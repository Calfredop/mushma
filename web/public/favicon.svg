<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app icon: a porcino on Lichene paper, coloured from the score scale and shaded with the
       forecast hatch. Source of every PNG in icons/ (scripts/render-icons.sh). -->
  <defs>
    <pattern id="hatch" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="15" fill="#1C211D" opacity=".4"/>
    </pattern>
    <path id="stem" d="M212 262 C204 310 148 334 148 388 C148 430 196 450 256 450 C316 450 364 430 364 388 C364 334 308 310 300 262 Z"/>
    <path id="cap" d="M76 238 C68 148 152 82 256 82 C360 82 444 148 436 238 C434 260 418 270 396 268 C350 264 302 262 256 262 C210 262 162 264 116 268 C94 270 78 260 76 238 Z"/>
    <clipPath id="stem-clip"><use href="#stem"/></clipPath>
    <clipPath id="cap-clip"><use href="#cap"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#EDF0EA"/>
  <g transform="translate(0 -8)" stroke="#1C211D" stroke-width="14" stroke-linejoin="round">
    <use href="#stem" fill="#F7F0C6"/>
    <path clip-path="url(#stem-clip)" stroke="none" fill="url(#hatch)" d="M130 250 H390 V470 H318 C340 416 330 364 300 338 C276 318 232 312 190 324 L130 342 Z"/>
    <use href="#stem" fill="none"/>
    <path d="M108 262 C168 312 344 312 404 262 Z" fill="#F0C967"/>
    <use href="#cap" fill="#652D1F"/>
    <path clip-path="url(#cap-clip)" stroke="none" fill="#B34F2A" d="M60 250 C58 160 140 80 250 64 C184 104 136 170 126 262 Z"/>
    <use href="#cap" fill="none"/>
  </g>
</svg>
