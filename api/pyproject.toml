[project]
name = "api"
version = "0.1.0"
description = "mushma API: scores, cell detail, hotspots, sightings and history"
readme = "README.md"
authors = [
    { name = "Cosimo Alfredo Pina Lari", email = "calfredop@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi[standard]>=0.141.1",
    "limits>=5.8.0",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "sentry-sdk[fastapi]>=2.69.2",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
grid = [
    "geopandas>=1.1.4",
    "py7zr>=1.1.3",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.1",
    "shapely>=2.1.2",
]
cds = [
    "cdsapi>=0.7.6",
    "netcdf4>=1.7.2",
    "xarray>=2025.1.0",
]

[tool.uv]
default-groups = ["dev", "grid"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # rasterio 1.5 still multiplies Affine transforms with `*`.
    "ignore:Use `@` matmul:PendingDeprecationWarning:rasterio",
]
