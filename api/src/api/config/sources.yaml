# Data sources used by the grid and the weather ingest. `attribution` is the credit the app shows;
# `download`, where present, holds what the grid build needs to fetch the data (api/grid/sources.py
# `read_vector`). Vector download shapes: `url` + `shapefile` (zip, nested 7z ok), `url` +
# `geopackage`/`layer`, `url` + `member` + `layer` (named layer inside a zip), `arcgis_layer` +
# `field`, `wfs` + `type_name` (optional `srs`, and `page_size` + `sort_by` for a server that caps
# GetFeature), or `parts` (a list of url shapes read and concatenated; `file` names a download whose
# url does not end in its file name). `field` names the forest-type column when the source serves
# `forest.types`.

istat_boundaries:
  name: ISTAT — Confini delle unità amministrative a fini statistici (generalizzati), 1 gennaio 2025
  homepage: https://www.istat.it/notizia/confini-delle-unita-amministrative-a-fini-statistici-al-1-gennaio-2018-2/
  license: CC BY 4.0
  attribution: "Confini amministrativi © ISTAT, CC BY 4.0"
  download:
    url: https://www.istat.it/storage/cartografia/confini_amministrativi/generalizzati/2025/Limiti01012025_g.zip
    regions: Reg01012025_g/Reg01012025_g_WGS84.shp
    provinces: ProvCM01012025_g/ProvCM01012025_g_WGS84.shp
    comuni: Com01012025_g/Com01012025_g_WGS84.shp

rer_carta_forestale:
  name: Regione Emilia-Romagna — Carta forestale regionale 2025 (1:10.000)
  homepage: https://ambiente.regione.emilia-romagna.it/it/parchi-natura2000/foreste/quadro-conoscitivo/sistema-informativo-regionale/carta-forestale-regionale
  license: CC BY 4.0
  attribution: "Carta forestale regionale © Regione Emilia-Romagna, CC BY 4.0"
  notes: >-
    Photo-interpreted from the AGEA 2023 flight (approved by Determinazione n. 6273 of 31/03/2026),
    minimum unit 0.16 ha. Each polygon has its land use (STC_RER: bosco, arbusteti in evoluzione,
    arboricoltura…) and INFC forest category (COD_CAT: faggete, cerrete, castagneti…). Published as
    one shapefile per province (RDN2008 / UTM 32N); the site's legal notes release its contents
    under CC BY 4.0.
  download:
    parts:
      - url: https://ambiente.regione.emilia-romagna.it/it/parchi-natura2000/foreste/quadro-conoscitivo/sistema-informativo-regionale/carta-forestale-regionale/cartaforestalepc.zip/@@download/file
        file: CartaForestale2025PC.zip
        shapefile: CartaForestale2025PC.shp
      - url: https://ambiente.regione.emilia-romagna.it/it/parchi-natura2000/foreste/quadro-conoscitivo/sistema-informativo-regionale/carta-forestale-regionale/cartaforestalepr.zip/@@download/file
        file: CartaForestale2025PR.zip
        shapefile: CartaForestale2025PR.shp
      - url: https://ambiente.regione.emilia-romagna.it/it/parchi-natura2000/foreste/quadro-conoscitivo/sistema-informativo-regionale/carta-forestale-regionale/cartaforestalere.zip/@@download/file
        file: CartaForestale2025RE.zip
        shapefile: CartaForestale2025RE.shp
      - url: https://ambiente.regione.emilia-romagna.it/it/parchi-natura2000/foreste/quadro-conoscitivo/sistema-informativo-regionale/carta-forestale-regionale/cartaforestalemo.zip/@@download/file
        file: CartaForestale2025MO.zip
        shapefile: CartaForestale2025MO.shp
      - url: https://ambiente.regione.emilia-romagna.it/it/parchi-natura2000/foreste/quadro-conoscitivo/sistema-informativo-regionale/carta-forestale-regionale/cartaforestalebo.zip/@@download/file
        file: CartaForestale2025BO.zip
        shapefile: CartaForestale2025BO.shp
      - url: https://ambiente.regione.emilia-romagna.it/it/parchi-natura2000/foreste/quadro-conoscitivo/sistema-informativo-regionale/carta-forestale-regionale/cartaforestalefe.zip/@@download/file
        file: CartaForestale2025FE.zip
        shapefile: CartaForestale2025FE.shp
      - url: https://ambiente.regione.emilia-romagna.it/it/parchi-natura2000/foreste/quadro-conoscitivo/sistema-informativo-regionale/carta-forestale-regionale/cartaforestalera.zip/@@download/file
        file: CartaForestale2025RA.zip
        shapefile: CartaForestale2025RA.shp
      - url: https://ambiente.regione.emilia-romagna.it/it/parchi-natura2000/foreste/quadro-conoscitivo/sistema-informativo-regionale/carta-forestale-regionale/cartaforestalefc.zip/@@download/file
        file: CartaForestale2025FC.zip
        shapefile: CartaForestale2025FC.shp
      - url: https://ambiente.regione.emilia-romagna.it/it/parchi-natura2000/foreste/quadro-conoscitivo/sistema-informativo-regionale/carta-forestale-regionale/cartaforestalern.zip/@@download/file
        file: CartaForestale2025RN.zip
        shapefile: CartaForestale2025RN.shp

rt_ucs:
  name: Regione Toscana — Uso e copertura del suolo 2007-2019 (1:10.000)
  homepage: https://www502.regione.toscana.it/geonetwork/srv/api/records/r_toscan:0d4d6640-9a1c-47a4-9a5d-a85cdb36927c
  license: CC BY 4.0
  attribution: "Uso e copertura del suolo © Regione Toscana, CC BY 4.0"
  download:
    url: https://www502.regione.toscana.it/geoscopio/download/tematici/ucs_rt/USO_E_COPERTURA_DEL_SUOLO_REGIONE_TOSCANA.zip
    shapefile: UCS_07_19.shp

rl_tipi_forestali:
  name: Regione Liguria — Tipi forestali della Regione Liguria sc. 1:10.000, ed. 2025
  homepage: https://geoportal.regione.liguria.it/catalogo/mappe.html?typeEvent=detailFromHome&idmap=2661
  license: CC BY 4.0
  attribution: "Tipi forestali e uso del suolo © Regione Liguria, CC BY 4.0"
  notes: >-
    Photo-interpreted at 1:10,000 (0.5 ha minimum unit) from AGEA 2019 and 2022 orthophotos and
    Sentinel-2. Each of its 52,044 polygons carries the 2025 land-use code (cod_uso, the national
    Corine-style legend with Liguria's own IV level: 3114 faggio, 3115 castagno) and, on wooded
    land, the IPLA forest category (cod_catfor) and type (cod_tipofo). GeoServer caps a GetFeature
    at 5,000 features, hence the paging.
  download:
    wfs: https://geoservizi.regione.liguria.it/geoserver/M2661/wfs
    type_name: M2661:L10450
    srs: EPSG:25832
    page_size: 5000
    sort_by: ogr_fid
    field: cod_catfor

rm_rem_vegetazione:
  name: Regione Marche — Rete Ecologica Marche (REM), Vegetazione naturale 1:50.000
  homepage: https://www.regione.marche.it/Entra-in-Regione/Rete-Ecologica-Marche-REM/Cartografia-shapefile
  license: Open by default (CAD, D.Lgs. 82/2005, art. 52 c. 2); reused as CC BY 4.0
  attribution: "Vegetazione naturale REM © Regione Marche, CC BY 4.0"
  notes: >-
    The phytosociological vegetation map of the regional ecological network (edition of March
    2019): 17,949 polygons of natural and semi-natural vegetation, each with its physiognomy
    (TipoFisio: bosco deciduo, rimboschimento a pino nero, arbusteto…) and dominant species
    (SpeciePrev), so one layer gives both the broad groups and the forest types. The download
    page states no licence; Italian public data published without one are open by default (CAD
    art. 52 c. 2), and CC BY 4.0 is the reference licence of AgID's open-data guidelines. Regione
    Marche's own open-data land-use map (Carta dell'uso del suolo 2007, CC BY 4.0) is published
    only at Corine level 2 (no broadleaf/conifer split), so it serves as a cross-check of the
    forest area in .gavin-root/docs/regions/marche.md.
  download:
    url: https://static.regione.marche.it/portals/0/Ambiente/Rete%20Ecologica%20regionale%20REM/CanaleREM/Shape%20files%20geoportale/Strati%20cartografici%20REM/REM_Vegetazione_naturale_50k.zip
    shapefile: REM_Vegetazione_naturale_50k.shp
    field: SpeciePrev

ispra_clc18_iv:
  name: ISPRA — Corine Land Cover 2018, IV livello (1:100.000)
  homepage: https://groupware.sinanet.isprambiente.it/uso-copertura-e-consumo-di-suolo/library/copertura-del-suolo/corine-land-cover/corine-land-cover-2018-iv-livello
  license: CC BY 4.0
  attribution: "Corine Land Cover 2018 IV livello © ISPRA, CC BY 4.0"
  download:
    arcgis_layer: https://sinacloud.isprambiente.it/arcgisina/rest/services/corine_land_cover/CorineLandCover/MapServer/4
    field: clc18

rp_carta_forestale:
  name: Regione Piemonte — Carta forestale regionale, edizione 2025 (1:10.000)
  homepage: https://www.geoportale.piemonte.it/geonetwork/srv/api/records/r_piemon:130b499f-3e2d-4388-8cf0-66892cd7ee25
  license: CC BY 4.0
  attribution: "Carta forestale regionale 2025 © Regione Piemonte (IPLA), CC BY 4.0"
  notes: >-
    The 2016 Carta forestale (IPLA, 1:10,000) updated with the Carta Forestale d'Italia (CFI 2020)
    forest limit. 74,021 polygons of forest only, each with its IPLA forest category (ca_1: 21
    categories, e.g. CA castagneti, FA faggete, LC lariceti e cembrete, RB robinieti) and type
    (tf_1); 987,175 ha including the subalpine and lowland shrublands (OV, AS). No land-use code
    and no mixed class: one map gives both the groups and the types, from the category.
  download:
    url: https://www.datigeo-piem-download.it/direct/Geoportale/RegionePiemonte/SIFOR/CF_2025.gpkg
    geopackage: true
    layer: CF_2025
    field: ca_1

pat_tipi_forestali:
  name: Provincia autonoma di Trento — Tipi forestali PAT integrati, elaborazione statica 2021
  homepage: https://siatservices.provincia.tn.it/geonetwork/srv/api/records/p_TN:920383ad-092c-4f8f-8f8a-1c9db904b36f
  license: CC BY 4.0
  attribution: "Tipi forestali PAT integrati 2021 © Provincia autonoma di Trento — Servizio Foreste, CC BY 4.0"
  notes: >-
    The real forest type (tipo forestale reale) of every forest unit in the management plans of the
    public and large private forests (SIGFAT), harmonised and filled in from other surveys where no
    plan exists, so it covers all of Trentino's forest: 56,531 polygons, 391,745 ha (the Province
    counts 390,463 ha of forest), 15 categories and 54 types of the Trentino typology (label:
    PE pecceta, FA faggeta, LA lariceto, AB abieteto, PS pineta, MU mugheta, OA ontaneta di ontano
    verde, ...). Valid from 2022-01-01. Forest only, so one map gives both groups and types.
  download:
    url: https://siatservices.provincia.tn.it/idt/vector/p_TN_920383ad-092c-4f8f-8f8a-1c9db904b36f.zip
    member: p_TN_920383ad-092c-4f8f-8f8a-1c9db904b36f/tipi_forestali_pat_v.gpkg
    layer: tipi_forestali_pat_v
    field: label

pbz_tipologie_forestali:
  name: Provincia autonoma di Bolzano — Tipologie forestali dell'Alto Adige (Waldtypisierung Südtirol)
  homepage: https://geonetwork1.civis.bz.it/geonetwork/srv/ita/catalog.search#/metadata/p_bz:Forestry:ForestTypes
  license: CC0 1.0
  attribution: "Tipologie forestali © Provincia autonoma di Bolzano — Ufficio Pianificazione forestale, CC0 1.0"
  notes: >-
    The forest-type map of the Waldtypisierung Südtirol (2010; published 2011): the forest area of
    South Tyrol typed by its site, derived from the geological map, the DTM and the technical map
    and calibrated on field plots. 94,671 polygons, 356,188 ha, 86 types in 14 groups (WGRU_BEZ_I:
    Peccete subalpine, Piceo-abieteti, Larici-cembrete, Faggete, ...); the riparian woods and the
    green-alder and mountain-pine scrub have a group name but no group code. A type names the
    trees its site carries (e.g. Piceo-abieti-faggeta), which in South Tyrol's largely near-natural
    forests is close to what grows there. Forest only, so one map gives both groups and types.
    CC0 per the provincial open-data portal (data.civis.bz.it, "Foreste: tipi forestali").
    GeoServer truncates large GetFeature responses, hence pages of 2,000.
  download:
    wfs: https://geoservices6.civis.bz.it/geoserver/p_bz-Forestry/ows
    type_name: p_bz-Forestry:ForestTypes
    srs: EPSG:25832
    page_size: 2000
    sort_by: ID
    field: WGRU_BEZ_I

copernicus_dem_glo30:
  name: Copernicus DEM GLO-30
  homepage: https://registry.opendata.aws/copernicus-dem/
  license: Copernicus DEM licence (free, attribution required)
  attribution: >-
    Produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space
    GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved
  notes: >-
    A surface model: forest canopy is partly included in the heights. Negligible for 1 km means and
    altitude bands; TINITALY 1.1 (INGV, 10 m, bare ground, CC BY 4.0) is the drop-in alternative.

soilgrids:
  name: SoilGrids 2.0 — pH in water (ISRIC)
  homepage: https://soilgrids.org/
  license: CC BY 4.0
  attribution: "SoilGrids © ISRIC — World Soil Information, CC BY 4.0"
  notes: Modelled at 250 m with wide uncertainty; a hint of soil acidity, not a measurement.

istat_localities:
  name: ISTAT — Basi territoriali 2021, località (points)
  homepage: https://www.istat.it/notizia/basi-territoriali-e-variabili-censuarie/
  license: CC BY 4.0
  attribution: "Località © ISTAT, CC BY 4.0"
  download:
    url: https://www.istat.it/storage/cartografia/basi_territoriali/2021/LocalitaPuntuali_21.zip

open_meteo:
  name: Open-Meteo — Historical Weather API and Forecast API
  homepage: https://open-meteo.com/
  license: CC BY 4.0
  attribution: "Weather data by Open-Meteo.com, CC BY 4.0"
  notes: >-
    The licence asks for a link to https://open-meteo.com/ next to any place the data is shown. The
    free API is for non-commercial use (no subscriptions or ads) and allows 600 calls per minute,
    5,000 per hour, 10,000 per day and 300,000 per month. Cite: Zippenfenig, P. (2023). Open-Meteo.com
    Weather API. Zenodo. https://doi.org/10.5281/zenodo.7970649

copernicus_era5_land:
  name: Copernicus Climate Change Service — ERA5-Land and ERA5 reanalysis
  homepage: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land
  license: CC BY 4.0
  attribution: "Contains modified Copernicus Climate Change Service information, CC BY 4.0"
  notes: >-
    Served through Open-Meteo (model era5_seamless) for Tuscany's stored history, and directly
    from the CDS for new regions (model era5_land_cds). Every Climate Data Store dataset moved to
    CC BY 4.0 on 2 July 2025. Cite: Muñoz Sabater, J. (2019). ERA5-Land hourly data from 1950 to
    present. C3S Climate Data Store. https://doi.org/10.24381/cds.e2161bac; Hersbach, H. et al.
    (2023). ERA5 hourly data on single levels from 1940 to present.
    https://doi.org/10.24381/cds.adbb2d47

copernicus_cds:
  name: Copernicus Climate Data Store — ERA5-Land hourly (bulk history)
  homepage: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land
  license: CC BY 4.0
  attribution: "Contains modified Copernicus Climate Change Service information, CC BY 4.0"
  notes: >-
    Direct CDS download used for multi-region history backfill (source id era5_land_cds). See
    .gavin-root/docs/weather-history-cds.md. Same underlying ERA5-Land as copernicus_era5_land.

ecmwf_open_data:
  name: ECMWF — IFS HRES open data forecasts (9 km)
  homepage: https://www.ecmwf.int/en/forecasts/datasets/open-data
  license: CC BY 4.0
  attribution: "Forecasts © European Centre for Medium-Range Weather Forecasts (ECMWF), CC BY 4.0"
  notes: Served through Open-Meteo (model ecmwf_ifs). Use is also subject to the ECMWF Terms of Use.

ecmwf_seasonal:
  name: ECMWF — EC46 extended-range and SEAS5 seasonal forecasts
  homepage: https://open-meteo.com/en/docs/seasonal-forecast-api
  license: CC BY 4.0
  attribution: "Long-range forecasts © European Centre for Medium-Range Weather Forecasts (ECMWF), CC BY 4.0, via Open-Meteo.com"
  notes: >-
    Served through Open-Meteo's Seasonal Forecast API (ECMWF seasonal seamless: EC46 for 46 days,
    then SEAS5). Weekly and monthly ensemble means and anomalies against the model's hindcast
    climate; not bias-adjusted. ECMWF opened its whole real-time catalogue under CC BY 4.0 in
    October 2025 (https://www.ecmwf.int/en/about/media-centre/news/2025/ecmwf-makes-its-entire-real-time-catalogue-open-all).
    Use is also subject to the ECMWF Terms of Use.

gbif:
  name: GBIF — Global Biodiversity Information Facility occurrence records
  homepage: https://www.gbif.org/
  license: Per-record (CC0, CC BY 4.0 or CC BY-NC 4.0); the store keeps each record's license
  attribution: "Occurrence data © GBIF.org contributors, gbif.org"
  notes: >-
    Free API, no key required; the terms of use ask that reuse of a mixed-source query be citable
    (a GBIF download DOI is the norm for publications, but a live occurrence/search is exempt for
    an app like this). Individual records can carry CC0, CC BY 4.0 or CC BY-NC 4.0; only counts per
    cell ever leave mushma (PRD → Sightings privacy), so no per-record licence text reaches the UI.

inaturalist:
  name: iNaturalist — community wildlife observations
  homepage: https://www.inaturalist.org/
  license: Per-record (most CC BY-NC 4.0); the store keeps each record's license
  attribution: "Observations © iNaturalist.org contributors, inaturalist.org"
  notes: >-
    Used only for the most recent observations (days, not months): research-grade iNaturalist
    records are also published through GBIF (dataset 50c9509d-22c7-4a22-a47d-8c48425ef4a7) with a
    days-to-weeks delay, so the direct API call closes that gap and is deduplicated against it by
    observation id. Free API, no key required for read-only search.
