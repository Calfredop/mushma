lazio_carta_forestale:
  name: Regione Lazio — Carta forestale su base tipologica (1:10.000)
  homepage: https://dati.lazio.it/dataset/carta-forestale-su-base-tipologica-della-regione-lazio
  license: CC BY 4.0
  attribution: "Carta forestale su base tipologica © Regione Lazio, CC BY 4.0"
  notes: >-
    Derived from the Region's Carta delle formazioni naturali e seminaturali by photo-interpretation
    of the 2005-2007 ADS40 flight and SPOT5 images at 1:10,000 (0.5 ha minimum unit; E-GEOS and
    Forest Lab for the Agenzia Regionale Parchi, final test February 2011; Chirici et al. 2014,
    Forest@ 11: 65-71). Its 39,095 polygons carry the forest category (categoria: Faggeta,
    Cerreta, Castagneto…) and type (tipologia: Faggeta montana eutrofica, Castagneto (eutrofico) su
    depositi vulcanici…) of every wood and shrubland, so one layer gives both the broad groups and
    the forest types. The open-data portal lists it under CC BY 4.0 (licence_id cc-by4) and
    publishes the WFS SHAPE-ZIP below as its download. The Region's land-use map (CUS 2000,
    1:25,000; its 2016 update revises urban and farm classes only) serves as the forest-area
    cross-check in .gavin-root/docs/regions/lazio.md.
  download:
    url: https://geoportale.regione.lazio.it/geoserver/ows?service=WFS&version=1.0.0&request=GetFeature&typename=geonode%3Atipi_forestali2&outputFormat=SHAPE-ZIP&srs=EPSG%3A25833&format_options=charset%3AUTF-8
    file: tipi_forestali2.zip
    shapefile: tipi_forestali2.shp
    field: tipologia

rl_tipi_forestali:
  name: Regione Liguria — Tipi forestali della Regione Liguria sc. 1:10.000, ed. 2025
  homepage: https://geoportal.regione.liguria.it/catalogo/mappe.html?typeEvent=detailFromHome&idmap=2661
  license: CC BY 4.0
  attribution: "Tipi forestali e uso del suolo © Regione Liguria, CC BY 4.0"
  notes: >-
    Photo-interpreted at 1:10,000 (0.5 ha minimum unit) from AGEA 2019 and 2022 orthophotos and
    Sentinel-2. Each of its 52,044 polygons carries the 2025 land-use code (cod_uso, the national
    Corine-style legend with Liguria's own IV level: 3114 faggio, 3115 castagno) and, on wooded
    land, the IPLA forest category (cod_catfor) and type (cod_tipofo). GeoServer caps a GetFeature
    at 5,000 features, hence the paging.
  download:
    wfs: https://geoservizi.regione.liguria.it/geoserver/M2661/wfs
    type_name: M2661:L10450
    srs: EPSG:25832
    page_size: 5000
    sort_by: ogr_fid
    field: cod_catfor

fvg_tipologie_forestali:
  name: Regione Autonoma Friuli Venezia Giulia — Tipologie forestali 2013
  homepage: https://geodati.gov.it/resource/id/r_friuve:m2182-cc-i10191
  license: IODL 2.0
  attribution: "Tipologie forestali © Regione Autonoma Friuli Venezia Giulia, IODL 2.0"
  notes: >-
    The regional forest-type map in the IRDAT catalogue (WFS layer IRDAT:TIPOLOGIE_FORESTALI_2013):
    the forest area of Friuli Venezia Giulia typed with the regional typology (Del Favero et al.
    1998: 20 categories, 105 types and subtypes, 70 variants). It joins the 1997-1999 "Tipi
    forestali" survey, updated in 2010, with the 2011 "Completamento del GIS dei Tipi forestali"
    (lowland and hill woods, validated 2013) and the Sappada forest plan of 2017. 20,556 polygons,
    325,467 ha including the mugo-pine and green-alder scrub. Forest only, so one map gives both
    groups and types, from the type code (CODICE_TIPO; a code like SN/GB0 is a spruce plantation
    on a beech site, XE/DB0 new woodland heading for hop-hornbeam). The RNDT record (revised
    2013-11-11) gives IODL 2.0 under DGR 2626/2014 and no limits on public access; the IRDAT
    Distributore also serves it as a shapefile. The GeoServer answers the whole layer in one
    GetFeature.
  download:
    wfs: https://serviziogc.regione.fvg.it/geoserver/IRDAT/wfs
    type_name: IRDAT:TIPOLOGIE_FORESTALI_2013
    srs: EPSG:25833
    field: CODICE_TIPO

rv_ccs2021:
  name: Regione del Veneto — Carta della copertura del suolo 2021 (1:10.000)
  homepage: https://idt2.regione.veneto.it/portfolio/webgis-carta-copertura-del-suolo-regione-del-veneto/
  license: IODL 2.0
  attribution: "Carta della copertura del suolo 2021 © Regione del Veneto – L.R. n. 28/76 – Formazione della Carta Tecnica Regionale, IODL 2.0"
  notes: >-
    The Region's land-cover database updated to 2021 (RNDT record r_veneto:c0506171_CCS2021,
    published 2025-07-03 by the Direzione Pianificazione Territoriale): photo-interpreted from the
    AGEA 2021 orthophoto, nominal scale 1:10,000, minimum unit 0.25 ha, a five-level Corine legend
    whose forest classes are the regional forest categories (level 4) and types (level 5) of the
    Carta regionale dei tipi forestali (Del Favero et al. 2000). Code `clc_lv_all` is the level-5
    code, or the level-4 code with a trailing 0 where a polygon has no type. `specific` flags forest
    hit by the Vaia storm (01), bark beetle (02) or fire (03). The RNDT record gives IODL 2.0 and no
    limits on public access; the Geoportale's terms name the credit line for the Direzione
    Pianificazione Territoriale's data. The GeoServer layer holds all 407,081 polygons of the
    region; a CQL filter fetches the 32,000 forest and scrub polygons (about 500 MB of GeoJSON in
    Monte Mario / Italy 1) in one GetFeature.
  download:
    wfs: https://idt2-geoserver.regione.veneto.it/geoserver/wfs
    type_name: rv:c0506171_ccs2021
    version: 1.1.0
    srs: EPSG:3003
    # The server answers HTTP 500 to any CQL OR; an IN list works.
    cql_filter: "clc_lvl_3 IN ('311', '312', '313', '322', '323')"
    field: clc_lv_all

rm_rem_vegetazione:
  name: Regione Marche — Rete Ecologica Marche (REM), Vegetazione naturale 1:50.000
  homepage: https://www.regione.marche.it/Entra-in-Regione/Rete-Ecologica-Marche-REM/Cartografia-shapefile
  license: Open by default (CAD, D.Lgs. 82/2005, art. 52 c. 2); reused as CC BY 4.0
  attribution: "Vegetazione naturale REM © Regione Marche, CC BY 4.0"
  notes: >-
    The phytosociological vegetation map of the regional ecological network (edition of March
    2019): 17,949 polygons of natural and semi-natural vegetation, each with its physiognomy
    (TipoFisio: bosco deciduo, rimboschimento a pino nero, arbusteto…) and dominant species
    (SpeciePrev), so one layer gives both the broad groups and the forest types. The download
    page states no licence; Italian public data published without one are open by default (CAD
    art. 52 c. 2), and CC BY 4.0 is the reference licence of AgID's open-data guidelines. Regione
    Marche's own open-data land-use map (Carta dell'uso del suolo 2007, CC BY 4.0) is published
    only at Corine level 2 (no broadleaf/conifer split), so it serves as a cross-check of the
    forest area in .gavin-root/docs/regions/marche.md.
  download:
    url: https://static.regione.marche.it/portals/0/Ambiente/Rete%20Ecologica%20regionale%20REM/CanaleREM/Shape%20files%20geoportale/Strati%20cartografici%20REM/REM_Vegetazione_naturale_50k.zip
    shapefile: REM_Vegetazione_naturale_50k.shp
    field: SpeciePrev

