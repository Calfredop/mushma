# Data sources used by the grid and the weather ingest. `attribution` is the credit the app shows;
# `download`, where present, holds what the grid build needs to fetch the data (api/grid/sources.py
# `read_vector`). Vector download shapes: `url` + `shapefile` (zip, nested 7z ok), `url` +
# `geopackage`/`layer`, `url` + `member` + `layer` (named layer inside a zip), `arcgis_layer` +
# `field`, or `wfs` + `type_name`.

istat_boundaries:
  name: ISTAT — Confini delle unità amministrative a fini statistici (generalizzati), 1 gennaio 2025
  homepage: https://www.istat.it/notizia/confini-delle-unita-amministrative-a-fini-statistici-al-1-gennaio-2018-2/
  license: CC BY 4.0
  attribution: "Confini amministrativi © ISTAT, CC BY 4.0"
  download:
    url: https://www.istat.it/storage/cartografia/confini_amministrativi/generalizzati/2025/Limiti01012025_g.zip
    regions: Reg01012025_g/Reg01012025_g_WGS84.shp
    provinces: ProvCM01012025_g/ProvCM01012025_g_WGS84.shp
    comuni: Com01012025_g/Com01012025_g_WGS84.shp

rt_ucs:
  name: Regione Toscana — Uso e copertura del suolo 2007-2019 (1:10.000)
  homepage: https://www502.regione.toscana.it/geonetwork/srv/api/records/r_toscan:0d4d6640-9a1c-47a4-9a5d-a85cdb36927c
  license: CC BY 4.0
  attribution: "Uso e copertura del suolo © Regione Toscana, CC BY 4.0"
  download:
    url: https://www502.regione.toscana.it/geoscopio/download/tematici/ucs_rt/USO_E_COPERTURA_DEL_SUOLO_REGIONE_TOSCANA.zip
    shapefile: UCS_07_19.shp

ispra_clc18_iv:
  name: ISPRA — Corine Land Cover 2018, IV livello (1:100.000)
  homepage: https://groupware.sinanet.isprambiente.it/uso-copertura-e-consumo-di-suolo/library/copertura-del-suolo/corine-land-cover/corine-land-cover-2018-iv-livello
  license: CC BY 4.0
  attribution: "Corine Land Cover 2018 IV livello © ISPRA, CC BY 4.0"
  download:
    arcgis_layer: https://sinacloud.isprambiente.it/arcgisina/rest/services/corine_land_cover/CorineLandCover/MapServer/4
    field: clc18

copernicus_dem_glo30:
  name: Copernicus DEM GLO-30
  homepage: https://registry.opendata.aws/copernicus-dem/
  license: Copernicus DEM licence (free, attribution required)
  attribution: >-
    Produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space
    GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved
  notes: >-
    A surface model: forest canopy is partly included in the heights. Negligible for 1 km means and
    altitude bands; TINITALY 1.1 (INGV, 10 m, bare ground, CC BY 4.0) is the drop-in alternative.

soilgrids:
  name: SoilGrids 2.0 — pH in water (ISRIC)
  homepage: https://soilgrids.org/
  license: CC BY 4.0
  attribution: "SoilGrids © ISRIC — World Soil Information, CC BY 4.0"
  notes: Modelled at 250 m with wide uncertainty; a hint of soil acidity, not a measurement.

istat_localities:
  name: ISTAT — Basi territoriali 2021, località (points)
  homepage: https://www.istat.it/notizia/basi-territoriali-e-variabili-censuarie/
  license: CC BY 4.0
  attribution: "Località © ISTAT, CC BY 4.0"
  download:
    url: https://www.istat.it/storage/cartografia/basi_territoriali/2021/LocalitaPuntuali_21.zip

open_meteo:
  name: Open-Meteo — Historical Weather API and Forecast API
  homepage: https://open-meteo.com/
  license: CC BY 4.0
  attribution: "Weather data by Open-Meteo.com, CC BY 4.0"
  notes: >-
    The licence asks for a link to https://open-meteo.com/ next to any place the data is shown. The
    free API is for non-commercial use (no subscriptions or ads) and allows 600 calls per minute,
    5,000 per hour, 10,000 per day and 300,000 per month. Cite: Zippenfenig, P. (2023). Open-Meteo.com
    Weather API. Zenodo. https://doi.org/10.5281/zenodo.7970649

copernicus_era5_land:
  name: Copernicus Climate Change Service — ERA5-Land and ERA5 reanalysis
  homepage: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land
  license: CC BY 4.0
  attribution: "Contains modified Copernicus Climate Change Service information, CC BY 4.0"
  notes: >-
    Served through Open-Meteo (model era5_seamless). Every Climate Data Store dataset moved to CC BY
    4.0 on 2 July 2025. Cite: Muñoz Sabater, J. (2019). ERA5-Land hourly data from 1950 to present.
    C3S Climate Data Store. https://doi.org/10.24381/cds.e2161bac; Hersbach, H. et al. (2023). ERA5
    hourly data on single levels from 1940 to present. https://doi.org/10.24381/cds.adbb2d47

ecmwf_open_data:
  name: ECMWF — IFS HRES open data forecasts (9 km)
  homepage: https://www.ecmwf.int/en/forecasts/datasets/open-data
  license: CC BY 4.0
  attribution: "Forecasts © European Centre for Medium-Range Weather Forecasts (ECMWF), CC BY 4.0"
  notes: Served through Open-Meteo (model ecmwf_ifs). Use is also subject to the ECMWF Terms of Use.

ecmwf_seasonal:
  name: ECMWF — EC46 extended-range and SEAS5 seasonal forecasts
  homepage: https://open-meteo.com/en/docs/seasonal-forecast-api
  license: CC BY 4.0
  attribution: "Long-range forecasts © European Centre for Medium-Range Weather Forecasts (ECMWF), CC BY 4.0, via Open-Meteo.com"
  notes: >-
    Served through Open-Meteo's Seasonal Forecast API (ECMWF seasonal seamless: EC46 for 46 days,
    then SEAS5). Weekly and monthly ensemble means and anomalies against the model's hindcast
    climate; not bias-adjusted. ECMWF opened its whole real-time catalogue under CC BY 4.0 in
    October 2025 (https://www.ecmwf.int/en/about/media-centre/news/2025/ecmwf-makes-its-entire-real-time-catalogue-open-all).
    Use is also subject to the ECMWF Terms of Use.

gbif:
  name: GBIF — Global Biodiversity Information Facility occurrence records
  homepage: https://www.gbif.org/
  license: Per-record (CC0, CC BY 4.0 or CC BY-NC 4.0); the store keeps each record's license
  attribution: "Occurrence data © GBIF.org contributors, gbif.org"
  notes: >-
    Free API, no key required; the terms of use ask that reuse of a mixed-source query be citable
    (a GBIF download DOI is the norm for publications, but a live occurrence/search is exempt for
    an app like this). Individual records can carry CC0, CC BY 4.0 or CC BY-NC 4.0; only counts per
    cell ever leave mushma (PRD → Sightings privacy), so no per-record licence text reaches the UI.

inaturalist:
  name: iNaturalist — community wildlife observations
  homepage: https://www.inaturalist.org/
  license: Per-record (most CC BY-NC 4.0); the store keeps each record's license
  attribution: "Observations © iNaturalist.org contributors, inaturalist.org"
  notes: >-
    Used only for the most recent observations (days, not months): research-grade iNaturalist
    records are also published through GBIF (dataset 50c9509d-22c7-4a22-a47d-8c48425ef4a7) with a
    days-to-weeks delay, so the direct API call closes that gap and is deduplicated against it by
    observation id. Free API, no key required for read-only search.
