    classes:
      "41.18": beech
      "41.732": deciduous_oak
      "41.7511": deciduous_oak
      "41.7512": deciduous_oak
      "41.7513": deciduous_oak
      "44.4": deciduous_oak
      "41.9": chestnut
      "83.12": chestnut
      "41.4": mixed_broadleaf
      "41.81": mixed_broadleaf      # hop-hornbeam
      "41.C1": mixed_broadleaf      # Alnus cordata, the southern Apennine alder
      "41.D": mixed_broadleaf
      "45.21": evergreen_oak        # cork oak
      "45.31": evergreen_oak
      "45.32": evergreen_oak
      "45.8": evergreen_oak         # holly
      "44.14": riparian
      "44.513": riparian
      "44.61": riparian
      "44.71": riparian
      "41.L_n": exotic_broadleaf
      "44.D2_n": exotic_broadleaf
      "42.65": mountain_pine        # laricio pine, as CLC IV 3122 files it
      "42.612": mountain_pine
      "42.711": mountain_pine       # pino loricato
      "42.G_n": mountain_pine       # mostly laricio reforestation (see the region doc)
      "83.31_m": mountain_pine
      "42.83": mediterranean_pine
      "42.84": mediterranean_pine
      "16.29": mediterranean_pine
      "42.15": fir_spruce

soil:
  source: soilgrids

# iNaturalist place for the recent-observations fetch, resolved by name ("Calabria, IT", admin level
# 10) on 2026-09-28. GBIF history is paged over bbox_wgs84 and clipped to the grid afterwards.
sightings:
  inaturalist_place_id: 9323

# Rain scale (merged onto config/model.yaml), fitted on long-term station normals, not daily gauges:
# Calabria's open daily rain needs registration (ARPACAL's Centro Funzionale archive, ARSAC's
# agrometeo network), so the check reads the raw CDS rain of 2016-2025 at the 15 stations whose
# mean annual rain and height the regional forest programme quotes. Calabria's history is CDS, so the
# scale names that source too: the national one scales era5_seamless only, while the rain normals are
# scaled whatever their source. .gavin-root/docs/regions/calabria.md, Weather.
model:
  precipitation_scale:
    sources: [era5_land_cds, era5_seamless]
    intercept: 0.85
    per_km: 0.82
    max_elevation_m: 1300  # the highest station: no extrapolation above it (factor 1.92)
    source: [mushma_calabria_rain_normals_check_2026]
    notes: >-
      Least squares through the origin of station normals on raw CDS era5_land_cds annual totals
      (2016-2025, read bilinearly from the land nodes at each station) x (a + b x elevation) over 15
      stations at 10-1,300 m quoted by the Programma Forestale Regionale 2024 (Serra San Bruno 1,772
      mm, Mongiana, Fabrizia, Gambarie 1,608, Camigliatello 1,634, Villaggio Mancuso 1,616, San
      Lorenzo Bellizzi; Arena, Joppolo, Tropea, Briatico, Villa San Giovanni, Reggio Calabria 594,
      Melito di Porto Salvo, Capo dell'Armi) gave a = 0.848, b = 0.819 per km: raw CDS holds 1.19 of
      the normals below 200 m and 0.59 at 800 m and above (the Serre 0.47). Leave-one-out slopes run
      0.77-0.95. The normals are older long-term means (the one dated runs 1939-2001); if 2016-2025
      was 10 % drier, the fit would be 0.76 + 0.74. It gives 1.01 at 200 m, 1.26 at 500 m, 1.50 at
      800 m and 1.83 at 1,200 m.
