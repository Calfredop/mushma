# Umbria (region-umbria card). Source ids resolve in ../sources.yaml.
id: umbria
name: {it: Umbria, en: Umbria}
timezone: Europe/Rome

# [lon_min, lat_min, lon_max, lat_max], the ISTAT boundary's extent rounded outward to 0.01°.
bbox_wgs84: [11.89, 42.36, 13.27, 43.62]

grid:
  crs: "EPSG:3035"
  cell_size_m: 1000

boundary:
  source: istat_boundaries
  region_code: 10

# Woodland: ISPRA CLC 2018 IV level alone. No Umbrian forest or land-use map has an open licence
# (UmbriaGeo data need written authorization to publish; CFI2020 and Carta della Natura are on
# request), so there is no forest.groups: the build derives broadleaf/conifer/mixed/macchia/
# transitional from CLC IV codes (311x, 312x, 313x, 3231/3232, 324x), and types use the shared CLC
# IV defaults. Forest area is -20 % vs INFC 2015: .gavin-root/docs/regions/umbria.md, Sources.
forest:
  types:
    source: ispra_clc18_iv

soil:
  source: soilgrids

# iNaturalist place for the recent-observations fetch, resolved by name ("Umbria, IT", admin level
# 10) on 2026-09-25. GBIF history is paged over bbox_wgs84 and clipped to the grid afterwards.
sightings:
  inaturalist_place_id: 10875

# Rain gauges for `api.weather.checks gauges`: Regione Umbria Servizio Idrografico daily rain
# (open data, CC BY, dati.regione.umbria.it).
checks:
  gauges: umbria_sir
