      "Abies cephalonica Link.": fir_spruce
      "Cupressus arizonica Green": other_conifer

soil:
  source: soilgrids

# iNaturalist place for the recent-observations fetch, resolved by name ("Marche, IT", admin level
# 10) on 2026-09-25. GBIF history is paged over bbox_wgs84 and clipped to the grid afterwards.
sightings:
  inaturalist_place_id: 7029

# Rain scale (merged onto config/model.yaml), borrowed: Marche publishes no open daily rain that a
# script can read (SIRMIP needs registration; the AMAP agrometeo API has no daily measures yet), so
# there is no Marche gauge check. The national scale cannot stay as it is: it scales era5_seamless
# only while the rain normals are scaled whatever their source, and Marche's history is CDS. Both
# bordering regions' woodland-gauge fits on the same CDS rain find it about right below 400 m and
# dry in the mountains; this is their mean. .gavin-root/docs/regions/marche.md, Weather.
model:
  precipitation_scale:
    sources: [era5_land_cds, era5_seamless]
    intercept: 0.76
    per_km: 0.57
    source: [mushma_marche_rain_prior_2026]
    notes: >-
      Marche: no gauge fit. Mean of the two bordering regions' least-squares fits of woodland gauge
      totals on CDS era5_land_cds totals x (a + b x elevation), 2019-2025: Umbria 0.89 + 0.33 per km
      (8 Servizio Idrografico gauges, 402-1,053 m; raw pooled ratio 0.88) and Emilia-Romagna 0.62 +
      0.80 per km (66 ARPAE gauges, 183-1,535 m; raw 1.06 below 400 m, 0.94 at 400-800 m, 0.69
      above). It gives 0.87 at 200 m, 1.04 at 500 m, 1.21 at 800 m and 1.44 at 1,200 m. The
      national 1.28 + 0.29 per km would make both neighbours' CDS rain 25-30 % too wet.
