# Molise: region #13 of the full-Italy rollout (.gavin-root/docs/regions/molise.md).
id: molise
name: {it: Molise, en: Molise}
timezone: Europe/Rome

# [lon_min, lat_min, lon_max, lat_max], the ISTAT boundary's extent rounded outward to 0.01°.
bbox_wgs84: [13.94, 41.36, 15.17, 42.08]

grid:
  crs: "EPSG:3035"
  cell_size_m: 1000

# ISTAT region code (COD_REG) in the national boundaries file.
boundary:
  source: istat_boundaries
  region_code: 14

# Woodland: one map gives both layers. ISPRA's Carta della Natura habitat map (1:25,000, 2021, on
# the 2018 orthophotos; its 2015 edition was drawn on the Region's 1:10,000 forest-type map) gives
# every polygon its CORINE Biotopes habitat, which says both which broad group it is and which kind.
# There is no mixed class. The Region's own Carta delle Tipologie Forestali (DGR 252/2009) is
# published only as a PDF. Synanthropic woods (4D_n: mixed deciduous regrowth on abandoned fields,
# orchards and pastures, robinia and ailanthus among native trees) count as mixed broadleaf.
# Conifers planted outside their range (42.G_n) are Aleppo pine and cypress below about 700 m (round
# the Guardialfiera and Occhito reservoirs) and black pine above, ISPRA says; the grid gives a code one
# habitat, so all of them go to mountain_pine, as CLC IV files black pine (3122). Broadleaf, poplar and
# fruit plantations stay farmland; Ampelodesmos steppe, bracken, supramediterranean garighe, the
# montane prostrate-juniper heath (31.43), grassland and rock are left out, as UCS and CLC leave
# 321/322 out in Tuscany. See .gavin-root/docs/woodland-grid.md and .gavin-root/docs/regions/molise.md
# (Sources).
forest:
  groups:
    source: ispra_cnat_molise
    class_column: codice_corine
    classes:
      "41.18": broadleaf     # faggete dell'Italia meridionale
      "41.4": broadleaf      # boschi misti di forre, scarpate e versanti umidi
      "41.731": broadleaf    # querceti temperati a roverella
      "41.732": broadleaf    # querceti mediterranei a roverella
      "41.741": broadleaf    # querceti temperati a cerro
      "41.7511": broadleaf   # querceti mediterranei a cerro
      "41.7512": broadleaf   # querceti a cerro e farnetto
      "41.81": broadleaf     # boschi di Ostrya carpinifolia
      "41.88_m": broadleaf   # boschi a frassini, aceri e carpini
      "41.9": broadleaf      # boschi a Castanea sativa
      "41.D": broadleaf      # boschi a Populus tremula
      "41.F1": broadleaf     # boschi e boscaglie a Ulmus minor
      "41.L_n": broadleaf    # latifoglie alloctone o fuori areale (robinia, ailanto)
      "44.13": broadleaf     # boschi ripariali temperati di salici
      "44.14": broadleaf     # boschi ripariali mediterranei di salici
      "44.61": broadleaf     # boschi ripariali a pioppi
      "44.63": broadleaf     # boschi ripariali a Fraxinus angustifolia
      "44.D2_n": broadleaf   # boschi e boscaglie ripariali di specie alloctone invasive
      "45.31": broadleaf     # leccete termo e mesomediterranee
      "45.32": broadleaf     # leccete supramediterranee
      "4D_n": broadleaf      # boschi e boscaglie sinantropici
      "42.15": conifer       # abetine dell'Appennino meridionale
      "42.G_n": conifer      # conifere alloctone o fuori areale (black and Aleppo pine, cypress)
      "83.31_m": conifer     # piantagioni di conifere
      "16.29": conifer       # dune alberate (coastal Aleppo and stone pine)
      "16.27": macchia       # dune stabili a ginepri
      "16.28": macchia       # dune stabili con macchia a sclerofille
      "32.3_m": macchia      # macchia mediterranea
      "32.4_m": macchia      # garighe termo e mesomediterranee
      "31.81": transitional  # cespuglieti temperati a latifoglie decidue
      "31.844": transitional # ginestreti collinari e montani
      "31.87": transitional  # aree recentemente disboscate da incendi o eventi estremi
      "31.88_m": transitional # ginepreti collinari e montani
      "31.8A": transitional  # roveti
      "32.A": transitional   # ginestreti a Spartium junceum
      "44.11": transitional  # saliceti arbustivi ripariali temperati
      "44.12": transitional  # saliceti arbustivi ripariali mediterranei
      "44.D1_n": transitional # cespuglieti ripariali di specie alloctone invasive
  types:
    source: ispra_cnat_molise
    classes:
      "41.18": beech
      "41.731": deciduous_oak
      "41.732": deciduous_oak
      "41.741": deciduous_oak
      "41.7511": deciduous_oak
      "41.7512": deciduous_oak
      "41.9": chestnut
      "41.4": mixed_broadleaf
      "41.81": mixed_broadleaf      # hop-hornbeam
      "41.88_m": mixed_broadleaf    # ash, maple and hornbeam
      "41.D": mixed_broadleaf
      "41.F1": mixed_broadleaf      # field elm
      "4D_n": mixed_broadleaf       # synanthropic woods on abandoned fields
      "45.31": evergreen_oak
      "45.32": evergreen_oak
      "44.13": riparian
      "44.14": riparian
      "44.61": riparian
      "44.63": riparian
      "41.L_n": exotic_broadleaf
      "44.D2_n": exotic_broadleaf
      "42.G_n": mountain_pine       # black pine above ~700 m; Aleppo pine and cypress below
      "83.31_m": mountain_pine
      "16.29": mediterranean_pine
      "42.15": fir_spruce

soil:
  source: soilgrids

# iNaturalist place for the recent-observations fetch, resolved by name ("Molise, IT", admin level
# 10) on 2026-09-30. GBIF history is paged over bbox_wgs84 and clipped to the grid afterwards.
sightings:
  inaturalist_place_id: 10871

# Rain scale (merged onto config/model.yaml), borrowed: Molise publishes no open daily rain (the
# Centro Funzionale releases gauge data on a PEC request and for a fee; Meteo Hub's dpcn-molise
# archive needs a login), so there is no Molise gauge check. Molise's history is CDS, which the
# national scale does not name, so both reanalysis sources are listed. The mean of the three measured
# fits on the same CDS rain that surround it, clamped at the highest gauge any of them holds.
# .gavin-root/docs/regions/molise.md, Weather.
model:
  precipitation_scale:
    sources: [era5_land_cds, era5_seamless]
    intercept: 0.84
    per_km: 0.36
    max_elevation_m: 1200  # Lazio's Accumoli gauge, 1,176 m, the highest of the three fits
    source: [mushma_molise_rain_prior_2026]
    notes: >-
      Molise: no gauge fit. Mean of the three neighbouring least-squares fits of gauge totals on CDS
      era5_land_cds totals x (a + b x elevation): Lazio 0.82 + 0.23 per km (92 ARSIAL agrometeo
      gauges, 1-1,176 m), Campania 0.77 + 0.52 per km (33 agrometeo gauges, 11-769 m) and Puglia
      0.93 + 0.34 per km (42 Protezione Civile gauges, 27-914 m). It gives 0.91 at 200 m, 1.02 at
      500 m, 1.13 at 800 m and 1.27 from 1,200 m up, 1.11 on average over the woodland cells (the
      three fits 1.00-1.17, the national scale 1.50). Abruzzo's scale is itself borrowed and is left
      out of the mean.
