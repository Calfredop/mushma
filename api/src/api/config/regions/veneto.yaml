      "31185": deciduous_oak             # ostrio-querceto tipico
      "31191": mixed_broadleaf           # carpineto con cerro
      "31192": mixed_broadleaf           # carpineto con frassino
      "31193": mixed_broadleaf           # carpineto con ostria
      "31194": mixed_broadleaf           # carpineto tipico
      "31195": deciduous_oak             # querco-carpineto collinare
      "31196": deciduous_oak             # querco-carpineto planiziale
      # 312 bosco di conifere
      "31211": fir_spruce                # abieteto dei substrati carbonatici
      "31212": fir_spruce                # abieteto dei substrati silicatici
      "31213": fir_spruce                # abieteto dei suoli mesici con faggio
      "31214": fir_spruce                # abieteto dei suoli mesici tipico
      "31215": fir_spruce                # abieteto esomesalpico montano
      # Conifer plantations: three quarters spruce on beech and hop-hornbeam sites in the
