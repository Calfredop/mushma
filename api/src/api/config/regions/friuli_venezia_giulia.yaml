# Friuli-Venezia Giulia: region #11 of the full-Italy rollout
# (.gavin-root/docs/regions/friuli_venezia_giulia.md).
id: friuli_venezia_giulia
name: {it: Friuli-Venezia Giulia, en: Friuli-Venezia Giulia}
timezone: Europe/Rome

# [lon_min, lat_min, lon_max, lat_max], the ISTAT boundary's extent rounded outward to 0.01°.
bbox_wgs84: [12.32, 45.58, 13.92, 46.65]

grid:
  crs: "EPSG:3035"
  cell_size_m: 1000

# ISTAT region code (COD_REG) in the national boundaries file.
boundary:
  source: istat_boundaries
  region_code: 6

# Woodland: one regional map gives both layers. The Region's Tipologie forestali 2013 maps forest
# only, every polygon with its type in the regional typology (Del Favero et al. 1998), so the type
# code (CODICE_TIPO) says both which broad group a polygon is and which habitat. Codes are the
# category letter, the type and a lower-case variant (GH1a: faggeta montana tipica esalpica with
# silver fir); a plantation or new woodland is coded by what grows there over the site it sits on
# (SN/GB0: spruce planted on a beech site; XE/DB0: new woodland heading for hop-hornbeam), and is
# mapped by what grows there. Mugo-pine krummholz (H), green-alder scrub (PA0) and subalpine
# Salix waldsteiniana scrub (QA5) are not forest, as INFC counts them, and go to the transitional
# group. Spruce-beech (L) and fir-spruce-beech (MB, MC, MD) woods are mixed. Every code in the
# map is listed; a code not listed is dropped with its area. See
# .gavin-root/docs/woodland-grid.md and .gavin-root/docs/regions/friuli_venezia_giulia.md (Sources).
