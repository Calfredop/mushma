# Valle d'Aosta: region #7 of the full-Italy rollout (.gavin-root/docs/regions/valle_d_aosta.md).
id: valle_d_aosta
name: {it: "Valle d'Aosta", en: Aosta Valley}
timezone: Europe/Rome

# [lon_min, lat_min, lon_max, lat_max], the ISTAT boundary's extent rounded outward to 0.01°.
bbox_wgs84: [6.80, 45.46, 7.94, 45.99]

grid:
  crs: "EPSG:3035"
  cell_size_m: 1000

# ISTAT region code (COD_REG) in the national boundaries file.
boundary:
  source: istat_boundaries
  region_code: 2

# Woodland: one regional map gives both layers. The Region's Carta forestale (Tipi forestali 2020,
# IPLA, 1:10,000) maps forest only, every polygon with its IPLA forest category (ca), the typology
# Piemonte's map uses, so the category says both which broad group a polygon is and which habitat.
# There is no mixed category: stands are typed by their dominant species. The subalpine and other
# shrublands (OV, AS) are not forest and go to the transitional group. The file is saved by hand
# (SPID login): see sources.yaml, rvda_tipi_forestali.
# See .gavin-root/docs/woodland-grid.md and .gavin-root/docs/regions/valle_d_aosta.md (Sources).
forest:
  groups:
    source: rvda_tipi_forestali
    class_column: ca
    classes:
      CA: broadleaf     # castagneti
      FA: broadleaf     # faggete
      RB: broadleaf     # robinieti
      BS: broadleaf     # boscaglie pioniere e d'invasione
      AF: broadleaf     # acero-tiglio-frassineti
      QR: broadleaf     # querceti di roverella (here QR is downy oak, the reverse of Piemonte)
      QV: broadleaf     # querceti di rovere
      SP: broadleaf     # formazioni legnose riparie
      AN: broadleaf     # alneti planiziali e montani
      LC: conifer       # lariceti e cembrete
      RI: conifer       # rimboschimenti (conifer plantations)
      PS: conifer       # pinete di pino silvestre
      AB: conifer       # abetine
      PE: conifer       # peccete
      PN: conifer       # pinete di pino uncinato
      OV: transitional  # arbusteti subalpini (ontano verde, rododendro)
      AS: transitional  # arbusteti planiziali, collinari e montani
  types:
    source: rvda_tipi_forestali
    classes:
      CA: chestnut
      FA: beech
      RB: exotic_broadleaf
      BS: mixed_broadleaf     # betulla, pioppo tremolo, nocciolo, pioneer scrub on rock
      AF: mixed_broadleaf
      QR: deciduous_oak
      QV: deciduous_oak
      SP: riparian
      AN: riparian
      AB: fir_spruce
      PE: fir_spruce
      LC: other_conifer       # larice, pino cembro
      RI: other_conifer
      PS: mountain_pine
      PN: mountain_pine

soil:
  source: soilgrids

# iNaturalist place for the recent-observations fetch, resolved by name ("Valle d'Aosta, IT", admin
# level 10) on 2026-09-29. GBIF history is paged over bbox_wgs84 and clipped to the grid afterwards.
sightings:
  inaturalist_place_id: 10882

# Lapse rates (°C per km) in place of weather.yaml's national ones for the air temperatures. Across
# the 59 ERA5-Land land nodes at 0.1° (lattice check, three 14-day windows of 2024) air cools faster
# with height than the national 4.2-4.5: median daily fits 5.33 (min), 5.54 (mean), 5.88 (max), all
# more than 1 °C/km steeper, in July and October as in January. The fitted rates cut the leave-out
# RMSE of the 0.2° lattice from 0.973 to 0.768 °C (min), 0.737 to 0.542 (mean), 0.786 to 0.569 (max),
# and as much at 0.3°. Soil temperature keeps the national 3.7: its fitted 4.0 is within 1 °C/km.
# .gavin-root/docs/regions/valle_d_aosta.md, Config.
weather:
  lapse_rates:
    temperature_2m_min: 5.3
    temperature_2m_mean: 5.6
    temperature_2m_max: 5.9

# Rain scale: the national field in config/model.yaml (fitted on every region's open gauges at
# once, api.weather.rain_field), so there is no step at the region's borders.
