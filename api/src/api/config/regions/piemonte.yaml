# Piemonte: region #6 of the full-Italy rollout (.gavin-root/docs/regions/piemonte.md).
id: piemonte
name: {it: Piemonte, en: Piedmont}
timezone: Europe/Rome

# [lon_min, lat_min, lon_max, lat_max], the ISTAT boundary's extent rounded outward to 0.01°.
bbox_wgs84: [6.62, 44.06, 9.22, 46.47]

grid:
  crs: "EPSG:3035"
  cell_size_m: 1000

# ISTAT region code (COD_REG) in the national boundaries file.
boundary:
  source: istat_boundaries
  region_code: 1

# Woodland: one regional map gives both layers. Regione Piemonte's Carta forestale 2025 (1:10,000)
# maps forest only, every polygon with its IPLA forest category (ca_1), so the category says both
# which broad group a polygon is (how much of each cell is broadleaf or conifer woodland) and which
# habitat (which kind). There is no mixed category: stands are typed by their dominant species. The
# subalpine and lowland shrublands (OV, AS) are not forest and go to the transitional group.
# See .gavin-root/docs/woodland-grid.md and .gavin-root/docs/regions/piemonte.md (Sources).
forest:
  groups:
    source: rp_carta_forestale
    class_column: ca_1
    classes:
      CA: broadleaf     # castagneti
      FA: broadleaf     # faggete
      RB: broadleaf     # robinieti
      BS: broadleaf     # boscaglie pioniere e d'invasione
      AF: broadleaf     # acero-tiglio-frassineti
      QR: broadleaf     # querceti di rovere
      QV: broadleaf     # querceti di roverella
      QC: broadleaf     # querco-carpineti
      SP: broadleaf     # saliceti e pioppeti ripari
      OS: broadleaf     # orno-ostrieti
      AN: broadleaf     # alneti planiziali e montani
      CE: broadleaf     # cerrete
      LC: conifer       # lariceti e cembrete
      RI: conifer       # rimboschimenti (pino nero, peccio, larice, douglasia; rarely quercia rossa)
      PS: conifer       # pinete di pino silvestre
      AB: conifer       # abetine
      PE: conifer       # peccete
      PN: conifer       # pinete di pino montano (uncinato)
      PM: conifer       # pinete di pino marittimo (Appennino alessandrino)
      OV: transitional  # arbusteti subalpini (ontano verde, rododendro)
      AS: transitional  # arbusteti planiziali, collinari e montani
  types:
    source: rp_carta_forestale
    classes:
      CA: chestnut
      FA: beech
      RB: exotic_broadleaf
      BS: mixed_broadleaf     # betula, pioppo tremolo, nocciolo
      AF: mixed_broadleaf
      OS: mixed_broadleaf
      QR: deciduous_oak
      QV: deciduous_oak
      QC: deciduous_oak       # farnia with carpino bianco
      CE: deciduous_oak
      SP: riparian
      AN: riparian
      AB: fir_spruce
      PE: fir_spruce
      LC: other_conifer       # larice, pino cembro
      RI: other_conifer
      PS: mountain_pine
      PN: mountain_pine
      PM: mediterranean_pine

soil:
  source: soilgrids

# iNaturalist place for the recent-observations fetch, resolved by name ("Piemonte, IT", admin level
# 10) on 2026-09-25. GBIF history is paged over bbox_wgs84 and clipped to the grid afterwards.
sightings:
  inaturalist_place_id: 10872
