# Tuscany: the v1 region. Source ids resolve in ../sources.yaml.
id: tuscany
name: {it: Toscana, en: Tuscany}
timezone: Europe/Rome

# [lon_min, lat_min, lon_max, lat_max], the ISTAT boundary's extent rounded outward to 0.01°.
bbox_wgs84: [9.68, 42.23, 12.38, 44.48]

# EEA reference grid: ETRS89-LAEA (EPSG:3035), 1 km cells named by their lower-left corner.
grid:
  crs: "EPSG:3035"
  cell_size_m: 1000

# ISTAT region code (COD_REG) in the national boundaries file.
boundary:
  source: istat_boundaries
  region_code: 9

# Woodland: the regional land-cover map says how much of each cell is broadleaf, conifer, mixed
# forest, macchia or regrowth (1:10,000, 2019); the ISPRA CLC IV level map says which forest types
# make up the broadleaf and conifer shares (1:100,000, 2018). See .gavin-root/docs/woodland-grid.md.
forest:
  groups:
    source: rt_ucs
    year_column: ucs19
    classes:
      "311": broadleaf
      "312": conifer
      "313": mixed
      "323": macchia
      "324": transitional
  types:
    source: ispra_clc18_iv
    classes:
      "3111": evergreen_oak
      "3112": deciduous_oak
      "3113": mixed_broadleaf
      "3114": chestnut
      "3115": beech
      "3116": riparian
      "3117": exotic_broadleaf
      "3121": mediterranean_pine
      "3122": mountain_pine
      "3123": fir_spruce
      "3124": other_conifer
      "3125": other_conifer

# Topsoil pH (0-30 cm, depth-weighted) from SoilGrids. Not used by the v1 rules (PRD known gaps).
soil:
  source: soilgrids
