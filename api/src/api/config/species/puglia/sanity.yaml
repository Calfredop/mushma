  claim: 'Late May to mid-June 2023: ''Nel resto del Sud in Puglia spiccano i Finferli/Galletti''
    (FM 2023-05-25); ''anche in Puglia ... si stanno trovano per lo più Finferli'' (FM 2023-06-01);
    ''Puglia-Basilicata dove, però di contro abbondano più che mai Finferli/Galletti'' (FM
