- id: arco_ionico_early_september_2021_vs_2019
  claim: 'Early September 2021: ''una ottima buttata di Porcini estivi appena iniziata nella bassa
    Basentana tra Basento-Bradano e confine pugliese fin su parte del Tarantino di
    Ginosa-Laterza-Massafra fin su Putignano'' (FM 2021-09-04); ''Ancora per qualche giorno
    dovrebbero esserci le condizioni ideali per nascite al confine tra Bradano – Basilicata e
    Tarantino, Murge meridionali'' (FM 2021-09-10). 2019: rain returned only ''dopo un lunghissimo
    periodo siccitoso e ben torrido'' (FM 2019-09-05); ''Campania-Basilicata-Puglia con nascite
    ancora modeste o del tutto assenti'' (FM 2019-09-20)'
  source: https://web.archive.org/web/20210922081914/https://funghimagazine.it/aggiornamento-meteofunghi-04-09-2021-porcini-giganti/
