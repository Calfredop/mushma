  claim: 'December 2023 (''Un Dicembre strepitoso per i funghi''): ''tra Lazio, Campania e Puglia si
    stanno trovando ancora i più estivi Cantharellus cibarius e Cantharellus pallens!'', ''ottimi
    raccolti di questi funghi in ... Puglia tutta'' (FM 2023-12-16); ''tranne la Puglia, che ha
