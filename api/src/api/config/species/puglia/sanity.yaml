# Press-contrast sanity check for Puglia (api.model.sanity).
# Areas by comuni (ISTAT 2025 names, all in Puglia; note ISTAT's "San Nicandro Garganico") or
# provinces (ISTAT sigle; '*' is the whole region). Windows and source URLs written down on
# 2026-09-28, before any Puglia score existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); read those with `--group ovoli` / `--group gallinacci`.
# Puglia local press does not say how a porcini season went: it reports cardoncelli (Pleurotus
# eryngii, out of scope), picking courses, lost pickers and giant finds. All thirteen contrasts
# rest on Funghi Magazine's national bulletins (read through Wayback Machine captures; the live
# site blocks scripts), whose Puglia lines come from readers' reports and are often one sentence,
# region-wide or about the "Foggiano"; most contrasts draw on 2-4 bulletins. Cardoncello lines
# were not used as evidence. No source covers 2016-2017. Quotes, second sources and weaknesses per contrast:
# .gavin-root/docs/species-ecology/puglia.md (Sanity contrasts).
