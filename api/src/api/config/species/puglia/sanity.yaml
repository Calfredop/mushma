    anche ... il Gargano in Puglia'' (FM 2022-09-05). Late August 2023: ''Assenza di nascite tra
    Molise-Puglia e Basilicata non tirrenica'' (FM 2023-08-24)'
  source: https://web.archive.org/web/20220826073117/https://funghimagazine.it/nuovo-boom-di-porcini/
