contrasts:
- id: puglia_early_june_2020_vs_2018_2021
  claim: 'Early June 2020: porcini estatini picked ''in Puglia anche sotto Querce isolate o nelle
    Pinete litoranee'' (FM 2020-06-11), after ''le prime nascite di funghi Porcini si potrebbero avere
    a brevissimo nella Foresta Umbra e Sub-Appennino Dauno'' (FM 2020-05-22). June 2018: ''Puglia
    insolitamente ferma ... mentre la Foresta Umbra sembra poltrire'' (FM 2018-06-16). June 2021:
    ''l''arrivo dei primi Boleti ha coinciso con la nuova fase climatica secca e ventosa che ha
    bloccato sul nascere ogni tentativo di avvio di stagione'' (FM 2021-06-24)'
  source: https://web.archive.org/web/20200929073545/https://funghimagazine.it/aggiornamento-funghi-11-giugno-2020/
  higher:
    area: puglia
    seasons:
    - 2020
    start: 06-01
    end: 06-15
  lower:
    area: puglia
    seasons:
    - 2018
    - 2021
    start: 06-01
    end: 06-15
- id: gargano_dauni_early_august_2020_vs_2021_2023_2025
  claim: 'Early August 2020: ''ottime nascite attese a brevissimo sul Gargano-Bosco di Lucera-Sub
    Appennino Dauno'' (FM 2020-07-23), ''Ultime nascite per il Gargano, Bosco di Lucerna e
    Sub-Appennino Dauno'', ''inattese nascite anche in alcune aree della Basilicata e Puglia'' (FM
    2020-08-14). 2021: ''Alcune docce registrate in Puglia il giorno 11 Agosto non dovrebbero aver
    innescato alcuna nascita'' (FM 2021-08-19). 2023: ''Stesso discorso per la Puglia con forse
    qualche cenno di timidissime nascite tra Bari e Monopoli'' (FM 2023-08-17). 2025: ''Le piogge
    recenti sono state troppo isolate e post-caldo africano'' (FM 2025-08-08)'
  source: https://web.archive.org/web/20200926054742/https://funghimagazine.it/aggiornamento-meteofunghi-14-08-2020/
