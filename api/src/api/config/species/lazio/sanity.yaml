# Press-contrast sanity check for Lazio (api.model.sanity).
# Areas by comuni (ISTAT names, 2025, all inside Lazio) or provinces (ISTAT sigle, as the grid's
# `province` column holds them); windows and source URLs written down on 2026-09-28, before any Lazio
# score existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); read those with `--group ovoli` / `--group gallinacci`.
# Evidence, second sources and weaknesses per contrast: .gavin-root/docs/species-ecology/lazio.md.
# Most contrasts rest on Funghi Magazine's national bulletins, whose Lazio paragraph is written from
# readers' reports; local press (Tusciaweb, Viterbonews24, RietiLife, Castelli Notizie, Terzo Binario)
# and the outing reports of the Associazione Micologica Ecologica Romana (A.M.E.R.) add the rest.
