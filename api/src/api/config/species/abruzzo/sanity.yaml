- id: laga_august_2018_2017
  claim: 'Second half of August, Laga (Teramo side): in 2018 "Si segnalano delle buone nascite di
    boleti sulle nostre Montagne", "molto probabile, effettuare dei buoni raccolti ovunque si andrà"
    (2018-08-21), and at the Cavata (Rocca Santa Maria) "E'' un momento buono per i funghi"
    (2018-08-24); in 2017, at the Ceppo, "tutto il resto è tremendamente secco" (2017-08-09) and "i
    boschi sono ridotti malissimo" (2017-08-29) (Funghi Teramani)'
  source: https://funghiteramani.blogspot.com/2018/08/quarto-aggiornamento-di-agostoporcini.html
