contrasts:
- id: laga_july_2024_2018
  claim: 'July, Laga (Teramo side): in 2024 "C''è stata una "sfungata" eccezionale di Boletus
    aestivalis, in certi boschi sembrava inesauribile" until the woods dried in late July (A spasso
    tra le nuvole, 2024-07-23); in 2018 "di porcini ce ne sono veramente pochi" (2018-07-11) and "i
    funghi non ci sono, quelli presenti sono anche brutti e verminati" (Funghi Teramani, 2018-07-21)'
  source: https://www.aspassotralenuvole.it/post/un-po-di-analisi-porcinara
  higher:
    area: laga_teramana
    seasons:
    - 2024
    start: 07-03
