# Press-contrast sanity check for Abruzzo (api.model.sanity).
# Areas by comuni (ISTAT names, 2025) or provinces; windows and source URLs written down on
# 2026-09-26, before any Abruzzo score existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); read those with `--group ovoli` / `--group gallinacci`.
# Evidence, second sources and weaknesses per contrast: .gavin-root/docs/species-ecology/abruzzo.md.
# Abruzzo local press rarely says how a mushroom season went. The best-dated source is Bruno de
# Ruvo's forager blog (Funghi Teramani, then A spasso tra le nuvole) on the Teramo side of the Monti
# della Laga: the Ceppo (comune of Rocca Santa Maria, where it meets Valle Castellana, Cortino and
# Torricella Sicura), the Valle Castellana chestnut and oak woods, the Vomano side and Campotosto.
# Eleven of the sixteen contrasts rest on it. The others use Funghi Magazine's national bulletins,
# Coldiretti Abruzzo (2019) and Rete8 (2018) for the Marsica, the Chieti hills, the Gran Sasso and
# Majella beech woods, the south-west (Marsica, Valle Roveto, Carseolano, PNALM) and the region.
