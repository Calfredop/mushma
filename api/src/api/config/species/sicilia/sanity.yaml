- id: sicani_erei_iblei_2024_2021_september
  claim: 'September 2024: ''In Sicilia situazione perfetta come non accadeva da tempo ... Nascono e
    nasceranno ancora per qualche giorno Porcini ... In particolar modo tra Sicani, Erei e Iblei oltre
    che sull''Etna'' (FM 2024-09-19), after August storms of ''fino a 200 mm sui monti Iblei'' and
    about 100 mm on the Sicani (FM 2024-08-16); September 2021: ''Tra Sicilia centrale e
    meridionale ... è sempre la siccità a farla da padrona'' (FM 2021-09-24)'
  source: https://funghimagazine.it/aggiornamento-nascite-funghi-19-09-2024/
