- id: etna_vs_sicani_erei_2021_september
  claim: 'Late September 2021: ''In Sicilia si raccoglie ... quasi esclusivamente sui settori Est, in
    modo particolare attorno all''Etna dove si sono formate lunghissime code d''auto di cercatori'';
    ''Tra Sicilia centrale e meridionale ... è sempre la siccità a farla da padrona con miceli
    superficiali completamente morti'' (FM 2021-09-24); births already ''tra Etna, Nebrodi e
    Peloritani'' (FM 2021-09-10)'
  source: https://web.archive.org/web/20211024074056/https://funghimagazine.it/aggiornamento-meteofunghi-24-09-2021-funghi-porcini-situazione-italia/
