- id: etna_nebrodi_peloritani_june_2018_2021_vs_2022_2024
  claim: 'June 2021: ''ottime le nascite di Porcini in Sicilia, dapprima sui soli settori Orientali,
    poi anche su quelli Centrali, infine solo sui settori Settentrionali ... con buona continuità tra
    Etna e Nebrodi'' (FM 2021-06-24); June 2018: ''Sicilia favorita in aree di montagna tra Etna,
    Nebrodi e Peloritani'' (FM 2018-06-16), ''nascite abbondanti'' (FM 2018-07-01); June 2022: ''La
    Sicilia resta ferma al chiodo ... Sporadiche nascite si sono avute tra Etna e Peloritani'' (FM
    2022-06-10); June 2024: ''sporadiche nascite in Sicilia orientale, anche di Porcini, però spesso
    già screpolati'' (FM 2024-06-14), ''giusto qualche sporadicissimo ritrovamento'' (FM 2024-06-28)'
  source: https://web.archive.org/web/20210725030935/https://funghimagazine.it/aggiornamento-meteofunghi-24-06-2021-funghi-porcini-si-inizia-a-fare-sul-serio/
