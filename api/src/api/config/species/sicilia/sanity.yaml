contrasts:
- id: etna_2018_2017_late_summer
  claim: 'Late summer 2018 on Etna: ''già in agosto si sono raccolte grandi quantità dei pregiati
    porcini dell''Etna'', prices ''scesi fino a sette euro al chilo'', foragers bringing home ''anche
    20 chili'' between Bronte and Randazzo (La Sicilia, 2018-09-28, via Bronte118); ''Sardegna e
    Sicilia ... hanno avuto piogge di gran lunga superiori alle attese e nascite di funghi
    eccezionali'' (FM 2018-08-31); an Etna forager on 2017: ''il bilancio devo dire è stato piuttosto
    fallimentare'', 2018: ''quest''anno è diverso ... piuttosto soddisfacenti'' (Steemit, 2018-08-31)'
  source: https://www.bronte118.it/speciale-funghi-i-piu-buoni-sul-terreno-calcare-delletna/
  higher:
    area: etna
    seasons:
    - 2018
    start: 08-10
    end: 09-30
  lower:
    area: etna
    seasons:
    - 2017
    start: 08-10
    end: 09-30
- id: etna_2018_2025_august
  claim: 'August 2018: ''già in agosto si sono raccolte grandi quantità dei pregiati porcini
    dell''Etna'' (La Sicilia, 2018-09-28), ''Mai quanto quest''anno era piovuto così tanto ad Agosto
    nel corso dell''ultimo lustro'' (FM 2018-08-31); August 2025: ''Calabria, Sicilia e Sardegna
    restano ancora fuori dai giochi, salvo micro-zone montane umide'' (FM 2025-08-01), ''Sicilia: al
    momento le probabilità di nascite sono molto basse'' (FM 2025-08-29), ''Dopo la magra estiva''
    (FM 2025-10-16)'
  source: https://web.archive.org/web/20250829134646/https://funghimagazine.it/aggiornamento-nascite-funghi-29-08-2025/
