- id: etna_peloritani_vs_sicani_ficuzza_2020_late_june
  claim: 'Late June 2020: ''In Sicilia buoni i settori orientali che hanno avuto diverse piogge, più
    asciutti i boschi dei settori Ovest che sono assai meno produttivi'' (FM 2020-06-25); ''ultimi
    ritrovamenti in zone montane della Sicilia orinetale, limitatamente ai boschi dell''Alcantara ed
    Etna Settentrionale'' (FM 2020-07-03); ''scarse nascite di funghi in Sardegna e Sicilia
    occidentale'' (FM 2020-07-10)'
  source: https://web.archive.org/web/20200929081804/https://funghimagazine.it/aggiornamento-funghi-25-giugno-2020/
