- id: etna_nebrodi_peloritani_2024_timing_late_summer
  claim: 'Summer 2024: ''in alcune aree della Sicilia, soprattutto orientale, da settimane o mesi,
    la siccità si fa sempre più pesante'' (FM 2024-06-14), heat through July; then ''In Sicilia
    finalmente si raccoglie!'' (FM 2024-08-30), ''situazione perfetta come non accadeva da tempo''
    (FM 2024-09-19); at Monte Minardo, Bronte, ''Sono circa dieci giorni che piove ... una condizione
    ideale'', about 10 kg in a day (La Sicilia, 2024-09-04)'
  source: https://www.lasicilia.it/news/buongusto/2250580/il-fungo-porcino-dell-etna-da-record-trovato-sul-monte-minardo-a-bronte-e-pesantissimo.html
