- id: sicani_ficuzza_vs_etna_2022_november
  claim: 'November 2022: ''non si registrano nascite degne di nota sui settori orientali, tranno che
    localmente sull''Etna, continuano invece le nascite'' where storm fronts keep crossing ''soprattutto
    il Trapanese e a tratti il Palermitano, l''Agrigentino'' (FM 2022-11-05); ''ottime nascite sui
    settori occidentali ... scarse sui settori orientali'' (FM 2022-11-12); ''ultime nascite in
    diminuzione tra Etna-Catanese e Ragusano-Siracusano'' (FM 2022-11-19)'
  source: https://web.archive.org/web/20221129141843/https://funghimagazine.it/aggiornamento-porcini-06-11-2022/
