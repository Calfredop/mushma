- id: etna_nebrodi_peloritani_vs_sicani_ficuzza_2020_october
  claim: 'October 2020: ''ottime nascite sui settori Est e Nord dell''Isola'' (FM 2020-10-08);
    ''Sicilia settentrionale ed orientale ... nascite di funghi Porcini progressivamente sempre più
    massicce e talvolta persino sbalorditive'' (FM 2020-10-15); ''ancora una volta protagonisti i
    settori Est e Nord ... Sud ed Ovest dell''isola continuamente sferzati dal vento e con piogge più
    contenute, registrano nascite del tutto sporadiche o persino localmente assenti'' (FM 2020-10-23)'
  source: https://web.archive.org/web/20201204163307/https://funghimagazine.it/meteofunghi-23-10-2020/
