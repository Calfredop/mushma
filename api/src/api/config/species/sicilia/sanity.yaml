# Press-contrast sanity check for Sicilia (api.model.sanity).
# Areas by comuni (ISTAT 2025 names, all in Sicily). Windows and source URLs written down on
# 2026-09-28, before any Sicily score existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); no ovoli or gallinacci contrast was found for Sicily.
# Sicilian local press rarely says how a season went, and the Giornale di Sicilia, Gazzetta del Sud
# and the Today network block AI agents; most contrasts rest on Funghi Magazine's national
# bulletins (read through Wayback Machine captures, the live site is behind a captcha), whose
# Sicily paragraphs are written from readers' reports and name sectors of the island ("settori
# Est" = Etna and the Messinese, "Nord" = Nebrodi, Madonie and the Tyrrhenian Peloritani, "Ovest" =
# the Trapanese and Palermitano, "Sud" = the Agrigentino and Ragusano) more often than comuni.
# Etna includes Randazzo and Bronte, which also reach into the Nebrodi; no contrast sets Etna
# against the Nebrodi. Quotes, second sources and weaknesses per contrast:
# .gavin-root/docs/species-ecology/sicilia.md (Sanity contrasts).
