- id: etna_nebrodi_vs_madonie_2023_october
  claim: 'Early October 2023: ''In Sicilia finalmente ben si raccoglie sui monti settentrionali ...
    Non male le nascite sui Peloritani, ancor meglio sui Nebrodi, ottime sull''Etna, appena
    sufficienti sulle Madonie'' (FM 2023-10-12); ''una buona buttata tra Etna e monti settentrionali,
    nella prima quindicina di ottobre'' (FM 2023-10-27)'
