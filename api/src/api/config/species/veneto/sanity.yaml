    in mid-September an Alto Comelico haul "che nell''occasione è stata molto abbondante" (Corriere
    delle Alpi, 2018-09-15); in 2017 "Non c''è praticamente niente da raccogliere nei nostri boschi"
    (Associazione micologica Bresadola, Corriere delle Alpi, 2017-08-29)'
