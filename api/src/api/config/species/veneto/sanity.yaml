# Press-contrast sanity check for Veneto (api.model.sanity).
# Areas by comuni (ISTAT names, 2025: Val di Zoldo, Alpago, Borgo Valbelluna, Setteville, Lusiana
# Conco, Pieve del Grappa, Valbrenta, Barbarano Mossano are the merged comuni) or provinces (sigle);
# windows and source URLs written down on 2026-09-29, before any Veneto score existed.
# `seasons: normal` expands to `normal_seasons`. 14 contrasts are porcini (the default `--group
# porcini`); `gallinacci_...` and `ovoli_...` are read with `--group gallinacci` and `--group ovoli`.
# Quotes, second sources and caveats per contrast: .gavin-root/docs/species-ecology/veneto.md (Press
# contrasts). Local papers rarely sum up a season: 7 contrasts rest on the Corriere delle Alpi, the
# Tribuna di Treviso, OggiTreviso and the Mattino di Padova quoting the Belluno mycological group
# (Associazione micologica Bresadola), the Cansiglio naturalists and the Treviso groups, the other 9
# mainly on Funghi Magazine's weekly bulletins, one editor working from readers' reports and rain
# gauges. Il Gazzettino, the Corriere del Veneto, L'Arena, Il Giornale di Vicenza, il Dolomiti,
# L'Amico del Popolo and the Today sites block AI agents and were not read. In Belluno "gialletti"
# and "finferli" are both used for C. cibarius.
