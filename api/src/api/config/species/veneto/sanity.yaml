- id: gallinacci_belluno_2019_2017
  claim: 'August in Belluno province: in 2019 northern Veneto had "piogge troppo persistenti ... In
    questo caso le nascite di funghi Galletti risultano abbondanti, ma non quelle di funghi Porcini"
    (Funghi Magazine, about 16 August 2019), and gialletti were among the species "maggiormente
    presenti" in late August (Associazione micologica Bresadola, Corriere delle Alpi, 2019-08-29); in
    2017 the woods, which in other years "avevano già iniziato a riempire ceste e cestini di porcini,
    finferli o anche di chiodini", had "praticamente niente da raccogliere" (Corriere delle Alpi,
