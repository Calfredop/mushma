- id: dolomites_2019_2017_august
  claim: 'Mid to late August in the Belluno Dolomites: in 2019 "La stagione è buona anche se non ci
    sono tanti funghi, se non in quota", with porcini the most present species (Fabio Padovan,
    Associazione micologica Bresadola, Corriere delle Alpi, 2019-08-29); in 2017 "È una disperazione
    quest''anno ... Non c''è praticamente niente da raccogliere nei nostri boschi" (Claudio
    Sommavilla, same group, Corriere delle Alpi, 2017-08-29)'
  source: https://www.corrierealpi.it/cronaca/funghi-tra-porcini-gialletti-e-russole-la-stagione-e-buona-jlojk87z
