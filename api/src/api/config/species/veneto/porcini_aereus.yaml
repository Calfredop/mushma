# Species rules for one key in VENETO, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Veneto records, the north-east census and the neighbours'
# evidence: what changed and why is in .gavin-root/docs/species-ecology/veneto.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_aereus
group: porcini
taxon: Boletus aereus
synonyms: []
status: draft
i18n_key: species.porcini_aereus
records:
  gbif_taxon_keys: [8733688]
  inat_taxon_ids: [333772]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    The best-sampled porcini taxon in Tuscany (61 iNaturalist records, 2026-09-17), but often confused
    with B. reticulatus in the field. Validate the porcini group score. Veneto (2026-09-29): 5
    iNaturalist records (3 observers; May, August, September 3), 1 GBIF copy, and 8 undated north-east
    census points (Colli Euganei 2, Monte Grappa foothills 2, Colli Berici 1, the Vicenza foothills 1,
    the Monte Baldo foothills 1, the Padova plain 1).
notes: >-
  The most xerothermophilous porcino. No quantitative weather study exists for this taxon: the rain
  logic is borrowed from B. edulis, and temperature and frost rules are shifted using qualitative sources.
  In Veneto a rare porcino of the warm hills and the Prealps' lowest slopes: the census has it at
  Torreglia (Colli Euganei), Cavaso del Tomba (Grappa foothills), Arcugnano (Colli Berici), Monte di
  Malo, Caprino Veronese (Baldo) and Piombino Dese, and the two located iNaturalist records are at
  Barbarano Mossano (Colli Berici, 59 m) and San Zeno di Montagna (Monte Baldo, 743 m), both in downy
  oak and hop-hornbeam woods. Kept because it is recorded and can only raise the porcini group score
  (the group takes the max over its keys). Changed here: one season window, the band cut to the hills,
  hop-hornbeam woods up to secondary host and subalpine scrub down to non-host.

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [2, 21, 32]
    reference_c: 17
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.5, 3.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, bmeteo_funghi_luglio, funghimagazine_giorni_pioggia]
  derived: true
  notes: >-
    POR-R3 for the thermophilic porcino. The pace is 1 at 17 °C of topsoil, the weather the lag
    window was drawn from. Fruit bodies develop at a lower optimum than mycelium grows in
    culture (B. edulis 25-28 °C; Moore et al. 2008), hence t_opt 21 °C. Thermophilic porcini
    appear 8-11 days after warm summer storms (lore); a 12 °C stretch runs at about 65 % pace.
    Caps stop growing when the day's minimum humidity falls under 40 % and grow well from about
    60 % (Kasparavičius 2001, B. edulis): open-air daily maximum VPD of 1.5 kPa keeps full pace
    and 3.0 kPa halves it; the floor stands for the moister air under the canopy. No peer-
    reviewed days-per-°C figure exists for these species: every number is a prior. The humidity
    ramp is set higher than for the autumn porcini because it fruits from summer, when open-air
    VPD is 2 kPa on a median July day.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: summer_autumn
          dates: ["15-06", "01-08", "31-10", "30-11"]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, gm_siena_boletus, museo_porcino_borgotaro, mushma_occurrence_check_2026, muse_censimento_boletus, mushma_veneto_occurrence_check_2026, mushma_fvg_occurrence_check_2026, ven_fm_funghi_giugno, ven_ambpd_fn2008a]
    derived: true
    data: available
    notes: >-
      POR-S2 in Tuscany, split by elevation to resolve a disagreement. The IGP (Apennine uplands) says July–September;
      Lucca and Siena sources and the records put the lowland peak in autumn. Central-Italy iNaturalist
      records: 0-300 m peak Sep–Nov, 300-600 m peak October, 600-900 m peak September; no July records
      at all (n=77, about 3 expected from observer effort), so the upland window reaches full only on
      1 August instead of the IGP's July. The 400-600 m handover is derived.
      Veneto (veneto.md): replaced by one window, full 1 August-31 October and closed by 30 November, as in
      Friuli-Venezia Giulia. The Tuscan upland/lowland split came from the Apennine IGP uplands and the
      macchia, which Veneto lacks. The north-east census profile, 83 % of it FVG, peaks in October (43
      %) with a second peak in August (25 %) and stops in November; the five Veneto iNaturalist records
      fall in May (1), August (1) and September (3). The June ramp keeps the summer storms' flushes:
      in June "si potrebbero già vedere in Veneto tra la bassa Lessinia e Colli Berici / Euganei"
      (ven_fm_funghi_giugno, folklore). On the Colli Euganei the Padova group found it "A fine ottobre ...
      nei boschi di castagni e querce a Laghizzolo (Monte Venda)", "presente nei Colli, ma di non facile
      ritrovamento", "rarissima invece nelle aree settentrionali, prevalentemente a quote collinari durante
      i periodi estivi" (ven_ambpd_fn2008a).

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        deciduous_oak: 1.0
        chestnut: 1.0
        evergreen_oak: 1.0
        macchia: 1.0
        mixed_broadleaf: 0.6
        mediterranean_pine: 0.6
        mixed_broadleaf_conifer: 0.3
        transitional_woodland_shrub: 0.1
        beech: 0.1
        other_conifer: 0.0
        mountain_pine: 0.0
        fir_spruce: 0.0
        riparian: 0.0
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, museo_porcino_borgotaro, gm_siena_boletus, sardegna_foreste_aereus, beugelsdijk2008, oria_de_rueda2008, mushma_habitat_share_2026, funghimagazine_carpino_nero2026, mushma_veneto_forest_check_2026, mushma_veneto_occurrence_check_2026, ven_ambpd_fn2008a, ven_ambpd_fn2009a]
    derived: true
    data: available
    notes: >-
      POR-H4. Four levels (2026-09-24, mushma_habitat_share_2026): oak, chestnut and holm oak are named
      hosts. Macchia is host too, not just dilution: this thermophilic taxon fruits directly in Cistus,
      Arbutus and Erica scrub in several sources, with Spanish yield data (22.5 kg/ha), and macchia is not
      one of the three classes design keeps below 1 (mixed broadleaf, mixed broadleaf+conifer, transitional
      woodland/shrub). Transitional woodland/shrub (oak/chestnut/macchia regrowth) and Mediterranean pine
      (documented pine-with-Erica-scoparia understorey) are secondary. Mixed broadleaf and mixed
      broadleaf+conifer are marginal: hornbeam/hazel/ash and conifer components are not this taxon's hosts.
      Beech, other conifer, mountain pine, fir/spruce, riparian and exotic broadleaf are non-host: cool or
      wet ground this warm, dry taxon avoids. Saturated to full credit from a host-weighted share of 0.30.
      Veneto (veneto.md, mushma_veneto_forest_check_2026). Mixed broadleaf 0.3 -> 0.6, as in
      Friuli-Venezia Giulia and Lombardia: here it is four fifths hop-hornbeam and manna ash
      (orno-ostrieti), 42 % of the woods below 700 m, and hop-hornbeam woods are a documented host ("sono
      spesso presenti il Boletus reticulatus (estatino) e il Boletus aereus (porcino nero)",
      funghimagazine_carpino_nero2026); both located Veneto records have ostrio-querceto as the first or
      second forest type within 500 m, and on the Colli Euganei the Padova group lists B. aereus among the
      commonest fungi of the downy-oak, manna-ash and hop-hornbeam woods on limestone and of the warm oak
      woods with holm oak (ven_ambpd_fn2008a, ven_ambpd_fn2009a); its hosts there are "querce, castagni e
      noccioli". Transitional woodland/shrub 0.6 -> 0.1: here mugo pine, green
      alder, shrubland and forest flattened by Vaia, mostly above 1000 m, not the Tuscan oak and macchia
      regrowth. Robinia stays non-host although one of the two records has it in half its surroundings:
      it replaced chestnut and oak on the hills but is no host. Holm oak, macchia and Mediterranean pine
      keep the Tuscan values; they cover a few hundred hectares on the coast and the Colli Euganei.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [null, null, 700, 1000]}
    confidence: plausible
    source: [matteucci2008_micoponte, muse_censimento_boletus, museo_porcino_borgotaro, arrigoni_viciani_castagneti, mushma_occurrence_check_2026, mushma_veneto_occurrence_check_2026, mushma_veneto_forest_check_2026, ven_gmb_primipassi]
    derived: true
    data: available
    notes: >-
      POR-A4. Coast to mid-hill; sunny mid-mountain chestnut is the upper limit. Tuscan iNaturalist records:
      median 352 m, p90 629 m, max 789 m (n=50).
      Veneto (veneto.md): full to 700 m, zero at 1000 m, between Friuli-Venezia Giulia's 600 -> 900 m and
      Trentino-Alto Adige's and Lombardia's 700-800 -> 1100 m. The north-east census altitude chart (83 %
      FVG) has 95 % of its records below 600 m, but Veneto's chestnut and warm oak belts climb higher on
      the Prealps' south faces than the Karst does: chestnut p90 740 m, downy oak with hop-hornbeam p90
      627 m on the grid, and the Monte Baldo record is at 743 m. It stays a hill porcino: "è specie tipica
      delle zone termofile o mediterranee ed è praticamente assente nell'areale alpino"
      (ven_gmb_primipassi).

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: plausible
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-R1 + POR-R2, transferred from B. edulis.

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: plausible
    source: [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1, transferred from B. edulis and community studies.
      Tuned (2026-09-22): the absolute 20->80 mm ramp was full in an ordinary September, so the 30
      days are scored as a percentage of the cell's own normal for those days (2016-2025 reanalysis,
      downscaled and rain-scaled like the rain): 0 at 50 %, full from 125 %. It raised the porcini
      train objective by 0.03 with or without the rain scale, and the hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [10, 14, 22, 26]}
    confidence: plausible
    source: [borgotaro_igp_rt, beugelsdijk2008, matteucci2008_micoponte, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: >-
      POR-T4. The warmest band: "la specie più xerotermofila". Low confidence within plausible.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d; compare in the backtest.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.75
    confidence: plausible
    source: [salerni2023_amiata, andrew2025]
    derived: true
    data: derived
    notes: POR-X1. Milder than for B. edulis (x0.75).

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.4
    confidence: folklore
    source: [funghimagazine_fino_quando, muse_censimento_boletus]
    derived: true
    data: available
    notes: POR-X3. Hardier in mild winters without constant frost (x0.4). NE Italy records run to early December.

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: folklore
    source: [borgotaro_igp_rt, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 5, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-X6. ET0 threshold 5 mm/day for a low-altitude summer taxon. All numbers are guesses.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [80, 95, null, null]}
    floor: 0.9
    confidence: folklore
    source: [matteucci2008_micoponte]
    derived: true
    data: derived
    notes: >-
      POR-A6. Tolerates or prefers sunny exposures (S x1.0, E/W x1.0, N x0.9): x0.9 at 80 % of
      flat ground's sun or less, x1 from 95 %. Read on the day's sun ratio, the cell's sun as
      a percentage of flat ground's (api.model.terrain), so it bites hardest in autumn, when
      the sun is low. The terrain microclimate already makes sunny slopes warmer and drier for
      every rule; this line is the species' own preference on top of that, kept soft.
      Kept for Veneto (veneto.md): below 1000 m the region's woodland cells run p10 80 %, median 101 %,
      p90 118 % of flat ground's sun on 15 October, a third of them under 95 %. The band is a statement
      about sun, not a Tuscan percentile.

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 35, 50]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby
      1979), but a 1 km cell's mean slope is not the slope of the exact spot the mushrooms
      grow on: normal terrain for Tuscan woodland scores full credit, and only clearly
      steep cells lose it. Woodland cells on the Tuscan grid run p10 10.2°, p25 12.6°, median
      16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up to 25°, about the p90, x0.8 from 40°.
      Mushroom production fell with slope in Pyrenean Scots pine (Bonet 2008), and B. edulis
      yield was highest under about 11° on plots in north-east Turkey (Mumcu Küçüker 2019);
      two Spanish studies found no slope effect (Martínez-Peña 2012, Taye 2016). It acts on
      the score only, never on the rain, so the same water is not counted twice.
      Veneto (veneto.md, mushma_veneto_forest_check_2026): the band moves onto the region grid by the
      same rule, normal terrain at full credit. Woodland cells there (grid built 2026-09-29, 4,025
      cells) run p10 15.0°, p25 18.6°, median 23.8°, p75 30.0°, p90 35.3°, max 49.9°, 45 % of them
      steeper than 25°: x1 up to 35°, about the p90, x0.8 from 50°, about the maximum, as Trentino-Alto
      Adige (35/45) and Friuli-Venezia Giulia (36/48) did. The Tuscan band would have docked 45 % of the
      region's woodland cells (mean x0.96); this one docks 11 % (mean x0.996).

known_gaps:
  - id: wood_edge
    description: POR-H5. Shrub, meadow and pasture within 100 m of a qualifying wood is productive.
    needs: [M2 grid, a woodland edge buffer when building habitat fractions]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014]
  - id: soil
    description: POR-N1. "Heavy loamy, often somewhat calcareous soil" (Dutch sampling); acid loams under Cistus in Spain.
    needs: [soil_texture, soil_ph]
    confidence: plausible
    source: [beugelsdijk2008, alonso_ponce2011]
