# Species rules for one key in VENETO, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Veneto records, the north-east census and the neighbours'
# evidence: what changed and why is in .gavin-root/docs/species-ecology/veneto.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_edulis
group: porcini
taxon: Boletus edulis
synonyms: [Boletus edulis s.s., Boletus quercicola, Boletus betulicola]
status: draft
i18n_key: species.porcini_edulis
records:
  gbif_taxon_keys: [5954958]
  inat_taxon_ids: [48701]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    Veneto (2026-09-29, mushma_veneto_occurrence_check_2026): 42 iNaturalist records (place 13074,
    verifiable; 32 observers, July to October, 16 of them from 2025-2026) and 22 GBIF records, all
    iNaturalist copies, against 12,721 fungi records in the region. The north-east census (MUSE) holds
    206 Veneto map points (Belluno 178, Vicenza 27, Verona 1) without dates: where, not when. Far too
    few to validate this key: validate the porcini group score and lean on the sanity contrasts.
notes: >-
  The only porcini taxon with direct weather-fruiting studies (Amiata, Germany, Spain).
  The shared rain logic below is borrowed by the other three porcini keys. In Veneto this is the
  porcino of the Dolomite and Prealpine spruce, fir and beech: the census points cluster in the
  Agordino (Agordo, Falcade, Canale d'Agordo, Gosaldo), Cadore and Comelico (Auronzo, Borca, San Vito,
  Santo Stefano), the Val di Zoldo and the Asiago plateau (Rotzo, Gallio, Asiago), and the located
  iNaturalist records sit at a median 1,369 m with spruce and fir around 64 % of them. Changed here:
  the season is split by elevation as in Friuli-Venezia Giulia, the band starts higher and ends higher,
  and the hop-hornbeam and downy-oak woods, larch and subalpine scrub drop to non-host.

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [0, 18, 30]
    reference_c: 15
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.0, 2.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, blog_prevedere_porcini, funghimagazine_giorni_pioggia, salerni2023_amiata, brejon_hoffman2026_preprint]
  derived: true
  notes: >-
    POR-R3. The pace is 1 at 15 °C of topsoil, the weather the lag window was drawn from. Fruit
    bodies develop at a lower optimum than mycelium grows in culture (B. edulis 25-28 °C; Moore
    et al. 2008), hence t_opt 18 °C. A 9 °C stretch runs at about 65 % pace and stretches a
    12-day lag to about 18 days, in line with the lore (about 0.6 days per °C; the lag grows by
    about 3 days when the 10 days after the rain average under 10 °C; longer in cool high beech
    than in chestnut at 600-700 m). Caps stop growing when the day's minimum humidity falls
    under 40 % and grow well from about 60 % (Kasparavičius 2001, B. edulis): open-air daily
    maximum VPD of 1.0 kPa keeps full pace and 2.0 kPa halves it; the floor stands for the
    moister air under the canopy. No peer-reviewed days-per-°C figure exists for these species:
    every number is a prior.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: lowland_autumn
          dates: ["15-06", "01-08", "31-10", "30-11"]
          elevation_weight: [null, null, 900, 1300]
        - label: alpine_summer
          dates: ["01-07", "25-07", "25-09", "25-10"]
          elevation_weight: [900, 1300, null, null]
    confidence: plausible
    source:
      [borgotaro_igp_rt, salerni2023_amiata, muse_censimento_edulis, mushma_veneto_occurrence_check_2026, fvg_campo2022_cansiglio, ven_reggenza_funghi, mushma_fvg_occurrence_check_2026, fvg_omg_observations, fvg_ktn_pilzschutz]
    derived: true
    data: available
    notes: >-
      POR-S3, split by elevation for Veneto (veneto.md) with Friuli-Venezia Giulia's numbers, as
      Lombardia also did. The Tuscan window (full 1 September to 15 November) would keep the Dolomite
      spruce of Cadore and the Agordino in season into December, held only by frost and snow. Veneto's
      42 iNaturalist records are over-represented in July (2.0x the region's fungi effort), August
      (3.4x) and September (1.6x), and under-represented in October (0.5x, 4 records); none in November.
      Located records at 1300 m and above run 17 July to 14 October (the latest at 1864 m at San Vito
      di Cadore, 2025), those below 1300 m 11 July to 20 October (the latest at 1017 m in the Valli del
      Pasubio, 2012). The Cansiglio beech checklist (about 30 years, 1000-1400 m) has B. edulis from July
      to October; the Asiago plateau's picking rules have it "dal mese di luglio in poi", resisting "anche
      a un discreto freddo, tanto che può resistere alle prime gelate" (ven_reggenza_funghi, folklore). The north-east census profile (36 % FVG, Veneto's share
      small) peaks in August, then September, with October at a quarter of the peak and its latest record on 3 November (Ovaro, 946
      m). Next door, Carinthian records with recorder elevations switch shape across 1000 m: 22-40 % of
      records in October or later below 1000 m, 2-5 % above. So, as there: the lowland window is full
      1 August-31 October and closed by 30 November, with a ramp from mid-June for the early flushes of
      the Prealpine beech and chestnut; the Alpine window is full 25 July-25 September and closed by 25
      October; the handover at 900-1300 m sits where the Veneto beech belt gives way to spruce and fir
      (beech median 1048 m, spruce and fir 1304 m on the grid). 44 % of the region's
      woodland cells are below 900 m and 28 % at 1300 m or above. A prior.

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        beech: 1.0
        chestnut: 1.0
        fir_spruce: 1.0
        mixed_broadleaf_conifer: 0.6
        mountain_pine: 0.6
        deciduous_oak: 0.1
        mixed_broadleaf: 0.1
        other_conifer: 0.1
        transitional_woodland_shrub: 0.1
        evergreen_oak: 0.1
        mediterranean_pine: 0.1
        macchia: 0.0
        riparian: 0.0
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, salerni2023_amiata, matteucci2008_micoponte, museo_porcino_borgotaro, gm_siena_boletus, beugelsdijk2008, mushma_habitat_share_2026, mushma_veneto_forest_check_2026, mushma_veneto_occurrence_check_2026, ven_del_favero2000, ven_ambpd_fn2007b, funghimagazine_carpino_nero2026, fvg_cebulec_pertot1985, taa_mandolini2025_larix, taa_mandolini2024_cembra, fvg_campo2022_cansiglio, mushma_taa_forest_check_2026]
    derived: true
    data: available
    notes: >-
      POR-H1. Four levels (2026-09-24, mushma_habitat_share_2026): beech, chestnut and fir/spruce are the
      preferred hosts named directly ("chestnut, beech and Norway spruce preferred") -> host. Mixed
      broadleaf+conifer (mostly a beech-fir mix, both hosts) and mountain pine (IGP-eligible black/Scots
      pine, "moderate") stay secondary: the mixed class is capped below host for dilution, not for weak
      evidence. Deciduous oak, mixed broadleaf (hornbeam/hazel eligible) and other conifer (Douglas fir
      eligible) are marginal: each is a class where only some of the trees are hosts. Transitional
      woodland/shrub is marginal for the same dilution reason. Evergreen oak, Mediterranean pine, macchia,
      riparian and exotic broadleaf (robinia) are non-host: none are named for this taxon. Saturated to full
      credit from a host-weighted share of 0.30 (`_habitat`'s response trapezoid), so a cell that is 30%
      beech/chestnut/fir is no longer diluted by the rest of the woods.
      Veneto (veneto.md; classes from regions/veneto.yaml on the Region's Carta della copertura del
      suolo 2021, mushma_veneto_forest_check_2026). Mixed broadleaf 0.3 -> 0.1: here it is the region's
      second woodland class (20.5 % of the woodland, 42 % of the woods below 700 m), and four fifths of
      it is orno-ostrieto, hop-hornbeam and manna ash on the carbonate Prealps (median 621 m on the grid,
      so about half of it sits inside the band's plateau). In the esalpica forest region, "in cui
      prevalgono i substrati carbonatici, sono abbondanti i consorzi, puri o misti, di carpino nero, che
      occupano circa un quinto dell'area forestale veneta", and only "al di sopra degli 800 m, agli
      orno-ostrieti si sostituiscono le faggete" (ven_del_favero2000). In hop-hornbeam woods the
      porcini "più legati a suoli acidi come Boletus edulis" are "quasi sempre assenti, o comunque molto rari nei contesti calcarei"
      (funghimagazine_carpino_nero2026), and next door in Trentino the B. edulis records below 1000 m
      had hop-hornbeam in 4 % of their surroundings against 27 % of the woods. At 0.3 a pure
      hop-hornbeam cell would get full credit under the 0.30 saturation; at 0.1 it gets a third, and a
      cell with a fifth of beech, chestnut or spruce still gets full credit. Deciduous oak 0.3 -> 0.1:
      the class is 90 % ostrio-querceti, downy oak with hop-hornbeam on warm limestone slopes (median 328
      m), as in Friuli-Venezia Giulia, where an 11-year survey of the Karst's oak scrub found no B.
      edulis; nearly all of it lies below the band's plateau anyway. Other conifer 0.3 -> 0.1: larch and
      stone pine (8.3 % of the woodland, median 1672 m), no porcini partner (no Boletus on South Tyrolean
      larch and stone pine roots, taa_mandolini2025_larix, taa_mandolini2024_cembra), as in the
      three Alpine neighbours; the Veneto records' surroundings hold larch in the same share as the woods
      (11 % against 11 %, n=33), because Dolomite larch stands mix with spruce, which carries the credit
      (a larch cell with a quarter of spruce still gets full credit). Transitional woodland/shrub 0.3 ->
      0.1: here mugo pine, green alder and shrubland, and the forest the map flags as flattened by Vaia
      or killed by bark beetle (median 1364 m), whose dead hosts no longer carry the mycorrhiza.
      Kept: beech, chestnut and fir/spruce as hosts (the located records' surroundings: spruce and fir 64
      % against 47 % of the woods at the same elevations, beech 13 % against 28 %; beech is kept as a
      host, as in Trentino-Alto Adige, because the Cansiglio beech checklist and the census record it,
      and the spruce bias may be where people walk); mountain pine at 0.6, not Friuli-Venezia Giulia's
      0.3, because in Veneto the class is the native Scots pine of the Belluno valleys (the black-pine
      plantations are typed with the conifer plantations, three quarters spruce, under fir/spruce): "le
      pinete di pino silvestre, che colonizzano ampi ambiti lungo l'alto corso del Piave e dei suoi
      affluenti" (ven_del_favero2000). The Colli Euganei chestnut woods list B. edulis among their
      commonest fungi (ven_ambpd_fn2007b), so chestnut stays a host at the band's foot.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [200, 600, 1900, 2200]}
    confidence: plausible
    source: [salerni2023_amiata, matteucci2008_micoponte, muse_censimento_boletus, muse_censimento_edulis, mushma_veneto_occurrence_check_2026, mushma_veneto_forest_check_2026, mushma_occurrence_check_taa_2026, ven_gmb_primipassi]
    derived: true
    data: available
    notes: >-
      POR-A1. "Dalla media all'alta montagna"; placed on the Tuscan beech and fir belts. Tuscan
      iNaturalist records: p10 478 m, median 1024 m, p90 1386 m (n=27).
      Veneto (veneto.md): full from 600 m to 1900 m, zero at 200 m and 2200 m. Located Veneto
      iNaturalist records (n=34, Copernicus GLO-30): min 272 m, p10 969 m, median 1369 m, p90 1662 m,
      max 1864 m. The north-east census altitude chart has its mode at 1200-1500 m, 18 % of records at
      1500-1800 m and 4 % at 1800-2100 m, but only 3 % below 600 m; its 206 Veneto map points are in the
      Belluno mountains, the Cansiglio and the Asiago plateau, with one in Verona province. The woods here reach higher than in Friuli-Venezia Giulia
      (woodland cells to 2154 m, 3.6 % above 1800 m): subalpine spruce and the spruce-rich
      larch-stone pine of Cadore, Comelico and the Agordino at 1750-1850 m median, as in Trentino-Alto
      Adige, whose records reach 2170 m and whose band is full to 1900 m; the Trento group's primer has B.
      edulis "rinvenibile dalla pianura fino a oltre 2000 m di quota" (ven_gmb_primipassi). The lower
      ramp runs through the chestnut belt of the Prealpine foothills and the hills (chestnut median 493
      m) and zeroes the plain's edge.

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: strong
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia, bmeteo_pioggia_funghi]
    derived: true
    data: available
    notes: >-
      POR-R1 + POR-R2. Amiata B. edulis counts correlate with >=20 mm rain days, peaking 12 days
      later (r about 0.6). Lag shape and the 10->30 mm ramp are derived (30 mm = the PRD hypothesis and
      the low end of forager lore). Strong for the lag; the amount ramp is plausible.

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: strong
    source:
      [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, salerni2023_amiata, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1. 30-day rain drives fruiting in Tuscan oak woods (community) and a 26-day window at
      2-4 mm/day fits B. edulis in German beech. The effect is strong; the 20->80 mm ramp is derived.
      Tuned (2026-09-22): the absolute 20->80 mm ramp was full in an ordinary September, so the 30
      days are scored as a percentage of the cell's own normal for those days (2016-2025 reanalysis,
      downscaled and rain-scaled like the rain): 0 at 50 %, full from 125 %. It raised the porcini
      train objective by 0.03 with or without the rain scale, and the hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [6, 10, 17, 22]}
    confidence: plausible
    source: [brejon_hoffman2026_preprint, salerni2023_amiata]
    derived: true
    data: available
    notes: >-
      POR-T1. German optimum about 13 °C over 20 days (preprint); the upper shoulder is widened because
      Amiata fruited in an 18.6 °C summer. Needs lapse-rate-corrected temperature per cell.

  - id: soil_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.soil_temperature
    input: {variable: soil_temperature_0_to_7cm_mean, aggregate: mean, window_days: 10}
    response: {trapezoid: [6, 10, 17, 22]}
    confidence: folklore
    source: [brejon_hoffman2026_preprint, bmeteo_pioggia_funghi]
    derived: true
    data: available
    enabled: false
    notes: POR-T5. Alternative to air_temperature, never both. No porcini soil-temperature threshold found in a primary source.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014, martinez_de_aragon2007, agreda2016]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d (P - ET0 instead of P); compare both in the backtest.

  - id: soil_moisture
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.soil_moisture
    input: {variable: soil_moisture_7_to_28cm_mean, aggregate: percentile_of_normal, window_days: 7}
    response: {trapezoid: [10, 40, null, null]}
    confidence: plausible
    source: [karavani2018, garcia_bustamante2021]
    derived: true
    data: derived
    enabled: false
    notes: >-
      POR-M2. Same-month soil moisture limits yield (Mediterranean pine, community). Percentile against
      the cell's calendar-month climatology, because model soil moisture is not comparable with field
      thresholds. Needs the backfill climatology.

  - id: early_season_wetness
    role: stopper
    kind: window_aggregate
    i18n_key: factor.early_season_wetness
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 60}
    response: {trapezoid: [50, 100, null, null]}
    floor: 0.6
    confidence: plausible
    source: [alday2017, taye2016, parlade2017, garcia_bustamante2021, salerni2002_oak]
    derived: true
    data: derived
    enabled: false
    notes: >-
      POR-M4. 60-day rain as % of the cell's climatology: x0.6 at <=50 %, x1 at >=100 %. Autumn only in
      the source reading; Soria found no effect of previous-summer rain, so it stays a weak multiplier.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.5
    confidence: plausible
    source: [salerni2023_amiata, karavani2018, andrew2025]
    derived: true
    data: derived
    notes: >-
      POR-X1. Tmax spikes about 8 °C above the period mean correlated negatively with fruit bodies for
      up to about 3 weeks at Amiata. The multiplier is derived.

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.2
    confidence: folklore
    source: [borgotaro_igp_rt, brejon_hoffman2026_preprint, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X3. Two or more frosty nights in a week -> x0.2. Thresholds derived.

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4. "Alla prima neve" ends the season. >=1 cm of snow in 3 days -> 0.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 4, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: >-
      POR-X6. Forager lore: drying wind (tramontana, grecale) after rain wastes the trigger. No source
      gives numbers; ET0 stands in for wind + dry air + sun. Every number is a guess to tune.

  - id: drought_45d
    role: stopper
    kind: window_aggregate
    i18n_key: factor.drought
    input: {variable: precipitation_sum, aggregate: sum, window_days: 45}
    response: {trapezoid: [10, 15, null, null]}
    confidence: plausible
    source: [brejon_hoffman2026_preprint, agreda2015, salerni2002_oak]
    derived: true
    data: available
    enabled: false
    notes: POR-X2. Mostly subsumed by rain_30d (0 at <=20 mm in 30 days); kept for the backtest to compare.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [null, null, 105, 125]}
    floor: 0.8
    where: {attribute: elevation_m, trapezoid: [null, null, 900, 1100]}
    confidence: folklore
    source: [rt_tipi_forestali_p4, bmeteo_pioggia_funghi, bonet2008, mumcu_kucuker2019]
    derived: true
    data: derived
    notes: >-
      POR-A5. Below 1000 m, north-facing slopes keep moisture in hot spells and hold the
      conifer hosts (N x1.0, E/W x0.9, S x0.8), but flat, east- and west-facing ground is
      normal for Tuscan woodland and scores full credit: only clearly sunny slopes lose it.
      On 15 Oct the cell's sun ratio (its clear-sky sun as a % of flat ground's) runs p10 89
      %, p25 95 %, median 100 %, p75 105 %, p90 111 % (2026-09-24): x1 up to 105 %, about the
      p90, x0.8 from 125 %, fading out between 900 and 1100 m. North aspect raised production
      in dry Pyrenean pine (Bonet 2008), while a humid Turkish forest found north slopes
      worst for B. edulis (Mumcu Küçüker 2019): the preference is kept to low altitude, where
      water limits fruiting. Read on the day's sun ratio, the cell's sun as a percentage of
      flat ground's (api.model.terrain), so it bites hardest in autumn, when the sun is low.
      The terrain microclimate already makes sunny slopes warmer and drier for every rule;
      this line is the species' own preference on top of that, kept soft.
      Kept for Veneto (veneto.md, mushma_veneto_forest_check_2026). On the region's woodland grid the
      15 October sun ratio runs p10 78 %, p25 90 %, median 101 %, p75 111 %, p90 120 % (below 1000 m
      p10 80 %, median 101 %, p90 118 %, 38 % of those cells above 105 %; Tuscany p10 89 %, p90 111 %).
      The steeper slopes put more cells on the ramp; the rule reads each cell's own sun, so the band is a
      statement about sun and drying, not a Tuscan percentile to re-anchor.

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 35, 50]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby
      1979), but a 1 km cell's mean slope is not the slope of the exact spot the mushrooms
      grow on: normal terrain for Tuscan woodland scores full credit, and only clearly
      steep cells lose it. Woodland cells on the Tuscan grid run p10 10.2°, p25 12.6°, median
      16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up to 25°, about the p90, x0.8 from 40°.
      Mushroom production fell with slope in Pyrenean Scots pine (Bonet 2008), and B. edulis
      yield was highest under about 11° on plots in north-east Turkey (Mumcu Küçüker 2019);
      two Spanish studies found no slope effect (Martínez-Peña 2012, Taye 2016). It acts on
      the score only, never on the rain, so the same water is not counted twice.
      Veneto (veneto.md, mushma_veneto_forest_check_2026): the band moves onto the region grid by the
      same rule, normal terrain at full credit. Woodland cells there (grid built 2026-09-29, 4,025
      cells) run p10 15.0°, p25 18.6°, median 23.8°, p75 30.0°, p90 35.3°, max 49.9°, 45 % of them
      steeper than 25°: x1 up to 35°, about the p90, x0.8 from 50°, about the maximum, as Trentino-Alto
      Adige (35/45) and Friuli-Venezia Giulia (36/48) did. The Tuscan band would have docked 45 % of the
      region's woodland cells (mean x0.96); this one docks 11 % (mean x0.996).

