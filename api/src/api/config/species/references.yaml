      una quota di 400 – 500 m. s.l.m." (art. 4), eligible "a una quota tra i 400 ed i 750 metri s.l.m." (art. 5), on
      "strati tufacei di origine vulcanica ricchi di sostanza organica, profondi, ben drenati, freschi" (art. 6); the
