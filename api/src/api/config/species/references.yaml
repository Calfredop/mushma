    kind: institutional
    region: Lazio
    verified: verified
    supports: 'on Monte Cimino "the pure beech forest covers about 60 hectares, ranging from the 1,054 m of the summit to
      800-850 m of altitude", "confined to the summit of the mountain, above 900 m"; "The most widespread forest type is
      undoubtedly represented by coppice and fruit sweet chestnut woodlands between 550 and 950 m of altitude, often
      associated with oak woods at lower altitudes", on the acid volcanic substratum.'
    cited_as:
    - species-ecology/lazio.md
  parchilazio_castelli_vegetazione:
