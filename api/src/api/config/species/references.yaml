  arsial_atlante_suoli2019:
    citation: 'Napoli R., Paolanti M., Di Ferdinando S. (eds.) (2019). Atlante dei Suoli del Lazio. ARSIAL and Regione
      Lazio'
    url: https://dati.lazio.it/dataset/17f16ae6-7372-45bc-97b8-82768b55e1b0/resource/575846e9-29fa-4125-b264-8b73315268de/download/atlantelaziocompletolow.pdf
    kind: institutional
    region: Lazio
    verified: verified
    supports: 'the volcanic soil region covers 5,299 km², "circa il 30,7 % del territorio della Regione" (p. 71), on
      the Vulsini, Cimini, Sabatini and Colli Albani; Andosols, whose "orizzonti sil-andici, hanno una reazione da acida
      a neutra, mentre gli orizzonti alu-andici variano da estremamente acidi ad acidi" (p. 108), "Umbric Andosols ...
      principalmente ai bordi delle caldere di Vico e Bracciano (M.ti Cimini e Sabatini)", Vitric Andosols on the Colli
      Albani (p. 110); the Bolsena, Vico and Bracciano caldera slopes carry "castagneti da frutto e cedui, faggete,
      cerrete, boschi di roverella" on Dystric Umbric Andosols (p. 75); the Terminillo and Simbruini-Ernici beech on
      Rendzic Leptosols and Phaeozems (pp. 93-94).'
    cited_as:
    - species-ecology/lazio.md
  lazio_ptar2018:
    citation: 'Regione Lazio and ARPA Lazio (2018). Piano di Tutela delle Acque Regionale (PTAR), Aggiornamento. BUR
      Lazio n. 103 of 20 December 2018, Suppl. 3 (the climate chapter summarises Blasi C. 1994, Fitoclimatologia del
      Lazio)'
    url: https://www.regione.lazio.it/sites/default/files/amministrazione-trasparente/tbl_contenuti/Piano_Tutela_Acque_Regionale_Aggiornamento.pdf
    kind: institutional
    region: Lazio
    verified: verified
    supports: 'Lazio phytoclimate (pp. 64-73 of the PDF): the temperate mountains (Terminillo, Gorzano, Meta) "P molto
      abbondante (1614 mm); Pest frequente e abbondante (277 mm)", no summer drought; the Cimini, Vico caldera, Colli
      Albani and Fiuggi 1,247-1,606 mm, drought absent or very weak; the Mediterranean region of transition (inner
      Maremma, Tolfa, Sabatini, Campagna Romana) "tra 810 e 1.519 mm e da un regime di aridità estiva che generalmente
      dura da due a tre mesi"; the Mediterranean coast, the Agro Pontino and the low Viterbo hills "inferiori ai 650 mm.
      Il periodo di aridità estiva è sempre presente, con una durata di circa 5 mesi", the Viterbo and Rome coast "P
      scarsa (593÷811 mm); Pest da 53 a 71 mm". "La faggeta occupa una fascia altitudinale compresa tra i 700 e 1400 m"
      (p. 78).'
    cited_as:
    - species-ecology/lazio.md
