  lr_lazio_32_1998:
    citation: 'Regione Lazio. L.R. 5 agosto 1998, n. 32, Disciplina della raccolta e della commercializzazione dei
      funghi epigei spontanei e di altri prodotti del sottobosco (BUR Lazio n. 23 of 20 August 1998, S.O. 2),
      testo coordinato with the amendments of L.R. 9/2017, 1/2018, 13/2018, 1/2020 and 20/2024. Consiglio
      regionale del Lazio'
    url: https://www.consiglio.regione.lazio.it/?vw=leggiregionalidettaglio&id=8275&sv=vigente
    kind: institutional
    region: Lazio
    verified: verified
    supports: 'the regional picking law in force: "determinata complessivamente in tre chilogrammi" per person per
      day (art. 3.1); minimum cap of 4 cm for "Amanita caesarea (ovolo buono)" and "Boletus edulis e relativo gruppo
      (porcino)" (3.2), none for "Cantharellus Adans ex Fries tutte le specie" (3.2 bis); "vietata la raccolta della
      Amanita caesarea allo stato di ovolo chiuso" (3.4); a permit after a 14-hour course and a yearly contribution
      (art. 4); no picking at night (9.1); bans in integral reserves and in the park areas their bodies choose (art.
      10); temporary closures, and since L.R. 20/2024 the weekdays open to picking, set by the Giunta (art. 11). No
      season calendar and no altitude rule. Confirms the porcini group, the ovolo and the chanterelles as regional
      species.'
    cited_as:
    - species-ecology/lazio.md
  regione_lazio_carta_forestale2011:
    citation: 'e-geos and Forest Lab Centre (Università del Molise) for Regione Lazio (2010, published 2011). Carta
      delle formazioni naturali e seminaturali mediante approfondimento al 4° e 5° livello Corine Land Cover della
      Carta dell''Uso del Suolo della Regione Lazio; Carta forestale su base tipologica: Report finale (versione del
      15/11/2010). Open Data Lazio'
    url: https://dati.lazio.it/dataset/91a9cd67-1a41-4584-b611-960c65d82724/resource/68897c70-79ab-4f86-b20c-9c920442ec05/download/relazionecartaforestaletipologicadellazio.pdf
    kind: institutional
    region: Lazio
    verified: verified
    supports: 'the Lazio forest types the grid reads (pp. 45-80). Faggete montane "tipici della fascia altitudinale
      compresa tra 900 e 1800 m", the lower montane ones "generalmente tra 1000 e 1400 m", the upper ones "tra 1400 e
      1800-1900 m" (p. 53); Faggeta altomontana e rupestre "indicativamente 1500-1800) fino al limite della
      vegetazione arborea" (p. 75); Faggete termofile e basso-montane "Boschi di bassa quota, generalmente di media e
      alta collina (500-800 m, eccezionalmente piccoli lembi anche a 300 m)", with "carpino nero (Ostrya
      carpinifolia), cerro (Quercus cerris), castagno (Castanea sativa), carpino bianco" (pp. 52-53), "discese fino a
      500 m sui substrati vulcanici, es. Faggete di Oriolo e di Allumiere" (p. 76). Chestnut woods "Interessano
      essenzialmente i versanti dei rilievi vulcanici", and limestone relief only where the soil has acidified (p.
      52): on potassic volcanics (Vulsino, Vicano, Sabatini, Colli Albani), acid lavas (Monti Cimini, Tolfa,
      Allumiere), sandstone and marl (Carseolani, Cicolano, Velino, Ruffi, Prenestini, Affilani, Cairo) and limestone
      (Vicovaro, Lepini, Liri) (p. 75). Ostrieti mesofili "Su tutti i rilievi montuosi carbonatici", "Molti
      rimboschimenti di conifere, prevalentemente a Pinus nigra" in their belt (p. 51); conifer reforestation of black
      pine, locally Douglas fir, firs, Weymouth pine, "Tipicamente nella fascia montana dei rilievi calcarei del Lazio
      (es. M. Simbruini, Serra Traversa, M. Cairo, Reatino) o substrati vulcanici (prevalentemente su M. Cimini)" (pp.
      76-77). Arbusteti temperati: broom, juniper, blackthorn, bramble and rose scrub "ai margini dei boschi collinari e
      montani (mantello) o in aree abbandonate dall''agricoltura e dal pascolo", "generalmente costituenti il mantello
      di querceti caducifogli" (p. 80); macchia "dominata da arbusti sclerofilli quali leccio (arbustivo), lentisco,
      fillirea, corbezzolo, erica" on the old dunes and coastal hills (p. 79); Boschi di neoformazione of elm, field
      maple, hornbeam, robinia on abandoned farmland (pp. 52, 77); stone-pine woods "generalmente nell''ambito della
      duna consolidata e della duna antica" (p. 54). The map itself (39,095 polygons) is published under CC BY 4.0 on
      the same portal.'
    cited_as:
    - species-ecology/lazio.md
