    region: Lazio
    verified: verified
    supports: 'Lazio iNaturalist verifiable records against 11,498 fungi records: B. edulis 6 (Aug 1, Oct 5; none of 5
      located inside a mapped wood, 3 at street addresses), B. reticulatus 10 (May-Jul 4, Sep-Oct 6; 9 located at
      75-1,433 m, median 654 m; in beech at 1,433 m in July), B. aereus 14 (Jun 1, Sep 7, Oct 3, Nov 3; 26-937 m,
      median 384 m; 5 of 8 in-wood records in deciduous oak, 2 in hop-hornbeam or ravine wood), B. pinophilus 0, A.
      caesarea 24 (Aug 1, Sep 10, Oct 13; 21 located at 25-943 m, median 418 m, 5 at 753-943 m; in-wood: deciduous
      oak 7, chestnut 4, low thermophilous beech 2, holm oak 2), Cantharellus 46 (C. cibarius 22, C. pallens 9, C.
      alborufescens 3, C. ferruginascens 2; Sep 9, Oct 16, Nov 8, Dec 2, Jan 2, Feb-Jun 8, Aug 1; 38 located at
      5-1,463 m, median 348 m; in-wood: deciduous oak 10, chestnut 4, holm and cork oak 4, temperate scrub 3,
      hop-hornbeam 2, montane beech 2 at 1,387-1,463 m). GBIF adds only herbarium specimens (1 ovolo, 5 Cantharellus,
