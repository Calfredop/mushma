    verified: verified
    supports: 'forest 259,734 ha on 2,370 woodland cells (median elevation 669 m, 5th-95th percentile 337-1,207 m;
      slope median 22.2°, 32 % of cells over 25°): mixed_broadleaf 44 % (almost all hop-hornbeam), deciduous_oak 29 %
      (downy and Turkey oak), beech 9 % (dominant cells median 1,193 m), mountain_pine 7 % (black-pine reforestation,
      about 16,400 ha), transitional 2.5 % (broom, Prunus, Crataegus and Cornus scrub), chestnut 2.4 % (about 4,900
      ha, median 889 m), evergreen_oak 2.3 % (holm oak of the Conero and the limestone gorges), riparian 1.6 %,
      macchia 1.3 % (Erica arborea, Juniperus oxycedrus and Ampelodesmos on the limestone hills, median 925 m), every
      other class 0.1 % or less. See species-ecology/marche.md.'
  mushma_occurrence_check_marche_2026:
    citation: 'mushma Marche occurrence cross-check: GBIF occurrence API (gadmGid ITA.11_1, basis of record human
