    region: Italia (Sicilia)
    verified: verified
    supports: 'The first Porcini Neri of late May 2019: "In Sicilia in particolar modo sono segnalati i migliori
      ritrovamenti, soprattutto alle falde dell''Etna e tra le falde tirreniche di Nebrodi-Peloritani e Madonie"
      (folklore).'
  fm_calendario_autunno2019_sicilia:
    citation: 'Funghi Magazine (2019-10-21). Il calendario dei funghi porcini autunnali-invernali (Wayback Machine
      capture of 20 November 2019)'
    url: https://web.archive.org/web/20191120130500/https://funghimagazine.it/il-calendario-dei-funghi-porcini-autunnali-invernali/
    kind: web
    region: Italia (Centro-Sud)
    verified: verified
    supports: 'B. aestivalis "sotto Faggio, Castagno ... e sotto i vari tipi di Quercia, anche sempreverde ... al Sud
      Italia, soprattutto tra Calabria e Sicilia, potranno persino apparire sotto le piante di Eucalipto"; B. edulis
      "Abbastanza diffusi ... sui suoli cristallini/quarziferi ed acidi della Sila, Pollino, Serre-Aspromonte e monti
      del Nord della Sicilia fin sull''Etna ... con preferenza per i boschi di Pino della Sila e di Faggio del resto del
      Sud" (folklore).'
  fm_sicilia_2023_05_25:
    citation: 'Funghi Magazine (2023-05-25). Aggiornamento 26-05-2023 (Wayback Machine capture of 25 May 2023)'
    url: https://web.archive.org/web/20230525132156/https://funghimagazine.it/aggiornamento-26-05-2023/
    kind: web
    region: Italia (Sicilia)
    verified: verified
    supports: '"nel Lazio, in Campania, Calabria e Sicilia, si sono già trovati i primi Ovoli Reali (Amanita caesarea)"
      (folklore).'
  fm_sicilia_2023_06_02:
    citation: 'Funghi Magazine (2023-06-01). Aggiornamento funghi 02-06-2023, Sicilia (Wayback Machine capture of 1
      June 2023)'
    url: https://web.archive.org/web/20230601201646/https://funghimagazine.it/aggiornamento-funghi-02-06-2023/
    kind: web
    region: Sicilia
    verified: verified
    supports: 'After a rainy May 2023: "Nascite di Porcini Neri (Boletus aereus) si stanno infatti registrando non solo
      nei boschi ma, anche e soprattutto nelle Macchie, in boschetti, gruppetti di alberi isolati"; the "Finferli/
      Galletti ... risultano ben presenti nei boschi scuri e ben umidi, al riparo dal vento"; "Sporadici Porcini Rossi
      ci vengono segnalati sull''Etna, alle quate superiori dove fa ancora più freddo" (folklore).'
  fm_sicilia_2024_05_30:
    citation: 'Funghi Magazine (2024-05-30). Aggiornamento funghi 31-05-2024 (Wayback Machine capture of 24 June 2024)'
    url: https://web.archive.org/web/20240624072920/https://funghimagazine.it/aggiornamento-funghi-31-05-2024/
    kind: web
    region: Italia (Sicilia)
    verified: verified
    supports: 'Ovolo: "Già se ne vendono i primi esemplari provenienti dalla Calabria, Sicilia e Sardegna"; after the
      May flush "ora le nascite dovrebbero essere terminate ovunque, semmai ancora qualche Porcino si potrà trovare nel
      solo Messinese montano" (folklore).'
  fm_sicilia_2024_09_19:
    citation: 'Funghi Magazine (2024-09-19). Aggiornamento nascite funghi 19-09-2024'
    url: https://funghimagazine.it/aggiornamento-nascite-funghi-19-09-2024/
    kind: web
    region: Sicilia
    verified: verified
    supports: '"In Sicilia situazione perfetta come non accadeva da tempo. Da fine agosto finalmente sono tornate
      frequenti le piogge ... Rallentano leggermente ora le nascite sui Nebrodi settentrionali e Peloritani dove sono
      iniziate prime, i Neri sono già arrivati al capolinea"; porcini "tra Sicani, Erei e Iblei oltre che sull''Etna"
      (folklore).'
  fm_sicilia_2025_11_08:
    citation: 'Funghi Magazine (2025-11-08). Aggiornamento nascite 08-11-2025 (Wayback Machine capture of 20 December
      2025)'
    url: https://web.archive.org/web/20251220120016/https://funghimagazine.it/aggiornamento-nascite-08-11-2025/
    kind: web
    region: Italia (Sicilia)
    verified: verified
    supports: '"Al Sud, invece, la stagione prosegue. Continuano le nascite di Porcini, soprattutto Boletus aereus, ma
      anche, sui monti della Calabria e tra Etna e Nebrodi, i meno comuni edulis e pinicola" (folklore).'
  lasicilia_bronte118_funghi2018:
    citation: 'Quaiotti M.E. (2018-09-28). Speciale funghi: i più buoni sul terreno calcare dell''Etna. La Sicilia,
      reprinted by Bronte118 (2018-09-29)'
    url: https://www.bronte118.it/speciale-funghi-i-piu-buoni-sul-terreno-calcare-delletna/
    kind: web
    region: Sicilia (Etna)
    verified: verified
    supports: '"Quest''anno la stagione è stata anticipata dalle piogge che hanno caratterizzato i mesi estivi e già in
      agosto si sono raccolte grandi quantità dei pregiati porcini dell''Etna", prices down to "sette euro al chilo";
      a Milo forager: "Dopo una grande pioggia per i porcini bisogna aspettare almeno sette, otto giorni" (folklore).'
  lasicilia_minardo_porcino2024:
    citation: 'La Sicilia (2024-09-04). Il fungo porcino dell''Etna da record trovato sul Monte Minardo a Bronte è
      pesantissimo'
    url: https://www.lasicilia.it/news/buongusto/2250580/il-fungo-porcino-dell-etna-da-record-trovato-sul-monte-minardo-a-bronte-e-pesantissimo.html
    kind: web
    region: Sicilia (Etna)
    verified: verified
    supports: 'A Bronte forager at Monte Minardo: "Sono circa dieci giorni che piove, anche se a tratti ... una
      condizione ideale alla proliferazione dei funghi"; "circa 10 kg di funghi"; "il periodo ideale dura solo fino a
      metà settembre" (folklore).'
  feelingetna_timparossa2024:
    citation: 'Feeling Etna Trekking (2024-09-24). I porcini della faggeta Timparossa'
    url: https://feelingetnatrekking.com/2024/09/24/i-porcini-della-faggeta-timparossa/
    kind: web
    region: Sicilia (Etna)
    verified: verified
    supports: '"Quest''anno la faggeta del Timparossa ha regalato un''enorme crescita di Boletus Edulis, il porcino per
      eccellenza che ha fatto riempire i panari di tutti i cercatori di funghi" (Castiglione di Sicilia, north flank of
      Etna; folklore).'
  mushma_sicilia_sias_gauge_check_2026:
    citation: 'mushma Sicilia rain check: raw ERA5-Land (CDS) daily precipitation, read bilinearly from the land nodes
      of the 0.2° lattice, against the SIAS gauges'' whole days from June 2019 to May 2020 (94 stations at 10-1,875 m,
      Regione Siciliana open data, CC BY 4.0), and downscaled to the 7 gauges inside woodland cells. See
      .gavin-root/docs/regions/sicilia.md, Weather'
    url: https://dati.regione.sicilia.it/dataset/sias-precipitazioni
    kind: analysis
    region: Sicilia
    verified: verified
    supports: 'Raw CDS holds 1.06 of the gauge rain pooled over 94 stations (1.10 below 200 m, 1.05 at 200-400 m, 1.06 at
      400-800 m, 0.99 at 800 m and above; median daily correlation 0.73-0.75); a fit of gauge totals on model totals x
      (a + b x elevation) gives 0.88 + 0.10 per km (leave-one-out slopes 0.08-0.13; 0.87 + 0.11 on the 40 stations at
      400 m and above). The 7 woodland gauges (440-1,840 m) hold 0.94 raw and 0.92 scaled. The bias is spatial more
      than altitudinal: wet on the Tyrrhenian coast (Patti 2.03, Lascari 1.57), dry on the Iblei (Modica 0.63, Ragusa
      0.68).'
  altotronto_porcini2017:
    citation: Alto Tronto (2017-01-03). Funghi porcini (porcini of the Monti della Laga and Sibillini)
    url: https://www.altotronto.it/funghi-porcini/
    kind: web
    region: Marche
    verified: verified
    supports: 'forager page for the upper Tronto valley: B. edulis, B. aestivalis and B. pinophilus in the high beech
      woods, B. pinophilus opening and closing the season; B. aereus, ovoli and galletti in the chestnut woods; porcini
      "una o due settimane" after gentle, steady rain, "se la temperatura non è scesa sotto i 15°C per troppo tempo"
      (folklore).'
  cacciatoridifunghi_marche2023:
    citation: Cacciatori di funghi (2023-06-16). Periodo funghi porcini nelle Marche
    url: https://www.cacciatoridifunghi.it/blog/altro/periodo-funghi-porcini-marche/
    kind: web
    region: Marche
    verified: verified
    supports: 'forager page: porcino nero "da metà estate (luglio) all''inizio dell''autunno (fine settembre)", porcino
      rosso "da settembre ai primi giorni di novembre", B. edulis from late September to late October (folklore).'
  camm_angelome2007_cantharellus:
    citation: 'Angelomè G., Egidi R., Fusari R., Rossi A., Splendiani F. (2007). Il genere Cantharellus nelle Marche.
      Micologia nelle Marche 1(1): 4–11 (Coordinamento Associazioni Micologiche delle Marche, CAMM)'
    url: https://www.gruppomicologicojesino.it/wp-content/uploads/2017/01/Micologia_nelle_Marche_200712_dicembre_2007.pdf
    kind: society
    region: Marche
    verified: verified
    supports: 'the Marche Cantharellus ("Finferli, Galletti o Gallucci"): C. cibarius s.str. "sotto latifoglie,
      estate-autunno ... Nelle Marche è una specie poco frequente" (collection at Faete di Arquata del Tronto); C.
      ferruginascens "la specie di Cantharellus più comune nelle nostre zone"; C. subpruinosus under chestnut
      (Pievebovigliana), C. amethysteus under holm oak (Abbadia di Fiastra, Tolentino); all "sotto latifoglie,
      primavera-autunno".'
  camm_calendario2007:
    citation: 'CAMM (2007). Calendario micologico: i funghi più caratteristici di ogni mese. Micologia nelle Marche
      0 (giugno 2007): 18–19'
    url: https://www.gruppomicologicojesino.it/wp-content/uploads/2017/02/Micologia_nelle_Marche_200706_giugno_2007.pdf
    kind: society
    region: Marche
    verified: verified
    supports: 'the Marche mycological groups'' month-by-month poster: June Cantharellus cibarius "galletto", July
      Boletus aestivalis "porcino", September Amanita caesarea "ovulo buono".'
  camm_carassai2016:
    citation: 'Carassai E. (2016). Autunno, tempo di funghi! Micologia nelle Marche X(2), ottobre 2016 (Associazione
      Micologica Naturalistica "Monti Sibillini")'
    url: https://www.gruppomicologicojesino.it/wp-content/uploads/2017/02/Micologia_nelle_Marche_201610_ottobre_2016.pdf
    kind: society
    region: Marche
    verified: verified
    supports: 'Sibillini autumn sequence: "se la stagione estiva è stata calda, con le prime consistenti piogge di
      inizio settembre i boschi iniziano a popolarsi"; "All''inizio di settembre le fresche faggete ... seguite poi dai
      castagneti, in ottobre ... i boschi termofili di Cerro ... a novembre inoltrato nelle pinete collinari" (black-pine
      reforestation, fungi "fino a dicembre"); C. subpruinosus "fruttifica fino a tutto settembre, abbastanza comune
      nelle faggete dei Sibillini"; A. caesarea in chestnut woods; B. aereus in hill Turkey-oak woods after the
      September rains.'
  camm_fabrizi2016_cerreta:
    citation: 'Fabrizi F., Brutti F., Lucarini M. (2016). Gli ambienti di crescita dei funghi: la cerreta. Micologia
      nelle Marche X(2), ottobre 2016'
    url: https://www.gruppomicologicojesino.it/wp-content/uploads/2017/02/Micologia_nelle_Marche_201610_ottobre_2016.pdf
    kind: society
    region: Marche
    verified: verified
    supports: 'Marche Turkey-oak woods: fungi "soprattutto nel periodo autunnale dopo abbondanti piogge e assenza di
      vento"; typical summer-autumn species include Amanita caesarea, Boletus aereus and Cantharellus pallens.'
  camm_fabrizi2016_faggeta:
    citation: 'Fabrizi F., Brutti F., Lucarini M. (2016). Gli ambienti di crescita dei funghi: la faggeta. Micologia
      nelle Marche X(1), giugno 2016'
    url: https://www.gruppomicologicojesino.it/wp-content/uploads/2017/02/Micologia_nelle_Marche_201606_giugno_2016.pdf
    kind: society
    region: Marche
    verified: verified
    supports: 'Marche beech woods "dagli 800 m sino ai pascoli sommitali ... fino a 1400-1800 m"; typical species
      include Boletus reticulatus and Cantharellus pallens. The same issue (Andar per funghi) has B. aestivalis "dalla
      fine di maggio fino a tutto ottobre in boschi caldi di querce, castagni e faggi".'
  camm_fabrizi2017_castagneto:
    citation: 'Fabrizi F., Brutti F., Lucarini M. (2017). Gli ambienti di crescita dei funghi: il castagneto. Micologia
      nelle Marche I(2) n.s., ottobre 2017'
    url: https://www.gruppomicologicojesino.it/wp-content/uploads/2018/03/Micologia_nelle_Marche_201710_ottobre_2017.pdf
    kind: society
    region: Marche
    verified: verified
    supports: 'Marche chestnut woods on sandstone and pelitic-sandstone ground "nel basso maceratese e in tutto
      l''ascolano", shrinking northwards, in mosaic with hop-hornbeam and downy oak between Montemonaco and Amandola;
      typical species "soprattutto nel periodo estivo-autunnale": Cantharellus pallens, Amanita caesarea, Boletus
      aereus, Boletus reticulatus.'
  camm_massi_polidori2022:
    citation: 'Massi M., Polidori L. (2022). I nostri giganti (seconda parte). Micologia nelle Marche VI(1) n.s.,
      giugno 2022'
    url: https://www.gruppomicologicojesino.it/wp-content/uploads/2024/10/Micologia_nelle_Marche_202206_giugno_2022.pdf
    kind: society
    region: Marche
    verified: verified
    supports: 'per-taxon porcini hosts from Marche mycologists: B. aestivalis "in boschi caldi con presenza di quercia,
      faggio, carpino nero in particolare nel periodo estivo"; B. aereus "in boschi termofili di latifoglie come cerro,
      castagno, carpino nero"; B. pinophilus with spruce and beech, "dalla primavera sino alle prime gelate invernali,
      quasi assente nel periodo estivo"; B. edulis with beech and fir, "ambienti freschi e umidi".'
  camm_para2008:
    citation: 'Para R. (2008). Introduzione all''uso ed allo studio dei funghi (seconda parte). Micologia nelle Marche
      II(1), giugno 2008: 19 ff. (CAMM)'
    url: https://www.gruppomicologicojesino.it/wp-content/uploads/2017/02/Micologia_nelle_Marche_200806_giugno_2008.pdf
    kind: society
    region: Marche
    verified: verified
    supports: 'the Marche hill woods "fino a circa 600 metri ... con prevalenza di querce, castagno e carpino" hold
      Amanita caesarea and Boletus aereus among their fungi; B. edulis is placed in the montane woods; black pine
      paired with Lactarius sanguifluus.'
  camm_santini2007:
    citation: 'Santini G. (2007). Porcinomania. Micologia nelle Marche 1(1): 2–3 (CAMM)'
    url: https://www.gruppomicologicojesino.it/wp-content/uploads/2017/01/Micologia_nelle_Marche_200712_dicembre_2007.pdf
    kind: society
    region: Marche
    verified: verified
    supports: '"Nelle nostre zone rinveniamo porcini, che nella stragrande maggioranza dei casi sono B. aestivalis, da
      circa 300 m. s.l.m. a circa 1.300 m. s.l.m. nel periodo che va dalla metà di maggio sino a tutto settembre e parte
      di ottobre, con ovvie soste nei periodo di maggior secco."'
  funghimagazine_alberi_porcini:
    citation: Funghi Magazine, Redazione (2019-02-27, updated 2026-02-25). Gli alberi dei funghi Porcini
    url: https://funghimagazine.it/gli-alberi-dei-funghi-porcini/
    kind: web
    verified: verified
    supports: 'forager magazine: "I PORCINI DEL PINO NERO E DEL PINO SILVESTRE SONO: Boletus reticulatus/aestivalis,
      Boletus pinophilus e B. edulis (raro e solo in Calabria-Sicilia, anche B. aereus)", black pine "più comune come
      albero da rimboschimenti"; the porcini of hornbeams are B. reticulatus and B. aereus, B. edulis "poco
      frequente", and no record of B. pinophilus among them (folklore). In pure larch (and ash, poplar, willow, maple)
      woods porcini are "altamente improbabile, se non del tutto impossibile"; "I porcini dell''abete rosso sono:
      Boletus pinophilus, B. edulis".'
    cited_as:
    - species-ecology/marche.md
    - species-ecology/piemonte.md
  funghimagazine_carpino_nero2026:
    citation: Giovinazzo A. (2026-02-04). Il Carpino Nero, Ostrya carpinifolia (gli alberi dei funghi). Funghi Magazine
    url: https://funghimagazine.it/il-carpino-nero-ostrya-carpinifolia-gli-alberi-dei-funghi/
    kind: web
    verified: verified
    supports: 'in hop-hornbeam woods "sono spesso presenti il Boletus reticulatus (estatino) e il Boletus aereus
      (porcino nero). Risultano invece quasi sempre assenti, o comunque molto rari nei contesti calcarei, i Porcini
      più legati a suoli acidi come Boletus edulis e Boletus pinophilus"; "In molti ostrieti su calcare risultano
      spesso scarsi o assenti funghi tipici dei suoli acidi, come alcune Russule, i finferli" (folklore).'
  infc2015_marche:
    citation: 'Gasparini P., Di Cosmo L., Floris A., De Laurentis D. (eds.) (2022). Italian National Forest Inventory
      INFC2015, tables 1.1 and 1.4 (Marche). Arma dei Carabinieri, CREA'
    url: https://www.inventarioforestale.org/en/superficie-e-composizione-area-and-composition/
    kind: dataset
    region: Marche
    verified: verified
    supports: 'Marche bosco 291,767 ha; tall-forest categories: hop-hornbeam and hornbeam 76,287 ha, other deciduous
      62,094, downy and sessile oak 61,753, Turkey oak 24,732, beech 17,790, black and laricio pine 10,377, holm oak
      7,042, other conifers 5,657, chestnut 3,706 (sampling error 31.5 %), Mediterranean pines 2,194, silver fir 0.'
  ipla_marche_inventario2000:
    citation: 'Regione Marche, IPLA (2000). Inventario e carta forestale della Regione Marche. Relazione generale.
      Torino (published 2001 as "I tipi forestali delle Marche")'
    url: https://www.regione.marche.it/Portals/0/Agricoltura/foreste/cartografia/relazinventariomarche.doc
    kind: institutional
    region: Marche
    verified: verified
    supports: 'forest 256,170 ha in 11 categories: downy oak 31.7 %, hop-hornbeam 24.1 %, Turkey oak 10.9 %, riparian
      8.3 %, beech 7.8 %, reforestation 7.5 % (mostly black pine), shrubland 2.8 %, holm oak 2.0 %, chestnut 1.8 %
      (4,600 ha); beech "fra i (900)-1000 e 1500-1600 m", "diffusamente fino ad 800 m" in the rainy Catria and Laga,
      down to 500-600 m at Fonte Avellana; chestnut calcifuge, on sandstone "del basso maceratese ed in tutto
      l''ascolano", "fra 400 e 1100 m", up to 1400 m in the Fluvione valley; Turkey oak to 1000-1100 m; hop-hornbeam
      to 1300 m on sunny slopes; black pine on limestone and laricio pine on neutral ground in the beech belt
      (Carpegna, Cesane, Furlo, Cingoli, Visso, Vettore, Montagna dei Fiori); silver fir relicts only in the Laga and
      near Fabriano.'
  iucn_ferruginascens2025:
    citation: 'Tansey C. (2025). Cantharellus ferruginascens. The IUCN Red List of Threatened Species 2025:
      e.T227507146A271621901'
    url: https://redlist.info/iucn/species_view/327479/
    kind: institutional
    verified: verified
    supports: 'C. ferruginascens with deciduous Fagaceae (Castanea, Fagus, Quercus) and Betulaceae (Carpinus), on
      "calcareous soil" in temperate areas "not prone to summer drought" and on more acidic soils in moist
      Mediterranean sites; the commonest Cantharellus of the Marche (camm_angelome2007_cantharellus).'
  lavalledelmetauro_funghi:
    citation: 'CEA Casa Archilei, Fano. Banca dati "La Valle del Metauro": schede funghi (Boletus aereus 528, Boletus
      aestivalis 529, Amanita caesarea 506; after Para 1987)'
    url: https://www.lavalledelmetauro.it/contenuti/funghi-flora-fauna/scheda/528.html
    kind: society
    region: Marche (Pesaro e Urbino)
    verified: verified
    supports: 'B. aereus "esclusivo di boschi di latifoglie con castagni, faggi, querce, noccioli ... specie termofila
      ... da giugno a ottobre ... sia su terreno acido che basico", at the Cesane, Monte Nerone, Petrano, Catria, Alpe
      della Luna-Bocca Trabaria and Bocca Serriola; B. aestivalis in broadleaf woods "con castagni, querce, noccioli,
      carpini, faggi", late spring to autumn; A. caesarea "predilige boschi caldi di castagni e querce ... Più
      frequente in terreno siliceo. Estate-autunno". The site lists name B. aereus and B. aestivalis, not B. edulis
      or B. pinophilus.'
  lr_marche_18_2022:
    citation: 'Regione Marche. Legge regionale 28 luglio 2022, n. 18, Disciplina per la raccolta e la
      commercializzazione dei funghi epigei spontanei (testo vigente, modified by l.r. 10 agosto 2026, n. 10; it
      repealed l.r. 25 luglio 2001, n. 17 from 1 January 2023)'
    url: https://www.consiglio.marche.it/banche_dati_e_documentazione/leggi/dettaglio.php?arc=vig&idl=2260
    kind: institutional
    region: Marche
    verified: verified
    supports: '3 kg per person per day for all species together (art. 8.1); "E'' vietata la raccolta dell''amanita
      caesarea allo stato di ovulo chiuso. E'' vietata la raccolta del genere Agaricus, Boletus e Calocybe con diametro
      del cappello inferiore a 3 cm" (art. 8.4); protected areas regulated by their bodies (art. 3.2); no fixed closed
      days or altitude rules. The same ovolo ban and 3 kg limit were in l.r. 17/2001.'
  mrak2025_mycorrhiza:
    citation: 'Mrak T., Brailey-Crane P.A., Šibanc N., Martinović T., Gričar J., Kraigher H. (2025). Mycelial
      communities associated with Ostrya carpinifolia, Quercus pubescens and Pinus nigra in a patchy Sub-Mediterranean
      Karst woodland. Mycorrhiza 35: 46'
    doi: 10.1007/s00572-025-01220-9
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12296906/
    kind: peer_reviewed
    region: Slovenia (Karst)
    verified: verified
    supports: 'Ostrya carpinifolia and Quercus pubescens are ectomycorrhizal hosts with mainly non-specific partners;
      planted, non-native Pinus nigra had the lowest ectomycorrhizal richness, its partners mostly conifer-specific
      (Suillus among the dominant genera); no Boletus or Cantharellus reported.'
  mushma_marche_forest_composition_2026:
    citation: 'mushma Marche woodland composition: share of wooded area, dominant cells and median elevation per habitat
      key on the Marche woodland grid, built 2026-09-25 from Regione Marche''s REM natural-vegetation map (Rete
      Ecologica Marche, 1:50,000, edition of March 2019), grouped by physiognomy and typed by dominant species'
    url: https://static.regione.marche.it/portals/0/Ambiente/Rete%20Ecologica%20regionale%20REM/CanaleREM/Shape%20files%20geoportale/Strati%20cartografici%20REM/REM_Vegetazione_naturale_50k.zip
    kind: analysis
    region: Marche
    verified: verified
    supports: 'forest 259,734 ha on 2,370 woodland cells (median elevation 669 m, 5th-95th percentile 337-1,207 m;
      slope median 22.2°, 32 % of cells over 25°): mixed_broadleaf 44 % (almost all hop-hornbeam), deciduous_oak 29 %
      (downy and Turkey oak), beech 9 % (dominant cells median 1,193 m), mountain_pine 7 % (black-pine reforestation,
      about 16,400 ha), transitional 2.5 % (broom, Prunus, Crataegus and Cornus scrub), chestnut 2.4 % (about 4,900
      ha, median 889 m), evergreen_oak 2.3 % (holm oak of the Conero and the limestone gorges), riparian 1.6 %,
      macchia 1.3 % (Erica arborea, Juniperus oxycedrus and Ampelodesmos on the limestone hills, median 925 m), every
      other class 0.1 % or less. See species-ecology/marche.md.'
  mushma_occurrence_check_marche_2026:
    citation: 'mushma Marche occurrence cross-check: GBIF occurrence API (gadmGid ITA.11_1, basis of record human
      observation, preserved specimen, occurrence, observation; month facet), iNaturalist histogram and observations
      APIs (place 7029, verifiable; elevations only for open, accurate records) and the Open-Meteo elevation API,
      queried 2026-09-25. Aggregates only (counts by month, elevation ranges); no coordinates are stored or published'
    url: https://api.gbif.org/v1/occurrence/search
    kind: analysis
    region: Marche
    verified: verified
    supports: 'Marche record counts by month for the six keys (B. edulis GBIF 0 / iNat 0, B. reticulatus 2 / 15, B.
      aereus 0 / 8, B. pinophilus 0 / 0, A. caesarea 0 / 7, Cantharellus 1 / 15), all iNaturalist records from 2019
      on and most obscured, and their month enrichment against all 2,859 Marche iNaturalist fungi records. See
      species-ecology/marche.md.'
  mushma_marche_rain_prior_2026:
    citation: 'mushma rain scale for Marche, borrowed: Marche has no open daily rain gauges a script can read (SIRMIP
      needs registration; the AMAP agrometeo API serves no daily measures yet), so its scale is the mean of the two
      bordering regions'' least-squares fits of woodland gauge totals on CDS era5_land_cds totals x (a + b x
      elevation), 2019-2025: Umbria (8 Servizio Idrografico gauges) and Emilia-Romagna (66 ARPAE gauges). See
      .gavin-root/docs/regions/marche.md, Weather'
    url: https://github.com/Calfredop/mushma/blob/main/.gavin-root/docs/regions/marche.md
    kind: analysis
    region: Marche
    verified: verified
    supports: 'Umbria 0.89 + 0.33 per km (raw CDS pooled 0.88 of gauge rain) and Emilia-Romagna 0.62 + 0.80 per km
      (raw 1.06 below 400 m, 0.94 at 400-800 m, 0.69 above) both find the CDS reanalysis about right in the lowlands
      and dry in the mountains, and the national 1.28 + 0.29 per km 25-30 % too wet; their mean, 0.76 + 0.57 per km,
      is 0.87 at 200 m, 1.04 at 500 m, 1.22 at 800 m and 1.44 at 1,200 m. A prior, not a Marche fit.'
    cited_as:
    - regions/marche.md
  ogsm_marche_precipitazioni2002:
    citation: 'Amici M., Spina R. (2002). Campo medio della precipitazione annuale e stagionale sulle Marche per il
      periodo 1950-2000. Osservatorio Geofisico Sperimentale di Macerata, for Regione Marche Protezione Civile'
    url: https://static.regione.marche.it/Portals/0/Protezione_Civile/Manuali%20e%20Studi/Studi_clima_precipitazioni_relazione.pdf?ver=2016-04-19-105631-193
    kind: institutional
    region: Marche
    verified: verified
    supports: 'Marche rain climatology from 102 stations: coast 600-850 mm a year (south coast 550-650), hills 850-1100,
      high hills and mountains over 1100; maxima on Monte Catria (1550-1700 mm) and the Sibillini (1500-1550); autumn
      the wettest season (315-480 mm in the mountains), summer 195-285 mm in the mountains and 105-165 mm on the
      coast.'
  regione_umbria_funghi_tartufi2013:
    citation: 'Regione Umbria, Gruppo Micologico Ternano (2013). Funghi e tartufi dell''Umbria (reprint). Perugia'
    url: https://www.regione.umbria.it/documents/18/1932463/Libro+Funghi+e+Tartufi/2c2d4961-b28d-47f3-87fe-1335769676ec
    kind: institutional
    region: Umbria
    verified: verified
    supports: 'for the Umbria-Marche Apennines: B. edulis "Poco comune in Umbria. Spesso viene confuso con Boletus
      aestivalis ... molto comune"; B. aestivalis "da maggio a ottobre in boschi soleggiati di latifoglia (castagno,
      quercia e faggio)"; B. aereus autumn, sometimes late summer, oak and chestnut, also beech; B. pinophilus autumn,
      beech and oak or under fir or pine, "non è comune"; A. caesarea "in boschi di castagno, cerro e roverella, ad
      altitudini inferiori agli 800/900 m"; C. cibarius "da maggio a ottobre", broadleaf woods in central Italy.'
  # ---------------------------------------------------------------------------------------------
  # Calabria (region card, 2026-09-28): sources for species/calabria/ and
  # .gavin-root/docs/species-ecology/calabria.md. One block rather than sorted in, placed here and
  # not at the end of the file so it merges cleanly with the region branches that append there.
  # ---------------------------------------------------------------------------------------------
  ispra2018_mlg180_calabria_foreste:
    citation: 'Siniscalco C., Bianco P.M., Lavorato C., Rotella M., Parrettini G.L., Marra E., Floccia F., Campana L.
      (eds.) (2018). Abbinamento delle componenti micologiche della Calabria ai sistemi di classificazione degli
      Habitat EUNIS e Natura 2000. Prima correlazione delle specie fungine delle foreste naturali. ISPRA, Manuali e
      linee guida 180/2018'
    url: https://www.isprambiente.gov.it/files2018/pubblicazioni/manuali-linee-guida/MLG_180_18_Abbinamento_Calabria_Foreste.pdf
    kind: institutional
    region: Calabria
    verified: verified
    supports: 'The Calabrian mycological groups'' 45,138 records (38,127 from the province of Cosenza, p. 7), each
      filed under a EUNIS habitat, with every species'' share of the habitat''s records. Laricio pine (Tab. 11, "5464
      rilevamenti, 933 specie"): B. pinophilus 0.9 %, B. edulis 0.3, C. cibarius 0.3, B. reticulatus (as aestivalis)
      0.1, no B. aereus or A. caesarea; commonest species Lactarius deliciosus, Suillus, Chroogomphus (p. 192); laricio
      "Nella Sila ... tra i 900 e i 1400 metri di altitudine e sull''Aspromonte tra 700 e 1600 metri", pinewoods about
      114,000 ha, half pure "sia di origine naturale che artificiale" (p. 191). Beech (Tab. 3, Pollino / Sila /
      Aspromonte): B. edulis 1.4 / 2.7 / 0.8, B. reticulatus 0.8 / 1.4 / 0.8, B. pinophilus 0.6 / 0.6 / 0.4 (var.
      fuscoruber Sila 0.3), B. aereus - / 0.1 / 0.8, Cantharellus (entered as C. alborufescens, filed under C.
      cibarius) 1.4 / 2.4 / 1.2; "In Calabria, a quote superiori ai 1000 metri, Fagus sylvatica è l''essenza arborea
      dominante" (p. 68). Silver fir (Tab. 1, 329 records): B. edulis 3.3 %, the top species, "gli abeti bianchi hanno
      un alto valore economico per l''alta presenza di Boletus edulis" (p. 14); fir at 820-1,400 m in the Serre,
      1,100-1,800 m in the Aspromonte (p. 14). Chestnut (Tab. 2, 3,192 records): C. cibarius 2.7 (top species), A.
      caesarea 1.8, B. reticulatus 1.8, B. aereus 0.8, B. edulis 0.7, B. pinophilus 0.1. Cork oak (Tab. 4, 352): C.
      cibarius 7.0, B. aereus 5.4, A. caesarea 4.8, B. reticulatus 1.1. Holm oak (Tab. 5, 390): B. aereus 1.1, A.
      caesarea 0.9, C. cibarius 0.6 (+0.3 C. ferruginascens), B. reticulatus 0.3. Downy oak (Tab. 6, 368): B. aereus
      2.4, C. cibarius 2.4, A. caesarea 1.6, B. reticulatus 1.1, B. edulis 0.3. Turkey oak (Tab. 7, 801): B. aereus
      3.1 ("la specie micologica più frequente", p. 144), C. cibarius 2.6, B. reticulatus 1.7, A. caesarea 0.4, B.
      edulis 0.2, B. pinophilus 0.1. Hungarian oak (Tab. 8, 792): B. aereus 2.6, A. caesarea 1.1, B. reticulatus 0.4,
      C. cibarius 0.4. Aleppo pine (Tab. 10, 20 records): none of the six. Pino loricato: "solo due rilevamenti"
      (p. 188). Poplar galleries (Tab. 13, 116): "C. alborufescens" 3.4.'
  ispra2018_mlg179_calabria_rimboschimenti:
    citation: 'Siniscalco C., Bianco P.M., Lavorato C., Rotella M., Parrettini G.L., Marra E., Floccia F., Campana L.
      (eds.) (2018). Abbinamento delle componenti micologiche della Calabria ai sistemi di classificazione degli
      Habitat EUNIS e Natura 2000. Prima correlazione delle specie fungine dei rimboschimenti. ISPRA, Manuali e linee
      guida 179/2018'
    url: https://www.isprambiente.gov.it/files2018/pubblicazioni/manuali-linee-guida/MLG_179_18_Abbinamento_Calabria_Rimboschimenti.pdf
    kind: institutional
    region: Calabria
    verified: verified
    supports: 'The same record base for plantations. "il pino nero laricio è stato largamente impiegato nella fascia
      pedemontana e montana della regione" (p. 10), "Il pino calabro è la specie maggiormente impiegata nei
      rimboschimenti in tutti i rilevi calabresi" (p. 114); Pinus nigra plantations (Tab. 13, "40 rilevamenti, 15
      specie") hold no porcini, only ubiquitous species (pp. 114, 117). Silver fir, spruce and larch plantations
      (Tab. 3, 806 records): B. edulis 4.6 % (top species), B. pinophilus 0.6, C. cibarius 0.6, B. reticulatus 0.4;
      spruce B. edulis 4.4; cedar (2,082) B. edulis 0.5; stone pine (271) B. pinophilus 0.8, B. edulis 0.7; Aleppo pine
      (802), Douglas fir (623) and radiata pine (373) plantations none of the six.'
  ispra2018_mlg184_acri_vol1:
    citation: 'Siniscalco C., Lavorato C., Rotella M., Luperi C., Floccia F., Campana L., Bianco P.M. (eds.) (2018).
      Contributo alla conoscenza della diversità micologica storica in Italia. Raccolta delle schede descrittive delle
      componenti micologiche liofilizzate del museo di Acri. Volume 1. ISPRA, Manuali e linee guida 184/2018'
    url: https://www.isprambiente.gov.it/files2018/pubblicazioni/manuali-linee-guida/MLG_184_18_Funghi_Acri_Vol_1.pdf
    kind: institutional
    region: Calabria
    verified: verified
    supports: 'Species cards of the Acri (Sila Greca) museum, habitat and season in Calabria. B. aereus: "da maggio a
      dicembre, diffuso in maggioranza sotto quercia, specialmente nelle zone submontane della Presila, ma anche sotto
      castagno, leccio e altre latifoglie di tutta la Calabria" (p. 22). B. edulis: "È molto diffuso prima nei
      castagneti poi sotto altre latifoglie e abeti da maggio a dicembre. In Calabria si comporta come una specie
      precoce a seconda delle condizioni ambientali e lo si può trovare già in primavera come prima fioritura" (p. 24).
      A. caesarea: "in Calabria da maggio a novembre sotto latifoglie, specialmente sotto castagno. Particolarmente
      abbondante nelle stagioni estive piovose" (p. 113).'
  ispra2018_mlg185_acri_vol2:
    citation: 'Siniscalco C., Lavorato C., Rotella M., Luperi C., Floccia F., Campana L., Bianco P.M. (eds.) (2018).
      Contributo alla conoscenza della diversità micologica storica in Italia. Raccolta delle schede descrittive delle
      componenti micologiche liofilizzate del museo di Acri. Volume 2. ISPRA, Manuali e linee guida 185/2018'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/Raccolte-componenti-micologiche-liofilizzate-museo-di-Acri-Vol.2.pdf
    kind: institutional
    region: Calabria
    verified: verified
    supports: 'C. cibarius: "in Calabria fa le sue prime comparse primaverili a maggio, poi da agosto a gennaio è
      abbondante sotto castagno, querce, faggio, ma anche sotto altre latifoglie e conifere" (p. 39).'
  lavorato1996_boletaceae_calabria:
    citation: 'Lavorato C. (1996). Chiave per la determinazione delle Boletaceae delle foreste della Calabria. Pagine di
      Micologia 5: 2-27. AMB Centro Studi Micologici, Vicenza'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/Chiave-per-la-determinazione-delle-Boletaceae-di-C.Lavorato.pdf
    kind: society
    region: Calabria
    verified: verified
    supports: 'Habitat notes (PDF pp. 12-13). B. pinophilus: "In Calabria (noto con il nome cozza e pinu) è molto
      diffuso sotto i pini silani secolari (Pinus nigra var. calabrica) e meno diffuso sotto faggio (Fagus)". B.
      edulis: "In Calabria (noto con il nome sillu e fagu) è molto diffuso sotto faggio (Fagus), meno diffuso sotto
      altre latifoglia e aghifoglia". B. aestivalis: "Sotto latifoglia in genere, in Calabria (noto con il nome sillu
      prumentiju) è precoce già in giugno è molto diffuso, più raro in autunno". B. aereus: "In Calabria (noto con il
      nome sillu e cerza) è diffuso sotto castagne (Castanea) e quercia (Quercus)".'
  lavorato_rotella2004_pini_sila_greca:
    citation: 'Lavorato C., Rotella M. (2004). Ricerca micocenologica sui pini della Sila Greca. Pagine di Micologia
      22: 69-80'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/Ricerca-micocenologica-sui-pini-della-Sila-Greca-di-C.Lavorato-e-M.Rotella.pdf
    kind: society
    region: Calabria (Sila Greca)
    verified: verified
    supports: 'Observations 1992-2003 under the Sila pine. Belts: "la fascia del castagno e delle querce tra i 600 ed i
      1100 metri; 3) la fascia del pino silano, piuttosto monotona, da 1000 a 1300 metri; 4) a partire dai 1300 metri
      la fascia del faggio". Under the pine: "Boletus pinophilus Pilát & Dermek, localmente comune sotto pino silano";
      var. fuscoruber "raro o localmente diffuso"; "Cantharellus cibarius ... poco comune sotto pino silano". No B.
      edulis, B. aereus, B. reticulatus or A. caesarea listed under the pines.'
  lavorato_rotella1995_mappatura_cosenza:
    citation: 'Lavorato C., Rotella M. (1995-1996). Per la mappatura nazionale dei funghi: osservazioni e ritrovamenti
      fatti nel 1994 in provincia di Cosenza. Vivere Meglio (Gruppo Micologico Calabro "N. Capitò", Roccella Jonica)
      IV(2-3), V(1)'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/Mappatura-Provincia-di-Cosenza-aprile-1995.pdf
    kind: society
    region: Calabria (Sila, Acri)
    verified: verified
    supports: 'Dated 1994 records with habitat and height: B. pinophilus 18/11/1994, Croce di Magara (Sila Grande),
      "bosco di pino", 1,300 m; B. edulis var. albus same day and place, "bosco di pino e faggio"; B. edulis 10/9/1994,
      Piana del Barone (Acri), "bosco di castagno", 1,100 m; B. aereus 30/7/1994, Cozzo S. Angelo (Acri), "bosco misto
      di pino e castagno", 850 m; B. aestivalis 15/10/1994, same place, chestnut, 850 m.'
  lavorato2013_calabrone_caesarea:
    citation: 'Lavorato C. (2013). Funghi a confronto: Amanita caesarea e Amanita phalloides. Il Calabrone 16,
      December 2013'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/Funghi-a-confronto-Amanita-caesarea-e-Amanita-phalloides.pdf
    kind: society
    region: Calabria
    verified: verified
    supports: 'A. caesarea "in Calabria è piuttosto precoce, solitamente si sviluppa nel periodo estivo, eccezionalmente
      anche a fine primavera, raramente in autunno, cresce fino a circa 1200 m di quota"; "cresce sotto latifoglie,
      specialmente in luoghi soleggiati con la presenza di castagno"; conifer reports "ne siamo dubbiosi"; "sempre meno
      frequente"; dialect names "voita", "vrìgliuocciudu" (Sila Greca), "guvitu" (lower Tyrrhenian Cosentino), "russa
      d''ovi" (Aspromonte).'
  lavorato2018_calabrone_consigli:
    citation: 'Lavorato C. (2018). Funghi: consigli utili. Il Calabrone 25, June 2018'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/Funghi-Consigli-utili.pdf
    kind: society
    region: Calabria
    verified: verified
    supports: '"La massima crescita si ha da fine estate al tardo autunno ... Le specie pregiate e commerciabili, in
      annate umide, anticipano il loro sviluppo già nel mese di maggio, come per esempio il gallinaccio ed alcuni
      porcini."'
  caroti2015_cantharellaceae_calabria:
    citation: 'Caroti V., Lavorato C., Rotella M. (2015). Cantharellaceae Schroeter della Calabria (Italia). Rivista
      Micologica Romana, Bollettino AMER 94 (1): 12-28'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/Cantharellaceae-in-Calabria-AMER.pdf
    kind: society
    region: Calabria
    verified: verified
    supports: '12 species and 1 variety from the province of Cosenza; "gallinelle" locally (p. 12). C. cibarius "nel
      mese di maggio e da agosto a gennaio, diffuso sotto castagno e querce, ma anche sotto altre latifoglie e
      conifere" (p. 14). C. pallens "comune dopo le prime piogge in primavera e poi secondo le condizioni ambientali da
      agosto a dicembre, a quote basse anche a gennaio; diffuso sotto castagno, querce, leccio", "Nell''area
      mediterranea riteniamo che sia questo il Cantharellus più diffuso" (pp. 14-15). C. ferruginascens "comune da
      luglio a novembre, sotto castagno, faggio e leccio", all from the acid Sila soils (pH 5-5.5) (p. 19). C. ilicis
      and C. alborufescens appear only as look-alikes (p. 18).'
  bosco_grande2004_caesarea_cocuzzo:
    citation: 'Bosco A., Grande C. (2004). Osservazioni di Amanita caesarea su terreno prevalentemente calcareo in
      direzione di Monte Cocuzzo. Gruppo Micologico "Sila Greca" AMB, Acri'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/Osservazione-di-Amanita-caesarea-di-A.-Bosco-e-C.Grande-2004.pdf
    kind: society
    region: Calabria (Catena Costiera)
    verified: verified
    supports: 'Monte Cocuzzo field notes. "Dopo 10-12 giorni dall''ultima pioggia utile, i primi carpofori di Amanita
      caesarea sono ben visibili nel terreno, altrettando accade al quindicesimo giorno per Boletus edulis ed aereus";
      found "sotto castagno, querceti, faggio, sotto carpino nero, cerro"; "nasce dai 300-400 m. e sino alla soglia
      della vetta di Monte Cocuzzo 1500 m. circa, tuttavia l''altitudine ideale alla sua fruttificazione è tra i 600 e
      900 metri"; "reperita da agosto ad ottobre con sporadiche presenze sino alla prima decade di novembre (2003)";
      2004 finds 30 September-15 October at 800-1,200 m, one "in bosco di faggio puro" at 1,200 m; big ovolo years after
      hot summers ("torrida estate del 2003"); "la fruttificazione di Boletus aestivalis non è rara anche in periodo
      quasi natalizio".'
  grande_funghi_silagreca:
    citation: 'Grande C. (n.d.). I Funghi. Gruppo Micologico "Sila Greca" AMB, Acri'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/I-Funghi-di-Claudio-Grande.pdf
    kind: society
    region: Calabria
    verified: verified
    supports: '"Il Boletus aereus ... non può vegetare né con i pini né con i larici ma solo sotto latifoglie (querce e
      castagno)" (p. 2); fruiting "coincidono con la fine dell''estate e l''inizio della stagione autunnale. Tuttavia non
      mancano le eccezioni dove per esempio in piena atmosfera natalizia capita di imbattersi in un bel porcino" (p. 3).'
  iacoi2003_macchia_rossano:
    citation: 'Iacoi C. (2003). Osservazioni fatte nella macchia mediterranea, Sila Greca, nel comune di Rossano
      Calabro. AMB Gruppo Sila Greca'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/Osservazioni-nella-macchia-mediterranea-di-C.Iacoi-2003.pdf
    kind: society
    region: Calabria (Sila Greca)
    verified: verified
    supports: 'Macchia belt "dal limite della pianura fino ai 700/800 metri"; porcini (Boletus) and ovoli "sotto
      castagno, quercia, lecci"; "Sotto ilatro comune, corbezzoli si notano: Clitocybe geotropa, Cantharellus
      cibarius".'
  lavorato1991_micoflora_cisto:
    citation: 'Lavorato C. (1991). Chiave analitica e note bibliografiche della micoflora del cisto. Bollettino AMER
      24: 16-45'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/Chiave-analitica-della-micoflora-del-cisto-di-C.Lavorato.pdf
    kind: society
    region: Calabria
    verified: verified
    supports: 'B. aereus appears in the Cistus key only with source code "OPC", observed by G. Pacioni in the Circeo
      (Lazio) Cistus scrub, not in the Cosenza scrub ("OLC"): no Calabrian Cistus record.'
  ambsg_manuale_corso_micologia:
    citation: 'AMB Gruppo Micologico Naturalistico Sila Greca (n.d., after 2009). Corso di micologia ai sensi della L.R.
      26/11/2001 n. 30, materiale didattico. Acri'
    url: https://www.ambsilagreca.it/wp-content/uploads/2025/05/Manuale-per-corso-di-micologia-raccolta-e-commercializzazione-funghi.pdf
    kind: society
    region: Calabria (Sila Greca)
    verified: verified
    supports: 'Acri dialect names (p. 50): "Boletus aereus Porcino nero Cuozzu nivuru"; "Boletus aestivalis Porcino
      estivo Sillu prumentiju"; "Boletus edulis Porcino comune Sillu ''e fagu"; "Boletus pinophilus Porcino del pino
      Sillu ''e pinu".'
  miceli2019_sua_maesta_porcino:
    citation: 'Miceli A. (2019-02-03). Sua Maestà il Porcino. Adset (dialect names after Bonazzi U. 2003, Dizionario dei
      nomi volgari e dialettali dei funghi in Italia, AMB)'
    url: https://www.adset.it/580-sua-maesta-il-porcino/
    kind: web
    region: Calabria
    verified: verified
    supports: 'B. pinophilus "Cozza ''e pinu (nome dialettale cosentino); Zappinaro (Nome dialettale reggino con
      riferimento alla sua tendenza ad associarsi ai grandi Pini dell''Aspromonte che localmente vengono chiamati
      Zappini)", "molto comune, apprezzato e ricercato in Calabria nei boschi dell''Aspromonte e della Sila".'
  parcosila_funghi:
    citation: 'Ente Parco Nazionale della Sila (n.d.). Funghi. parcosila.it, Il Parco, La flora'
    url: https://parcosila.it/il-parco/la-flora/funghi/
    kind: institutional
    region: Calabria (Sila)
    verified: verified
    supports: 'The porcino "cresce in simbiosi sia con alberi di latifoglie che di aghifoglie"; Lactarius deliciosus "molto
      diffuso nelle giovani pinete di laricio ma anche nelle abetine"; "galletti (Cantharellus cibarius)"; the ovolo
      "Molto ricercato ma non molto diffuso"; picking only with the permit of L.R. 30/2001.'
  parcosila_vegetazione:
    citation: 'Ente Parco Nazionale della Sila (n.d.). Distribuzione della vegetazione. parcosila.it, Il Parco, La
      flora'
    url: https://parcosila.it/il-parco/la-flora/distribuzione-della-vegetazione/
    kind: institutional
    region: Calabria (Sila)
    verified: verified
    supports: '"le pendici esposte a Sud risultano occupate dal pino mentre in quelle esposte a Nord vegeta il faggio";
      beech above the laricio belt, with silver fir at Gariglione, Macchia dell''Orso and Vallone Cecita.'
  pn_sila_geografia_web:
    citation: 'Ente Parco Nazionale della Sila (n.d.). Geografia. archivio.parcosila.it'
    url: https://archivio.parcosila.it/it/la-natura/geografia.html
    kind: institutional
    region: Calabria (Sila)
    verified: verified
    supports: '"La piovosità media annua varia tra 1.000-1.100 mm e 1.400-1.700 mm. Il 60-70% delle precipitazioni è
      concentrato nel periodo autunnale e invernale, da ottobre a marzo ... solo il 7-10% delle precipitazioni si
      verificano nel periodo estivo. Il periodo di aridità estivo è molto contenuto e varia tra poco più di 2 mesi a
      meno di un mese"; mean annual temperature 12-7 °C; granite weathered to "sabbioni".'
  vivigreen_pat_porcini_silani:
    citation: 'ViVi GREEN (2026). Funghi porcini Silani PAT Calabria (reproduces the Regione Calabria PAT sheet "Funghi
      porcini silani sillo"; the Region''s PDF is truncated on its server)'
    url: https://www.vivigreen.eu/blog/funghi-porcini-silani-pat-calabria/
    kind: web
    region: Calabria (Sila)
    verified: verified
    supports: '"Da settembre fino a novembre e, più limitatamente, in agosto, si ha in Sila la maggiore produzione di
      funghi."'
  masaf2023_pat_calabria:
    citation: 'MASAF (2023). Elenco nazionale dei prodotti agroalimentari tradizionali, Allegato I, Regione Calabria'
    url: https://www.arsacweb.it/wp-content/uploads/2023/09/MASAF_2023_0263996_Allegato_MASAF_2023_0222691_Allegato_-Calabria.pdf
    kind: institutional
    region: Calabria
    verified: verified
    supports: 'Traditional products include "98 Funghi porcini silani "sillo"", "96 Funghi "rosito"", "74 Castagne di
      Calabria"; names only.'
  lupo_talmamax_re_porcino_sila:
    citation: 'Lupo T. (2003-2015). Re Porcino della Sila. I Funghi & le Orchidee della Calabria (talmamax.it)'
    url: https://www.talmamax.it/porcino_dell'anno.htm
    kind: web
    region: Calabria (Sila)
    verified: verified
    supports: 'Forager lore: B. aereus "il primo a fruttificare fin già dalla fine di aprile"; B. pinophilus in May
      "Nelle pinete sabbiose"; B. reticulatus "da fine maggio-giugno e fruttifica più volte ... fino al mese di
      ottobre"; B. edulis "l''ultimo a comparire, proprio dopo le piogge pre-autunnali", best on "le vette della Sila
      Grande" (Monte Scuro, Monte Nero), "prati sommitali ... boschetti di faggio, siano essi puri o misti all''altra
      essenza primaria della Sila: il pino laricio".'
  amer2024_weekend_sila:
    citation: 'AMER, Associazione Micologica Ecologica Romana (2024-11-05). Report weekend micologico Sila 24-27/10/2024'
    url: https://www.ameronlus.it/blog/2024/11/05/report-weekend-micologico-sila-24-27-10-2024/
    kind: society
    region: Calabria (Sila)
    verified: verified
    supports: 'Late October 2024 in "un bosco misto a predominanza di faggio e pino laricio": "Nonostante la produzione
      fungina fosse ormai in calo ... anche qualche Boletus pinophilus e B. edulis"; pure beech more productive.'
  funghimagazine_porcini_maggio2022:
    citation: 'Funghi Magazine (2022-05-28). Boom di Funghi Porcini Estatini e Rossi. Ecco dove'
    url: https://funghimagazine.it/boom-di-funghi-porcini-estatini-e-rossi-ecco-dove/
    kind: web
    region: Calabria
    verified: verified
    supports: '"Al momento si registrano ottime nascite di Porcini rossi-Pinicola in Sila, Pollino e localmente anche
      tra Serre-Aspromonte. Discrete nascite di Porcini Estatini tra Campania-Basilicata-Calabria".'
  bmeteo_pinophilus_oppicelli2024:
    citation: 'Oppicelli N. (2024-11-14). Il porcino moro o rosso, Boletus pinophilus. Passione Funghi, 3BMeteo'
    url: https://funghi.3bmeteo.com/boletus-pinophilus/
    kind: web
    verified: verified
    supports: '"I primi Boletus pinophilus della stagione pertanto spuntano in maggio-giugno, occasionalmente anche alla
      fine del mese di aprile, soprattutto al limite dei boschi di faggio e castagno, o negli areali submontani con
      presenza di pino silvestre, pino nero o pino laricio, in particolare sulle montagne della Calabria"; autumn "da
      settembre fino alle prime nevicate".'
  bmeteo_boletus_aereus:
    citation: 'Oppicelli N. (2024-07-15). Il porcino nero o bronzino, Boletus aereus. Passione Funghi, 3BMeteo'
    url: https://funghi.3bmeteo.com/boletus-aereus/
    kind: web
    verified: verified
    supports: '"15 e 24 gradi ... accumuli, sia intorno ai 30-40 mm complessivi (limite minore)"; above "29-30 gradi, la
      sua crescita diventa difficile"; in the South with macchia the flushes "proseguono fino a novembre inoltrato ...
      magari in boschi di leccio e sughera, addirittura in pieno periodo natalizio".'
  funghimagazine_calendario_primavera2019:
    citation: 'Spagnoli R., Giovinazzo A. (2019-03-07, rev. 2024). Il Calendario dei funghi Porcini Primavera-Estate.
      Funghi Magazine'
    url: https://web.archive.org/web/20240417083959/https://funghimagazine.it/fm-calendario-porcini-primavera-estate/
    kind: web
    verified: verified
    supports: 'Centre-South: "Entro fine Maggio gli estatini arrivano anche nei boschi di Castagno e poi in quelli di
      Faggio"; in June the summer porcini "si concentrano soprattutto nei boschi di Faggio di medio-alta montagna"; B.
      aereus "dapprima al piano, poi anche in collina ed infine in piena estate anche in montagna ... Solo ad estate
      inoltrata ... Faggio, quasi esclusivamente al Sud"; July flushes "dalla Toscana alla Sicilia, sono legate e
      direttamente proporzionali alla meteorologia".'
  funghimagazine_giugno2019:
    citation: 'Funghi Magazine, Redazione (2019-06-14). Giugno il mese dei Porcini e funghi estivi'
    url: https://web.archive.org/web/20240724145708/https://funghimagazine.it/giugno-mese-di-porcini-e-funghi-estivi/
    kind: web
    verified: verified
    supports: 'Early June 2019: galletti "nei soli boschi termofili, essenzialmente a base di Quercia. I primi buoni
      raccolti tra Calabria, Basilicata, Campania poi anche tra Lazio, Umbria e Toscana"; "Tra Puglia, Basilicata,
      Calabria e Sicilia le prime nascite di Porcini aereus".'
  funghimagazine_nascite_2025_08_01:
    citation: 'Giovinazzo A. (2025-08-01). Funghi Porcini: Inizio Agosto col Botto? Aggiornamento nascite 01-08 Agosto
      2025. Funghi Magazine'
    url: https://web.archive.org/web/20250801114245/https://funghimagazine.it/aggiornamento-nascite-01-08-agosto-2025/
    kind: web
    verified: verified
    supports: '"Sud e Isole: Calabria, Sicilia e Sardegna restano ancora fuori dai giochi, salvo micro-zone montane
      umide"; July flushes need "frequenti temporali con pochi picchi di temperature oltre i 32°C".'
  funghimagazine_nascite_2025_11_08:
    citation: 'Giovinazzo A. (2025-11-08). Porcini al capolinea al Nord, ma al Sud si raccoglie ancora bene.
      Aggiornamento nascite 08-11-2025. Funghi Magazine'
    url: https://web.archive.org/web/20251220120016/https://funghimagazine.it/aggiornamento-nascite-08-11-2025/
    kind: web
    verified: verified
    supports: '"Al Sud, invece, la stagione prosegue. Continuano le nascite di Porcini, soprattutto Boletus aereus, ma
      anche, sui monti della Calabria e tra Etna e Nebrodi, i meno comuni edulis e pinicola."'
  funghimagazine_2023_dodici_mesi:
    citation: 'Giovinazzo A. (2024-01-02). 12 mesi di funghi Porcini e non solo, Funghi 2023. Funghi Magazine'
    url: https://web.archive.org/web/20240614055903/https://funghimagazine.it/funghi-2023-12-mesi-di-funghi-porcini-e-non-solo/
    kind: web
    verified: verified
    supports: 'October 2023 "nascite senza sosta in Calabria superiore"; December 2023 "Porcini tardivi ... sulla solita
      Sila che quest''anno ha sfornato funghi Porcini senza sosta dal mese di Maggio a fine anno".'
  informacalabria_porcini2025:
    citation: 'Fiorillo I. (2025-07-05). Trovati porcini giganti, un''estate anomala in Calabria: ma non è la prima
      volta. InformaCalabria'
    url: https://www.informacalabria.it/porcini-giganti-unestate-anomala-in-calabria-ma-non-e-la-prima-volta/
    kind: web
    region: Calabria (Sila Piccola)
    verified: verified
    supports: 'In the Sila Piccola "già da almeno due settimane si trovano porcini", unusual "a causa delle temperature
      elevate e della siccità" and made possible "dalle piogge frequenti registrate nei mesi di aprile e maggio"; "i
      porcini estivi e neri ... possono fruttificare anche a partire da maggio in zone particolarmente esposte".'
  noidicalabria_serra_porcini2026:
    citation: 'NoiDiCalabria (2026-07-10). Serra San Bruno sorprende la Calabria: a luglio esplode una nascita
      straordinaria di porcini'
    url: https://noidicalabria.it/serra-san-bruno-sorprende-la-calabria-a-luglio-esplode-una-nascita-straordinaria-di-porcini/
    kind: web
    region: Calabria (Serre)
    verified: verified
    supports: '"Nei boschi del comprensorio di Serra San Bruno si sta registrando una nascita abbondante e diffusa di
      funghi porcini", in "foreste secolari di faggio, abete e castagno".'
  lr_calabria_30_2001:
    citation: 'Regione Calabria. Legge regionale 26 novembre 2001, n. 30, Normativa per la regolamentazione della
      raccolta e commercializzazione dei funghi epigei ed ipogei freschi e conservati (BURC n. 104 of 1 December 2001,
      suppl. straord. 1); testo coordinato with L.R. 9/2009, 47/2011, 69/2012, 53/2017 and 19/2026'
    url: https://www.consiglioregionale.calabria.it/bdf/api/BDF?numero=30&anno=2001
    kind: institutional
    region: Calabria
    verified: verified
    supports: '"vietata la raccolta dell''Amanita Caesarea allo stato di Ovolo chiuso" (art. 2 c. 1 e); minimum caps
      "Amanita caesarea (Ovolo buono), cm 5", "Boletus edulis e relativo gruppo (Porcini), cm 4", 3 cm for the rest
      (art. 3 c. 1); picking "nei boschi e nei terreni non coltivati, esenti da divieti e solo nelle ore diurne" (3.3);
      "limite massimo giornaliero di 3 (tre) Kg", up to 5 kg for residents of mountain comuni (art. 5), no separate
      ovolo limit, no weekday rule, season or altitude rule; the Giunta "può stabilire limiti quantitativi o divieti
      alla raccolta, anche differenziati per specie e per periodi temporali" (5.7); banned in integral reserves and
      areas the Giunta names (5-bis); permits (5-ter); Annex D protects "Amanita caesarea forma alba" and "Boletus
      edulis var. citrinus".'
  lr_calabria_19_2026:
    citation: 'Regione Calabria. Legge regionale 12 giugno 2026, n. 19, Modifiche e integrazioni della legge regionale
      26 novembre 2001, n. 30 (BURC n. 121 of 12 June 2026)'
    url: https://www.consiglioregionale.calabria.it/bdf/api/BDF?numero=19&anno=2026
    kind: institutional
    region: Calabria
    verified: verified
    supports: 'The latest amendment: permits issued "anche per il tramite dei Comuni e dell''Azienda Calabria Verde",
      valid ten years; truffle calendar and limits; no change to the mushroom sizes, quantities, hours or bans. (L.R.
      13 agosto 2026, n. 26, with the same text, had its promulgation revoked on 17 August 2026.)'
  pn_aspromonte_regolamento2016:
    citation: 'Ministero dell''Ambiente (2016). Decreto 7 dicembre 2016, approvazione del regolamento del Parco
      nazionale dell''Aspromonte. Gazzetta Ufficiale, Serie Generale n. 24 of 30 January 2017, art. 20'
    url: https://www.gazzettaufficiale.it/eli/gu/2017/01/30/24/sg/pdf
    kind: institutional
    region: Calabria (Aspromonte)
    verified: verified
    supports: 'No picking in zone A; in zones B-D "solo nelle ore diurne", 3 kg (amateur) and 10 kg (professional); "La
      raccolta dei funghi è vietata nelle aree di nuovo rimboschimento e nelle aree percorse da incendi prima che siano
      trascorsi dieci anni dall''avvenuto incendio" (art. 20 c. 4).'
  infc2015_calabria:
    citation: 'Gasparini P., Di Cosmo L., Floris A., De Laurentis D. (eds.) (2022). Italian National Forest Inventory
      INFC2015, tables 1.1-1.5 (Calabria). Arma dei Carabinieri, CREA'
    url: https://www.inventarioforestale.org/en/superficie-e-composizione-area-and-composition/
    kind: dataset
    region: Calabria
    verified: verified
    supports: 'Calabria bosco 495,177 ha (relative standard error 2.0 %), other wooded land 155,443 ha; categories: beech
      79,413 ha, black, laricio and loricato pine 73,443, chestnut 68,966, sessile, downy and pedunculate oak 53,790,
      holm oak 48,692, other deciduous 45,153, Turkey oak and Hungarian oak 43,593, other evergreen broadleaves 21,143,
      Mediterranean pines 17,474, hygrophilous 12,872, other conifers 12,561, cork oak 5,224, hop-hornbeam and hornbeam
      4,477, silver fir 3,731; plantations 2,406 ha.'
  calabria_pfr2024:
    citation: 'Regione Calabria, UOA Politiche della montagna, Foreste, forestazione e difesa del suolo (2024). Programma
      Forestale Regionale 2024-2044'
    url: https://www.regione.calabria.it/website/portalmedia/decreti/2024-03/1709723226408_programmaforestaleregionaleCalabria.pdf
    kind: institutional
    region: Calabria
    verified: verified
    supports: 'Rain "per circa il 40% in inverno, il 30% in autunno, dal 21 al 26% in primavera e dal 4 al 9% in
      estate", 3 % on parts of the Ionian coast; Camigliatello 1,634 mm, Serra San Bruno 1,772, Gambarie 1,608,
      Laghitello (Catena Costiera) 1,928, Reggio 594 (pp. 11-12). Beech the forest limit, lower limit "da 1.400 a
      1.000 m" east and west, down to 600/700 m in humid spots, pure beech "fino a 1.700/1.800 metri" (p. 45); loricato
      1,800-2,000 m (p. 46); 84 % of the INFC black-pine category is laricio, 94 % of it on the Sila plateau, about
      4,000 ha in the Aspromonte (pp. 46-47); about 110,000 ha reforested 1955-1967, laricio "nel Castanetum freddo e
      Fagetum caldo" (pp. 48-49); chestnut 500-1,000 m on the Catena Costiera, 600/700-1,000/1,100 m in the Sila, 300-
      1,200 m in the western Aspromonte (pp. 43-44); holm oak 450/500-1,100/1,200 m, cork oak 50/100-600/650 m, Turkey
      oak to about 1,200 m (pp. 37-42); Aspromonte beech "da 900-1.000 a 1.900 m ... possono scendere a 600-700 m";
      Sila NP laricio plantations at 900-1,200/1,300 m, 1950-70 (pp. 105-109). Sila, Serre and Aspromonte soils acid
      Dystrudepts, Pollino neutral Hapludolls (pp. 22-25).'
  nicolaci2014_laricio_sila:
    citation: 'Nicolaci A., Travaglini D., Menguzzato G., Nocentini S., Veltri A., Iovino F. (2014). Ecological and
      anthropogenic drivers of Calabrian pine (Pinus nigra J.F. Arn. ssp. laricio (Poiret) Maire) distribution in the
      Sila mountain range. iForest 8: 497-508'
    doi: 10.3832/ifor1041-007
    kind: peer_reviewed
    region: Calabria (Sila)
    verified: verified
    supports: 'Laricio covers about 114,000 ha in Calabria, "more than 50% are pure stands of both natural and
      artificial origin", plantations from 1950-1970; "natural pine forests grow between 800-1000 m a.s.l., and
      1500-1600 m a.s.l., while plantations were located between 900 and 1200-1300 m"; pine area +38 % 1935-2006; pure
      beech from 1,400-1,500 m; Sila rain over 1,000 mm, Camigliatello 1,631 mm; soils on granite acidic Dystrudepts;
      "Snow stayed on the ground for 6 months at elevations > 1400 to 1600 m".'
  bissanti1973_neve_sila:
    citation: 'Bissanti A.A. (1973). Sulle precipitazioni nevose e sul manto nevoso in Sila. Bollettino della Società
      Geografica Italiana: 233-248'
    doi: 10.36253/bsgi-6156
    kind: peer_reviewed
    region: Calabria (Sila)
    verified: verified
    supports: 'Seven Sila stations at 1,005-1,358 m, 1951-1967: annual rain 1,196-1,806 mm, July and August together
      3.0-3.8 % of it (Camigliatello 1,714 mm, July 30.4, August 27.9, November 242.5 mm; Tab. 2, p. 237); snow "può
      iniziare a cadere in novembre per finire in maggio", 20-25 snow days a year, snow on the ground 60-80 days
      (Camigliatello 85; November 2.1 days, December 10.6) (pp. 242, 245-246).'
  terranova2011_rain_events:
    citation: 'Terranova O.G., Iaquinta P. (2011). Temporal properties of rainfall events in Calabria (southern Italy).
      Natural Hazards and Earth System Sciences 11: 751-757'
    doi: 10.5194/nhess-11-751-2011
    kind: peer_reviewed
    region: Calabria
    verified: verified
    supports: '"average yearly rainfalls vary between 1000 and 2000 mm y−1 in mountainous and internal areas, and between
      600 and 900 mm y−1 in coastal areas, with a mean regional value of about 1150 mm y−1 ... Over 70% of the yearly
      precipitation occurs from October to March, with negligible monthly values from June to September" (p. 752).'
  muscolo2021_laricio_soil:
    citation: 'Muscolo A., Settineri G., Romeo F., Mallamaci C. (2021). Soil biodiversity as affected by different
      thinning intensities in a Pinus laricio stand of Calabrian Apennine, south Italy. Forests 12: 108'
    doi: 10.3390/f12010108
    kind: peer_reviewed
    region: Calabria (Aspromonte)
    verified: verified
    supports: 'A 60-year laricio stand at 1,100 m in the Aspromonte on schist and gneiss, sandy loam: soil pH 4.96-5.39 in
      summer and 5.37-5.64 in winter, "moderately acidic" (Table 2, p. 6).'
  ispra_cdn_calabria_legenda2024:
    citation: 'ISPRA, Capogrossi R. (2024). Tabella di conversione della Legenda regionale della Regione Calabria nella
      Legenda nazionale per la cartografia degli habitat di Carta della Natura'
    url: http://cartanatura.isprambiente.it/CdN/SchedeInformative/Calabria_SpecificheTecniche.pdf
    kind: institutional
    region: Calabria
    verified: verified
    supports: 'Regional "42.67 - Rimboschimenti di Pinus nigra" becomes national "42.G_n - Boschi di conifere alloctone o
      fuori dal loro areale"; regional "42.1B1 - Rimboschimenti di Abies alba" becomes "83.31_m - Piantagioni di
      conifere"; 42.65 laricio pine, 41.18 beech and 42.15 silver fir keep their codes (pp. 2-3).'
  arpacal_cfm_dati_storici:
    citation: 'ARPACAL, Centro Funzionale Multirischi (2026). Consultazione banca dati storici (login page and terms)'
    url: https://www.cfd.calabria.it/Login/login.php
    kind: web
    region: Calabria
    verified: verified
    supports: 'Historical station data are free ("fornito a titolo gratuito a chiunque ne faccia richiesta") but need an
      account requested by e-mail with a copy of an identity card, and "I dati non sono cedibili a terzi a nessun
      titolo"; scanned yearbooks (Annali idrologici) 1916-2000 are downloadable without registration.'
  mushma_calabria_forest_composition_2026:
    citation: 'mushma Calabria woodland composition: area and elevation of each habitat key on ISPRA and Regione
      Calabria''s Carta della Natura habitat map (1:25,000, 2023; CORINE Biotopes codes read through the class mapping
      of config/regions/calabria.yaml), rasterised on a 100 m lattice in EPSG:3035 with Copernicus DEM GLO-30 heights,
      per ISTAT 2025 comune and province; approximate 1 km woodland cells (broadleaf and conifer over half the cell)
      built from the same lattice; computed 2026-09-28 before the woodland grid was built'
    url: https://sdi.isprambiente.it/download_ogc/cnat/CNAT_Habitat_Calabria.gpkg
    kind: analysis
    region: Calabria
    verified: verified
    supports: '714,790 ha of mapped woods, macchia and scrub, 586,704 ha of them broadleaf or conifer woodland (INFC 2015
      bosco 495,177 ha). Shares and elevations (median, p10-p90): deciduous_oak 20.6 % (586 m, 230-983; downy oak 404
      m, Hungarian oak 724, Turkey oak 834), evergreen_oak 14.9 % (554 m; holm oak 90 %, cork oak 10 % at 297 m), beech
      14.0 % (1,270 m, 883-1,640, max 2,045), mountain_pine 13.8 % (1,201 m, 754-1,459; conifers planted outside their
      range, i.e. Pinus nigra reforestation, 71 % at 1,223 m, conifer plantations 20 % at 844 m, natural laricio 8.5 %
      at 1,390 m, Apennine black pine and pino loricato under 1 %), chestnut 12.0 % (816 m, 521-1,087), macchia 9.8 %
      (315 m; lentisk 35 %, Cytisus 28 %, evergreen-oak matorral 24 %, Mediterranean macchia 9 %),
      transitional_woodland_shrub 8.1 % (717 m; Spartium 52 %, broom 26 %), mixed_broadleaf 2.3 % (767 m; Alnus
      cordata 86 %), mediterranean_pine 2.0 % (367 m; Aleppo pine 82 %), riparian 1.5 %, exotic_broadleaf 0.6 %,
      fir_spruce 0.5 % (1,076 m; 1,514 ha in Serra San Bruno). Mountain pine lies mostly in the Sila comuni (San
      Giovanni in Fiore 14,974 ha, Longobucco 10,652, Casali del Manco 4,994, Taverna 4,896). Approximate woodland
      cells: 5,718, elevation median 852 m (p10 417, p90 1,403); mean habitat share deciduous oak 21.0 %, beech 18.4,
      mountain pine 16.9, evergreen oak 16.8, chestnut 15.6. See species-ecology/calabria.md.'
  mushma_occurrence_check_calabria_2026:
    citation: 'mushma Calabria occurrence check: iNaturalist API (place 9323, verifiable; month and year histograms;
      elevations from the Open-Meteo elevation API for open, non-obscured records with positional accuracy of 1 km or
      better; the Carta della Natura habitat at and within 500 m of each, deduplicated by observer, day and site;
      compared with Toscana, place 13073) and GBIF occurrence API (gadmGid ITA.4_1), queried 2026-09-28. Aggregates
      only; no coordinates are stored or published'
    url: https://api.inaturalist.org/v1/observations
    kind: analysis
    region: Calabria
    verified: verified
    supports: 'iNaturalist verifiable records: B. edulis 30 (August 1, September 12, October 10, November 5, December 2),
      B. reticulatus 36 (June 5, July 9, August 2, September 19, October 1), B. aereus 7 (August-November), B.
      pinophilus 19 (June 5, September 3, October 5, November 5), A. caesarea 15 (October 7), Cantharellus 11 (C.
      cibarius 3, C. pallens 3, C. amethysteus 1), against 3,053 fungi (September 12 %, October 24 %, November 14 %,
      December 9 %); the 27 GBIF records of these taxa are all iNaturalist copies. Elevations of all located records:
      B. edulis median 1,247 m (534-1,462, n=11; Tuscany 1,054 m, n=22), B. reticulatus 1,105 m (797-1,485, n=18; July
      records 1,329-1,485 m; Tuscany 649 m, n=19), B. pinophilus 1,152 m (797-1,638, n=11; Tuscany 692 m, n=6), B.
      aereus 253-828 m (n=3; Tuscany 352 m, n=42), A. caesarea 328-932 m (n=4; Tuscany 364 m, n=32), Cantharellus
      482-1,585 m (n=5; Tuscany 283 m, n=93). Deduplicated by observer, day and site (11 B. edulis, 12 B.
      reticulatus, 10 B. pinophilus), mountain pine dominates the 500 m around 5, 5 and 4 of them; at the point itself
      2, 1 and 0 fall in pine polygons. See species-ecology/calabria.md.'
  mushma_calabria_rain_normals_check_2026:
    citation: 'mushma Calabria rain check: raw ERA5-Land (CDS) annual precipitation 2016-2025, read bilinearly from the
      land nodes of the 0.2° lattice at 15 stations, against the long-term station normals the Programma Forestale
