      Primeval Beech Forests of the Carpathians and Other Regions of Europe"). Bracciano-Martignano Regional Park: Monte
      Raschio'
    url: https://www.faggetevetuste.it/en/faggeta/bracciano-martignano-regional-park/
    kind: institutional
    region: Lazio
    verified: verified
    supports: 'the Monte Raschio beech (Oriolo Romano, UNESCO since 2017) "develops between 400 and 550 m,
      extraordinarily low altitudes"; "The beech forest covers about 80 hectares", with conifer reforestation and a
      buffer of "other deciduous broad-leaved trees, mainly Turkey oaks"; "in the volcanic mountains of Lazio, thanks
      to the abundant rainfall and the favorable soil conditions, beech forests develop at lower altitudes – even at
      350-400 m".'
    cited_as:
    - species-ecology/lazio.md
  faggetevetuste_monte_cimino:
