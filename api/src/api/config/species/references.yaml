      aereus 255, B. pinophilus 32, A. caesarea 147, C. cibarius 952; Carinthian Austrian Mycological Society records
      by elevation band (B. edulis since 1990: October or later 40 % below 600 m, 22 % at 600-1000 m, 5 % at
      1000-1400 m, 2 % above); Slovene iNaturalist months and elevations. See species-ecology/friuli_venezia_giulia.md.'
    cited_as:
    - species-ecology/friuli_venezia_giulia.md
  mushma_fvg_forest_check_2026:
    citation: 'mushma Friuli-Venezia Giulia forest check: the region''s woodland grid (built 2026-09-27 from the
      Region''s Tipologie forestali 2013 map, 3,304 woodland cells) and the map itself, joined to the region config''s
      habitat mapping and to Copernicus GLO-30 elevations; habitat shares, per-habitat elevations, slope and 15
      October sun-ratio percentiles, and the habitat and altitude gates under the Tuscan and the regional rules'
    url: https://serviziogc.regione.fvg.it/geoserver/UTIL_TER/wfs?service=WFS&version=2.0.0&request=GetCapabilities
    kind: analysis
    region: Friuli-Venezia Giulia
    verified: verified
    supports: 'habitat shares of the mapped forest: beech 25.7 %, mountain pine 15.3 % (black pine 35,160 ha, Scots
      pine 8,300 ha, Karst pine plantations about 2,600 ha), mixed broadleaf 14.0 %, mixed broadleaf-conifer 12.6 %,
      fir/spruce 12.5 %, deciduous oak 6.8 % (87 % ostrio-querceti), chestnut 5.8 %, other conifer 2.1 % (72 %
      larch); woodland cells median 874 m, max 1898 m, slope median 27.0°, p90 36.2°, max 48.6°, soil pH median
      5.56. See species-ecology/friuli_venezia_giulia.md.'
    cited_as:
    - species-ecology/friuli_venezia_giulia.md
  mushma_fvg_rain_unscaled_2026:
    citation: 'mushma rain scale for Friuli-Venezia Giulia, left off: no FVG gauge fit exists yet. ARPA FVG''s daily
      rain (OSMER archive, about 60 priority stations, CC BY-SA 3.0) answered HTTP 400 to every request on
      2026-09-27, and no bordering region has a fit on the CDS rain. See .gavin-root/docs/regions/friuli_venezia_giulia.md,
      Validation'
    url: https://github.com/Calfredop/mushma/blob/main/.gavin-root/docs/regions/friuli_venezia_giulia.md
    kind: analysis
    region: Friuli-Venezia Giulia
    verified: verified
    supports: 'The Alpine woodland-gauge fits on CDS era5_land_cds rain so far: Piemonte x0.74 (97 ARPA gauges, raw
      1.33), South Tyrol x0.75 (17 gauges, raw 1.34), Lombardy x0.96 (60 ARPA gauges, May-October, raw 1.06). None
      borders FVG, whose Prealps hold Italy''s wettest stations; the scale stays off (factor 1 on every source and on
      the normals) so the CDS history, the Open-Meteo days and the normals agree. A placeholder, not a fit.'
