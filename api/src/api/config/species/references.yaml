    kind: institutional
    verified: verified
    supports: 'National record shares from ISPRA''s "Progetto Speciale Funghi" database. Downy-oak woods (1,072 records,
      324 species; the southern type listed for Puglia among other regions): Armillaria tabescens 1.90 %, Boletus
      aereus 1.81 %, Cantharellus cibarius 1.81 %, Amanita caesarea 1.24 %; C. cibarius "ha, in questa tipologia di
      boschi, un picco di frequenza ... rispetto ad altri tipi di copertura arborea del suolo" (pp. 84-90). Beech woods
      (4,718 records, 1,004 species): B. edulis 2.1 %, C. cibarius 1.8 %, B. pinophilus 1.0 %, B. reticulatus 1.0 %
      (p. 63); the Gargano beech is EUNIS G1.681 in habitat 9210. Holm-oak woods (1,526 records, Puglia among the
      regions): C. cibarius 0.9 %, C. ferruginascens 0.2 %, no porcino among the frequent species (pp. 72-75). Dune
      pinewoods (habitat 2270): Inocybe, Helvella, Suillus, Chroogomphus, Rhizopogon, no porcino, ovolo or chanterelle
      among the frequent species; natural dune Aleppo pine in Puglia "Isole Tremiti, Gargano e coste tarantine" (pp.
      168-171).'
    cited_as:
    - species-ecology/puglia.md
