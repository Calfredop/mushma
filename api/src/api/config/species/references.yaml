# Shared bibliography for the draft species rules. Every factor `source` id must resolve here.
# Built from the evidence appendices in .gavin-root/docs/species-ecology/ (cited_as gives the local R-number).
# verified = page, abstract or PDF opened; snippet-only = seen in search results or metadata only.
schema_version: 1
references:
  agreda2015:
    citation: 'Ágreda T., Águeda B., Olano J.M., Vicente-Serrano S.M., Fernández-Toirán M. (2015) Increased evapotranspiration
      demand in a Mediterranean climate might cause a decline in fungal yields under global warming. Global Change
      Biology 21: 3499–3510'
    doi: 10.1111/gcb.12960
    kind: peer_reviewed
    verified: verified
    supports: water balance vs rain models, bimodal spring and late-summer–autumn response (guild level).
    cited_as:
    - porcini.md R9
    - ovoli.md R10
  agreda2016:
    citation: 'Ágreda T., Águeda B., Fernández-Toirán M., Vicente-Serrano S.M., Olano J.M. (2016) Long-term monitoring
      reveals a highly structured interspecific variability in climatic control of sporocarp production. Agricultural
      and Forest Meteorology 223: 39–47'
    doi: 10.1016/j.agrformet.2016.03.015
    kind: peer_reviewed
    verified: verified
    supports: 'climate control well before the season; timing of the summer–autumn rain signal (species named in
      the abstract: none).'
    cited_as:
    - porcini.md R10
  aguilar2010:
    citation: 'Aguilar C., Herrero J., Polo M.J. (2010) Topographic effects on solar radiation distribution in mountainous
      watersheds and their influence on reference evapotranspiration estimates at watershed scale. Hydrology and Earth
      System Sciences 14: 2479–2494'
    doi: 10.5194/hess-14-2479-2010
    kind: peer_reviewed
    region: Spain (Sierra Nevada)
    verified: verified
    supports: correcting the radiation for slope and aspect changes reference ET0 by a mean of 61 mm a year (SD 142),
      so ET0 on a slope follows its radiation.
  alday2017:
    citation: 'Alday J.G., Martínez de Aragón J., de-Miguel S., Bonet J.A. (2017) Mushroom biomass and diversity
      are driven by different spatio-temporal scales along Mediterranean elevation gradients. Scientific Reports
      7: 45824'
    doi: 10.1038/srep45824
    kind: peer_reviewed
    verified: verified
    supports: late-summer–early-autumn precipitation as main driver; elevation not significant (community).
    cited_as:
    - porcini.md R16
    - ovoli.md R11
  allen2006_slopes:
    citation: 'Allen R.G., Trezza R., Tasumi M. (2006) Analytical integrated functions for daily solar radiation on
      slopes. Agricultural and Forest Meteorology 139: 55–73'
    doi: 10.1016/j.agrformet.2006.05.012
    kind: peer_reviewed
    verified: verified
    supports: daily clear-sky direct and diffuse radiation on any slope and aspect by integrating the incidence angle
      over the day; the geometry of the sun ratio.
  alonso_ponce2011:
    citation: 'Alonso Ponce R. et al. (2011) Rockroses and Boletus edulis ectomycorrhizal association: realized
      niche and climatic suitability in Spain. Fungal Ecology 4: 224–232'
    doi: 10.1016/j.funeco.2010.10.002
    kind: peer_reviewed
    verified: snippet-only
    supports: mesothermal, Mediterranean, humid climatic niche; strongly acid loam soils.
    cited_as:
    - porcini.md R33
  ambrosio_zotti2015:
    citation: 'Ambrosio E., Zotti M. (2015) Mycobiota of three Boletus edulis (and allied species) productive sites.
