  mushma_lazio_forest_composition_2026:
    citation: 'mushma Lazio woodland composition: area and elevation of each forest type and habitat key in the Regione
      Lazio Carta forestale su base tipologica (39,095 polygons, the WFS download of config/sources.yaml, read by the
      class mapping of config/regions/lazio.yaml), rasterized on a 100 m lattice in EPSG:25833 with Copernicus DEM
      GLO-30 elevations at each lattice centre, computed 2026-09-28 before the Lazio woodland grid existed'
    url: https://dati.lazio.it/dataset/carta-forestale-su-base-tipologica-della-regione-lazio
    kind: analysis
    region: Lazio
    verified: verified
    supports: 'the map holds 619,200 ha of woods and scrub, 530,400 ha of it broadleaf or conifer wood (elevation p10
      142 m, median 607 m, p90 1,263 m, max 1,915 m; 41 % below 500 m, 1.9 % above 1,600 m). Shares of the wood and
      elevations (p10 / median / p90): deciduous_oak 41.1 % (107 / 388 / 902 m; a quarter acidophilous Turkey oak),
      mixed_broadleaf 16.5 % (402 / 751 / 1,052 m; 96 % hop-hornbeam), beech 16.2 % (998 / 1,302 / 1,620 m, p99
      1,785, max 1,915; 11.7 % above 1,600 m; 788 ha below 700 m, 3,322 ha below 900 m), chestnut 10.7 % (327 / 603 /
      956 m; on volcanic ash median 497 m, on sandstone and marl 778 m), evergreen_oak 8.8 % (92 / 483 / 860 m),
      riparian 3.1 %, mountain_pine 2.2 % (black-pine reforestation, median 926 m), mediterranean_pine 1.2 % (median
      66 m), exotic_broadleaf 0.2 %; outside the wood, transitional_woodland_shrub 74,800 ha (Arbusteti temperati
      64,000 ha, median 483 m) and macchia 13,200 ha (median 217 m). No fir wood, no mixed broadleaf-conifer class.
      See species-ecology/lazio.md.'
    cited_as:
    - species-ecology/lazio.md
  mushma_occurrence_check_lazio_2026:
    citation: 'mushma Lazio occurrence check: iNaturalist observations and histogram APIs (place 8670, verifiable;
      locations used only for open records with positional accuracy of 1 km or better), GBIF occurrence API (gadmGid
      ITA.8_1, MATERIAL_SAMPLE rows excluded, iNaturalist copies set apart), elevations from the Open-Meteo
