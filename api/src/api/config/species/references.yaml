  mrak2025_mycorrhiza:
    citation: 'Mrak T., Brailey-Crane P.A., Šibanc N., Martinović T., Gričar J., Kraigher H. (2025). Mycelial
      communities associated with Ostrya carpinifolia, Quercus pubescens and Pinus nigra in a patchy Sub-Mediterranean
