      trascorsi dieci anni dall''avvenuto incendio" (art. 20 c. 4).'
  infc2015_calabria:
    citation: 'Gasparini P., Di Cosmo L., Floris A., De Laurentis D. (eds.) (2022). Italian National Forest Inventory
