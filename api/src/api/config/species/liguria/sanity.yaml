# Press-contrast sanity check for Liguria (api.model.sanity).
# Areas by comuni (ISTAT names, 2025) or provinces; windows and source URLs written down on
# 2026-09-25, before any Liguria score existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); read those with `--group ovoli` / `--group gallinacci`.
# Evidence, second sources and weaknesses per contrast: .gavin-root/docs/species-ecology/liguria.md.
# Picking was restricted in the 2022-2023 African swine fever zone (Beigua, Valle Stura, Torriglia):
# that thins sightings there, not the scores these contrasts compare.
