    start: 09-01
    end: 09-15
- id: ovoli_savonese_2021_2022
  claim: 'Ovoli, late August to mid-September: "una gettata eccezionale anche di Amanita Caesarea nel
    savonese" in 2022; in 2021 a few after Ferragosto that dried out, then nothing (IVG, 2021-09-16)'
  source: https://www.basilico.it/2022/10/25/raccolta-funghi-in-liguria-nel-2022-annata-record-ma-lambiente-soffre/
  higher:
