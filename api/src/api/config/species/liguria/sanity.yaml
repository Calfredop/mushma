normal_seasons:
- 2017
- 2018
- 2019
- 2020
- 2021
- 2022
- 2023
- 2024
- 2025
contrasts:
- id: aveto_2016_2017
  claim: 'Early October: 2016 a "timida nascita" after months of drought, "in tremendo ritardo"
    (LevanteNews, 2016-10-09); 2017 a flush from 30 September to mid-October on the border with
    Emilia and Piemonte'
  source: https://prevedereuscitaporcini.blogspot.com/2017/12/racconti-dai-boschi-della-liguria-con.html
  higher:
    area: aveto_trebbia
    seasons:
    - 2017
    start: 09-30
    end: 10-15
  lower:
    area: aveto_trebbia
    seasons:
    - 2016
    start: 09-30
    end: 10-15
- id: aveto_2021_timing
  claim: '2021: drought until the end of September ("il perdurare della siccità"), then "l''esplosione
    delle nascite" from Sunday 3 October, up to 1500 m'
  source: https://www.levantenews.it/2021/10/06/funghi-raccolta-al-via-le-regole-i-consorzi-le-sanzioni/
  higher:
    area: aveto_trebbia
    seasons:
    - 2021
    start: 10-03
    end: 10-20
  lower:
    area: aveto_trebbia
    seasons:
    - 2021
    start: 08-25
    end: 09-25
- id: aveto_2019_2021_early_september
  claim: 'Early September: "in questi giorni è esplosa la nascita di funghi" in 2019; in 2021 no rain
    for months and picking suspended in the Aveto park forests (Mentelocale, 2021-09-11)'
  source: https://www.levantenews.it/2019/09/09/raccolta-funghi-le-regole-da-seguire/
  higher:
    area: aveto_trebbia
    seasons:
    - 2019
    start: 09-01
    end: 09-14
  lower:
    area: aveto_trebbia
    seasons:
    - 2021
    start: 09-01
    end: 09-14
- id: aveto_july_2022_2024
  claim: 'July: summer porcini (B. reticulatus) peaking in the eastern Genovesato and the
    Ligurian-Emilian Apennine in 2024; July 2022 dry, "ad eccezione della Liguria" (FM, 2022-08-02)'
  source: https://funghimagazine.it/aggiornamento-funghi-25-07-2024/
  higher:
    area: aveto_trebbia
    seasons:
    - 2024
    start: 07-01
    end: 07-25
  lower:
    area: aveto_trebbia
    seasons:
    - 2022
    start: 07-01
    end: 07-25
- id: sassello_2021_2022
  claim: 'Sassello, first half of September: "cestini ricolmi di porcini e ovuli", a "stagione boom" in
    2022; no rain at Sassello and no porcini yet in 2021 (IVG, 2021-09-16)'
  source: https://www.redazionenews.it/economia/2022/09/15/sassello-dopo-la-festa-amaretto-sotto-coi-funghi-stagione-boom/
  higher:
    area: beigua_stura
