    di nascite'' (FM 2022-06-24); ''ottime nascite ... tra Basilicata e Calabria, dopo le piogge del
    17 giugno'' (FM 2022-07-01). 2018: ''Basilicata ferma al palo.'' (FM 2018-06-16), ''ferma al
    palo con buone piogge ma nascite contenute e per ora relegate ai soli boschi caldi Mediterranei
