- id: basentana_bradano_early_september_2021_vs_2022_2023
  claim: 'Early September 2021: ''Ancora in Basilicata per una ottima buttata di Porcini estivi appena
    iniziata nella bassa Basentana tra Basento-Bradano e confine pugliese'' (FM 2021-09-04);
    ''Ancora per qualche giorno dovrebbero esserci le condizioni ideali per nascite al confine tra
    Bradano–Basilicata e Tarantino'' (FM 2021-09-10). 2022: ''le nascite risultano pressoché assenti
    in provincia di Matera'' (FM 2022-09-05). 2023: ''Assenza di nascite tra Molise-Puglia e
    Basilicata non tirrenica'' (FM 2023-08-24)'
  source: https://web.archive.org/web/20210922081914/https://funghimagazine.it/aggiornamento-meteofunghi-04-09-2021-porcini-giganti/
