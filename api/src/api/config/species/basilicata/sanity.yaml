- id: basilicata_spring_2024_2025_vs_2023
  claim: 'Late May 2024: ''Exlpoit a sorpresa per la Basilicata che, zitta-zitta, mette a frutto le poche
    piogge avute'', ''sufficienti a scatenare una piccola apoteosi porcina'', ''Porcini estivi e
    rari Neri Lucani'', ''Nascono ancora attorno al Golfo di Maratea e nel Potentino, oltre che sul
    pre-Pollino'', after the rains of 18-19 May (FM 2024-05-30). May 2025: ''il boom è arrivato
    all''improvviso anche in Calabria, Basilicata e Campania'', ''Nascite abbondanti di Porcini
    Neri'' (FM 2025-05-16, live page); ''La Basilicata ha già avuto un primo exploit'' (FM
    2025-05-30, live page). May 2023: ''Gargano, Molise, Abruzzo, Basilicata e Vibonese ... sembrano
    fermi al palo'' (FM 2023-05-18); ''presto arriveranno anche i primi Porcini così come in
    Basilicata'' (FM 2023-05-25); ''per i funghi Porcini ci sarà da attendere'' (FM 2023-06-01)'
  source: https://web.archive.org/web/20240624072920/https://funghimagazine.it/aggiornamento-funghi-31-05-2024/
