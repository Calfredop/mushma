- id: basilicata_late_june_2022_vs_2018_2024
  claim: 'Late June 2022: ''Basilicata temporaneamente protagonista, a sorpresa persino più della
    Calabria dove si registrano ottime nascite, anche e soprattutto di Porcini Bronzini (Boletus
