- id: lucania_tirrenica_vs_non_tirrenica_late_august_2023
  claim: 'Late August 2023: ''buone nascite si stanno ancora registrando ed aumenteranno in Cilento e
    nella Lucania tirrenica''; ''Assenza di nascite tra Molise-Puglia e Basilicata non tirrenica''
    (FM 2023-08-24); ''Buttata ancora buona sulla Lucania tirrenica'' (FM 2023-09-06); rain on 4-5
    August ''con assenza però di piogge degne di nota da Potenza verso Est e Sud'', concentrated
    ''tra l''alta valle del fiume Sinni ed il Golfo di Maratea'' (FM 2023-08-17)'
