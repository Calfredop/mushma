# Press-contrast sanity check for Basilicata (api.model.sanity).
# Areas by comuni (ISTAT 2025 names, all in Basilicata) or provinces (ISTAT sigle PZ, MT; '*' is the
# whole region). Windows and source URLs written down on 2026-09-30, before any Basilicata score
# existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); read those with `--group ovoli` / `--group gallinacci`.
# Basilicata's local press almost never says how a season went: 12 of the 14 contrasts rest on
# Funghi Magazine's national bulletins alone, read through Wayback Machine captures (live pages where
# no capture exists), whose Basilicata lines come from readers' reports; most draw on 2-4 bulletins.
# A La Siritide piece (2020) seconds one 2020 side, and a Coldiretti note on SassiLive gives the only
# 2017 verdict. The bulletins start in 2018: no source covers 2016. Quotes, second sources and
# weaknesses per contrast:
# .gavin-root/docs/species-ecology/basilicata.md (Sanity contrasts).
