    end: 09-10
  lower:
    area: ovest_sud
    seasons:
    - 2024
    start: 08-15
    end: 09-10
- id: potenza_vs_materano_late_summer_2022
  claim: 'Early September 2022: ''la Basilicata sta vivendo una delle migliori stagioni fungine degli
    ultimi decenni ... Purtroppo i settori Est della regione non hanno avuto buone piogge e infatti
    le nascite risultano pressoché assenti in provincia di Matera, abbondanti invece nel Potentino
    fin sul Tirreno'' (FM 2022-09-05); ''Meno favorite dalle piogge e dalle nascite i settori
    orientali della regione, in particolar modo la provincia di Matera e Metapontino'' (FM
    2022-08-26), which names the Dolomiti Lucane among the productive areas, hence the Gallipoli
    Cognato comuni are left out of the lower side'
  source: https://web.archive.org/web/20220905122706/https://funghimagazine.it/perche-nascono-tanti-funghi-tutti-insieme/
