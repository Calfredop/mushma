- id: ovest_sud_october_2020_2022_vs_2023
  claim: 'October 2020: ''La Basilicata vede buone o ottime nascite di funghi, soprattutto Porcini, nei
    settori Ovest e Sud della regione, soprattutto al confine con la Campania e la Calabria'' (FM
    2020-10-23). October 2022: ''Più fortunati i settori Ovest dove a Ottobre si sono registrate
    nascite davvero importanti, diffuse e talvolta persino massicce'' (FM 2022-11-05); ''Basilicata
    occidentale ancora con buone nascite'' (FM 2022-10-13). October 2023: ''In Basilicata, tutta,
    non si registrano nascite di funghi degne di nota, a causa del persistere della siccità, ivi
    incluso alto Sinni e Pollino'' (FM 2023-10-12); ''nascite modeste'' (FM 2023-10-04); ''nascite
    quasi non pervenute'' (FM 2023-10-27). Second outlet for 2020: at San Severino Lucano ''un mese
    di ottobre umido e non freddo che ha permesso di prolungare la stagione dei funghi'' (La
    Siritide 2020-10-21)'
  source: https://web.archive.org/web/20231012124159/https://funghimagazine.it/aggiornamento-porcini-12-10-2023/
