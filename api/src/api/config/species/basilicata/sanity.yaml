contrasts:
- id: basilicata_ovest_sud_late_august_2022_vs_2024
  claim: 'Late August 2022: ''3) In terza posizione la BASILICATA''; ''Nascite importanti si sono
    registrate e, localmente sono ancora in atto sulle Dolomiti Lucane, nel Vulture ... ma
    soprattutto all''interno del Parco Nazionale dell''Appennino Lucano-Val d''Agri-Lagonegrese,
    inclusi gli alti monti del Sinni e Pollino con ottime nascite in particolar modo tra Lauria e
    Golfo di Maratea'' (FM 2022-08-26); ''Ottime nascite in Cilento e Potentino'' (FM 2022-08-18);
    ''abbondanti invece nel Potentino fin sul Tirreno'' (FM 2022-09-05). Late August 2024: ''Poco è
    nato tra Sinni e Pollino, per via del gran caldo'' (FM 2024-08-16); in Puglia and Basilicata
    storms ''non sufficienti a scatenare nascite porcine'', readers report ''ore per poter trovare
    un paio di Porcini al massimo'' in western Lucania (FM 2024-08-30)'
  source: https://web.archive.org/web/20220902074404/https://funghimagazine.it/nuovo-boom-di-porcini/amp/
  higher:
    area: ovest_sud
    seasons:
