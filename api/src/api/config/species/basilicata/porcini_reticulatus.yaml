# Species rules for one key in BASILICATA, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Basilicata sources: .gavin-root/docs/species-ecology/basilicata.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_reticulatus
group: porcini
taxon: Boletus reticulatus
synonyms: [Boletus aestivalis]
status: draft
i18n_key: species.porcini_reticulatus
records:
  gbif_taxon_keys: [5954691]
  inat_taxon_ids: [350216]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    GBIF taxonKey 5954691 includes the synonym B. aestivalis (5954988). 28 of 39 Tuscan GBIF rows are
    soil-DNA MATERIAL_SAMPLE records from the 2019 "Global soil organisms" dataset: exclude them.
    Basilicata: 1 iNaturalist record (7 September 2022, Chiaromonte, the Pollino; not located to 1 km,
    needs ID), none on GBIF (2026-09-30). Validate the porcini group score, not this key alone.
notes: >-
  The summer porcino ("fungo del caldo"). Basilicata: the "Porcini estivi" of the Funghi Magazine
  bulletins, found in May-June from the south-west ("Discrete nascite di Porcini Estatini tra
  Campania-Basilicata-Calabria", 28 May 2022) and in the summer storms of the Pollino and western
  Lucania, "decisamente più abbondanti nelle faggete e nei castagneti" (July 2026). Changed for
  Basilicata, as in Campania and Calabria: beech becomes a full host and the altitude band climbs to the
  beech belt. No quantitative weather study exists for this taxon: the rain logic is borrowed from B.
  edulis, temperature and cold-night rules are shifted using qualitative sources.

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [2, 21, 32]
    reference_c: 17
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.5, 3.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, bmeteo_funghi_luglio, funghimagazine_giorni_pioggia]
  derived: true
  notes: >-
    POR-R3 for the summer porcino. The pace is 1 at 17 °C of topsoil, the weather the lag window
    was drawn from. Fruit bodies develop at a lower optimum than mycelium grows in culture (B.
    edulis 25-28 °C; Moore et al. 2008), hence t_opt 21 °C. Thermophilic porcini appear 8-11
    days after warm summer storms (lore); a 12 °C stretch runs at about 65 % pace. Caps stop
    growing when the day's minimum humidity falls under 40 % and grow well from about 60 %
    (Kasparavičius 2001, B. edulis): open-air daily maximum VPD of 1.5 kPa keeps full pace and
    3.0 kPa halves it; the floor stands for the moister air under the canopy. No peer-reviewed
    days-per-°C figure exists for these species: every number is a prior. The humidity ramp is
    set higher than for the autumn porcini because it fruits in summer, when open-air VPD is 2
    kPa on a median July day.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: late_spring_summer
          dates: ["01-05", "01-06", "30-09", "15-11"]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, museo_porcino_borgotaro, mushma_occurrence_check_2026, funghimagazine_porcini_maggio2022, fm_sicilia_2024_05_30, bas_fm_2023_07_13, funghimagazine_nascite_2026_04_23, funghimagazine_nascite_2026_07_10]
    derived: true
    data: available
    notes: >-
      POR-S1, tail widened by the occurrence cross-check: central-Italy iNaturalist records are
      over-represented Jun–Sep (4.2x, 2.7x, 1.8x, 2.6x vs all fungi) and still 0.8x in October (9
      records), so the ramp now ends mid-November instead of 31 October. Basilicata: kept. The first
      summer porcini are reported in late May ("Discrete nascite di Porcini Estatini tra
      Campania-Basilicata-Calabria", 28 May 2022), when the window is already at 0.9, and "Porcini
      estivi e rari Neri Lucani" came in late May 2024 after the rains of 18-19 May (Funghi Magazine,
      folklore); the summer porcino was once "precocissimi" in the "Lucania costiera" (April 2026), but
      the coast has no host wood (Aleppo pine and dune pine), so Puglia's April opening is not copied.
      July flushes on the Pollino and in western Lucania (July 2026) sit on the plateau; in a hot July
      the rain and heat rules leave only the high beech, as in 2023: "Nascite scarsissime o assenti in
      Lucania, salvo in alta quota sul Sirino e vicine cime di Lauria-Lagonegro". No Basilicata source
      dates a late tail like Calabria's "quasi natalizio".

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        chestnut: 1.0
        deciduous_oak: 1.0
        beech: 1.0
        fir_spruce: 0.6
        mixed_broadleaf_conifer: 0.6
        mountain_pine: 0.3
        mixed_broadleaf: 0.3
        transitional_woodland_shrub: 0.3
        evergreen_oak: 0.3
        mediterranean_pine: 0.1
        other_conifer: 0.1
        macchia: 0.1
        riparian: 0.05
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, museo_porcino_borgotaro, beugelsdijk2008, santolamazza2023, mushma_habitat_share_2026, ispra2018_mlg180_calabria_foreste, ispra2019_mlg187_flora_micologica, funghimagazine_nascite_2026_07_10, bas_linee_forestali2013, mushma_basilicata_forest_composition_2026]
    derived: true
    data: available
    notes: >-
      Basilicata (2026-09-30, the Carta della Natura habitat map as the grid reads it). `beech` (12.7 %
      of the wooded area) moves from secondary 0.6 to host 1.0, as in Campania and Calabria: B.
      aestivalis (= reticulatus) is among "le specie maggiormente frequenti in tutte le tipologie" of
      the Calabrian beech, 0.8 % of the Pollino beech records (ISPRA MLG 180/2018), and the July 2026
      flush on the Pollino and in western Lucania was "decisamente più abbondanti nelle faggete e nei
      castagneti" than in the lower oak woods (Funghi Magazine, folklore). Deciduous oak (63.4 %, mostly
      Turkey oak) and chestnut stay hosts: 1.7 % of the Calabrian Turkey-oak records and 1.1 % of the
      downy-oak ones, and the top species of the national chestnut records (2.9 %, MLG 187/2019).
      `mixed_broadleaf` (Alnus cordata 63 %, hop-hornbeam 36 %) and `transitional_woodland_shrub`
      (bramble, deciduous thickets, broom) move to marginal 0.3, as in Calabria; `mountain_pine` (pino
      loricato, no porcino in its two Calabrian records) moves to 0.3. `other_conifer` (the Aleppo and
      black-pine plantations) stays non-host 0.1. Otherwise Tuscany's POR-H3. Four levels (2026-09-24,
      mushma_habitat_share_2026): chestnut and deciduous oak are "mainly" named -> host. "Rarer under
      beech, hazel, pine and fir" names four more documented but clearly less typical hosts, so beech,
      fir/spruce, mountain pine and mixed broadleaf (via hazel) stay secondary; mixed broadleaf+conifer
      and transitional woodland/shrub are also secondary because that mix is mostly chestnut/oak (both
      hosts), diluted only by design, not by weak evidence. Evergreen oak is marginal (only "oak" is
      named, not specifically holm oak). Mediterranean pine, other conifer and macchia are non-host (the
      "pine" mention is read as mountain pine, IGP's eligible black/Scots pine); riparian and exotic
      broadleaf are non-host. Saturated to full credit from a host-weighted share of 0.30.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [0, 150, 1600, 1900]}
    confidence: plausible
    source: [matteucci2008_micoponte, muse_censimento_boletus, rt_tipi_forestali_p4, arrigoni_viciani_castagneti, mushma_occurrence_check_2026, mushma_occurrence_check_campania_2026, bas_linee_forestali2013, mushma_basilicata_forest_composition_2026, bas_fm_2022_08_26, bas_fm_2022_09_05]
    derived: true
    data: available
    notes: >-
      POR-A3. Hills to lower mountain, the chestnut and oak belt. Central-Italy iNaturalist records:
      median 714 m, p90 1272 m (n=56). Basilicata: full to 1,600 m (Tuscany 1,100 m) and 0 at 1,900 m,
      as in Campania and Calabria, because beech is now a full host and sits at a median 1,259 m (p90
      1,468 m) on the map, with the Fagetum "fino a 1800-1900 metri" (Linee programmatiche forestali
      2013). The southern mainland's located records (mostly Calabria) sit at a median 1,120 m against
      Tuscany's 649 m. In the 2022 season the summer porcini came from the hills and then "degli alti
      colli e monti", the "boschi montani con Estatini" (Funghi Magazine, folklore). With the Tuscan
      band the beech-dominated cells (median 1,334 m) would lose more than half their credit (0.42).

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: plausible
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-R1 + POR-R2, transferred from B. edulis (strong there, plausible here).

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: plausible
    source: [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1, transferred from B. edulis and community studies.
      Tuned (2026-09-22): the absolute 20->80 mm ramp was full in an ordinary September, so the 30
      days are scored as a percentage of the cell's own normal for those days (2016-2025 reanalysis,
      downscaled and rain-scaled like the rain): 0 at 50 %, full from 125 %. It raised the porcini
      train objective by 0.03 with or without the rain scale, and the hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [9, 13, 21, 25]}
    confidence: plausible
    source: [borgotaro_igp_rt, matteucci2008_micoponte, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: >-
      POR-T3. The B. edulis band shifted warmer: "fungo del caldo" (IGP), "tipicamente termofila e
      xerofila" (Matteucci). Low confidence within plausible.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d; compare in the backtest.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.75
    confidence: plausible
    source: [salerni2023_amiata, andrew2025]
    derived: true
    data: derived
    notes: POR-X1. Milder than for B. edulis (x0.75) because this taxon is thermophilous.

  - id: cold_nights
    role: stopper
    kind: count_days
    i18n_key: factor.cold_nights
    input: {variable: temperature_2m_min, op: lte, threshold: 5, window_days: 7}
    response: {trapezoid: [null, null, 2, 3]}
    floor: 0.5
    confidence: folklore
    source: [funghimagazine_fino_quando]
    derived: true
    data: available
    notes: >-
      POR-X5. "Stops with the first cold": Tmin <=5 °C on 3+ of the last 7 nights -> x0.5.

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.1
    confidence: folklore
    source: [funghimagazine_fino_quando, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: POR-X3. Least frost-tolerant of the four (x0.1).

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: folklore
    source: [borgotaro_igp_rt, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 5, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: >-
      POR-X6. ET0 threshold raised to 5 mm/day because this taxon fruits in summer at low altitude,
      where 4 mm/day is normal. All numbers are guesses.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [80, 95, null, null]}
    floor: 0.9
    confidence: folklore
    source: [matteucci2008_micoponte]
    derived: true
    data: derived
    notes: >-
      POR-A6. Tolerates or prefers sunny exposures (S x1.0, E/W x1.0, N x0.9): x0.9 at 80 % of
      flat ground's sun or less, x1 from 95 %. Read on the day's sun ratio, the cell's sun as
      a percentage of flat ground's (api.model.terrain), so it bites hardest in autumn, when
      the sun is low. The terrain microclimate already makes sunny slopes warmer and drier for
      every rule; this line is the species' own preference on top of that, kept soft.

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 25, 40]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby
      1979), but a 1 km cell's mean slope is not the slope of the exact spot the mushrooms
      grow on: normal terrain for Tuscan woodland scores full credit, and only clearly
      steep cells lose it. Woodland cells on the Tuscan grid run p10 10.2°, p25 12.6°, median
      16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up to 25°, about the p90, x0.8 from 40°.
      Mushroom production fell with slope in Pyrenean Scots pine (Bonet 2008), and B. edulis
      yield was highest under about 11° on plots in north-east Turkey (Mumcu Küçüker 2019);
      two Spanish studies found no slope effect (Martínez-Peña 2012, Taye 2016). It acts on
      the score only, never on the rain, so the same water is not counted twice.

known_gaps:
  - id: temperature_drop
    description: POR-T6. Temperature-drop bonus; see porcini_edulis.
    needs: [a change-detection factor kind]
    confidence: folklore
    source: [bmeteo_pioggia_funghi]
  - id: wood_edge
    description: POR-H5. Shrub, meadow and pasture within 100 m of a qualifying wood is productive.
    needs: [M2 grid, a woodland edge buffer when building habitat fractions]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014]
  - id: stand_and_soil
    description: >-
      POR-N1. Mycelium is more frequent in mature (40-year) chestnut orchards than young ones; prefers
      clay or sand-mixed loam.
    needs: [stand_age, soil_texture]
    confidence: plausible
    source: [santolamazza2023, beugelsdijk2008]
