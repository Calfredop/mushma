# Press-contrast sanity check for Campania (api.model.sanity).
# Areas by comuni (ISTAT 2025 names) or provinces; windows and source URLs written down on
# 2026-09-27, before any Campania score existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); read those with `--group ovoli` / `--group gallinacci`.
# Campania local press rarely says how a season went; most contrasts rest on Funghi Magazine's
# national bulletins (read through Wayback Machine captures, the live site is behind a captcha),
# whose Campania paragraphs are written from readers' reports. Quotes, second sources and
# weaknesses per contrast: .gavin-root/docs/species-ecology/campania.md (Sanity contrasts).
