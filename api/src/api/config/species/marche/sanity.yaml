# Press-contrast sanity check for the Marche (api.model.sanity).
# Areas by comuni (ISTAT names, 2025) or provinces; windows and source URLs written down on
# 2026-09-25, before any Marche score existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); read those with `--group ovoli` / `--group gallinacci`.
# Evidence, second sources and weaknesses per contrast: .gavin-root/docs/species-ecology/marche.md.
# Marche local press on mushroom seasons is thin; the best-dated source is a forager blog on the
# Teramo (Abruzzo) side of the Monti della Laga (Ceppo, Valle Castellana), read here onto the Marche
# side of the same massif (Acquasanta Terme, which borders Valle Castellana, and Arquata del Tronto).
# The 2016-2017 earthquakes closed parts of the Sibillini and Laga: that thins sightings there, not
# the scores these contrasts compare.
areas:
  laga:
    comuni:
    - Acquasanta Terme
    - Arquata del Tronto
  laga_montegallo:
    comuni:
    - Acquasanta Terme
    - Arquata del Tronto
    - Montegallo
  catria_nerone:
    comuni:
    - Cagli
    - Cantiano
    - Frontone
    - Serra Sant'Abbondio
    - Apecchio
    - Piobbico
    - Acqualagna
  southern_marche:
    provinces:
    - MC
    - FM
    - AP
  marche:
    provinces:
    - '*'
normal_seasons:
- 2017
- 2018
- 2019
- 2020
- 2021
- 2022
- 2023
- 2024
- 2025
contrasts:
- id: laga_montegallo_2019_2017
  claim: 'Early September: "Ultimi quattro giorni da record per i fungaioli piceni", porcini
    exploding "soprattutto sui Monti Sibillini (zona di Montegallo in primis) e della Laga
    (Acquasanta e dintorni)" in 2019; in 2017 the Laga woods "tremendamente secco" through the summer,
    rain only in mid-September, "stagioni così devastanti" (Funghi Teramani, 2017-09-14)'
  source: https://www.cronachepicene.it/2019/09/09/funghi-raccolta-boom-nel-piceno-e-la-vendemmia-dei-porcini/147166/
  higher:
    area: laga_montegallo
    seasons:
    - 2019
    start: 09-02
    end: 09-09
  lower:
    area: laga_montegallo
    seasons:
    - 2017
    start: 09-02
    end: 09-09
