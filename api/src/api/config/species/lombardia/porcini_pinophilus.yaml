# Species rules for one key in LOMBARDIA, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Lombard and Alpine sources: what changed and why is in
# .gavin-root/docs/species-ecology/lombardia.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_pinophilus
group: porcini
taxon: Boletus pinophilus
synonyms: [Boletus pinicola]
status: draft
i18n_key: species.porcini_pinophilus
records:
  gbif_taxon_keys: [5954949]
  inat_taxon_ids: [335942]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    Only 3 GBIF and 7 iNaturalist Tuscan records (2026-09-17). "Boletus pinicola" does not match in the
    GBIF backbone (it resolves to class level), so map verbatim names to 5954949 by hand in the ingest.
    Lombardia: 16 iNaturalist records (13 located, 2026-09-26), all July to October; GBIF's 5 are copies.
notes: >-
  The most cold-tolerant porcino, and the earliest and latest to fruit. Hosts disagree between sources
  (pines only in the Netherlands, beech, fir and chestnut in Italy); the Italian view is used. In
  Lombardia Scots pine joins the hosts, and above about 1000 m the spring and autumn flushes merge into
  one summer-autumn season (lombardia.md).

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [0, 18, 30]
    reference_c: 15
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.0, 2.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, blog_prevedere_porcini, funghimagazine_giorni_pioggia]
  derived: true
  notes: >-
    POR-R3, transferred from B. edulis (the cool-climate porcino, earliest and latest in the
    year). The pace is 1 at 15 °C of topsoil, the weather the lag window was drawn from. Fruit
    bodies develop at a lower optimum than mycelium grows in culture (B. edulis 25-28 °C; Moore
    et al. 2008), hence t_opt 18 °C. A 9 °C stretch runs at about 65 % pace. Caps stop growing
    when the day's minimum humidity falls under 40 % and grow well from about 60 %
    (Kasparavičius 2001, B. edulis): open-air daily maximum VPD of 1.0 kPa keeps full pace and
    2.0 kPa halves it; the floor stands for the moister air under the canopy. No peer-reviewed
    days-per-°C figure exists for these species: every number is a prior.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: lowland_spring_autumn
          dates: ["01-05", "20-05", "10-11", "10-12"]
          elevation_weight: [null, null, 900, 1300]
        - label: alpine_summer
          dates: ["01-07", "25-07", "25-09", "25-10"]
          elevation_weight: [900, 1300, null, null]
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, muse_censimento_boletus, micoweb_pinophilus, gmb_trento_galleria_pinophilus, mushma_swissfungi_check_2026, mushma_occurrence_check_lombardia_2026, gm_cantu_como_schede_boletus, dogali2022_porcini_camonica, funghimagazine_calendario_primavera_estate, funghimagazine_calendario_autunno]
    derived: true
    data: available
    notes: >-
      POR-S4 recast for Lombardia (lombardia.md LOM-POR-S4). Tuscany had a spring window (full 20 May-30
      June) and an autumn one (full 15 September-15 November) with a summer gap. Lombard evidence has no
      gap: the 16 Lombard records run 25 July to 8 October (July 2, August 5, September 5, October 4),
      and SwissFungi records at or below 1000 m run May 11, June 9, July 10, August 12, September 15,
      October 27, November 7 (effort ratios May 1.9, then 1.0-1.3 to October, November 0.7). Above 1000
      m SwissFungi has no spring record: 22 July-2 October at 1401-1800 m (p5-p95). Lombard and Alpine
      societies: "Dalla tarda primavera ... fino ad autunno inoltrato" (Lario), "già dalla primavera e
      fino al tardo autunno" (Brescia), "quella più precoce e più tardiva" (Trento). So below 900 m one
      window, full 20 May-10 November and closed by 10 December (the hot-summer lull is left to the
      heat and drying rules, as for the gallinacci), and above 1300 m an Alpine window, full 25
      July-25 September and closed by 25 October; the handover is B. edulis's. Derived; plausible.

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        beech: 1.0
        fir_spruce: 1.0
        chestnut: 1.0
        mountain_pine: 1.0
        mixed_broadleaf_conifer: 0.6
        mediterranean_pine: 0.3
        deciduous_oak: 0.3
        transitional_woodland_shrub: 0.3
        other_conifer: 0.1
        mixed_broadleaf: 0.1
        evergreen_oak: 0.1
        macchia: 0.0
        riparian: 0.0
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, muse_censimento_boletus, museo_porcino_borgotaro, beugelsdijk2008, mushma_habitat_share_2026, iucn_pinophilus2019, gmb_trento_galleria_pinophilus, dogali2022_porcini_camonica, gm_cantu_como_ambienti2021, mushma_swissfungi_check_2026, mandolini2024_larix, mandolini2022_cembra, funghimagazine_alberi_porcini, funghimagazine_carpino_nero2026, mushma_occurrence_check_lombardia_2026, mushma_lombardia_forest_composition_2026]
    derived: true
    data: available
    notes: >-
      Lombardia (lombardia.md LOM-POR-H2): mountain pine moves up to host (1.0); other conifer and mixed
      broadleaf move down to non-host (0.1). Mountain pine here is Scots pine only (the mughete are not
      woodland on this map): "frequentemente legato al pino silvestre" (Trento), "associato
      preferibilmente al Pino silvestre" (Brescia), Scots-pine heath of the high plain with B.
      pinophilus (Lario), pines about 48 % of SwissFungi partners, "pine forests and pine plantations of all ages" (IUCN). Other conifer
      is larch and stone pine: no Boletus on their roots (Mandolini et al. 2024, 2022), larch 5 % and
      stone pine 3 % of SwissFungi partners; the two Lombard records above 1500 m keep full credit.
      Mixed broadleaf is 58 % hop-hornbeam on limestone and 30 % maple-ash (no ectomycorrhizal host),
      and a forager magazine has no record of B. pinophilus among hornbeams (Funghi Magazine, gli
      alberi dei Porcini); Lombard records' cells hold 2 % of it against 25 % of woodland (n=13). Fir and
      spruce stay host: 8 of the 13 located records are at 1000-1500 m in cells that are 65 % spruce and
      fir, and the Lario spruce wood lists B. pinophilus, although SwissFungi puts spruce and fir at only
      22 % of partners. Tuscany's POR-H2 follows.
      POR-H2. Four levels (2026-09-24, mushma_habitat_share_2026): beech, fir and chestnut are the
      Italian-source hosts ("mainly with beech, fir and chestnut", preferred over the Dutch phylogeny
      paper's pine-only claim for this Tuscan file) -> host. Mixed broadleaf+conifer (a beech-fir mix,
      both hosts, capped below host for dilution) and mountain pine (often Pinus sylvestris, "moderate")
      stay secondary. Other conifer, Mediterranean pine, deciduous oak, mixed broadleaf and transitional
      woodland/shrub are marginal: "many pines" and "also broadleaves" are named only generically, and the
      mixed/transitional classes are diluted by design. Evergreen oak, macchia, riparian and exotic
      broadleaf are non-host: this cool/humid taxon has no source support there. Saturated to full credit
      from a host-weighted share of 0.30.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [200, 500, 1700, 2100]}
    confidence: plausible
    source:
      [borgotaro_igp_rt, muse_censimento_boletus, mushma_occurrence_check_lombardia_2026, mushma_swissfungi_check_2026, mushma_lombardia_forest_elevation_2026, gm_cantu_como_ambienti2021, funghimagazine_calendario_primavera_estate]
    derived: true
    data: available
    notes: >-
      POR-A2 moved onto the Lombard belts (lombardia.md LOM-POR-A2; Tuscany 300 -> 800 ... 1600 -> 1900).
      Cool, humid mountain sites; the summer form also in low chestnut and Scots pine. Lombard located
      records (n=13): p5 448 m, p10 572 m, median 1351 m, p90 1636 m, max 1683 m. SwissFungi (n=128): p95
      1700 m, p99 1995 m, max 2025 m. The spring form fruits at 500-900 m in chestnut and beech in the
      North (Funghi Magazine), and the Scots-pine heaths of the high plain (Lario society) lie at 285-437 m
      (p5-p95). Zero at 200 m, full from 500 m to 1700 m, zero at 2100 m.

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: plausible
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-R1 + POR-R2, transferred from B. edulis.

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: plausible
    source: [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1, transferred from B. edulis and community studies.
      Tuned (2026-09-22): the absolute 20->80 mm ramp was full in an ordinary September, so the 30
      days are scored as a percentage of the cell's own normal for those days (2016-2025 reanalysis,
      downscaled and rain-scaled like the rain): 0 at 50 %, full from 125 %. It raised the porcini
      train objective by 0.03 with or without the rain scale, and the hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [4, 8, 15, 20]}
    confidence: plausible
    source: [muse_censimento_boletus, matteucci2008_micoponte, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: POR-T2. The coolest band, from "copes better with cool climates". Low confidence within plausible.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d; compare in the backtest.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.5
    confidence: plausible
    source: [salerni2023_amiata, andrew2025]
    derived: true
    data: derived
    notes: POR-X1, as for B. edulis.

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.2
    confidence: folklore
    source: [borgotaro_igp_rt, brejon_hoffman2026_preprint, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X3.

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: folklore
    source: [borgotaro_igp_rt, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 4, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-X6. All numbers are guesses.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [null, null, 105, 125]}
    floor: 0.8
    where: {attribute: elevation_m, trapezoid: [null, null, 900, 1100]}
    confidence: folklore
    source: [rt_tipi_forestali_p4, bmeteo_pioggia_funghi, bonet2008, mumcu_kucuker2019]
    derived: true
    data: derived
    notes: >-
      POR-A5. Below 1000 m, north-facing slopes keep moisture in hot spells and hold the
      conifer hosts (N x1.0, E/W x0.9, S x0.8), but flat, east- and west-facing ground is
      normal for Tuscan woodland and scores full credit: only clearly sunny slopes lose it.
      On 15 Oct the cell's sun ratio (its clear-sky sun as a % of flat ground's) runs p10 89
      %, p25 95 %, median 100 %, p75 105 %, p90 111 % (2026-09-24): x1 up to 105 %, about the
      p90, x0.8 from 125 %, fading out between 900 and 1100 m. North aspect raised production
      in dry Pyrenean pine (Bonet 2008), while a humid Turkish forest found north slopes
      worst for B. edulis (Mumcu Küçüker 2019): the preference is kept to low altitude, where
      water limits fruiting. Read on the day's sun ratio, the cell's sun as a percentage of
      flat ground's (api.model.terrain), so it bites hardest in autumn, when the sun is low.
      The terrain microclimate already makes sunny slopes warmer and drier for every rule;
      this line is the species' own preference on top of that, kept soft.
      Kept for Lombardia (lombardia.md). On the Lombard woodland grid the 15 October sun ratio runs p10
      71 %, p25 86 %, median 100 %, p75 112 %, p90 122 % (below 1000 m p10 76 %, p90 119 %; Tuscany p10 89
      %, p90 111 %). The steeper Lombard slopes put more cells on the ramp; the rule reads each cell's
      own sun, so that is the species' preference acting where the terrain is extreme, not a Tuscan
      percentile to re-anchor.

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 35, 46]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby
      1979), but a 1 km cell's mean slope is not the slope of the exact spot the mushrooms
      grow on: normal terrain for Tuscan woodland scores full credit, and only clearly
      steep cells lose it. Woodland cells on the Tuscan grid run p10 10.2°, p25 12.6°, median
      16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up to 25°, about the p90, x0.8 from 40°.
      Mushroom production fell with slope in Pyrenean Scots pine (Bonet 2008), and B. edulis
      yield was highest under about 11° on plots in north-east Turkey (Mumcu Küçüker 2019);
      two Spanish studies found no slope effect (Martínez-Peña 2012, Taye 2016). It acts on
      the score only, never on the rain, so the same water is not counted twice.
      Lombardia (lombardia.md): the band moves onto the Lombard grid by the same rule, normal terrain
      at full credit. Woodland cells there (2026-09-26) run p10 15.6°, p25 22.2°, median 27.5°, p75
      31.7°, p90 35.1°, max 46.4°, 63 % of them steeper than 25°: x1 up to 35°, about the p90, x0.8
      from 46°, about the maximum. The Tuscan band would have docked 63 % of Lombard woodland cells
      (mean x0.95); this one docks 10 % (mean x0.995).

known_gaps:
  - id: wood_edge
    description: POR-H5. Shrub, meadow and pasture within 100 m of a qualifying wood is productive.
    needs: [M2 grid, a woodland edge buffer when building habitat fractions]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014]
  - id: soil
    description: POR-N1. "Poor, acid, sandy soil" in Dutch sampling.
    needs: [soil_ph, soil_texture]
    confidence: plausible
    source: [beugelsdijk2008]
