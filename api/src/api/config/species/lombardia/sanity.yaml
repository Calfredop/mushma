- id: valcamonica_2023_2025_2024
  claim: 'Val Camonica, early August: 2023 "E'' tempo di funghi in Valle Camonica, Valtellina e Orobie ed è
    un''annata record ... la raccolta è già da record" (Gazzetta delle Valli, 2023-08-18) and 2025 "È
    fungo-mania in Vallecamonica: da qualche settimana i preziosi frutti del sottobosco stanno crescendo
    copiosi" (Giornale di Brescia, 2025-08-01); in 2024 "I cercatori hanno ancora i cestini vuoti ... la metà
    del mese di agosto, generalmente, è uno dei periodi migliori" (Giornale di Brescia, 2024-08-12)'
  source: https://www.giornaledibrescia.it/cronaca/fa-ancora-troppo-caldo-per-andare-a-funghi-i4d6ldtt
