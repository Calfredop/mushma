# Press-contrast sanity check for Lombardia (api.model.sanity).
# Areas by comuni (ISTAT names, 2025); windows and source URLs written down on 2026-09-26, before any
# Lombardia score existed. `seasons: normal` expands to `normal_seasons`; the two ovoli contrasts list
# their normal years by hand instead, leaving out the years the sources call unusual for ovoli.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); read those with `--group ovoli` / `--group gallinacci`.
# Evidence, second sources and weaknesses per contrast: .gavin-root/docs/species-ecology/lombardia.md.
# Every main source was opened and its quote checked; outlets whose robots.txt blocks AI agents (Il
# Giorno, La Provincia Pavese, the Citynews sites, Bresciaoggi, Corriere, ANSA) were not read.
