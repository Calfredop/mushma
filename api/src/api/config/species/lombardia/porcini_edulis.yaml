# Species rules for one key in LOMBARDIA, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Lombard and Alpine sources: what changed and why is in
# .gavin-root/docs/species-ecology/lombardia.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_edulis
group: porcini
taxon: Boletus edulis
synonyms: [Boletus edulis s.s., Boletus quercicola, Boletus betulicola]
status: draft
i18n_key: species.porcini_edulis
records:
  gbif_taxon_keys: [5954958]
  inat_taxon_ids: [48701]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    Lombardia: 170 iNaturalist records (place 10870, verifiable, 2026-09-26), 110 with a usable
    location, 70 % of them at 1000 m or higher; GBIF's 73 are mostly the same records. The best-recorded
    porcino of the region, but still few per season: validate the porcini group score.
notes: >-
  The only porcini taxon with direct weather-fruiting studies (Amiata, Germany, Spain).
  The shared rain logic below is borrowed by the other three porcini keys. In Lombardia this is the
  porcino of the Alpine spruce belt as well as of the lake-slope chestnut and the Prealpine beech:
  the season is split by elevation, the band reaches the tree line and larch is not a host.

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [0, 18, 30]
    reference_c: 15
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.0, 2.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, blog_prevedere_porcini, funghimagazine_giorni_pioggia, salerni2023_amiata, brejon_hoffman2026_preprint]
  derived: true
  notes: >-
    POR-R3. The pace is 1 at 15 °C of topsoil, the weather the lag window was drawn from. Fruit
    bodies develop at a lower optimum than mycelium grows in culture (B. edulis 25-28 °C; Moore
    et al. 2008), hence t_opt 18 °C. A 9 °C stretch runs at about 65 % pace and stretches a
    12-day lag to about 18 days, in line with the lore (about 0.6 days per °C; the lag grows by
    about 3 days when the 10 days after the rain average under 10 °C; longer in cool high beech
    than in chestnut at 600-700 m). Caps stop growing when the day's minimum humidity falls
    under 40 % and grow well from about 60 % (Kasparavičius 2001, B. edulis): open-air daily
    maximum VPD of 1.0 kPa keeps full pace and 2.0 kPa halves it; the floor stands for the
    moister air under the canopy. No peer-reviewed days-per-°C figure exists for these species:
    every number is a prior.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: lowland_autumn
          dates: ["01-07", "15-08", "31-10", "05-12"]
          elevation_weight: [null, null, 900, 1300]
        - label: alpine_summer
          dates: ["01-07", "01-08", "25-09", "25-10"]
          elevation_weight: [900, 1300, null, null]
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, salerni2023_amiata, mushma_occurrence_check_2026, mushma_occurrence_check_lombardia_2026, swissfungi_wsl, mushma_swissfungi_check_2026, waldwissen_swissfungi2018, funghimagazine_calendario_autunno, lomb_habitat_manual2018, buntgen2013_gcb]
    derived: true
    data: available
    notes: >-
      POR-S3, split by elevation for Lombardia (lombardia.md LOM-POR-S3). The Tuscan window (full
      1 September to 15 November) would keep Alpine cells in season into December, held only by frost
      and snow. Lombard located records (n=110) by elevation: at 1300 m and above (n=50) July 1, August
      21, September 19, October 9 (none after 31 October), median date about 30 August at 1500 m and
      above; at 1000-1300 m the same August-September shape; at 600-1000 m a September peak; below 600 m
      12 August to 28 November, October the busiest month. SwissFungi (n=3,396) agrees: at 1401-1800 m p5
      25 July, median 27 August, p95 6 October; below 600 m p5 1 July, median 8 September, p95 2
      November. Forager bulletins: the Alpine spruce season starts in early August and "prime nevicate /
      gelate" end it in October, while chestnut and beech at 500-1300 m fruit on. So the Alpine window
      is full 1 August-25 September and closed by 25 October (October records at altitude, 18 %, are
      more than the Swiss 10 %, hence a later close than Piemonte's 20 October); the lowland window is
      full from 15 August (as in Emilia-Romagna) to 31 October and closed by 5 December (November 0.2x
      the effort region-wide). The handover at 900-1300 m sits where the Lombard montane belt starts
      (high beech woods with conifers "in genere oltre i 1100 m") and where the records switch to the
      August-September shape. Derived from records and belts: a prior.

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        beech: 1.0
        chestnut: 1.0
        fir_spruce: 1.0
        mixed_broadleaf_conifer: 0.6
        mountain_pine: 0.6
        deciduous_oak: 0.3
        mixed_broadleaf: 0.3
        transitional_woodland_shrub: 0.3
        other_conifer: 0.1
        evergreen_oak: 0.1
        mediterranean_pine: 0.1
        macchia: 0.0
        riparian: 0.0
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, salerni2023_amiata, matteucci2008_micoponte, museo_porcino_borgotaro, gm_siena_boletus, beugelsdijk2008, mushma_habitat_share_2026, mandolini2024_larix, mandolini2022_cembra, gm_cantu_como_ambienti2021, funghimagazine_laricino, funghimagazine_edulis, mushma_swissfungi_check_2026, mushma_occurrence_check_lombardia_2026, mushma_lombardia_forest_composition_2026, taniguchi2007_robinia]
    derived: true
    data: available
    notes: >-
      Lombardia (lombardia.md LOM-POR-H1): other conifer moves from marginal (0.3) to non-host (0.1).
      On the Lombard forest map this class is only larch and stone pine (lariceti 89 %,
      larici-cembreti 11 %; no Douglas fir, which went to the plantations), and larch is not a porcini
      host: larch roots at 1760-1910 m in South Tyrol held 68 ectomycorrhizal taxa and no Boletus,
      stone pine at 2000-2100 m 20 and none (Mandolini et al. 2024, 2022); larch is the partner in 2 %
      of SwissFungi B. edulis records; the Lario society lists only Suillus grevillei for the larch
      wood; "Non micorriza il Larice" and porcini among larches only "a patto che nelle immediate
      vicinanze ci siano uno o più Abeti rossi o Abeti bianchi" (Funghi Magazine). Lombard records at
      1500 m and above (n=28) sit in cells whose woods are 66 % spruce and fir and 30 % larch, against
      40 % and 48 % over all woodland there. At 0.1 a pure larch cell gets a third of full credit and
      a larch cell with a quarter of spruce gets full credit; 27 of the 28 high records keep full credit
      (all 28 at 0.3), while 30 % of woodland cells above 1500 m lose it. Everything else is Tuscany's,
      checked on Lombard evidence: fir/spruce host (records' cells at 1000-1500 m are 52 % spruce and
      fir against 26 % of woodland), chestnut and beech hosts (Lario society lists; below 1000 m the
      records' cells are 31 % chestnut and 18 % beech against 25 % and 9 %), mixed broadleaf marginal
      (here 58 % hop-hornbeam, 30 % maple-ash, 11 % birch-hazel; 24 % of the records' cells below 1000
      m against 32 % of woodland), robinia non-host. Tuscany's POR-H1 follows.
      POR-H1. Four levels (2026-09-24, mushma_habitat_share_2026): beech, chestnut and fir/spruce are the
      preferred hosts named directly ("chestnut, beech and Norway spruce preferred") -> host. Mixed
      broadleaf+conifer (mostly a beech-fir mix, both hosts) and mountain pine (IGP-eligible black/Scots
      pine, "moderate") stay secondary: the mixed class is capped below host for dilution, not for weak
      evidence. Deciduous oak, mixed broadleaf (hornbeam/hazel eligible) and other conifer (Douglas fir
      eligible) are marginal: each is a class where only some of the trees are hosts. Transitional
      woodland/shrub is marginal for the same dilution reason. Evergreen oak, Mediterranean pine, macchia,
      riparian and exotic broadleaf (robinia) are non-host: none are named for this taxon. Saturated to full
      credit from a host-weighted share of 0.30 (`_habitat`'s response trapezoid), so a cell that is 30%
      beech/chestnut/fir is no longer diluted by the rest of the woods.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [100, 400, 1800, 2200]}
    confidence: plausible
    source:
      [matteucci2008_micoponte, muse_censimento_boletus, mushma_occurrence_check_lombardia_2026, mushma_swissfungi_check_2026, treindl_leuchtmann2019, ersaf_specie_forestali2019, mushma_lombardia_forest_elevation_2026, lomb_masseroli2016_treeline, gm_cantu_como_schede_boletus, funghimagazine_calendario_autunno]
    derived: true
    data: available
    notes: >-
      POR-A1 moved onto the Lombard belts (lombardia.md LOM-POR-A1; Tuscany 200 -> 700 ... 1600 ->
      1900). Lombard located records (n=110): p5 347 m, p10 480 m, median 1266 m, p75 1504 m, p90
      1705 m, p95 1827 m, max 2157 m; 8 at 1800 m or higher, 15 below 600 m in the lake-slope and
      moraine chestnut woods ("dalla pianura alla montagna", Lario society). SwissFungi: p95 1700 m,
      p99 1858 m, records at 2140 m (Castasegna, on the Valchiavenna border) and 2210 m, and B. edulis
      "rarely found above tree line" (Treindl & Leuchtmann 2019). The woods reach the tree line:
      Lombard spruce to about 1960 m (p95), larch to 2050 m, larch-stone pine to 2230 m; the Upper
      Valtellina tree line lies at 2300-2440 m. So zero at 100 m (the Po plain's robinia and riparian
      woods), full from 400 m to 1800 m, zero at 2200 m.

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: strong
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia, bmeteo_pioggia_funghi]
    derived: true
    data: available
    notes: >-
      POR-R1 + POR-R2. Amiata B. edulis counts correlate with >=20 mm rain days, peaking 12 days
      later (r about 0.6). Lag shape and the 10->30 mm ramp are derived (30 mm = the PRD hypothesis and
      the low end of forager lore). Strong for the lag; the amount ramp is plausible.

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: strong
    source:
      [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, salerni2023_amiata, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1. 30-day rain drives fruiting in Tuscan oak woods (community) and a 26-day window at
      2-4 mm/day fits B. edulis in German beech. The effect is strong; the 20->80 mm ramp is derived.
      Tuned (2026-09-22): the absolute 20->80 mm ramp was full in an ordinary September, so the 30
      days are scored as a percentage of the cell's own normal for those days (2016-2025 reanalysis,
      downscaled and rain-scaled like the rain): 0 at 50 %, full from 125 %. It raised the porcini
      train objective by 0.03 with or without the rain scale, and the hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [6, 10, 17, 22]}
    confidence: plausible
    source: [brejon_hoffman2026_preprint, salerni2023_amiata]
    derived: true
    data: available
    notes: >-
      POR-T1. German optimum about 13 °C over 20 days (preprint); the upper shoulder is widened because
      Amiata fruited in an 18.6 °C summer. Needs lapse-rate-corrected temperature per cell.

  - id: soil_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.soil_temperature
    input: {variable: soil_temperature_0_to_7cm_mean, aggregate: mean, window_days: 10}
    response: {trapezoid: [6, 10, 17, 22]}
    confidence: folklore
    source: [brejon_hoffman2026_preprint, bmeteo_pioggia_funghi]
    derived: true
    data: available
    enabled: false
    notes: POR-T5. Alternative to air_temperature, never both. No porcini soil-temperature threshold found in a primary source.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014, martinez_de_aragon2007, agreda2016]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d (P - ET0 instead of P); compare both in the backtest.

  - id: soil_moisture
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.soil_moisture
    input: {variable: soil_moisture_7_to_28cm_mean, aggregate: percentile_of_normal, window_days: 7}
    response: {trapezoid: [10, 40, null, null]}
    confidence: plausible
    source: [karavani2018, garcia_bustamante2021]
    derived: true
    data: derived
    enabled: false
    notes: >-
      POR-M2. Same-month soil moisture limits yield (Mediterranean pine, community). Percentile against
      the cell's calendar-month climatology, because model soil moisture is not comparable with field
      thresholds. Needs the backfill climatology.

  - id: early_season_wetness
    role: stopper
    kind: window_aggregate
    i18n_key: factor.early_season_wetness
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 60}
    response: {trapezoid: [50, 100, null, null]}
    floor: 0.6
    confidence: plausible
    source: [alday2017, taye2016, parlade2017, garcia_bustamante2021, salerni2002_oak]
    derived: true
    data: derived
    enabled: false
    notes: >-
      POR-M4. 60-day rain as % of the cell's climatology: x0.6 at <=50 %, x1 at >=100 %. Autumn only in
      the source reading; Soria found no effect of previous-summer rain, so it stays a weak multiplier.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.5
    confidence: plausible
    source: [salerni2023_amiata, karavani2018, andrew2025]
    derived: true
    data: derived
    notes: >-
      POR-X1. Tmax spikes about 8 °C above the period mean correlated negatively with fruit bodies for
      up to about 3 weeks at Amiata. The multiplier is derived.

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.2
    confidence: folklore
    source: [borgotaro_igp_rt, brejon_hoffman2026_preprint, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X3. Two or more frosty nights in a week -> x0.2. Thresholds derived.

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4. "Alla prima neve" ends the season. >=1 cm of snow in 3 days -> 0.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 4, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: >-
      POR-X6. Forager lore: drying wind (tramontana, grecale) after rain wastes the trigger. No source
      gives numbers; ET0 stands in for wind + dry air + sun. Every number is a guess to tune.

  - id: drought_45d
    role: stopper
    kind: window_aggregate
    i18n_key: factor.drought
    input: {variable: precipitation_sum, aggregate: sum, window_days: 45}
    response: {trapezoid: [10, 15, null, null]}
    confidence: plausible
    source: [brejon_hoffman2026_preprint, agreda2015, salerni2002_oak]
    derived: true
    data: available
    enabled: false
    notes: POR-X2. Mostly subsumed by rain_30d (0 at <=20 mm in 30 days); kept for the backtest to compare.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [null, null, 105, 125]}
    floor: 0.8
    where: {attribute: elevation_m, trapezoid: [null, null, 900, 1100]}
    confidence: folklore
    source: [rt_tipi_forestali_p4, bmeteo_pioggia_funghi, bonet2008, mumcu_kucuker2019]
    derived: true
    data: derived
    notes: >-
      POR-A5. Below 1000 m, north-facing slopes keep moisture in hot spells and hold the
      conifer hosts (N x1.0, E/W x0.9, S x0.8), but flat, east- and west-facing ground is
      normal for Tuscan woodland and scores full credit: only clearly sunny slopes lose it.
      On 15 Oct the cell's sun ratio (its clear-sky sun as a % of flat ground's) runs p10 89
      %, p25 95 %, median 100 %, p75 105 %, p90 111 % (2026-09-24): x1 up to 105 %, about the
      p90, x0.8 from 125 %, fading out between 900 and 1100 m. North aspect raised production
      in dry Pyrenean pine (Bonet 2008), while a humid Turkish forest found north slopes
      worst for B. edulis (Mumcu Küçüker 2019): the preference is kept to low altitude, where
      water limits fruiting. Read on the day's sun ratio, the cell's sun as a percentage of
      flat ground's (api.model.terrain), so it bites hardest in autumn, when the sun is low.
      The terrain microclimate already makes sunny slopes warmer and drier for every rule;
      this line is the species' own preference on top of that, kept soft.
      Kept for Lombardia (lombardia.md). On the Lombard woodland grid the 15 October sun ratio runs p10
      71 %, p25 86 %, median 100 %, p75 112 %, p90 122 % (below 1000 m p10 76 %, p90 119 %; Tuscany p10 89
      %, p90 111 %). The steeper Lombard slopes put more cells on the ramp; the rule reads each cell's
      own sun, so that is the species' preference acting where the terrain is extreme, not a Tuscan
      percentile to re-anchor.

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 35, 46]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby
      1979), but a 1 km cell's mean slope is not the slope of the exact spot the mushrooms
      grow on: normal terrain for Tuscan woodland scores full credit, and only clearly
      steep cells lose it. Woodland cells on the Tuscan grid run p10 10.2°, p25 12.6°, median
      16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up to 25°, about the p90, x0.8 from 40°.
      Mushroom production fell with slope in Pyrenean Scots pine (Bonet 2008), and B. edulis
      yield was highest under about 11° on plots in north-east Turkey (Mumcu Küçüker 2019);
      two Spanish studies found no slope effect (Martínez-Peña 2012, Taye 2016). It acts on
      the score only, never on the rain, so the same water is not counted twice.
      Lombardia (lombardia.md): the band moves onto the Lombard grid by the same rule, normal terrain
      at full credit. Woodland cells there (2026-09-26) run p10 15.6°, p25 22.2°, median 27.5°, p75
      31.7°, p90 35.1°, max 46.4°, 63 % of them steeper than 25°: x1 up to 35°, about the p90, x0.8
      from 46°, about the maximum. The Tuscan band would have docked 63 % of Lombard woodland cells
      (mean x0.95); this one docks 10 % (mean x0.995).

known_gaps:
  - id: temperature_drop
    description: >-
      POR-T6. A >=3 °C drop in 7-day mean Tmax, 3-15 days before, helps trigger fruiting (x1.1 bonus).
      Bonuses above 1 and change-over-time inputs are not in schema v1.
    needs: [a change-detection factor kind]
    confidence: folklore
    source: [bmeteo_pioggia_funghi, karavani2018]
  - id: wood_edge
    description: POR-H5. Shrub, meadow and pasture within 100 m of a qualifying wood is productive (IGP rule).
    needs: [M2 grid, a woodland edge buffer when building habitat fractions]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014]
  - id: stand_and_soil
    description: >-
      POR-N1. Stand age (30- vs 60-year fir), basal area, thinning, litter removal and soil texture/pH
      change B. edulis yield.
    needs: [stand_age, canopy_cover, litter_depth, soil_texture, soil_ph]
    confidence: strong
    source: [salerni_perini2004, salerni2023_amiata, parlade2017, bonet2010, martinez_pena2012, beugelsdijk2008]
