# Species rules for one key in CALABRIA, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Calabria sources: .gavin-root/docs/species-ecology/calabria.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_aereus
group: porcini
taxon: Boletus aereus
synonyms: []
status: draft
i18n_key: species.porcini_aereus
records:
  gbif_taxon_keys: [8733688]
  inat_taxon_ids: [333772]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    The best-sampled porcini taxon in Tuscany (61 iNaturalist records, 2026-09-17), but often confused
    with B. reticulatus in the field. Calabria: only 7 iNaturalist records (August 2, September 1,
    October 3, November 1; the 4 GBIF records are copies of them), 3 located at 253-828 m (2026-09-28).
    Validate the porcini group score.
notes: >-
  The most xerothermophilous porcino. Calabria: the porcino of the oak woods, "sillu e cerza", "diffuso
  sotto castagne (Castanea) e quercia (Quercus)" (Lavorato 1996), "da maggio a dicembre, diffuso in
  maggioranza sotto quercia, specialmente nelle zone submontane della Presila, ma anche sotto castagno,
  leccio e altre latifoglie di tutta la Calabria" (the Acri museum card, ISPRA MLG 184/2018). It is the
  commonest species of the Turkey oak records and 5.4 % of the cork oak ones (ISPRA MLG 180/2018).
  Changed for Calabria: the windows open in mid-May and the lowland one ends in January, the altitude
  band climbs with the oak and chestnut belt, the Aspromonte's low beech moves up and three classes
  that hold no host here (lentisk and Cytisus macchia, Aleppo pine, Alnus cordata) move down. No
  quantitative weather study exists for this taxon: the rain logic is borrowed from B. edulis, and
  temperature and frost rules are shifted using qualitative sources; the Calabrian lore (about 15 days
  after the last useful rain, Bosco & Grande 2004; 30-40 mm, growth hard above 29-30 °C, 3bmeteo)
  agrees with them.

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [2, 21, 32]
    reference_c: 17
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.5, 3.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, bmeteo_funghi_luglio, funghimagazine_giorni_pioggia]
  derived: true
  notes: >-
    POR-R3 for the thermophilic porcino. The pace is 1 at 17 °C of topsoil, the weather the lag
    window was drawn from. Fruit bodies develop at a lower optimum than mycelium grows in
    culture (B. edulis 25-28 °C; Moore et al. 2008), hence t_opt 21 °C. Thermophilic porcini
    appear 8-11 days after warm summer storms (lore); a 12 °C stretch runs at about 65 % pace.
    Caps stop growing when the day's minimum humidity falls under 40 % and grow well from about
    60 % (Kasparavičius 2001, B. edulis): open-air daily maximum VPD of 1.5 kPa keeps full pace
    and 3.0 kPa halves it; the floor stands for the moister air under the canopy. No peer-
    reviewed days-per-°C figure exists for these species: every number is a prior. The humidity
    ramp is set higher than for the autumn porcini because it fruits from summer, when open-air
    VPD is 2 kPa on a median July day.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: upland_summer
          dates: ["15-05", "01-07", "31-10", "30-11"]
          elevation_weight: [600, 800, null, null]
        - label: lowland_long
          dates: ["15-05", "15-06", "30-11", "10-01"]
          elevation_weight: [null, null, 600, 800]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, gm_siena_boletus, museo_porcino_borgotaro, mushma_occurrence_check_2026, ispra2018_mlg184_acri_vol1, funghimagazine_giugno2019, funghimagazine_calendario_primavera2019, informacalabria_porcini2025, lavorato_rotella1995_mappatura_cosenza, funghimagazine_nascite_2025_11_08, bmeteo_boletus_aereus, grande_funghi_silagreca, mushma_calabria_forest_composition_2026, mushma_occurrence_check_calabria_2026]
    derived: true
    data: available
    notes: >-
      POR-S2, split by elevation to resolve a disagreement. The IGP (Apennine uplands) says July–September;
      Lucca and Siena sources and the records put the lowland peak in autumn. Central-Italy iNaturalist
      records: 0-300 m peak Sep–Nov, 300-600 m peak October, 600-900 m peak September; no July records
      at all (n=77, about 3 expected from observer effort), so the upland window reaches full only on
      1 August instead of the IGP's July. The 400-600 m handover is derived. Calabria: both windows open
      on 15 May, the lowland one is full from 15 June and ends on 10 January, the upland one is full
      from 1 July to 31 October and ends on 30 November, and the handover moves up to 600-800 m, as in
      Campania. The Acri museum card gives "da maggio a dicembre ... specialmente nelle zone
      submontane della Presila" (ISPRA MLG 184/2018, plausible); in the South the first aereus come in
      June, "dapprima al piano, poi anche in collina ed infine in piena estate anche in montagna", and
      "Tra Puglia, Basilicata, Calabria e Sicilia le prime nascite di Porcini aereus" were reported by
      mid-June 2019; in the Sila Piccola "i porcini estivi e neri ... possono fruttificare anche a
      partire da maggio in zone particolarmente esposte" (InformaCalabria 2025); a dated record at 850
      m on 30 July 1994 (Lavorato & Rotella 1995). In November 2025 "Al Sud ... la stagione prosegue.
      Continuano le nascite di Porcini, soprattutto Boletus aereus"; in mild macchia of the South they
      go on "addirittura in pieno periodo natalizio" in holm and cork oak (3bmeteo); "in piena atmosfera
      natalizia capita di imbattersi in un bel porcino" (Sila Greca society). All folklore except the
      museum card. The 600-800 m handover sits where Calabria's hosts do: chestnut median 816 m, Turkey
      oak 834 m, Hungarian oak 724 m. The summer heat and drought, not the calendar, keep the lowland
      window empty in July and August: the air temperature band and the heat and drying stoppers do it.

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        deciduous_oak: 1.0
        chestnut: 1.0
        evergreen_oak: 1.0
        macchia: 0.3
        transitional_woodland_shrub: 0.3
        mixed_broadleaf_conifer: 0.3
        beech: 0.3
        mediterranean_pine: 0.1
        mixed_broadleaf: 0.1
        other_conifer: 0.0
        mountain_pine: 0.0
        fir_spruce: 0.0
        riparian: 0.0
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, museo_porcino_borgotaro, gm_siena_boletus, sardegna_foreste_aereus, beugelsdijk2008, oria_de_rueda2008, mushma_habitat_share_2026, ispra2018_mlg180_calabria_foreste, ispra2018_mlg179_calabria_rimboschimenti, ispra2018_mlg184_acri_vol1, lavorato1996_boletaceae_calabria, grande_funghi_silagreca, iacoi2003_macchia_rossano, lavorato1991_micoflora_cisto, funghimagazine_calendario_primavera2019, mushma_calabria_forest_composition_2026]
    derived: true
    data: available
    notes: >-
      Calabria (2026-09-28, Carta della Natura habitat map and the ISPRA MLG 180/179 record shares,
      the per-habitat frequencies of about 45,000 records of the Calabrian mycological groups). The
      three hosts stay: B. aereus is 3.1 % of the Turkey oak records ("la specie micologica più
      frequente"), 2.6 % of the Hungarian oak, 2.4 % of the downy oak, 5.4 % of the cork oak, 1.1 % of
      the holm oak and 0.8 % of the chestnut records. `macchia` (9.8 % of the mapped woods and scrub)
      moves from host 1.0 to marginal 0.3: 63 % of Calabria's macchia is lentisk and Cytisus scrub,
      neither an ectomycorrhizal host, and only the evergreen-oak matorral and the Erica-Arbutus macchia
      (a third) are; on the Rossano macchia belt porcini grow "sotto castagno, quercia, lecci", not
      under the shrubs (Iacoi 2003), and the Cistus record in Lavorato's key is from the Circeo, not
      Calabria. `transitional_woodland_shrub` (8.1 %; Spartium, broom, bramble) moves from secondary
      0.6 to marginal 0.3. `mediterranean_pine` (2.0 %; 82 % Aleppo pine of the Ionian coast) moves
      from secondary 0.6 to non-host 0.1: none of the 20 natural or 802 planted Aleppo pine records is
      this taxon, and it "non può vegetare né con i pini né con i larici ma solo sotto latifoglie"
      (Sila Greca society). `mixed_broadleaf` (86 % Alnus cordata) moves from marginal 0.3 to non-host
      0.1. `beech` moves from 0.1 to marginal 0.3: 0.8 % of the Aspromonte beech records, as high as
      the chestnut (Sila 0.1 %, Pollino none), and "Solo ad estate inoltrata ... Faggio, quasi
      esclusivamente al Sud" (Funghi Magazine, folklore); the altitude band keeps it to the lowest
      beech. Otherwise Tuscany's POR-H4: Four levels (2026-09-24, mushma_habitat_share_2026): oak,
      chestnut and holm oak are named hosts. Mixed broadleaf+conifer is marginal: its conifer component
      is not this taxon's host. Other conifer, mountain pine, fir/spruce, riparian and exotic broadleaf
      are non-host: cool or wet ground this warm, dry taxon avoids (no Calabrian record under laricio).
      Saturated to full credit from a host-weighted share of 0.30.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [null, null, 1000, 1350]}
    confidence: plausible
    source: [matteucci2008_micoponte, muse_censimento_boletus, museo_porcino_borgotaro, arrigoni_viciani_castagneti, mushma_occurrence_check_2026, ispra2018_mlg184_acri_vol1, lavorato_rotella2004_pini_sila_greca, lavorato_rotella1995_mappatura_cosenza, ispra2018_mlg180_calabria_foreste, calabria_pfr2024, mushma_calabria_forest_composition_2026, mushma_occurrence_check_calabria_2026]
    derived: true
    data: available
    notes: >-
      POR-A4. Coast to mid-hill; sunny mid-mountain chestnut is the upper limit. Tuscan iNaturalist records:
      median 352 m, p90 629 m, max 789 m (n=50). Calabria: full credit now runs to 1,000 m (Tuscany 800
      m) and reaches 0 at 1,350 m (1,250 m). The hosts sit 150-250 m higher than in Tuscany and
      Campania: in the Sila Greca "la fascia del castagno e delle querce tra i 600 ed i 1100 metri"
      (Lavorato & Rotella 2004), on the habitat map chestnut median 816 m and p90 1,087 m, Turkey oak
      834 m and 1,099 m (Campania's chestnut median 658 m). The Acri card places it "specialmente nelle
      zone submontane della Presila", a dated record sits at 850 m, and it is 0.8 % of the Aspromonte
      beech records (ISPRA MLG 180/2018), a beech that comes down to 900-1,000 m and locally 600-700 m
      (Programma Forestale Regionale 2024). Plausible but weak: the
      3 located Calabria records are at 253-828 m.

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: plausible
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-R1 + POR-R2, transferred from B. edulis.

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: plausible
    source: [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1, transferred from B. edulis and community studies.
      Tuned (2026-09-22): the absolute 20->80 mm ramp was full in an ordinary September, so the 30
      days are scored as a percentage of the cell's own normal for those days (2016-2025 reanalysis,
      downscaled and rain-scaled like the rain): 0 at 50 %, full from 125 %. It raised the porcini
      train objective by 0.03 with or without the rain scale, and the hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [10, 14, 22, 26]}
    confidence: plausible
    source: [borgotaro_igp_rt, beugelsdijk2008, matteucci2008_micoponte, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: >-
      POR-T4. The warmest band: "la specie più xerotermofila". Low confidence within plausible.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d; compare in the backtest.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.75
    confidence: plausible
    source: [salerni2023_amiata, andrew2025]
    derived: true
    data: derived
    notes: POR-X1. Milder than for B. edulis (x0.75).

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.4
    confidence: folklore
    source: [funghimagazine_fino_quando, muse_censimento_boletus]
    derived: true
    data: available
    notes: POR-X3. Hardier in mild winters without constant frost (x0.4). NE Italy records run to early December.

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: folklore
    source: [borgotaro_igp_rt, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 5, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-X6. ET0 threshold 5 mm/day for a low-altitude summer taxon. All numbers are guesses.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [80, 95, null, null]}
    floor: 0.9
    confidence: folklore
    source: [matteucci2008_micoponte]
    derived: true
    data: derived
    notes: >-
      POR-A6. Tolerates or prefers sunny exposures (S x1.0, E/W x1.0, N x0.9): x0.9 at 80 % of
      flat ground's sun or less, x1 from 95 %. Read on the day's sun ratio, the cell's sun as
      a percentage of flat ground's (api.model.terrain), so it bites hardest in autumn, when
      the sun is low. The terrain microclimate already makes sunny slopes warmer and drier for
      every rule; this line is the species' own preference on top of that, kept soft.

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 25, 40]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby
      1979), but a 1 km cell's mean slope is not the slope of the exact spot the mushrooms
      grow on: normal terrain for Tuscan woodland scores full credit, and only clearly
      steep cells lose it. Woodland cells on the Tuscan grid run p10 10.2°, p25 12.6°, median
      16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up to 25°, about the p90, x0.8 from 40°.
      Mushroom production fell with slope in Pyrenean Scots pine (Bonet 2008), and B. edulis
      yield was highest under about 11° on plots in north-east Turkey (Mumcu Küçüker 2019);
      two Spanish studies found no slope effect (Martínez-Peña 2012, Taye 2016). It acts on
      the score only, never on the rain, so the same water is not counted twice.

known_gaps:
  - id: wood_edge
    description: POR-H5. Shrub, meadow and pasture within 100 m of a qualifying wood is productive.
    needs: [M2 grid, a woodland edge buffer when building habitat fractions]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014]
  - id: soil
    description: POR-N1. "Heavy loamy, often somewhat calcareous soil" (Dutch sampling); acid loams under Cistus in Spain.
    needs: [soil_texture, soil_ph]
    confidence: plausible
    source: [beugelsdijk2008, alonso_ponce2011]
