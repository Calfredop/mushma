# Species rules for one key in CALABRIA, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Calabria sources: .gavin-root/docs/species-ecology/calabria.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_pinophilus
group: porcini
taxon: Boletus pinophilus
synonyms: [Boletus pinicola]
status: draft
i18n_key: species.porcini_pinophilus
records:
  gbif_taxon_keys: [5954949]
  inat_taxon_ids: [335942]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    Calabria: 19 iNaturalist records (June 5, September 3, October 5, November 5; 2018-2025; the 4
    GBIF records are copies of them), 11 located at 797-1,638 m, median 1,152 m (2026-09-28; Tuscany
    7). "Boletus pinicola" does not match in the GBIF backbone (it resolves to class level), so map
    verbatim names to 5954949 by hand in the ingest.
notes: >-
  The most cold-tolerant porcino, and the earliest and latest to fruit. Calabria: the porcino of the
  Sila's laricio pine. "molto diffuso sotto i pini silani secolari (Pinus nigra var. calabrica) e meno
  diffuso sotto faggio" (Lavorato 1996), "localmente comune sotto pino silano" (Lavorato & Rotella
  2004), and named for it in dialect: "Sillu 'e pinu" against B. edulis's "Sillu 'e fagu" (Acri), "cozza
  'e pinu" (Cosenza), "Zappinaro" after the big Aspromonte pines (Reggio). Among the 5,464 records of
  Calabria's laricio forests it is the 8th of 933 species and the commonest porcino, 0.9 % of records
  against 0.3 % for B. edulis (ISPRA MLG 180/2018). Changed for Calabria: mountain pine becomes a full
  host, chestnut moves down, Alnus cordata and broom scrub move to non-host, and the altitude band
  reaches the tree line. Seasons and weather are Tuscany's. Hosts disagree between sources (pines only
  in the Netherlands, beech, fir and chestnut in Italy); in Calabria the pine and the beech are both
  documented.

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [0, 18, 30]
    reference_c: 15
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.0, 2.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, blog_prevedere_porcini, funghimagazine_giorni_pioggia]
  derived: true
  notes: >-
    POR-R3, transferred from B. edulis (the cool-climate porcino, earliest and latest in the
    year). The pace is 1 at 15 °C of topsoil, the weather the lag window was drawn from. Fruit
    bodies develop at a lower optimum than mycelium grows in culture (B. edulis 25-28 °C; Moore
    et al. 2008), hence t_opt 18 °C. A 9 °C stretch runs at about 65 % pace. Caps stop growing
    when the day's minimum humidity falls under 40 % and grow well from about 60 %
    (Kasparavičius 2001, B. edulis): open-air daily maximum VPD of 1.0 kPa keeps full pace and
    2.0 kPa halves it; the floor stands for the moister air under the canopy. No peer-reviewed
    days-per-°C figure exists for these species: every number is a prior.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: spring
          dates: ["01-05", "20-05", "30-06", "20-07"]
        - label: autumn
          dates: ["15-08", "15-09", "15-11", "15-12"]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, muse_censimento_boletus, museo_porcino_borgotaro, micoweb_pinophilus, funghimagazine_porcini_maggio2022, bmeteo_pinophilus_oppicelli2024, lavorato_rotella1995_mappatura_cosenza, mushma_occurrence_check_calabria_2026]
    derived: true
    data: available
    notes: >-
      POR-S4. A summer form from June in chestnut and an autumn form under beech and fir (IGP). The
      spring flush is the least certain part. Calabria: kept. The spring flush is documented here:
      "ottime nascite di Porcini rossi-Pinicola in Sila, Pollino e localmente anche tra Serre-Aspromonte"
      in late May 2022 (Funghi Magazine), first ones "in maggio-giugno, occasionalmente anche alla fine
      del mese di aprile ... in particolare sulle montagne della Calabria" (3bmeteo; both folklore). A
      dated record under pine at 1,300 m on 18 November 1994 (Lavorato & Rotella 1995) sits on the
      autumn ramp. The 19 iNaturalist records fall in June (5) and September-November (13), none in July
      and August.

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        beech: 1.0
        fir_spruce: 1.0
        mountain_pine: 1.0
        mixed_broadleaf_conifer: 0.6
        chestnut: 0.3
        other_conifer: 0.3
        mediterranean_pine: 0.3
        deciduous_oak: 0.3
        mixed_broadleaf: 0.1
        transitional_woodland_shrub: 0.1
        evergreen_oak: 0.1
        macchia: 0.0
        riparian: 0.0
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, muse_censimento_boletus, museo_porcino_borgotaro, beugelsdijk2008, mushma_habitat_share_2026, ispra2018_mlg180_calabria_foreste, ispra2018_mlg179_calabria_rimboschimenti, lavorato1996_boletaceae_calabria, lavorato_rotella2004_pini_sila_greca, ambsg_manuale_corso_micologia, miceli2019_sua_maesta_porcino, mushma_calabria_forest_composition_2026]
    derived: true
    data: available
    notes: >-
      Calabria (2026-09-28, Carta della Natura habitat map and ISPRA MLG 180/179 record shares, the
      per-habitat frequencies of about 45,000 records of the Calabrian mycological groups).
      `mountain_pine` (13.8 % of the mapped woods and scrub, about 99,000 ha, mostly laricio pine of
      the Sila, natural and replanted) moves from secondary 0.6 to host 1.0: this taxon is "molto
      diffuso sotto i pini silani secolari (Pinus nigra var. calabrica) e meno diffuso sotto faggio"
      (Lavorato 1996), "localmente comune sotto pino silano" (Lavorato & Rotella 2004), "Sillu 'e pinu"
      in Acri's dialect and "Zappinaro" after the Aspromonte pines, and 0.9 % of the laricio records (8th
      of 933 species), against 0.6 % (plus 0.3 % var. fuscoruber) of the Sila beech records. `chestnut`
      moves from host 1.0 to marginal 0.3: 0.1 % of 3,192 chestnut records, and no Calabrian source
      names it; one iNaturalist site in chestnut at about 800 m keeps it above non-host.
      `mixed_broadleaf` (2.3 %; 86 % Alnus cordata, an alder with its own fungal partners) and
      `transitional_woodland_shrub` (8.1 %; Spartium, broom, deciduous scrub, bramble) move to non-host
      0.1. Beech and fir stay hosts (fir reforestations 0.6 % of 806 records). Otherwise Tuscany's
      POR-H2. Four levels (2026-09-24, mushma_habitat_share_2026): beech and fir are Italian-source
      hosts ("mainly with beech, fir and chestnut"). Mixed broadleaf+conifer (a beech-fir mix, both
      hosts, capped below host for dilution; empty on the Carta della Natura) stays secondary. Other
      conifer, Mediterranean pine (Calabria: stone-pine plantations 0.8 % of 271 records, Aleppo-pine
      plantations none of 802) and deciduous oak are marginal. Evergreen oak, macchia, riparian and
      exotic broadleaf are non-host: this cool/humid taxon has no source support there. Saturated to
      full credit from a host-weighted share of 0.30.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [300, 800, 1800, 2000]}
    confidence: plausible
    source: [borgotaro_igp_rt, matteucci2008_micoponte, muse_censimento_boletus, rt_tipi_forestali_p4, ispra2018_mlg180_calabria_foreste, lavorato_rotella2004_pini_sila_greca, calabria_pfr2024, mushma_calabria_forest_composition_2026, mushma_occurrence_check_calabria_2026]
    derived: true
    data: available
    notes: >-
      POR-A2. Cool, humid mountain sites; the summer form also in mid-altitude chestnut. Calabria: full
      credit now runs to 1,800 m (Tuscany 1,600 m) and reaches 0 at 2,000 m, as in Campania. Its two
      hosts climb that high here: beech is dominant "a quote superiori ai 1000 metri" and reaches the
      tree line on the Pollino (on the habitat map median 1,270 m, p90 1,640 m, max 2,045 m); the
      laricio belt is 900-1,400 m in the Sila and 700-1,600 m in the Aspromonte (ISPRA MLG 180/2018), on
      the map median 1,201 m, p90 1,459 m. The located Calabria records sit at 797-1,638 m (median 1,152
      m, n=11; Tuscany 692 m, n=6). The lower ramp is kept: the pine starts at about 750 m (p10).

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: plausible
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-R1 + POR-R2, transferred from B. edulis.

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: plausible
    source: [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1, transferred from B. edulis and community studies.
      Tuned (2026-09-22): the absolute 20->80 mm ramp was full in an ordinary September, so the 30
      days are scored as a percentage of the cell's own normal for those days (2016-2025 reanalysis,
      downscaled and rain-scaled like the rain): 0 at 50 %, full from 125 %. It raised the porcini
      train objective by 0.03 with or without the rain scale, and the hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [4, 8, 15, 20]}
    confidence: plausible
    source: [muse_censimento_boletus, matteucci2008_micoponte, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: POR-T2. The coolest band, from "copes better with cool climates". Low confidence within plausible.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d; compare in the backtest.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.5
    confidence: plausible
    source: [salerni2023_amiata, andrew2025]
    derived: true
    data: derived
    notes: POR-X1, as for B. edulis.

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.2
    confidence: folklore
    source: [borgotaro_igp_rt, brejon_hoffman2026_preprint, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X3.

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: folklore
    source: [borgotaro_igp_rt, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 4, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-X6. All numbers are guesses.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [null, null, 105, 125]}
    floor: 0.8
    where: {attribute: elevation_m, trapezoid: [null, null, 900, 1100]}
    confidence: folklore
    source: [rt_tipi_forestali_p4, bmeteo_pioggia_funghi, bonet2008, mumcu_kucuker2019]
    derived: true
    data: derived
    notes: >-
      POR-A5. Below 1000 m, north-facing slopes keep moisture in hot spells and hold the
      conifer hosts (N x1.0, E/W x0.9, S x0.8), but flat, east- and west-facing ground is
      normal for Tuscan woodland and scores full credit: only clearly sunny slopes lose it.
      On 15 Oct the cell's sun ratio (its clear-sky sun as a % of flat ground's) runs p10 89
      %, p25 95 %, median 100 %, p75 105 %, p90 111 % (2026-09-24): x1 up to 105 %, about the
      p90, x0.8 from 125 %, fading out between 900 and 1100 m. North aspect raised production
      in dry Pyrenean pine (Bonet 2008), while a humid Turkish forest found north slopes
      worst for B. edulis (Mumcu Küçüker 2019): the preference is kept to low altitude, where
      water limits fruiting. Read on the day's sun ratio, the cell's sun as a percentage of
      flat ground's (api.model.terrain), so it bites hardest in autumn, when the sun is low.
      The terrain microclimate already makes sunny slopes warmer and drier for every rule;
      this line is the species' own preference on top of that, kept soft.

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 25, 40]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby
      1979), but a 1 km cell's mean slope is not the slope of the exact spot the mushrooms
      grow on: normal terrain for Tuscan woodland scores full credit, and only clearly
      steep cells lose it. Woodland cells on the Tuscan grid run p10 10.2°, p25 12.6°, median
      16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up to 25°, about the p90, x0.8 from 40°.
      Mushroom production fell with slope in Pyrenean Scots pine (Bonet 2008), and B. edulis
      yield was highest under about 11° on plots in north-east Turkey (Mumcu Küçüker 2019);
      two Spanish studies found no slope effect (Martínez-Peña 2012, Taye 2016). It acts on
      the score only, never on the rain, so the same water is not counted twice.

known_gaps:
  - id: wood_edge
    description: POR-H5. Shrub, meadow and pasture within 100 m of a qualifying wood is productive.
    needs: [M2 grid, a woodland edge buffer when building habitat fractions]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014]
  - id: soil
    description: POR-N1. "Poor, acid, sandy soil" in Dutch sampling.
    needs: [soil_ph, soil_texture]
    confidence: plausible
    source: [beugelsdijk2008]
