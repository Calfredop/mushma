contrasts:
- id: sila_2016_normal
  claim: 'Mid-September 2016: ''Non si vedeva una stagione di funghi così da diversi anni. Dalla
    Sila Grande a quella Piccola, passando per le Serre catanzaresi e vibonesi fino alla Sila Greca
    e al Pollino è un boom di funghi'' (EcodelloJonio, 2016-09-24); ''si registrano raccolte record
    nei territori delle località silane'' (Parola di Vita, 2016-09-23); ''mai come prima era stato
    tanto abbondante ... il raccolto dei funghi porcini'' (Cosenza Post, 2016-09-20)'
  source: https://ecodellojonio.it/articoli/funghi-e-boom-di-raccolta-porcini-in-sila
  higher:
    area: sila
    seasons:
    - 2016
    start: 09-06
    end: 09-24
  lower:
    area: sila
    seasons: normal
    start: 09-06
    end: 09-24
- id: sila_2021_2019_early_september
  claim: 'Early September 2021: ''Momento felice per la CALABRIA superiore che ha avuto piogge
    adeguate attorno a Ferragosto e poi una ricca passata temporalesca il 26 Agosto'', ''ottime
    nascite di Porcini edulis in Sila'' (FM 2021-09-04, 2021-09-10); early September 2019: ''in
    Calabria, dove la raccolta è iniziata in modo sporadico soltanto sulla Sila'' (Coldiretti via LaC
    News24, 2019-09-08), ''la Calabria che ha visto finalmente le prime nascite'' (FM 2019-09-20)'
  source: https://web.archive.org/web/20210922081914/https://funghimagazine.it/aggiornamento-meteofunghi-04-09-2021-porcini-giganti/
