- id: sila_late_june_2018_2020_2021_vs_2024_2025
  claim: 'Late June 2018: ''Calabria a tutta birra ... alle pinete della Sila'' (FM 2018-07-01); 2020:
    ''Exploit in Calabria ... ritrovamenti abbondanti di Porcini rossi (Boletus pinophilus) nelle
    pinete del Pollino, della Sila e dell''Aspromonte'' (FM 2020-06-25); 2021: ''ottime nascite di
    funghi Porcini Pinicola ... soprattutto in alta Sila'' (FM 2021-06-24); 2024: ''l''avvezione calda
    ... ha fatto danni davvero notevoli'' (FM 2024-06-28); 2025: ''le nascite fungine ... sono state
    bloccate dalla vampata africana'' (FM 2025-07-03)'
