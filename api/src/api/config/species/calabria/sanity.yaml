# Press-contrast sanity check for Calabria (api.model.sanity).
# Areas by comuni (ISTAT 2025 names, all in Calabria; Casali del Manco holds the former Spezzano
# Piccolo, Pedace, Serra Pedace, Casole Bruzio and Trenta). Windows and source URLs written down on
# 2026-09-28, before any Calabria score existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); read those with `--group ovoli` / `--group gallinacci`.
# Calabrian local press rarely says how a season went; most contrasts rest on Funghi Magazine's
# national bulletins (read through Wayback Machine captures, the live site is behind a captcha),
# whose Calabria paragraphs are written from readers' reports, each contrast on 2-5 bulletins.
# Quotes, second sources and weaknesses per contrast: .gavin-root/docs/species-ecology/calabria.md
# (Sanity contrasts).
