# Species rules for one key in TRENTINO-ALTO ADIGE, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Trentino and South Tyrol sources: .gavin-root/docs/species-ecology/trentino_alto_adige.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_pinophilus
group: porcini
taxon: Boletus pinophilus
synonyms: [Boletus pinicola]
status: draft
i18n_key: species.porcini_pinophilus
records:
  gbif_taxon_keys: [5954949]
  inat_taxon_ids: [335942]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    Only 3 GBIF and 7 iNaturalist Tuscan records (2026-09-17). "Boletus pinicola" does not match in the
    GBIF backbone (it resolves to class level), so map verbatim names to 5954949 by hand in the ingest.
    Trentino-Alto Adige: 45 iNaturalist records (2026-09-26; 32 in Trentino, 13 in South Tyrol), 29
    located at 725-1927 m; the 17 GBIF records are iNaturalist copies.
notes: >-
  Trentino-Alto Adige: one May-October season with no summer gap, Scots pine a full host, larch and
  stone pine non-host, and the altitude band moved up to the spruce belt; weather rules unchanged.
  The most cold-tolerant porcino, and the earliest and latest to fruit. Hosts disagree between sources
  (pines only in the Netherlands, beech, fir and chestnut in Italy); the Italian view is used.

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [0, 18, 30]
    reference_c: 15
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.0, 2.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, blog_prevedere_porcini, funghimagazine_giorni_pioggia]
  derived: true
  notes: >-
    POR-R3, transferred from B. edulis (the cool-climate porcino, earliest and latest in the
    year). The pace is 1 at 15 °C of topsoil, the weather the lag window was drawn from. Fruit
    bodies develop at a lower optimum than mycelium grows in culture (B. edulis 25-28 °C; Moore
    et al. 2008), hence t_opt 18 °C. A 9 °C stretch runs at about 65 % pace. Caps stop growing
    when the day's minimum humidity falls under 40 % and grow well from about 60 %
    (Kasparavičius 2001, B. edulis): open-air daily maximum VPD of 1.0 kPa keeps full pace and
    2.0 kPa halves it; the floor stands for the moister air under the canopy. No peer-reviewed
    days-per-°C figure exists for these species: every number is a prior.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: late_spring_autumn
          dates: ["01-05", "25-05", "10-10", "10-11"]
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, muse_censimento_boletus, museo_porcino_borgotaro, micoweb_pinophilus, muse_censimento_pinophilus, mushma_occurrence_check_taa_2026]
    derived: true
    data: available
    notes: >-
      Trentino-Alto Adige (2026-09-26): the spring and autumn windows become one, full from 25 May to
      10 October and closed by 10 November (Tuscany: a gap from 20 July to 15 August, autumn to 15
      December). The 45 records of the region run May 3, June 6, July 7, August 12, September 9,
      October 8, 1.0-1.5x the effort of all the region's fungi records in every month from May to
      October, so no summer gap; the located ones run from 25 May (below 1000 m) to 16 October.
      "Tra le specie del genere Boletus è quella più precoce e più tardiva": the north-east census
      has it from 12 May to 28 October, both at Baselga di Piné in spruce and Scots pine at
      910-1120 m (MUSE). Its north-east monthly profile dips in July but does not stop. Frost and
      snow end the tail at altitude. Tuscany's POR-S4 follows.
      POR-S4. A summer form from June in chestnut and an autumn form under beech and fir (IGP). The
      spring flush is the least certain part. Too few records to cross-check.

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        beech: 1.0
        fir_spruce: 1.0
        chestnut: 1.0
        mountain_pine: 1.0
        mixed_broadleaf_conifer: 0.6
        mediterranean_pine: 0.3
        deciduous_oak: 0.3
        mixed_broadleaf: 0.3
        transitional_woodland_shrub: 0.1
        other_conifer: 0.1
        evergreen_oak: 0.1
        macchia: 0.0
        riparian: 0.0
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, muse_censimento_boletus, museo_porcino_borgotaro, beugelsdijk2008, mushma_habitat_share_2026, muse_censimento_pinophilus, mushma_taa_forest_check_2026, taa_bz_waldtypisierung2010, taa_mandolini2025_larix, taa_mandolini2024_cembra, taa_bz_hauptbaumarten]
    derived: true
    data: available
    notes: >-
      Trentino-Alto Adige (2026-09-26): mountain pine moves from secondary to host (0.6 -> 1.0) and
      other conifer from marginal to non-host (0.3 -> 0.1). Here mountain pine is Scots pine (and some
      black pine): Trentino's pinete di pino silvestre o nero are 34,720 ha, 9 % of the woods, and in
      South Tyrol the pine holds 10 % of the growing stock, with "weit ausgedehnte montane Kiefern- und
      Lärchenwälder am Sonnenhang des Vinschgaus" (Waldtypisierung Südtirol). The census calls B.
      pinophilus "frequentemente legato al pino silvestre", its earliest and latest north-east records
      in spruce and Scots pine woods (MUSE); the surroundings of the 16 located Trentino records at
      1000-1500 m are 18 % Scots pine against 8 % of the woods at that height, and 56 % spruce, 15 % fir
      (mushma_taa_forest_check_2026). Other conifer holds only larch and stone pine here, with no
      Boletus on their root tips (Mandolini et al. 2025, 2024; see porcini_edulis). Transitional
      woodland/shrub moves from marginal to non-host (0.3 -> 0.1): the transitional class here is
      subalpine scrub, mountain-pine krummholz (mughete, 13,867 ha in Trentino, median 1779 m) and green
      alder (8,592 ha, median 1962 m), which the region config keeps out of the woodland mask but in the
      habitat mix (see porcini_edulis). Tuscany's POR-H2 follows. POR-H2. Four levels (2026-09-24,
      mushma_habitat_share_2026): beech, fir and chestnut are the Italian-source hosts ("mainly with
      beech, fir and chestnut", preferred over the Dutch phylogeny paper's pine-only claim for this
      Tuscan file) -> host. Mixed broadleaf+conifer (a beech-fir mix, both hosts, capped below host for
      dilution) and mountain pine (often Pinus sylvestris, "moderate") stay secondary. Other conifer,
      Mediterranean pine, deciduous oak, mixed broadleaf and transitional woodland/shrub are marginal:
      "many pines" and "also broadleaves" are named only generically, and the mixed/transitional classes
      are diluted by design. Evergreen oak, macchia, riparian and exotic broadleaf are non-host: this
      cool/humid taxon has no source support there. Saturated to full credit from a host-weighted share
      of 0.30.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [400, 700, 1800, 2200]}
    confidence: plausible
    source:
      [borgotaro_igp_rt, matteucci2008_micoponte, muse_censimento_boletus, rt_tipi_forestali_p4, muse_censimento_pinophilus, mushma_occurrence_check_taa_2026, taa_pat_tipi_forestali_2018, mushma_taa_forest_check_2026, diez2020_alps]
    derived: true
    data: available
    notes: >-
      POR-A2 moved onto the Alpine belts of the region (Tuscany: 300 -> 800 ... 1600 -> 1900). The 29
      located records: min 725 m, p10 988 m, median 1270 m, p90 1567 m, p95 1631 m, max 1927 m; the
      north-east census runs 200-1898 m, its maximum in Trentino (MUSE). The hosts reach from Scots
      pine, mapped in Trentino from 379 m (p5) to 1351 m (p95), to spruce up to about 2000-2200 m
      (Tipi forestali del Trentino 2018), and Alpine fungi fruit higher than they did (Diez et al.
      2020). So zero at 400 m, full from 700 m to 1800 m, zero at 2200 m. Tuscany: cool, humid
      mountain sites; the summer form also in mid-altitude chestnut.

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: plausible
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-R1 + POR-R2, transferred from B. edulis.

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: plausible
    source: [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1, transferred from B. edulis and community studies.
      Tuned (2026-09-22): the absolute 20->80 mm ramp was full in an ordinary September, so the 30
      days are scored as a percentage of the cell's own normal for those days (2016-2025 reanalysis,
      downscaled and rain-scaled like the rain): 0 at 50 %, full from 125 %. It raised the porcini
      train objective by 0.03 with or without the rain scale, and the hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [4, 8, 15, 20]}
    confidence: plausible
    source: [muse_censimento_boletus, matteucci2008_micoponte, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: POR-T2. The coolest band, from "copes better with cool climates". Low confidence within plausible.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d; compare in the backtest.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.5
    confidence: plausible
    source: [salerni2023_amiata, andrew2025]
    derived: true
    data: derived
    notes: POR-X1, as for B. edulis.

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.2
    confidence: folklore
    source: [borgotaro_igp_rt, brejon_hoffman2026_preprint, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X3.

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: folklore
    source: [borgotaro_igp_rt, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 4, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-X6. All numbers are guesses.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [null, null, 105, 125]}
    floor: 0.8
    where: {attribute: elevation_m, trapezoid: [null, null, 900, 1100]}
    confidence: folklore
    source: [rt_tipi_forestali_p4, bmeteo_pioggia_funghi, bonet2008, mumcu_kucuker2019]
    derived: true
    data: derived
    notes: >-
      POR-A5. Below 1000 m, north-facing slopes keep moisture in hot spells and hold the conifer hosts
      (N x1.0, E/W x0.9, S x0.8), but flat, east- and west-facing ground is normal for Tuscan woodland
      and scores full credit: only clearly sunny slopes lose it. On 15 Oct the cell's sun ratio (its
      clear-sky sun as a % of flat ground's) runs p10 89 %, p25 95 %, median 100 %, p75 105 %, p90 111 %
      (2026-09-24): x1 up to 105 %, about the p90, x0.8 from 125 %, fading out between 900 and 1100 m.
      North aspect raised production in dry Pyrenean pine (Bonet 2008), while a humid Turkish forest
      found north slopes worst for B. edulis (Mumcu Küçüker 2019): the preference is kept to low
      altitude, where water limits fruiting. Read on the day's sun ratio, the cell's sun as a percentage
      of flat ground's (api.model.terrain), so it bites hardest in autumn, when the sun is low. The
      terrain microclimate already makes sunny slopes warmer and drier for every rule; this line is the
      species' own preference on top of that, kept soft. Trentino-Alto Adige: kept from Tuscany. On 15
      Oct the woodland cells of the region grid below 1000 m run p10 73 %, p25 85 %, median 98 %, p75
      110 %, p90 121 % (Tuscany 89/95/100/105/110 %): the steep valley sides spread the sun ratio wider,
      so 105 % sits near the p65 here and the line docks about a third of the low woods, at most by its
      floor. The band is kept as a statement about sun and drying, not re-anchored to the region's
      percentiles; the backtest can test it (2026-09-26).

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 35, 45]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979, mushma_taa_forest_check_2026, taa_bz_wald_flaechen]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby 1979), but a
      1 km cell's mean slope is not the slope of the exact spot the mushrooms grow on: normal terrain
      for Tuscan woodland scores full credit, and only clearly steep cells lose it. Woodland cells on
      the Tuscan grid run p10 10.2°, p25 12.6°, median 16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up
      to 25°, about the p90, x0.8 from 40°. Mushroom production fell with slope in Pyrenean Scots pine
      (Bonet 2008), and B. edulis yield was highest under about 11° on plots in north-east Turkey (Mumcu
      Küçüker 2019); two Spanish studies found no slope effect (Martínez-Peña 2012, Taye 2016). It acts
      on the score only, never on the rain, so the same water is not counted twice. Trentino-Alto Adige
      (2026-09-26): the band moves onto the region's woods by the same rule, normal terrain at full
      credit. The 7,698 woodland cells of the region grid run p10 17.6°, p25 22.2°, median 26.9°, p75
      31.0°, p90 34.5°, p99 40.2°, max 44.7° (Trentino and South Tyrol alike: p90 34.8° and 34.1°): 62 %
      are steeper than 25°, against 13 % in Tuscany. South Tyrol is as steep ("Over two-thirds" of its
      forest on slopes over 40 %, that is 22°, Forstdienst). x1 up to 35° (about the p90), x0.8 from 45°
      (about the max, as 40° is on the Tuscan grid).

known_gaps:
  - id: wood_edge
    description: POR-H5. Shrub, meadow and pasture within 100 m of a qualifying wood is productive.
    needs: [M2 grid, a woodland edge buffer when building habitat fractions]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014]
  - id: soil
    description: POR-N1. "Poor, acid, sandy soil" in Dutch sampling.
    needs: [soil_ph, soil_texture]
    confidence: plausible
    source: [beugelsdijk2008]
