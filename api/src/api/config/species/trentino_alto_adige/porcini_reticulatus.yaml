# Species rules for one key in TRENTINO-ALTO ADIGE, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Trentino and South Tyrol sources: .gavin-root/docs/species-ecology/trentino_alto_adige.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_reticulatus
group: porcini
taxon: Boletus reticulatus
synonyms: [Boletus aestivalis]
status: draft
i18n_key: species.porcini_reticulatus
records:
  gbif_taxon_keys: [5954691]
  inat_taxon_ids: [350216]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    GBIF taxonKey 5954691 includes the synonym B. aestivalis (5954988). 28 of 39 Tuscan GBIF rows are
    soil-DNA MATERIAL_SAMPLE records from the 2019 "Global soil organisms" dataset: exclude them.
    Validate the porcini group score, not this key alone. Trentino-Alto Adige: 42 iNaturalist
    fruit-body records (2026-09-26; 29 in Trentino, 13 in South Tyrol), 26 located (min 501 m, p10
    665 m, median 931 m, p90 1275 m, max 1945 m); GBIF adds one record.
notes: >-
  Trentino-Alto Adige: the Tuscan rules with a September close and an altitude ceiling moved up to the
  montane beech and fir; weather rules unchanged (no numbers from the region). The summer porcino
  ("fungo del caldo"). No quantitative weather study exists for this taxon: the rain logic is borrowed
  from B. edulis, temperature and cold-night rules are shifted using qualitative sources.

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [2, 21, 32]
    reference_c: 17
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.5, 3.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, bmeteo_funghi_luglio, funghimagazine_giorni_pioggia]
  derived: true
  notes: >-
    POR-R3 for the summer porcino. The pace is 1 at 17 °C of topsoil, the weather the lag window
    was drawn from. Fruit bodies develop at a lower optimum than mycelium grows in culture (B.
    edulis 25-28 °C; Moore et al. 2008), hence t_opt 21 °C. Thermophilic porcini appear 8-11
    days after warm summer storms (lore); a 12 °C stretch runs at about 65 % pace. Caps stop
    growing when the day's minimum humidity falls under 40 % and grow well from about 60 %
    (Kasparavičius 2001, B. edulis): open-air daily maximum VPD of 1.5 kPa keeps full pace and
    3.0 kPa halves it; the floor stands for the moister air under the canopy. No peer-reviewed
    days-per-°C figure exists for these species: every number is a prior. The humidity ramp is
    set higher than for the autumn porcini because it fruits in summer, when open-air VPD is 2
    kPa on a median July day.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: late_spring_summer
          dates: ["01-05", "01-06", "15-09", "20-10"]
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, museo_porcino_borgotaro, mushma_occurrence_check_2026, mushma_occurrence_check_taa_2026, taa_muse_censimento_aestivalis]
    derived: true
    data: available
    notes: >-
      Trentino-Alto Adige (2026-09-26): full from 1 June to 15 September, closed by 20 October (Tuscany:
      full to 30 September, zero on 15 November). The 42 records of the region run June 10, July 15,
      August 12, September 5 and October none: against all fungi records of the region June is 2.7x the
      effort, July 2.3x, August 1.2x, September 0.6x, and October should have held about 6. The located
      ones run from 3 June to 14 September at every elevation. The north-east census still has October
      at a third of the July peak (MUSE), but that comes mostly from the low Friulian and Venetian
      hills; the few warm low woods of the region keep a ramp into October. Tuscany's POR-S1 follows.
      POR-S1, tail widened by the occurrence cross-check: central-Italy iNaturalist records are
      over-represented Jun–Sep (4.2x, 2.7x, 1.8x, 2.6x vs all fungi) and still 0.8x in October (9
      records), so the ramp now ends mid-November instead of 31 October.

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        chestnut: 1.0
        deciduous_oak: 1.0
        beech: 0.6
        fir_spruce: 0.6
        mountain_pine: 0.6
        mixed_broadleaf: 0.6
        mixed_broadleaf_conifer: 0.6
        evergreen_oak: 0.3
        transitional_woodland_shrub: 0.1
        mediterranean_pine: 0.1
        other_conifer: 0.1
        macchia: 0.1
        riparian: 0.05
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, museo_porcino_borgotaro, beugelsdijk2008, santolamazza2023, mushma_habitat_share_2026]
    derived: true
    data: available
    notes: >-
      Trentino-Alto Adige (2026-09-26): transitional woodland/shrub moves from secondary to non-host
      (0.6 -> 0.1): the transitional class here is subalpine scrub, mountain-pine krummholz (mughete,
      13,867 ha in Trentino, median 1779 m) and green alder (8,592 ha, median 1962 m), which the region
      config keeps out of the woodland mask but in the habitat mix, neither a porcini host; every other
      tier is Tuscany's. Tuscany's POR-H3 follows. POR-H3. Four levels (2026-09-24,
      mushma_habitat_share_2026): chestnut and deciduous oak are "mainly" named -> host. "Rarer under
      beech, hazel, pine and fir" names four more documented but clearly less typical hosts, so beech,
      fir/spruce, mountain pine and mixed broadleaf (via hazel) stay secondary; mixed broadleaf+conifer
      and transitional woodland/shrub are also secondary because that mix is mostly chestnut/oak (both
      hosts), diluted only by design, not by weak evidence. Evergreen oak is marginal (only "oak" is
      named, not specifically holm oak). Mediterranean pine, other conifer and macchia are non-host (the
      "pine" mention is read as mountain pine, IGP's eligible black/Scots pine); riparian and exotic
      broadleaf are non-host. Saturated to full credit from a host-weighted share of 0.30.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [0, 150, 1300, 1700]}
    confidence: plausible
    source:
      [matteucci2008_micoponte, muse_censimento_boletus, rt_tipi_forestali_p4, arrigoni_viciani_castagneti, mushma_occurrence_check_2026, mushma_occurrence_check_taa_2026, taa_muse_censimento_aestivalis, taa_pat_tipi_forestali_2018, mushma_taa_forest_check_2026]
    derived: true
    data: available
    notes: >-
      Trentino-Alto Adige (2026-09-26): full to 1300 m, zero at 1700 m (Tuscany: 1100 -> 1500 m).
      The 26 located records: p75 1181 m, p90 1275 m, p95 1360 m, 5 of them at 1200-1500 m and one
      at 1945 m (the north-east census maximum, 1927 m on 29 August 2010 in Trentino, is likely the
      same find; MUSE). Here the summer porcino's hosts are montane: the surroundings of the 16
      located Trentino records are 29 % spruce, 18 % beech, 18 % Scots pine, 11 % fir and 13 %
      larch (mushma_taa_forest_check_2026), chestnut and oak being rare; montane beech woods run
      "tra 1000 e 1500 m" and fir woods to about 1600 m (Tipi forestali del Trentino 2018). The
      habitat tiers are Tuscany's: beech, spruce/fir and Scots pine were already secondary hosts.
      The lower end is kept. Tuscany's POR-A3 follows.
      POR-A3. Hills to lower mountain, the chestnut and oak belt. Central-Italy iNaturalist records:
      median 714 m, p90 1272 m (n=56).

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: plausible
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-R1 + POR-R2, transferred from B. edulis (strong there, plausible here).

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: plausible
    source: [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1, transferred from B. edulis and community studies.
      Tuned (2026-09-22): the absolute 20->80 mm ramp was full in an ordinary September, so the 30
      days are scored as a percentage of the cell's own normal for those days (2016-2025 reanalysis,
      downscaled and rain-scaled like the rain): 0 at 50 %, full from 125 %. It raised the porcini
      train objective by 0.03 with or without the rain scale, and the hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [9, 13, 21, 25]}
    confidence: plausible
    source: [borgotaro_igp_rt, matteucci2008_micoponte, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: >-
      POR-T3. The B. edulis band shifted warmer: "fungo del caldo" (IGP), "tipicamente termofila e
      xerofila" (Matteucci). Low confidence within plausible.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d; compare in the backtest.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.75
    confidence: plausible
    source: [salerni2023_amiata, andrew2025]
    derived: true
    data: derived
    notes: POR-X1. Milder than for B. edulis (x0.75) because this taxon is thermophilous.

  - id: cold_nights
    role: stopper
    kind: count_days
    i18n_key: factor.cold_nights
    input: {variable: temperature_2m_min, op: lte, threshold: 5, window_days: 7}
    response: {trapezoid: [null, null, 2, 3]}
    floor: 0.5
    confidence: folklore
    source: [funghimagazine_fino_quando]
    derived: true
    data: available
    notes: >-
      POR-X5. "Stops with the first cold": Tmin <=5 °C on 3+ of the last 7 nights -> x0.5.

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.1
    confidence: folklore
    source: [funghimagazine_fino_quando, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: POR-X3. Least frost-tolerant of the four (x0.1).

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: folklore
    source: [borgotaro_igp_rt, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 5, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: >-
      POR-X6. ET0 threshold raised to 5 mm/day because this taxon fruits in summer at low altitude,
      where 4 mm/day is normal. All numbers are guesses.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [80, 95, null, null]}
    floor: 0.9
    confidence: folklore
    source: [matteucci2008_micoponte]
    derived: true
    data: derived
    notes: >-
      POR-A6. Tolerates or prefers sunny exposures (S x1.0, E/W x1.0, N x0.9): x0.9 at 80 % of flat
      ground's sun or less, x1 from 95 %. Read on the day's sun ratio, the cell's sun as a percentage of
      flat ground's (api.model.terrain), so it bites hardest in autumn, when the sun is low. The terrain
      microclimate already makes sunny slopes warmer and drier for every rule; this line is the species'
      own preference on top of that, kept soft. Trentino-Alto Adige: kept from Tuscany. On 15 Oct the
      woodland cells of the region grid below 1300 m run p10 71 %, median 98 % (Tuscany p10 89 %): the
      steep valley sides put 21 % of them at 80 % of flat ground's sun or less, where this line gives
      its full x0.9, and 45 % under 95 %. The band is kept as a statement about shade, not re-anchored
      to the region's percentiles; the backtest can test it (2026-09-26).

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 35, 45]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979, mushma_taa_forest_check_2026, taa_bz_wald_flaechen]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby 1979), but a
      1 km cell's mean slope is not the slope of the exact spot the mushrooms grow on: normal terrain
      for Tuscan woodland scores full credit, and only clearly steep cells lose it. Woodland cells on
      the Tuscan grid run p10 10.2°, p25 12.6°, median 16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up
      to 25°, about the p90, x0.8 from 40°. Mushroom production fell with slope in Pyrenean Scots pine
      (Bonet 2008), and B. edulis yield was highest under about 11° on plots in north-east Turkey (Mumcu
      Küçüker 2019); two Spanish studies found no slope effect (Martínez-Peña 2012, Taye 2016). It acts
      on the score only, never on the rain, so the same water is not counted twice. Trentino-Alto Adige
      (2026-09-26): the band moves onto the region's woods by the same rule, normal terrain at full
      credit. The 7,698 woodland cells of the region grid run p10 17.6°, p25 22.2°, median 26.9°, p75
      31.0°, p90 34.5°, p99 40.2°, max 44.7° (Trentino and South Tyrol alike: p90 34.8° and 34.1°): 62 %
      are steeper than 25°, against 13 % in Tuscany. South Tyrol is as steep ("Over two-thirds" of its
      forest on slopes over 40 %, that is 22°, Forstdienst). x1 up to 35° (about the p90), x0.8 from 45°
      (about the max, as 40° is on the Tuscan grid).

known_gaps:
  - id: temperature_drop
    description: POR-T6. Temperature-drop bonus; see porcini_edulis.
    needs: [a change-detection factor kind]
    confidence: folklore
    source: [bmeteo_pioggia_funghi]
  - id: wood_edge
    description: POR-H5. Shrub, meadow and pasture within 100 m of a qualifying wood is productive.
    needs: [M2 grid, a woodland edge buffer when building habitat fractions]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014]
  - id: stand_and_soil
    description: >-
      POR-N1. Mycelium is more frequent in mature (40-year) chestnut orchards than young ones; prefers
      clay or sand-mixed loam.
    needs: [stand_age, soil_texture]
    confidence: plausible
    source: [santolamazza2023, beugelsdijk2008]
