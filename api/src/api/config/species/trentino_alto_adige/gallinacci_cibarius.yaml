# Species rules for one key in TRENTINO-ALTO ADIGE, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Trentino and South Tyrol sources: .gavin-root/docs/species-ecology/trentino_alto_adige.md.
# Tuscan evidence and rule ids (GAL-*): .gavin-root/docs/species-ecology.md and species-ecology/gallinacci.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: gallinacci_cibarius
group: gallinacci
taxon: Cantharellus cibarius s.l.
synonyms: [Cantharellus pallens, Cantharellus subpruinosus, Cantharellus alborufescens, Cantharellus ilicis, Cantharellus ferruginascens, Cantharellus amethysteus]
status: draft
i18n_key: species.gallinacci_cibarius
records:
  gbif_taxon_keys: [9623860]
  inat_taxon_ids: [47348]
  exclude_gbif_taxon_keys: [9226626, 5249532]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    Genus-level include: C. cibarius s.str. is said to be absent under a Mediterranean climate, so
    Tuscan "C. cibarius" records are mostly C. pallens and C. alborufescens. GBIF keeps C. cinereus
    (9226626) and C. melanoxeros (5249532) in Cantharellus: exclude them (iNaturalist files them under
    Craterellus). Tuscany: 48 GBIF and 116 iNaturalist records (2026-09-17), 111 of them 2019-2025. Pool
    seasons. Trentino-Alto Adige (2026-09-26): 206 iNaturalist records (127 in Trentino, 79 in South
    Tyrol), 161 located (median 1347 m, p90 1727 m); GBIF has 113, 95 of them iNaturalist copies. Of the
    191 identified to species on iNaturalist, 169 are C. cibarius, 8 C. friesii, 8 C. pallens, 5 C.
    amethysteus and 1 C. enelensis: as in Piemonte, the chanterelle here is C. cibarius s.str.
notes: >-
  Trentino-Alto Adige. The chanterelle here is C. cibarius s.str., mostly in the spruce woods of
  1000-1800 m. Changed for the region: no winter lowland mode and an earlier close in the mountains,
  spruce and fir as full hosts, Scots pine up and larch down a tier, and the altitude band moved to the
  subalpine spruce; weather rules unchanged. One rule set for the group. Responds to sustained moisture
  over weeks and fruit bodies persist (about 44 days on average), so the rain logic is broader and
  slower than for porcini. The acid-soil preference is a disabled alternative in v1 (see soil_ph and
  lithology below).

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [0, 18, 30]
    reference_c: 15
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.0, 2.0]
    floor: 0.5
  max_lag_days: 75
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, straatsma1986_thesis, deshaware2021, ivanochko2021]
  derived: true
  notes: >-
    GAL-10 refinement. The pace is 1 at 15 °C of topsoil, the weather the lag window was drawn
    from. Fruit bodies develop at a lower optimum than mycelium grows in culture (C. cibarius
    about 22 °C, Straatsma 1986, Deshaware 2021; Moore et al. 2008), hence t_opt 18 °C.
    Chanterelle fruiting follows accumulated warmth (about 500 degree-days above 5 °C, Ivanochko
    2021); a 9 °C stretch runs at about 65 % pace. Caps stop growing when the day's minimum
    humidity falls under 40 % and grow well from about 60 % (Kasparavičius 2001, B. edulis):
    open-air daily maximum VPD of 1.0 kPa keeps full pace and 2.0 kPa halves it; the floor
    stands for the moister air under the canopy. No peer-reviewed days-per-°C figure exists for
    these species: every number is a prior. The source's 'consistently high humidity' fits a
    sensitive ramp; the humidity numbers are borrowed from B. edulis.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: lowland_long
          dates: ["15-05", "15-06", "31-10", "30-11"]
          elevation_weight: [null, null, 600, 1000]
        - label: mountain_summer_autumn
          dates: ["01-06", "01-07", "15-09", "20-10"]
          elevation_weight: [600, 1000, null, null]
    confidence: plausible
    source:
      [olariaga2017, micoex2016_pallens, bmeteo_cantharellus, cacciatoridifunghi_finferli, myboletus_finferli, mushma_occurrence_check_2026, mushma_occurrence_check_taa_2026, muse_censimento_cibarius, taa_altoadige_2023_08_08]
    derived: true
    data: available
    notes: >-
      Trentino-Alto Adige (2026-09-26): the lowland window is full from 15 June to 31 October and closed
      by 30 November, with no winter mode (Tuscany: 10 May to 15 December, zero on 25 January), and the
      mountain window is full to 15 September and closed by 20 October (Tuscany: 15 October and 15
      November). The 206 records of the region run June 12, July 74, August 72, September 31, October
      10, November 3 (and 3 winter records): against all the region's fungi records July is 2.3x the
      effort, August 1.5x, September 0.8x, October 0.4x. Above 1000 m the 134 located records have 15 in
      the first half of September, 5 in the second and 2 in October; below 1000 m the 27 are spread from
      25 May to 6 November. The north-east census profile peaks in August and is small by November
      (MUSE). In 2023 the finferli season in the Val Pusteria "è iniziata bene già alla fine di luglio"
      (Alto Adige, Bresadola Bolzano). The 600-1000 m handover is kept. Tuscany's GAL-02 + GAL-03
      follow. GAL-02 + GAL-03. Lowland window wraps the year end and keeps summer in on purpose:
      moisture and heat rules make the summer gap, and rainy summers do fruit. Tuscan records: spring
      mode May-June, trough July-August, big mode October-November running into January. The appendix
      blends the two windows linearly across 600-1000 m; this schema sums the weighted windows, which
      matches it.

  - id: season_two_flush
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: spring
          dates: ["15-04", "10-05", "30-06", "31-07"]
        - label: autumn
          dates: ["20-08", "20-09", "31-10", "30-11"]
    confidence: folklore
    source: [micoex2016_pallens, cacciatoridifunghi_finferli, mushma_occurrence_check_2026, mushma_occurrence_check_taa_2026]
    derived: true
    data: available
    enabled: false
    notes: >-
      GAL-04. Alternative to season, only for comparison in the backtest. Trentino-Alto Adige: the
      autumn window ends on 30 November, like the main season rule.

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        chestnut: 1.0
        evergreen_oak: 1.0
        fir_spruce: 1.0
        beech: 0.6
        mixed_broadleaf_conifer: 0.6
        mountain_pine: 0.6
        deciduous_oak: 0.3
        mediterranean_pine: 0.3
        mixed_broadleaf: 0.3
        macchia: 0.3
        transitional_woodland_shrub: 0.1
        other_conifer: 0.1
        riparian: 0.1
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source:
      [lagana1999_czech_mycol, olariaga2017, pilz2003, conedera2016_castanea, micoex2016_pallens, rt_tipi_forestali_p1, cacciatoridifunghi_finferli, mushma_habitat_share_2026, muse_censimento_cibarius, mushma_taa_forest_check_2026, taa_mandolini2025_larix, taa_mandolini2024_cembra]
    derived: true
    data: available
    notes: >-
      Trentino-Alto Adige (2026-09-26): fir/spruce to host (0.6 -> 1.0), mountain pine to secondary (0.3
      -> 0.6), other conifer to non-host (0.3 -> 0.1); the rest is Tuscany's. The Tuscan tiers were
      built on the Mediterranean segregates; the region's chanterelle is C. cibarius s.str. (169 of 191
      species-level records). Spruce: the census collections of the region are all in spruce or conifer
      woods ("Bosco misto con prevalenza di abete rosso" at 1350 and 1420 m, "Bosco subalpino di
      conifere" at 1700 m; MUSE), and the surroundings of the 50 located Trentino records at 1000-1500 m
      are 62 % spruce and 14 % fir against 30 % and 22 % of the woods there
      (mushma_taa_forest_check_2026). Scots pine: a census collection in a "Bosco misto con prevalenza
      di pino silvestre" at Piné (910 m; MUSE) and 15 % of the surroundings of the 18 records below 1000
      m; it is a secondary host, not a full one, because the woods there hold 21 % Scots pine. Larch and
      stone pine (the whole class here): no Cantharellus on their root tips in South Tyrol (Mandolini et
      al. 2025, 2024), and at 0.1 the habitat gate still averages 1.00 at the 48 located records in
      woodland cells at 1500 m or higher (cells 14 % larch and stone pine, 82 % spruce and fir) against
      0.95 over the woodland cells there (27 % and 67 %) on the region grid. Beech stays secondary: it
      holds 7 % of the surroundings of the records at 1000-1500 m against 25 % of the woods. Mixed
      broadleaf (here mostly hop-hornbeam) stays marginal: the hop-hornbeam woods hold 8 % of the
      surroundings of the records below 1000 m against 27 % of the woods. Transitional woodland/shrub
      moves from marginal to non-host (0.3 -> 0.1): the transitional class here is subalpine scrub,
      mountain-pine krummholz (mughete, 13,867 ha in Trentino, median 1779 m) and green alder (8,592 ha,
      median 1962 m), which the region config keeps out of the woodland mask but in the habitat mix;
      they hold 4 % of the surroundings of the records above 1500 m against 14 % of the woods. Tuscany's
      GAL-05 follows. GAL-05. Four levels (2026-09-24, mushma_habitat_share_2026): chestnut is strong,
      present in 9/9 Tuscan chestnut coppice plots and a calcifuge host, doubling as a soil-pH proxy ->
      host. Evergreen oak is also host: it is the main host of one segregate (C. alborufescens) and
      common for another (C. pallens), so the notes already weight it above its 5/10 Tuscan plot
      frequency. Beech (documented, but no Tuscan plot numbers), fir/spruce (2/7 plots) and mixed
      broadleaf+conifer (mean of host parts) are secondary. Deciduous oak, Mediterranean pine, mountain
      pine, mixed broadleaf, macchia, other conifer and transitional woodland/shrub are marginal: each
      is a class where only part of it is a documented host (deciduous oak's 1/4 calcicolous plots,
      Mediterranean pine's P. pinaster only, macchia only where a Fagaceae host is present, and so on).
      Riparian (Populus, a wet-site genus mention) is non-host at 0.1; exotic broadleaf (robinia, no
      ectomycorrhizal host, nitrogen-rich soil) is non-host at 0. Saturated to full credit from a
      host-weighted share of 0.30.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [null, null, 1700, 2100]}
    confidence: plausible
    source:
      [lagana1999_czech_mycol, muse_censimento_alborufescens, cacciatoridifunghi_finferli, myboletus_finferli, mushma_occurrence_check_2026, mushma_occurrence_check_taa_2026, muse_censimento_cibarius, taa_pat_tipi_forestali_2018, taa_bz_waldtypisierung2010]
    derived: true
    data: available
    notes: >-
      Trentino-Alto Adige (2026-09-26): full to 1700 m, zero at 2100 m (Tuscany: 1000 -> 1700 m). The
      161 located records: p10 849 m, median 1347 m, p75 1559 m, p90 1727 m, p95 1767 m, max 2161 m;
      44 at 1500-1800 m, 5 higher. The census has C. cibarius to 2040 m on the Trentino border
      (Passo Valles) and a Trentino collection in a subalpine conifer wood at 1700 m (MUSE). The
      subalpine spruce reaches about 2000 m (Tipi forestali del Trentino 2018), and in South Tyrol
      the subalpine spruce belt starts at 1450-1600 m on shady and 1600-1900 m on sunny slopes and
      is 200-400 m wide (Waldtypisierung Südtirol). Tuscany's GAL-06 follows.
      GAL-06. Tuscan Cantharellus records (n=116): median 289 m, p90 740 m, max 1431 m. Observer effort
      pulls the median low; keep the altitude gate permissive.

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: sum, window_days: 30}
    response: {trapezoid: [15, 70, null, null]}
    confidence: plausible
    source: [salerni2002_oak, straatsma2001, ivanochko2021, tahvanainen2020]
    derived: true
    data: available
    notes: GAL-08. 30-day window from the Tuscan oak study; 50-100 mm cumulative from Saskatchewan; edges derived.

  - id: rain_frequency
    role: driver
    weight: 0.5
    kind: count_days
    i18n_key: factor.rain_frequency
    input: {variable: precipitation_sum, op: gte, threshold: 5, window_days: 20}
    response: {trapezoid: [0, 3, null, null]}
    floor: 0.3
    confidence: plausible
    source: [micocyl2021, bmeteo_cantharellus]
    derived: true
    data: available
    notes: >-
      GAL-09. The number of rain events in the previous 15-20 days matters (Castilla y León program).
      0 days -> 0.3, 1 -> ~0.53, 2 -> ~0.77, >=3 -> 1 (the appendix steps are 0.3/0.6/0.85/1.0).
      Half weight because it overlaps rain_30d.

  - id: rain_trigger
    role: driver
    weight: 1
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 20, null, null]
      lag_days: [4, 10, 30, 50]
    confidence: plausible
    source: [pilz2003, rochon2011, ehlers_hobby2010, micocyl2021, cacciatoridifunghi_finferli]
    derived: true
    data: available
    notes: >-
      GAL-10. Onset about a week after wetting, flushes every 2-3 weeks, fruit bodies persisting 44 days
      on average: a long plateau and slow decay, the main structural difference from porcini.

  - id: soil_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.soil_temperature
    input: {variable: soil_temperature_0_to_7cm_mean, aggregate: mean, window_days: 7}
    response: {trapezoid: [5, 9, 20, 25]}
    confidence: folklore
    source: [straatsma1986_thesis, deshaware2021, bmeteo_cantharellus, mushma_occurrence_check_2026]
    derived: true
    data: available
    notes: >-
      GAL-13. No field temperature band exists; the lab mycelium optimum is 20-24 °C. The lower edges
      keep the December-January lowland records in; the upper zero sits where Tuscan summer soils are.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 7}
    response: {trapezoid: [4, 8, 21, 26]}
    confidence: folklore
    source: [straatsma1986_thesis, deshaware2021, bmeteo_cantharellus]
    derived: true
    data: available
    enabled: false
    notes: GAL-14. Fallback for soil_temperature, never both.

  - id: soil_moisture
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.soil_moisture
    input: {variable: soil_moisture_0_to_7cm_mean, aggregate: percentile_of_normal, window_days: 7}
    response: {trapezoid: [15, 40, null, null]}
    confidence: plausible
    source: [pilz2003, tahvanainen2020]
    derived: true
    data: derived
    enabled: false
    notes: >-
      GAL-11. The mycelium lives in the top 5-10 cm. The appendix weights 0-7 cm 0.6 and 7-28 cm 0.4;
      this draft uses 0-7 cm only. Needs the backfill climatology.

  - id: water_balance_60d
    role: stopper
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 60}
    response: {trapezoid: [-150, -30, null, null]}
    floor: 0.5
    confidence: plausible
    source: [salerni2002_oak, straatsma2001, tahvanainen2020]
    derived: true
    data: derived
    notes: GAL-12. A dry preceding two months damps the whole flush (x0.5 at <=-150 mm, x1 at >=-30 mm).

  - id: drought_14d
    role: stopper
    kind: window_aggregate
    i18n_key: factor.drought
    input: {variable: water_balance, aggregate: sum, window_days: 14}
    response: {trapezoid: [-70, -40, null, null]}
    floor: 0.2
    confidence: plausible
    source: [olariaga2017, pilz2003, ehlers_hobby2010, mushma_occurrence_check_2026]
    derived: true
    data: derived
    notes: >-
      GAL-17. Two dry, high-evaporation weeks suppress fruiting; floor 0.2 because fruit bodies persist
      and the Mediterranean segregates tolerate drought. The appendix applies it only when 14-day rain <
      10 mm; the 14-day water balance rarely falls below -40 mm otherwise.

  - id: heat
    role: stopper
    kind: window_aggregate
    i18n_key: factor.heat
    input: {variable: temperature_2m_max, aggregate: mean, window_days: 7}
    response: {trapezoid: [null, null, 29, 33]}
    floor: 0.3
    confidence: folklore
    source: [mushma_occurrence_check_2026, olariaga2017]
    derived: true
    data: available
    notes: GAL-18. A sustained hot spell suppresses fruiting; the only evidence is the July-August record trough.

  - id: heat_vpd
    role: stopper
    kind: window_aggregate
    i18n_key: factor.heat
    input: {variable: vapour_pressure_deficit_max, aggregate: mean, window_days: 7}
    response: {trapezoid: [null, null, 2.0, 3.0]}
    floor: 0.3
    confidence: folklore
    source: [mushma_occurrence_check_2026, olariaga2017]
    derived: true
    data: available
    enabled: false
    notes: GAL-18 alternative on dry air. The appendix applies the stronger of heat and heat_vpd; the schema has no max-of, so pick one.

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: -2, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.3
    confidence: folklore
    source: [ehlers_hobby2010, pilz2003]
    derived: true
    data: available
    notes: GAL-16. Repeated frost (Tmin <=-2 °C on 2+ of 7 nights) -> x0.3; persistent fruit bodies make a hard zero too strong.

  - id: hard_frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: -5, window_days: 10}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: folklore
    source: [ehlers_hobby2010]
    derived: true
    data: available
    notes: GAL-16. Any Tmin <=-5 °C in the last 10 days -> 0.

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 10}
    response: {trapezoid: [null, null, 4, 5]}
    confidence: folklore
    source: [ehlers_hobby2010]
    derived: true
    data: available
    notes: GAL-16. >=5 cm of snow -> 0 for about 10 days.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 4, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.8
    confidence: folklore
    source: [forager_wind_pages, pilz2003]
    derived: true
    data: available
    notes: >-
      GAL-19. No gallinacci source: the porcini drying rule at half effect (floor 0.8 instead of 0.6),
      because long-lived fruit bodies dry slowly.

  - id: soil_ph
    role: gate
    kind: static_band
    i18n_key: factor.soil_ph
    input: {attribute: soil_ph}
    response: {trapezoid: [3.5, 4.0, 6.0, 7.8]}
    floor: 0.3
    confidence: plausible
    source: [pilz2003, olariaga2017, lagana1999_czech_mycol, jansen_van_dobben1987, straatsma1986_thesis, deshaware2021]
    derived: true
    data: available
    enabled: false
    notes: >-
      GAL-20. Field range pH 4.0-5.5 for the acidophilous members; softened (floor 0.3, full to 6.0)
      because C. alborufescens prefers limestone. Tuscan plots: about 10x lower abundance on calcareous
      oak plots (pH 6.8-7.4) than in chestnut, with host and substrate confounded. The woodland grid now
      carries SoilGrids 2.0 topsoil pH (0-30 cm, modelled at 250 m; woodland cells median 6.64, range
      5.44-7.66, see woodland-grid.md), so the rule can run. It stays disabled: SoilGrids is a hint with
      wide uncertainty, and the gallinacci records are too few for the backtest to tell it apart.

  - id: lithology
    role: gate
    kind: static_band
    i18n_key: factor.lithology
    input: {attribute: lithology_calcareous}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.4
    confidence: plausible
    source: [lagana1999_czech_mycol, olariaga2017, rt_db_geologico]
    derived: true
    data: missing
    enabled: false
    notes: >-
      GAL-21, the cheaper proxy for soil_ph: calcareous share of the cell (0-1) -> x1 siliceous, ~x0.7
      mixed, x0.4 calcareous. The appendix exempts evergreen oak on limestone (x0.8), which needs a
      habitat interaction the schema lacks.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [null, null, 105, 120]}
    floor: 0.85
    where: {attribute: elevation_m, trapezoid: [null, null, 500, 700]}
    confidence: folklore
    source: [olariaga2017, myboletus_finferli]
    derived: true
    data: derived
    notes: >-
      GAL-07. Below 600 m, moister north- and east-facing slopes get a slight edge (S/SW/W x0.85), but
      flat, east- and west-facing ground is normal for Tuscan woodland and scores full credit: only
      clearly sunny slopes lose it. On 15 Oct the cell's sun ratio (its clear-sky sun as a % of flat
      ground's) runs p10 89 %, p25 95 %, median 100 %, p75 105 %, p90 111 % (2026-09-24): x1 up to 105
      %, about the p90, x0.85 from 120 %, fading out between 500 and 700 m. The source limits it to
      June-September; the engine cannot, but the sun ratio is near 1 outside the low autumn sun only in
      midsummer, so the effect is small out of season anyway. Read on the day's sun ratio, the cell's
      sun as a percentage of flat ground's (api.model.terrain), so it bites hardest in autumn, when the
      sun is low. The terrain microclimate already makes sunny slopes warmer and drier for every rule;
      this line is the species' own preference on top of that, kept soft. Trentino-Alto Adige: kept from
      Tuscany. On 15 Oct the woodland cells of the region grid below 600 m run p10 76 %, p25 86 %,
      median 97 %, p75 108 %, p90 117 % (Tuscany 89/95/100/105/110 % below 1000 m): the steep valley
      sides spread the sun ratio wider, so the line docks more of the few low woods, at most by its
      floor. The band is kept as a statement about sun and drying, not re-anchored to the region's
      percentiles (2026-09-26).

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 35, 45]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979, mushma_taa_forest_check_2026, taa_bz_wald_flaechen]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby 1979), but a
      1 km cell's mean slope is not the slope of the exact spot the mushrooms grow on: normal terrain
      for Tuscan woodland scores full credit, and only clearly steep cells lose it. Woodland cells on
      the Tuscan grid run p10 10.2°, p25 12.6°, median 16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up
      to 25°, about the p90, x0.8 from 40°. Mushroom production fell with slope in Pyrenean Scots pine
      (Bonet 2008), and B. edulis yield was highest under about 11° on plots in north-east Turkey (Mumcu
      Küçüker 2019); two Spanish studies found no slope effect (Martínez-Peña 2012, Taye 2016). It acts
      on the score only, never on the rain, so the same water is not counted twice. Trentino-Alto Adige
      (2026-09-26): the band moves onto the region's woods by the same rule, normal terrain at full
      credit. The 7,698 woodland cells of the region grid run p10 17.6°, p25 22.2°, median 26.9°, p75
      31.0°, p90 34.5°, p99 40.2°, max 44.7° (Trentino and South Tyrol alike: p90 34.8° and 34.1°): 62 %
      are steeper than 25°, against 13 % in Tuscany. South Tyrol is as steep ("Over two-thirds" of its
      forest on slopes over 40 %, that is 22°, Forstdienst). x1 up to 35° (about the p90), x0.8 from 45°
      (about the max, as 40° is on the Tuscan grid).

