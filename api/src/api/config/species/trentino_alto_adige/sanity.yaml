contrasts:
- id: fiemme_2019_2021
  claim: 'Val di Fiemme, late August to September: 2019 "è stata caratterizzata da una scarsa crescita
    nei mesi di giugno-luglio, mentre molto meglio sono andati i mesi di agosto e settembre" (Magnifica
    Comunità di Fiemme, via Trentino, 2019-11-07); 2021: porcini "ci sono stati, un paio di volte, e poi
    basta. Diciamo però che finora la stagione è stata misera misera" (Sportello Micologico of Cavalese
    and Predazzo, via l''Adige, 2021-09-22)'
  source: https://www.giornaletrentino.it/cronaca/fiemme-e-fassa/nonostante-la-tempesta-vaia-ottima-annata-per-i-fungaioli-1.2175281
  higher:
