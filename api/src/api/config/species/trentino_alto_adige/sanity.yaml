    - 2021
    start: 08-20
    end: 09-20
- id: alta_valsugana_2020_2021
  claim: 'Alta Valsugana, Piné and the Vezzena, late August to late September: 2020 "Soprattutto ad agosto
    ... c''è stata una buona raccolta, le condizioni climatiche sono state ideali" (Pergine mycological
    group, l''Adige, 2020-09-10) and on 26 September at Passo Vezzena "le ultime «brise» di una stagione
    davvero fortunata" (l''Adige); 2021 "ottima fino alla metà di agosto, poi un ‘rebalton’ meteorologico
    ha compromesso, particolarmente in quota" (l''Adige, 2021-09-22), with "Segni di cedimento delle nascite
    appunto in Valsugana, Baselga di Pine''" (Funghi Magazine, 2021-08-15)'
  source: https://www.ladige.it/territori/pergine/funghi-una-buona-stagione-agosto-doro-e-purtroppo-anche-i-primi-intossicati-jm5241fz
