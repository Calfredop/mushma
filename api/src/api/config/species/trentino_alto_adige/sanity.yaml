    estiva di quest''anno è iniziata prima" (Gruppo Micologico Bresadola, il Dolomiti, 2023-08-02); 2022
    "Il caldo di quest''ultimo periodo ha portato alla quasi completa assenza di funghi non soltanto nei
    boschi del Trentino ma anche in quelli dell''Alto Adige" (il Dolomiti, 2022-07-20)'
