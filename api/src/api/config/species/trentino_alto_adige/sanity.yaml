# Press-contrast sanity check for Trentino-Alto Adige (api.model.sanity).
# Areas by comuni (ISTAT 2025 names exactly as the grid's comune_name carries them: the ISTAT
# COMUNE field, which for South Tyrol is bilingual, e.g. "Brunico/Bruneck") or by province sigla
# (TN, BZ; "*" is the whole region). Windows and source URLs written down on 2026-09-26, before
# any score for the region existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`gallinacci_...`); read those with `--group gallinacci`. No ovoli claim was found.
# Every main source was opened and its quote checked. Several rest on Funghi Magazine's weekly
# bulletins, which often reason from rain gauges: those partly test the rain data, not only the
# fruiting. Quotes, second sources and weaknesses per contrast:
# .gavin-root/docs/species-ecology/trentino_alto_adige.md (Press contrasts).
