- id: region_early_august_2025
  claim: 'Trentino-Alto Adige, late July to early August 2025: "Fino alla settimana scorsa la raccolta
    è andata bene" ("finora è un''ottima stagione", Gruppo Micologico Bresadola, l''Adige, 2025-08-13);
    "la grande buttata che ha interessato soprattutto Trentino-Alto Adige, Veneto e Friuli Venezia Giulia",
    "Chi ha passato le vacanze in Trentino non avrà potuto non notare i Porcini ovunque" (Funghi Magazine,
