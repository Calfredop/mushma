# Press-contrast sanity check for Sardegna (api.model.sanity).
# Areas by comuni (ISTAT 2025 names, all in Sardinia; Sardinia's provinces were redrawn in 2016 and
# 2025, the comuni were not) or provinces ('*' is the whole region). Windows and source URLs written
# down on 2026-09-30, before any Sardinia score existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); read those with `--group ovoli` / `--group gallinacci`.
# Sources: Funghi Magazine's national bulletins (read through Wayback Machine captures; the live site
# shows a captcha), whose Sardinia paragraphs come from readers and name sectors of the island
# ("settori occidentali", "Nord ed Est", "Cagliaritano") more often than comuni; and the island's
# local press (L'Unione Sarda, La Nuova Sardegna, Cagliaripad, Casteddu Online, Olbia.it, Gallura
# Oggi), the ASL Gallura's mycological inspectorate and a hiking blog of the Arburese (NAlife). Many
# press items are giant-porcino stories; only those that also say how the season went were used.
# ANSA, Rai TGR, Sardinia Post and the Today network block AI agents and were not fetched. Quotes,
# second sources and weaknesses per contrast: .gavin-root/docs/species-ecology/sardegna.md (Sanity
# contrasts).
