contrasts:
- id: gennargentu_2018_2020_early_september
  claim: 'Late summer 2018: ''Le piogge numerose e il caldo umido hanno creato l''ambiente perfetto per
    i funghi che quest''anno abbondano nei boschi della Sardegna. Porcini, ovuli'', ''già i primi funghi
    cominciano a vedersi nelle zone di montagna come Desulo, Tonara e Fonni'' (ANSA via IteNovas, September
    2018); ''hanno infatti anticipato la stagione di raccolta con una super produzione di funghi in varie
    zone dell''Isola'' (Casteddu Online, 2018-08-23); ''Sardegna e Sicilia ... hanno avuto piogge di gran
    lunga superiori alle attese e nascite di funghi eccezionali'' (FM 2018-08-31). Late summer 2020: ''nascite
    nulle ... in tutta la Sardegna continuamente sferzata da venti caldi e secchi'' (FM 2020-08-20), ''i
    20/30 mm giunti dopo una lunghissima fase siccitosa ed assai calda potranno avere effimeri effetti''
    (FM 2020-09-04), ''Cestini vuoti per adesso anche in Sardegna'' (Campagna Amica, 2020-09-14)'
  source: https://www.itenovas.com/in-tavola/3431-funghi-sardegna-2018-e-annata-eccezionale.html
  higher:
    area: gennargentu
    seasons:
    - 2018
    start: 08-25
    end: 09-15
  lower:
    area: gennargentu
    seasons:
    - 2020
    start: 08-25
    end: 09-15
- id: sardegna_2018_2019_june
  claim: 'June 2018: ''Sardegna sempre protagonista con nascite ora non più soltanto nella macchia ma
    ora anche nei boschi di collina e montagna. Qua è piovuto davvero tantissimo nelle ultime settimane''
    (FM 2018-06-16), ''Sicilia e Sardegna con nascite abbondanti, non solo nelle zone interne ma anche
    lungo le macchie costiere'' (FM 2018-07-01); June-July 2019: ''Vento dominante in Sardegna con siccità
    ad oltranza e nascite di funghi praticamente nulle'' (FM 2019-07-03), ''Eclatante la Sardegna con
    i suoi periodi lungamente ventosi e siccitosi e nascite di funghi quasi del tutto assenti'' (FM 2019-07-08)'
  source: https://web.archive.org/web/20220930220913/https://funghimagazine.it/aggiornamento-funghi-16-giugno-2018/
