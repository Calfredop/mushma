- id: sardegna_2023_2021_late_spring
  claim: 'Late May-June 2023: ''Porcini Neri in quantità si trovano già in Sardegna, per lo più sui settori
    meridionali'' (FM 2023-05-25), ''La Sardegna e la Sicilia, finalmente, dopo un lungo attendere, stanno
    registrando ottime nascite di Porcini Neri'' (FM 2023-06-15), a porcino at Seulo ''di inizio stagione''
    (L''Unione Sarda, 2023-06-01), the Gallura inspectorate reopened because ''Le piogge registrate con
    alta frequenza e intensità nel mese di maggio e nei primi giorni di giugno hanno ... alimentato la
    crescita dei funghi'' (ASL Gallura, 2023-06-09); 2021: ''Maggio 2021 si è rivelato essere un mese
    disastroso, dal punto di vista delle nascite di Porcini e Leccini in Sardegna, a causa del persistere
    del forte vento secco'' (FM 2021-05-30), ''una fase climatica semplicemente avversa per i funghi''
    (FM 2021-06-24)'
  source: https://web.archive.org/web/20240417084120/https://funghimagazine.it/aggiornamento-funghi-16-06-2023/
