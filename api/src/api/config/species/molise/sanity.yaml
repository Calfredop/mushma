# Press-contrast sanity check for Molise (api.model.sanity).
# Areas by comuni (ISTAT names, 2025) or provinces; windows and source URLs written down on
# 2026-09-30, before any Molise score existed. `seasons: normal` expands to `normal_seasons`.
# The schema has no group field: contrasts are porcini unless the id starts with the group
# (`ovoli_...`, `gallinacci_...`); read those with `--group ovoli` / `--group gallinacci`.
# Evidence, second sources and weaknesses per contrast: .gavin-root/docs/species-ecology/molise.md.
# Molise local press almost never says how a mushroom season went (it reports lost foragers,
# permits and recipes). Sixteen of the seventeen contrasts rest mainly on Funghi Magazine's national
# bulletins (read through Wayback Machine captures, or the live site where robots.txt allows),
# whose Molise lines are one or two sentences; the others on a Campobasso mushroom show (2017) and,
# as second sources, Il Giornale del Molise, L'Eco dell'Alto Molise, Coldiretti and a Molise forager
# blog. Areas: the region, its two provinces, the Alto Molise, the mountain belt (Alto Molise tops,
# Matese, Montagnola di Frosolone, Mainarde), the hills of the Basso Molise and Fortore, and the
# Isernia comuni on the L'Aquila border.
