- id: molise_october_2022_2023
  claim: 'First half of October: in 2022 "le grandi nascite in atto al momento in Toscana, Umbria, Marche,
    Abruzzo, Molise, Campania" (mostly black porcini; Funghi Magazine, 2022-10-13), and a 750 g porcino
    near Sant’Elia a Pianisi with "gli altri raccolti che sono comunque notevoli per dimensioni" (Il Giornale
    del Molise, 2022-10-20); in 2023 "Anche nel Molise ci sono state buone piogge ma, come in Abruzzo,
    il vento di Tramontana ha di fatto bloccato ogni velleità porcina" (2023-10-12), and looking back
    "ogni pioggia è stata seguita o caratterizzata da forte vento che, di fatto ha inibito le nascite
    con pochi cenni e nessuna vera buttata" (Funghi Magazine, 2023-10-27)'
