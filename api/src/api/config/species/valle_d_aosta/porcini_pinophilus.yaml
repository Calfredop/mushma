# Species rules for one key in VALLE D'AOSTA, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Valdostan and neighbouring Alpine sources: .gavin-root/docs/species-ecology/valle_d_aosta.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_pinophilus
group: porcini
taxon: Boletus pinophilus
synonyms: [Boletus pinicola]
status: draft
i18n_key: species.porcini_pinophilus
records:
  gbif_taxon_keys: [5954949]
  inat_taxon_ids: [335942]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    Only 3 GBIF and 7 iNaturalist Tuscan records (2026-09-17). "Boletus pinicola" does not match in the GBIF
    backbone (it resolves to class level), so map verbatim names to 5954949 by hand in the ingest. Valle
    d'Aosta: 3 iNaturalist records (2026-09-29; July 2021 at the Col de Joux, August 2024 at La Salle,
    September 2018 at Courmayeur, 1799 m), 1 on GBIF (a copy). SwissFungi has 15 in Valais.
notes: >-
  Valle d'Aosta: one May-November window at every elevation (no summer gap), Scots pine a full host, larch and
  the subalpine scrub non-host, the band moved onto the Alpine belts; weather rules unchanged. The most
  cold-tolerant porcino, and the earliest and latest to fruit. Hosts disagree between sources (pines only in
  the Netherlands, beech, fir and chestnut in Italy); the Italian view is used.

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [0, 18, 30]
    reference_c: 15
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.0, 2.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, blog_prevedere_porcini, funghimagazine_giorni_pioggia]
  derived: true
  notes: >-
    POR-R3, transferred from B. edulis (the cool-climate porcino, earliest and latest in the year). The pace
    is 1 at 15 °C of topsoil, the weather the lag window was drawn from. Fruit bodies develop at a lower
    optimum than mycelium grows in culture (B. edulis 25-28 °C; Moore et al. 2008), hence t_opt 18 °C. A 9 °C
    stretch runs at about 65 % pace. Caps stop growing when the day's minimum humidity falls under 40 % and
    grow well from about 60 % (Kasparavičius 2001, B. edulis): open-air daily maximum VPD of 1.0 kPa keeps
    full pace and 2.0 kPa halves it; the floor stands for the moister air under the canopy. No peer-reviewed
    days-per-°C figure exists for these species: every number is a prior.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: late_spring_autumn
          dates: ["01-05", "25-05", "10-10", "10-11"]
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, muse_censimento_boletus, museo_porcino_borgotaro, micoweb_pinophilus, muse_censimento_pinophilus, mushma_occurrence_check_vda_2026, mushma_swissfungi_check_2026, vda_peretti1999_mont_avic, vda_marra2001_macromiceti, vda_fm_2024_05_31, vda_fm_2024_07_25]
    derived: true
    data: available
    notes: >-
      Valle d'Aosta (2026-09-29): one window, full from 25 May to 10 October and closed by 10 November, as in
      Trentino-Alto Adige (Tuscany: a spring and an autumn window with a gap from 20 July to 15 August). The
      region has no summer gap on record: Funghi Magazine had the first "Porcini Rossi-Pinicola (B.
      pinophilus)" at the end of May 2024 ("Altezze medie 800/1000 metri", in open, sunny mixed woods of the
      south-east), good pickings in late June and a "bellissima e insolita buttata" that was over by late
      July; in 2023 foehn heat ended them in early July; in August 2021 "radi anche Porcini Pinicola in
      quota". The iNaturalist records fall in July, August and September; the older collections at Cogne
      (September 1971), in the Val Ferret (25 September and 10 October 1979; Marra 2001) and at Mont Avic (1
      September to 8 October 1999, 1750-1850 m; Peretti et al. 1999) are late summer and autumn; in Valais
      (SwissFungi, 15 records) June 1, July 1, August 4, September 6, October 3. The census calls it "più
      precoce e più tardiva" of the Boletus, 12 May to 28 October in the north-east. The spring flush is on
      the low sunny slopes and the late one at altitude; the temperature, frost and snow rules make that
      split. Tuscany's POR-S4 follows. POR-S4. A summer form from June in chestnut and an autumn form under
      beech and fir (IGP). The spring flush is the least certain part. Too few records to cross-check.

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        beech: 1.0
        fir_spruce: 1.0
        chestnut: 1.0
        mountain_pine: 1.0
        mixed_broadleaf_conifer: 0.6
        mediterranean_pine: 0.3
        deciduous_oak: 0.3
        mixed_broadleaf: 0.3
        other_conifer: 0.1
        transitional_woodland_shrub: 0.1
        evergreen_oak: 0.1
        macchia: 0.0
        riparian: 0.0
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, muse_censimento_boletus, museo_porcino_borgotaro, beugelsdijk2008, mushma_habitat_share_2026, muse_censimento_pinophilus, mushma_swissfungi_check_2026, swissfungi_wsl, vda_tipi_forestali_2007, vda_carta_forestale_2020, vda_marra2001_macromiceti, vda_peretti1999_mont_avic, taa_mandolini2025_larix, vda_fm_2024_06_14]
    derived: true
    data: available
    notes: >-
      Valle d'Aosta (2026-09-29): mountain pine rises from secondary to host (0.6 -> 1.0), other conifer and
      transitional woodland/shrub fall to non-host (0.3 -> 0.1). Mountain pine here is Scots pine (9,614 ha,
      "in una fascia altitudinale compresa fra (500) 600 e 1.600 (1.700) m", almost unbroken on the sunny side
      of the central valley between Verrayes and Morgex) and erect Pinus uncinata (3,247 ha, Mont Avic); the
      census calls B. pinophilus "frequentemente legato al pino silvestre", Scots pine is its commonest named
      partner in Switzerland (10 of the 37 records naming a tree, 14 with the unnamed pines), and in the
      region it was collected in "boschi di Larix, Betula verrucosa, Sorbus aucuparia e Pinus sylvestris" in
      the Val Ferret (Marra 2001) and under Pinus uncinata at Mont Avic (Peretti et al. 1999); Funghi
      Magazine's 2024 reports have it "in boschi misti a base di Pino o Abete con Faggi o Castagni". Larch is
      2 of those 37 and holds no Boletus on its roots (Mandolini et al. 2025); the region's larch stands carry
      at most 14 % of other trees (see porcini_edulis): non-host, the same choice and the same first knob as
      for B. edulis. Transitional here is green-alder scrub. Tuscany's POR-H2 follows. POR-H2. Four levels
      (2026-09-24, mushma_habitat_share_2026): beech, fir and chestnut are the Italian-source hosts ("mainly
      with beech, fir and chestnut", preferred over the Dutch phylogeny paper's pine-only claim for this
      Tuscan file) -> host. Mixed broadleaf+conifer (a beech-fir mix, both hosts, capped below host for
      dilution) and mountain pine (often Pinus sylvestris, "moderate") stay secondary. Other conifer,
      Mediterranean pine, deciduous oak, mixed broadleaf and transitional woodland/shrub are marginal: "many
      pines" and "also broadleaves" are named only generically, and the mixed/transitional classes are diluted
      by design. Evergreen oak, macchia, riparian and exotic broadleaf are non-host: this cool/humid taxon has
      no source support there. Saturated to full credit from a host-weighted share of 0.30.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [400, 700, 1900, 2300]}
    confidence: plausible
    source:
      [borgotaro_igp_rt, matteucci2008_micoponte, muse_censimento_boletus, rt_tipi_forestali_p4, muse_censimento_pinophilus, mushma_occurrence_check_vda_2026, vda_peretti1999_mont_avic, vda_tipi_forestali_2007, vda_fm_2024_05_31]
    derived: true
    data: available
    notes: >-
      Valle d'Aosta (2026-09-29): full from 700 m to 1900 m, zero at 400 m and 2300 m (Tuscany: 300 -> 800 ...
      1600 -> 1900). Records: 1799 m at Courmayeur, 1750-1850 m under Pinus uncinata at Mont Avic, the Val
      Ferret at 1600-1800 m, and the spring flush of 2024 at "800/1000 metri"; SwissFungi's Valais records run
      611-2001 m and the north-east census to 1898 m. Its hosts span the same belts: Scots pine (500) 600-1700
      m, spruce (1000) 1200-1800 (2000) m, Pinus uncinata 1300-2200 m (Tipi forestali della Valle d'Aosta).
      The top matches B. edulis; the bottom stays above the chestnut and downy-oak floor of the Bassa Valle.
      Tuscany's POR-A2 follows. POR-A2. Cool, humid mountain sites; the summer form also in mid-altitude
      chestnut.

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: plausible
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-R1 + POR-R2, transferred from B. edulis.

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: plausible
    source: [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1, transferred from B. edulis and community studies. Tuned (2026-09-22): the absolute 20->80 mm
      ramp was full in an ordinary September, so the 30 days are scored as a percentage of the cell's own
      normal for those days (2016-2025 reanalysis, downscaled and rain-scaled like the rain): 0 at 50 %, full
      from 125 %. It raised the porcini train objective by 0.03 with or without the rain scale, and the
      hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [4, 8, 15, 20]}
    confidence: plausible
    source: [muse_censimento_boletus, matteucci2008_micoponte, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: POR-T2. The coolest band, from "copes better with cool climates". Low confidence within plausible.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d; compare in the backtest.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.5
    confidence: plausible
    source: [salerni2023_amiata, andrew2025]
    derived: true
    data: derived
    notes: POR-X1, as for B. edulis.

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.2
    confidence: folklore
    source: [borgotaro_igp_rt, brejon_hoffman2026_preprint, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X3.

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: folklore
    source: [borgotaro_igp_rt, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 4, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-X6. All numbers are guesses.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [null, null, 105, 125]}
    floor: 0.8
    where: {attribute: elevation_m, trapezoid: [null, null, 900, 1100]}
    confidence: folklore
    source: [rt_tipi_forestali_p4, bmeteo_pioggia_funghi, bonet2008, mumcu_kucuker2019, mushma_vda_terrain_check_2026]
    derived: true
    data: derived
    notes: >-
      POR-A5. Below 1000 m, north-facing slopes keep moisture in hot spells and hold the conifer hosts (N
      x1.0, E/W x0.9, S x0.8), but flat, east- and west-facing ground is normal for Tuscan woodland and scores
      full credit: only clearly sunny slopes lose it. On 15 Oct the cell's sun ratio (its clear-sky sun as a %
      of flat ground's) runs p10 89 %, p25 95 %, median 100 %, p75 105 %, p90 111 % (2026-09-24): x1 up to 105
      %, about the p90, x0.8 from 125 %, fading out between 900 and 1100 m. North aspect raised production in
      dry Pyrenean pine (Bonet 2008), while a humid Turkish forest found north slopes worst for B. edulis
      (Mumcu Küçüker 2019): the preference is kept to low altitude, where water limits fruiting. Read on the
      day's sun ratio, the cell's sun as a percentage of flat ground's (api.model.terrain), so it bites
      hardest in autumn, when the sun is low. The terrain microclimate already makes sunny slopes warmer and
      drier for every rule; this line is the species' own preference on top of that, kept soft. Valle d'Aosta:
      kept from Tuscany. On 15 Oct the region's woodland cells below 1000 m run p10 66 %, median 98 %, p90 124
      % of flat ground's sun (mushma_vda_terrain_check_2026; Tuscany 89/100/110 %), so the line docks about
      two fifths of the low woods, at most by its floor; the band is kept as a statement about sun and drying,
      not re-anchored to the region's percentiles (2026-09-29).

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 36, 45]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979, mushma_vda_terrain_check_2026]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby 1979), but a 1 km
      cell's mean slope is not the slope of the exact spot the mushrooms grow on: normal terrain for Tuscan
      woodland scores full credit, and only clearly steep cells lose it. Woodland cells on the Tuscan grid run
      p10 10.2°, p25 12.6°, median 16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up to 25°, about the p90, x0.8
      from 40°. Mushroom production fell with slope in Pyrenean Scots pine (Bonet 2008), and B. edulis yield
      was highest under about 11° on plots in north-east Turkey (Mumcu Küçüker 2019); two Spanish studies
      found no slope effect (Martínez-Peña 2012, Taye 2016). It acts on the score only, never on the rain, so
      the same water is not counted twice. Valle d'Aosta (2026-09-29): the band moves onto the region's woods
      by the same rule, normal terrain at full credit. The region grid was not built yet, so the woods were
      approximated by the 1 km cells (EPSG:3035, inside the ISTAT boundary) at least half covered by trees on
      ESA WorldCover 2021, with slopes from the Copernicus 30 m DEM, the grid's own method
      (mushma_vda_terrain_check_2026): 1,174 cells, slope p10 20.4°, p25 24.2°, median 28.5°, p75 32.8°, p90
      36.5°, p99 40.1°, max 44.4°; 72 % are steeper than 25° (Tuscany 13 %), the steepest woods of any region
      so far. x1 up to 36° (about the p90), x0.8 from 45° (about the max, as 40° is on the Tuscan grid), close
      to Trentino-Alto Adige's 35°/45°. Recheck against the region grid's woodland cells once it is built.

known_gaps:
  - id: wood_edge
    description: POR-H5. Shrub, meadow and pasture within 100 m of a qualifying wood is productive.
    needs: [M2 grid, a woodland edge buffer when building habitat fractions]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014]
  - id: soil
    description: POR-N1. "Poor, acid, sandy soil" in Dutch sampling.
    needs: [soil_ph, soil_texture]
    confidence: plausible
    source: [beugelsdijk2008]
