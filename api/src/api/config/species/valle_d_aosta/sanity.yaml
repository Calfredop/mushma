    nascite di funghi Porcini anche in Val d''Aosta", "In tutta la regione le piogge sono state abbastanza
    democratiche" (Funghi Magazine, 2023-08-17); 2022 "l''intera Val d''Aosta, con poche eccezioni per i settori
    orientali" among the zones "leggermente o assai più sfavorite" (Funghi Magazine, 2022-08-18) and "Fanalino di
    coda Val d''Aosta, baciata da piogge sempre troppo brevi, irrisorie e spesso seguite da vento secco" (Funghi
    Magazine, 2022-08-26)'
