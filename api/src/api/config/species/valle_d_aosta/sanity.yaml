# Press-contrast sanity check for Valle d'Aosta (api.model.sanity).
# Areas by comuni (ISTAT 2025 names, as the grid's comune_name carries them: note "Etroubles" and
# "Emarèse" without an accent on the E) or by province sigla ("*" is the whole region, AO its only
# province). Windows and source URLs written down on 2026-09-29, before any score for the region
# existed. `seasons: normal` expands to `normal_seasons`. All contrasts are porcini (run with the
# default `--group porcini`): the chanterelle notes found were one-sided or contradicted each other,
# and ovoli are not modelled in the region.
# The Valdostan papers (AostaSera, AostaOggi, Gazzetta Matin, La Vallée Notizie, Bobine.tv, 12vda,
# Valledaostaglocal) print incidents, seizures and USL notices but no season comparisons; La Stampa
# Aosta and Rai TGR could not be read. So every contrast rests on Funghi Magazine's weekly
# bulletins (one editor, reader reports and rain-gauge reasoning): several partly test the rain
# data, not only the fruiting. Every main source was opened and its quote checked. Quotes, second
# sources and weaknesses per contrast: .gavin-root/docs/species-ecology/valle_d_aosta.md (Press
# contrasts).
