# Species rules for one key in VALLE D'AOSTA, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Valdostan and neighbouring Alpine sources: .gavin-root/docs/species-ecology/valle_d_aosta.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_reticulatus
group: porcini
taxon: Boletus reticulatus
synonyms: [Boletus aestivalis]
status: draft
i18n_key: species.porcini_reticulatus
records:
  gbif_taxon_keys: [5954691]
  inat_taxon_ids: [350216]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    GBIF taxonKey 5954691 includes the synonym B. aestivalis (5954988). 28 of 39 Tuscan GBIF rows are soil-DNA
    MATERIAL_SAMPLE records from the 2019 "Global soil organisms" dataset: exclude them. Validate the porcini
    group score, not this key alone. Valle d'Aosta: 3 iNaturalist records (2026-09-29), all in June, at
    Pont-Saint-Martin (2020, about 430 m, coarse location) and Quart (2024, 789 m); GBIF adds nothing. Too few
    to test anything: the numbers below lean on the neighbouring Alps.
notes: >-
  Valle d'Aosta: the Tuscan rules with a September close, the altitude ceiling moved up to the montane spruce
  and fir, and the subalpine scrub and the region's mostly non-host "mixed broadleaf" lowered; weather rules
  unchanged (no numbers from the region). A marginal key here: its hosts (chestnut, downy and sessile oak,
  beech) are a tenth of the region's woods, in the Bassa Valle and on the low sunny slopes of the central
  valley. The summer porcino ("fungo del caldo"). No quantitative weather study exists for this taxon: the
  rain logic is borrowed from B. edulis, temperature and cold-night rules are shifted using qualitative
  sources.

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [2, 21, 32]
    reference_c: 17
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.5, 3.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, bmeteo_funghi_luglio, funghimagazine_giorni_pioggia]
  derived: true
  notes: >-
    POR-R3 for the summer porcino. The pace is 1 at 17 °C of topsoil, the weather the lag window was drawn
    from. Fruit bodies develop at a lower optimum than mycelium grows in culture (B. edulis 25-28 °C; Moore et
    al. 2008), hence t_opt 21 °C. Thermophilic porcini appear 8-11 days after warm summer storms (lore); a 12
    °C stretch runs at about 65 % pace. Caps stop growing when the day's minimum humidity falls under 40 % and
    grow well from about 60 % (Kasparavičius 2001, B. edulis): open-air daily maximum VPD of 1.5 kPa keeps
    full pace and 3.0 kPa halves it; the floor stands for the moister air under the canopy. No peer-reviewed
    days-per-°C figure exists for these species: every number is a prior. The humidity ramp is set higher than
    for the autumn porcini because it fruits in summer, when open-air VPD is 2 kPa on a median July day.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: late_spring_summer
          dates: ["01-05", "01-06", "15-09", "20-10"]
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, museo_porcino_borgotaro, mushma_occurrence_check_2026, mushma_occurrence_check_vda_2026, mushma_swissfungi_check_2026, swissfungi_wsl, vda_fm_2024_07_25, vda_fm_2024_06_28]
    derived: true
    data: available
    notes: >-
      Valle d'Aosta (2026-09-29): full from 1 June to 15 September, closed by 20 October (Tuscany: full to 30
      September, zero on 15 November), as in Trentino-Alto Adige. The region's 3 records are all June. Around
      it (iNaturalist, the region and 30-60 km beyond it into Piemonte, Valais and Savoie: 21 records) June is
      3.9x the effort, July-September 1.1-1.3x and October 0.4x (one record, at 1830 m in Savoie); in Valais
      (SwissFungi, 17 records) June is 6.1x, July 2.3x, August 1.4x, September 0.3x and October 0. Funghi
      Magazine's Valdostan reports put the "Porcini estivi" in late June (2024: "in boschi di latifoglie di
      media e bassa quota, fino a fondovalle"), early July (2023, "tra le faggete"), late July (2024:
      "numerosi Porcini estatini/reticulatus", already old at the lowest sites) and early August (2021, "a
      fondovalle"). The summer mode is the taxon's here too; the autumn tail is thin, so the gate closes
      earlier and the cold-night and frost rules end it. Tuscany's POR-S1 follows. POR-S1, tail widened by the
      occurrence cross-check: central-Italy iNaturalist records are over-represented Jun–Sep (4.2x, 2.7x,
      1.8x, 2.6x vs all fungi) and still 0.8x in October (9 records), so the ramp now ends mid-November
      instead of 31 October.

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        chestnut: 1.0
        deciduous_oak: 1.0
        beech: 0.6
        fir_spruce: 0.6
        mountain_pine: 0.6
        mixed_broadleaf_conifer: 0.6
        mixed_broadleaf: 0.3
        evergreen_oak: 0.3
        transitional_woodland_shrub: 0.1
        mediterranean_pine: 0.1
        other_conifer: 0.1
        macchia: 0.1
        riparian: 0.05
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, museo_porcino_borgotaro, beugelsdijk2008, santolamazza2023, mushma_habitat_share_2026, vda_tipi_forestali_2007, vda_carta_forestale_2020, vda_marra2000_lago_villa]
    derived: true
    data: available
    notes: >-
      Valle d'Aosta (2026-09-29): two classes lowered, every other tier Tuscany's. Mixed broadleaf goes from
      secondary to marginal (0.6 -> 0.3): here it is the acero-tiglio-frassineti (5,954 ha, 94 % of them
      invasion woods on abandoned land) and the boscaglie pioniere (6,171 ha: rocky pioneer scrub 46 %, other
      pioneer and invasion scrub 31 %, birch 13 %, aspen 8 %, hazel 2 %), so the hazel that made it secondary
      in Tuscany is about 1 % of the class (Carta forestale 2020). Transitional woodland/shrub goes from
      secondary to non-host (0.6 -> 0.1): here it is the subalpine green-alder scrub (alneti di ontano verde,
      2,775 ha; Tipi forestali della Valle d'Aosta), not oak and chestnut regrowth. The one Valdostan
      collection of the taxon in the regional checklist comes from a full-season survey of the Lago di Villa
      reserve (Challand-Saint-Victor, 820-969 m), downy oak and chestnut (Marra 2000). Deciduous oak here is
      downy oak (querceti di roverella, 3,846 ha, "dai 300 m del fondovalle a Pont-Saint-Martin fino a 1.400 m
      sui versanti sud") with 68 ha of sessile oak, and chestnut (4,720 ha) runs "sin verso i 1.000 m", mostly
      in the Bassa Valle up to Châtillon: both stay host. Beech (1,154 ha, only in the Bassa Valle),
      fir/spruce and Scots pine stay secondary; larch and stone pine stay non-host. Tuscany's POR-H3 follows.
      POR-H3. Four levels (2026-09-24, mushma_habitat_share_2026): chestnut and deciduous oak are "mainly"
      named -> host. "Rarer under beech, hazel, pine and fir" names four more documented but clearly less
      typical hosts, so beech, fir/spruce, mountain pine and mixed broadleaf (via hazel) stay secondary; mixed
      broadleaf+conifer and transitional woodland/shrub are also secondary because that mix is mostly
      chestnut/oak (both hosts), diluted only by design, not by weak evidence. Evergreen oak is marginal (only
      "oak" is named, not specifically holm oak). Mediterranean pine, other conifer and macchia are non-host
      (the "pine" mention is read as mountain pine, IGP's eligible black/Scots pine); riparian and exotic
      broadleaf are non-host. Saturated to full credit from a host-weighted share of 0.30.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [0, 150, 1300, 1700]}
    confidence: plausible
    source: [matteucci2008_micoponte, muse_censimento_boletus, rt_tipi_forestali_p4, arrigoni_viciani_castagneti, mushma_occurrence_check_2026, mushma_occurrence_check_vda_2026, taa_muse_censimento_aestivalis, vda_tipi_forestali_2007, mushma_vda_terrain_check_2026]
    derived: true
    data: available
    notes: >-
      Valle d'Aosta (2026-09-29): full to 1300 m, zero at 1700 m (Tuscany: 1100 -> 1500), as in Trentino-Alto
      Adige. The region's records sit at about 430-790 m, but around it the 17 located records run p10 608 m,
      median 1212 m, p90 1771 m, max 1830 m (Savoie and Valais, in spruce country), and the north-east census
      has the taxon to 1927 m. Its hosts end lower here: chestnut "sin verso i 1.000 m", downy oak to 1400 m
      on the sunny slopes, beech 700-1500 m (Tipi forestali della Valle d'Aosta); spruce and fir, secondary
      hosts, run on to 1800 m. The region's lowest woods are at about 300 m (Pont-Saint- Martin), so the low
      end is Tuscany's and never binds. Tuscany's POR-A3 follows. POR-A3. Hills to lower mountain, the
      chestnut and oak belt. Central-Italy iNaturalist records: median 714 m, p90 1272 m (n=56).

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: plausible
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: POR-R1 + POR-R2, transferred from B. edulis (strong there, plausible here).

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: plausible
    source: [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1, transferred from B. edulis and community studies. Tuned (2026-09-22): the absolute 20->80 mm
      ramp was full in an ordinary September, so the 30 days are scored as a percentage of the cell's own
      normal for those days (2016-2025 reanalysis, downscaled and rain-scaled like the rain): 0 at 50 %, full
      from 125 %. It raised the porcini train objective by 0.03 with or without the rain scale, and the
      hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [9, 13, 21, 25]}
    confidence: plausible
    source: [borgotaro_igp_rt, matteucci2008_micoponte, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: >-
      POR-T3. The B. edulis band shifted warmer: "fungo del caldo" (IGP), "tipicamente termofila e xerofila"
      (Matteucci). Low confidence within plausible.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d; compare in the backtest.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.75
    confidence: plausible
    source: [salerni2023_amiata, andrew2025]
    derived: true
    data: derived
    notes: POR-X1. Milder than for B. edulis (x0.75) because this taxon is thermophilous.

  - id: cold_nights
    role: stopper
    kind: count_days
    i18n_key: factor.cold_nights
    input: {variable: temperature_2m_min, op: lte, threshold: 5, window_days: 7}
    response: {trapezoid: [null, null, 2, 3]}
    floor: 0.5
    confidence: folklore
    source: [funghimagazine_fino_quando]
    derived: true
    data: available
    notes: >-
      POR-X5. "Stops with the first cold": Tmin <=5 °C on 3+ of the last 7 nights -> x0.5.

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.1
    confidence: folklore
    source: [funghimagazine_fino_quando, brejon_hoffman2026_preprint]
    derived: true
    data: available
    notes: POR-X3. Least frost-tolerant of the four (x0.1).

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: folklore
    source: [borgotaro_igp_rt, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 5, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia]
    derived: true
    data: available
    notes: >-
      POR-X6. ET0 threshold raised to 5 mm/day because this taxon fruits in summer at low altitude, where 4
      mm/day is normal. All numbers are guesses.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [80, 95, null, null]}
    floor: 0.9
    confidence: folklore
    source: [matteucci2008_micoponte, mushma_vda_terrain_check_2026]
    derived: true
    data: derived
    notes: >-
      POR-A6. Tolerates or prefers sunny exposures (S x1.0, E/W x1.0, N x0.9): x0.9 at 80 % of flat ground's
      sun or less, x1 from 95 %. Read on the day's sun ratio, the cell's sun as a percentage of flat ground's
      (api.model.terrain), so it bites hardest in autumn, when the sun is low. The terrain microclimate
      already makes sunny slopes warmer and drier for every rule; this line is the species' own preference on
      top of that, kept soft. Valle d'Aosta: kept from Tuscany. On 15 Oct the region's woodland cells below
      1700 m, the band's top (742 of 1,174, approximated as for the slope, mushma_vda_terrain_check_2026), run
      p10 63 %, median 97 %, p90 125 % of flat ground's sun (Tuscany p10 89 %): the steep, shady envers of the
      valleys put 30 % of them at 80 % or less, where this line gives its full x0.9, and 47 % under 95 %. The
      band is kept as a statement about shade, not re-anchored to the region's percentiles; the backtest can
      test it (2026-09-29).

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 36, 45]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979, mushma_vda_terrain_check_2026]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby 1979), but a 1 km
      cell's mean slope is not the slope of the exact spot the mushrooms grow on: normal terrain for Tuscan
      woodland scores full credit, and only clearly steep cells lose it. Woodland cells on the Tuscan grid run
      p10 10.2°, p25 12.6°, median 16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up to 25°, about the p90, x0.8
      from 40°. Mushroom production fell with slope in Pyrenean Scots pine (Bonet 2008), and B. edulis yield
      was highest under about 11° on plots in north-east Turkey (Mumcu Küçüker 2019); two Spanish studies
      found no slope effect (Martínez-Peña 2012, Taye 2016). It acts on the score only, never on the rain, so
      the same water is not counted twice. Valle d'Aosta (2026-09-29): the band moves onto the region's woods
      by the same rule, normal terrain at full credit. The region grid was not built yet, so the woods were
      approximated by the 1 km cells (EPSG:3035, inside the ISTAT boundary) at least half covered by trees on
      ESA WorldCover 2021, with slopes from the Copernicus 30 m DEM, the grid's own method
      (mushma_vda_terrain_check_2026): 1,174 cells, slope p10 20.4°, p25 24.2°, median 28.5°, p75 32.8°, p90
      36.5°, p99 40.1°, max 44.4°; 72 % are steeper than 25° (Tuscany 13 %), the steepest woods of any region
      so far. x1 up to 36° (about the p90), x0.8 from 45° (about the max, as 40° is on the Tuscan grid), close
      to Trentino-Alto Adige's 35°/45°. Recheck against the region grid's woodland cells once it is built.

known_gaps:
  - id: temperature_drop
    description: POR-T6. Temperature-drop bonus; see porcini_edulis.
    needs: [a change-detection factor kind]
    confidence: folklore
    source: [bmeteo_pioggia_funghi]
  - id: wood_edge
    description: POR-H5. Shrub, meadow and pasture within 100 m of a qualifying wood is productive.
    needs: [M2 grid, a woodland edge buffer when building habitat fractions]
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014]
  - id: stand_and_soil
    description: >-
      POR-N1. Mycelium is more frequent in mature (40-year) chestnut orchards than young ones; prefers clay or
      sand-mixed loam.
    needs: [stand_age, soil_texture]
    confidence: plausible
    source: [santolamazza2023, beugelsdijk2008]
