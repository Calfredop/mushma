# Species rules for one key in VALLE D'AOSTA, loaded and validated by api.model.rules (see README.md here).
# Copied from tuscany/ and retuned from Valdostan and neighbouring Alpine sources: .gavin-root/docs/species-ecology/valle_d_aosta.md.
# Tuscan evidence and rule ids (POR-*): .gavin-root/docs/species-ecology.md and species-ecology/porcini.md.
# Parameters are priors for the M3 backtest unless `status` says tuned.
schema_version: 1
key: porcini_edulis
group: porcini
taxon: Boletus edulis
synonyms: [Boletus edulis s.s., Boletus quercicola, Boletus betulicola]
status: draft
i18n_key: species.porcini_edulis
records:
  gbif_taxon_keys: [5954958]
  inat_taxon_ids: [48701]
  exclude_basis_of_record: [MATERIAL_SAMPLE]
  notes: >-
    About 30 Tuscan fruit-body records (iNaturalist, 2026-09-17). Too few to validate this key alone: validate
    the porcini group score. Valle d'Aosta: 17 iNaturalist records (2026-09-29; 5 of them from 2026), 8 with
    an open, accurate location at 1341-1833 m; GBIF adds nothing (iNaturalist copies only). The least-recorded
    Alpine region so far: the season and band lean on the region's older mycological records and on the
    neighbouring Alps (132 iNaturalist records within 30-60 km, 103-110 SwissFungi records in Valais).
notes: >-
  Valle d'Aosta. The only porcini taxon with direct weather-fruiting studies (Amiata, Germany, Spain); no
  study from the region ties its fruiting to the weather in numbers, so the weather rules are Tuscany's
  unchanged (a three-year Mont Avic survey agrees with them in words). Changed for the region: an Alpine
  season window above 1300 m, the autumn tail cut below it, the altitude band moved onto the Alpine belts,
  larch and stone pine and the subalpine scrub lowered to non-host, and the slope band moved onto the region's
  steep woods. The shared rain logic below is borrowed by the other porcini keys.

# Growth clock (README, "Growth clock"): how fast fruit bodies develop after the rain, day by day.
# The rain_event lag below is counted in growth days, the sum of these daily paces.
growth:
  temperature:
    variable: soil_temperature_0_to_7cm_mean
    cardinal_c: [0, 18, 30]
    reference_c: 15
  humidity:
    variable: vapour_pressure_deficit_max
    trapezoid: [null, null, 1.0, 2.0]
    floor: 0.5
  max_lag_days: 40
  confidence: folklore
  source: [yan_hunt1999, moore2008_fruit_bodies, kasparavicius2001, blog_prevedere_porcini, funghimagazine_giorni_pioggia, salerni2023_amiata, brejon_hoffman2026_preprint]
  derived: true
  notes: >-
    POR-R3. The pace is 1 at 15 °C of topsoil, the weather the lag window was drawn from. Fruit bodies develop
    at a lower optimum than mycelium grows in culture (B. edulis 25-28 °C; Moore et al. 2008), hence t_opt 18
    °C. A 9 °C stretch runs at about 65 % pace and stretches a 12-day lag to about 18 days, in line with the
    lore (about 0.6 days per °C; the lag grows by about 3 days when the 10 days after the rain average under
    10 °C; longer in cool high beech than in chestnut at 600-700 m). Caps stop growing when the day's minimum
    humidity falls under 40 % and grow well from about 60 % (Kasparavičius 2001, B. edulis): open-air daily
    maximum VPD of 1.0 kPa keeps full pace and 2.0 kPa halves it; the floor stands for the moister air under
    the canopy. No peer-reviewed days-per-°C figure exists for these species: every number is a prior.

factors:
  - id: season
    role: gate
    kind: season_window
    i18n_key: factor.season
    input:
      windows:
        - label: lowland_autumn
          dates: ["01-07", "15-08", "31-10", "30-11"]
          elevation_weight: [null, null, 900, 1300]
        - label: alpine_summer
          dates: ["20-06", "25-07", "05-10", "31-10"]
          elevation_weight: [900, 1300, null, null]
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, matteucci2008_micoponte, salerni2023_amiata, gm_siena_boletus, museo_porcino_borgotaro, mushma_occurrence_check_2026, mushma_occurrence_check_vda_2026, vda_peretti1999_mont_avic, vda_marra2001_macromiceti, mushma_swissfungi_check_2026, swissfungi_wsl, vda_fm_2021_08_06, vda_fm_2024_07_25, vda_fm_2023_10_12]
    derived: true
    data: available
    notes: >-
      Valle d'Aosta (2026-09-29): an Alpine window blended in from 900 m and alone from 1300 m, as in
      Lombardia and Friuli-Venezia Giulia: full from 25 July to 5 October, zero before 20 June and after 31
      October. Below 900 m the window is full from mid-August to the end of October and closed by 30 November
      (Tuscany: full September to mid-November, zero on 20 December). Evidence, none of it enough alone: (1)
      the region's 17 iNaturalist records run July 3, August 6, September 5, October 3; (2) within 30-60 km of
      it (iNaturalist, 132 records, 21,410 fungi records for effort) July is 0.4x the effort, August 1.7x,
      September 1.8x, October 1.0x, November 0.6x, and the 58 located observer-days at 1400 m or higher run
      from the second half of July (4) through August (32) and September (18) to October (4), those at
      900-1400 m peak in September (18 of 25), and the 5 below 900 m fall in September-November; (3) in Valais
      (SwissFungi, 110 records) July is 2.2x, August 1.8x, September 0.9x, October 0.7x, November 0.5x; (4) a
      Mont Avic survey of mountain-pine woods at 1330-2100 m, visited from mid-June in 1998 and 1999, found B.
      edulis only from 25 August (1999) or 16-24 September (1997, 1998) to 8-21 October, the 1997 flush ended
      by -10 °C on 28 October (Peretti et al. 1999); (5) older collections at Cogne and La Thuile in
      August-September and in the Val Ferret in September, and at the Lago di Lolair (1184 m) between 16 June
      and 9 August 2000 (Marra 2001); (6) Funghi Magazine's bulletins give the first B. edulis in the last
      days of July (2021: "I primi edulis si sono trovati in Val d'Aosta, grazie al ritorno delle piogge";
      2024, 2025) and the end in October (2023: "le nascite sono al momento del tutto cessate sui settori
      Ovest della regione" on 12 October). The handover follows the records, not the montane-subalpine
      boundary (1800 m, 1600 m in the wetter Bassa Valle): the 900-1400 m records already start and end like
      the high ones. Frost, snow and the temperature rules close the tails. Tuscany's POR-S3 follows. POR-S3.
      "Da fine settembre alla prima neve, rare le forme estive" (IGP); Amiata peaks moved from October to
      August in 2002, so the window is broad and temperature does the fine timing. Central-Italy iNaturalist
      records are over-represented Aug–Oct (1.8x, 3.1x, 1.7x vs all fungi).

  - id: habitat
    role: gate
    kind: habitat
    i18n_key: factor.habitat
    input:
      affinity:
        beech: 1.0
        chestnut: 1.0
        fir_spruce: 1.0
        mixed_broadleaf_conifer: 0.6
        mountain_pine: 0.6
        deciduous_oak: 0.3
        mixed_broadleaf: 0.3
        other_conifer: 0.1
        transitional_woodland_shrub: 0.1
        evergreen_oak: 0.1
        mediterranean_pine: 0.1
        macchia: 0.0
        riparian: 0.0
        exotic_broadleaf: 0.0
      default: 0.0
    response: {trapezoid: [0, 0.3, null, null]}
    confidence: plausible
    source:
      [borgotaro_igp_rt, borgotaro_igp_2014, salerni2023_amiata, matteucci2008_micoponte, museo_porcino_borgotaro, gm_siena_boletus, beugelsdijk2008, mushma_habitat_share_2026, vda_tipi_forestali_2007, vda_carta_forestale_2020, taa_mandolini2025_larix, taa_mandolini2024_cembra, mushma_swissfungi_check_2026, swissfungi_wsl, funghimagazine_laricino, vda_marra2001_macromiceti, vda_peretti1999_mont_avic]
    derived: true
    data: available
    notes: >-
      Valle d'Aosta (2026-09-29): other conifer and transitional woodland/shrub move from marginal to non-host
      (0.3 -> 0.1); every other tier is Tuscany's. Other conifer here is the larch and stone pine category,
      the region's commonest forest: 43,089 ha, 44 % of the woods (Carta forestale 2020), half of it the
      subalpine Larici-cembreto su rodoreto-vaccinieto (21,800 ha) and a fifth the Lariceto montano (8,664
      ha). The weighing: (a) against larch as a host, root tips of South Tyrolean larch at 1700-1900 m held 68
      ectomycorrhizal species and no Boletus (Mandolini et al. 2025), stone pine none either (Mandolini et al.
      2024); in the Swiss records naming a partner tree larch is 25 of 960 for B. edulis (2.6 %; SwissFungi);
      forager lore has the larch wood "esclude completamente la presenza di funghi Porcini" unless spruce or
      fir stand nearby (Funghi Magazine); and in the region's larch stands "Le altre specie presenti,
      rappresentate soprattutto da conifere, non superano nel complesso il 14% del numero ed il 6 % del
      volume", mostly in the lower layers, while at the tree line the larch woods are "generalmente quasi
      puri" (Tipi forestali della Valle d'Aosta); (b) for it, the old Valdostan collections include B. edulis
      in "Boschi frondoso-laricini" at La Thuile (1800 m, 1929), "In un bosco di larici" in the Val Ferret
      (1980) and in "Picea-Larix" at Cogne (Marra 2001), and the larch dominance is partly a management
      product ("sistematica eliminazione del pino cembro e delle altre conifere"), with spruce the tree that
      "più spesso accompagna il larice". An affinity of 0.1 is about the host share those stands carry (up to
      14 % of stems, mostly spruce): a pure larch cell gets a third of full credit and a larch cell with a
      fifth of spruce, fir, pine or beech full credit, since the gate saturates at a host share of 0.30. This
      is the region's biggest single choice, and the opposite knob of Piemonte's (which kept 0.3 on the same
      forest typology): if the sanity check or the backtest finds the larch valleys (Valdigne, Valpelline,
      upper Ayas, Valtournenche) too low, raise it to 0.3. Transitional woodland/shrub here is the subalpine
      green-alder scrub (alneti di ontano verde, 2,775 ha), not a porcini host. Mixed broadleaf stays marginal
      and is not raised to secondary as in Piemonte: here it is ash-maple-lime invasion woods (5,954 ha) and
      pioneer scrub (6,171 ha, of which birch, a host, is 790 ha). Mountain pine stays secondary: Scots pine
      (9,614 ha, 600-1700 m on the sunny side of the central valley) and mountain pine (3,247 ha, 95 % erect
      Pinus uncinata), under which B. edulis fruited at Mont Avic up to 2000 m (Peretti et al. 1999). Beech
      (1,154 ha) and chestnut (4,720 ha) are host but confined to the Bassa Valle; fir and spruce (15,307 ha)
      are the main host of the montane belt. Tuscany's POR-H1 follows. POR-H1. Four levels (2026-09-24,
      mushma_habitat_share_2026): beech, chestnut and fir/spruce are the preferred hosts named directly
      ("chestnut, beech and Norway spruce preferred") -> host. Mixed broadleaf+conifer (mostly a beech-fir
      mix, both hosts) and mountain pine (IGP-eligible black/Scots pine, "moderate") stay secondary: the mixed
      class is capped below host for dilution, not for weak evidence. Deciduous oak, mixed broadleaf
      (hornbeam/hazel eligible) and other conifer (Douglas fir eligible) are marginal: each is a class where
      only some of the trees are hosts. Transitional woodland/shrub is marginal for the same dilution reason.
      Evergreen oak, Mediterranean pine, macchia, riparian and exotic broadleaf (robinia) are non-host: none
      are named for this taxon. Saturated to full credit from a host-weighted share of 0.30 (`_habitat`'s
      response trapezoid), so a cell that is 30% beech/chestnut/fir is no longer diluted by the rest of the
      woods.

  - id: altitude
    role: gate
    kind: static_band
    i18n_key: factor.altitude
    input: {attribute: elevation_m}
    response: {trapezoid: [200, 500, 1900, 2300]}
    confidence: plausible
    source:
      [salerni2023_amiata, matteucci2008_micoponte, muse_censimento_boletus, rt_tipi_forestali_p4, borgotaro_igp_rt, mushma_occurrence_check_2026, mushma_occurrence_check_vda_2026, vda_peretti1999_mont_avic, vda_marra2001_macromiceti, mushma_swissfungi_check_2026, muse_censimento_edulis, diez2020_alps, vda_tipi_forestali_2007, vda_carta_forestale_2020, mushma_vda_terrain_check_2026]
    derived: true
    data: available
    notes: >-
      POR-A1 moved onto the Alpine belts of the region (Tuscany: 200 -> 700 ... 1600 -> 1900), the band of
      Trentino-Alto Adige. The region's 8 located records sit at 1341-1833 m; the 97 located records within
      30-60 km of it run p10 1140 m, median 1596 m, p90 1847 m, p95 1897 m, max 2110 m; SwissFungi's Valais
      records with an altitude run 556-1922 m (68 records, median 1586 m); at Mont Avic B. edulis fruited
      under mountain pine at 1330-2000 m (1997, 1999; Peretti et al. 1999) and at La Thuile at 1800 m (1929;
      Marra 2001); the north-east census tops out at 2175 m, and Alpine fungi fruit higher than in 1960 (Diez
      et al. 2020). Above, larch and stone pine form the tree line ("Sopra i 2.000 m larice e pino cembro sono
      le uniche specie arboree"), and the potential forest reaches "in media fino ai 2.300 m" (Carta forestale
      2020). So full to 1900 m and zero at 2300 m. Below, the region's lowest woods are the Bassa Valle
      chestnut and downy oak from about 300 m (Pont-Saint-Martin): zero at 200 m, full from 500 m. The woods
      sit high here: of the 1,174 approximated woodland cells (mushma_vda_terrain_check_2026) the median is at
      1566 m, the p90 at 1998 m and the max at 2225 m, so the top ramp docks about a fifth of the woods.
      Tuscany's POR-A1 follows. POR-A1. "Dalla media all'alta montagna"; placed on the Tuscan beech and fir
      belts. Tuscan iNaturalist records: p10 478 m, median 1024 m, p90 1386 m (n=27).

  - id: rain_trigger
    role: driver
    weight: 2
    kind: rain_event
    i18n_key: factor.rain_trigger
    input: {variable: precipitation_sum, accumulation_days: 3}
    response:
      amount_mm: [10, 30, null, null]
      lag_days: [6, 10, 16, 24]
    confidence: strong
    source: [salerni2023_amiata, salerni2002_oak, funghimagazine_giorni_pioggia, bmeteo_pioggia_funghi, vda_peretti1999_mont_avic]
    derived: true
    data: available
    notes: >-
      POR-R1 + POR-R2. Amiata B. edulis counts correlate with >=20 mm rain days, peaking 12 days later (r
      about 0.6). Lag shape and the 10->30 mm ramp are derived (30 mm = the PRD hypothesis and the low end of
      forager lore). Strong for the lag; the amount ramp is plausible. Valle d'Aosta (2026-09-29): kept. The
      one Valdostan account in words agrees: at Mont Avic in 1997 the fruit bodies came "solo dopo le piogge
      del 2-3/9 e del 13/9", abundant on 16 September, 13-14 days after the first rain, while the rain of 28
      August gave nothing, "probabilmente a causa dell'abbassamento delle temperature minime" (Peretti et al.
      1999), which the growth clock's cold slow-down stands for.

  - id: rain_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.rain_30d
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 30}
    response: {trapezoid: [50, 125, null, null]}
    confidence: strong
    source:
      [salerni2002_oak, brejon_hoffman2026_preprint, karavani2018, salerni2023_amiata, mushma_rain_tuning_2026]
    derived: true
    data: derived
    notes: >-
      POR-M1. 30-day rain drives fruiting in Tuscan oak woods (community) and a 26-day window at 2-4 mm/day
      fits B. edulis in German beech. The effect is strong; the 20->80 mm ramp is derived. Tuned (2026-09-22):
      the absolute 20->80 mm ramp was full in an ordinary September, so the 30 days are scored as a percentage
      of the cell's own normal for those days (2016-2025 reanalysis, downscaled and rain-scaled like the
      rain): 0 at 50 %, full from 125 %. It raised the porcini train objective by 0.03 with or without the
      rain scale, and the hold-out one by 0.013.

  - id: air_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.air_temperature
    input: {variable: temperature_2m_mean, aggregate: mean, window_days: 20}
    response: {trapezoid: [6, 10, 17, 22]}
    confidence: plausible
    source: [brejon_hoffman2026_preprint, salerni2023_amiata]
    derived: true
    data: available
    notes: >-
      POR-T1. German optimum about 13 °C over 20 days (preprint); the upper shoulder is widened because Amiata
      fruited in an 18.6 °C summer. Needs lapse-rate-corrected temperature per cell.

  - id: soil_temperature
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.soil_temperature
    input: {variable: soil_temperature_0_to_7cm_mean, aggregate: mean, window_days: 10}
    response: {trapezoid: [6, 10, 17, 22]}
    confidence: folklore
    source: [brejon_hoffman2026_preprint, bmeteo_pioggia_funghi]
    derived: true
    data: available
    enabled: false
    notes: POR-T5. Alternative to air_temperature, never both. No porcini soil-temperature threshold found in a primary source.

  - id: water_balance_30d
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.water_balance
    input: {variable: water_balance, aggregate: sum, window_days: 30}
    response: {trapezoid: [-80, 0, null, null]}
    confidence: plausible
    source: [agreda2015, boddy2014, martinez_de_aragon2007, agreda2016]
    derived: true
    data: derived
    enabled: false
    notes: POR-M3. Alternative to rain_30d (P - ET0 instead of P); compare both in the backtest.

  - id: soil_moisture
    role: driver
    weight: 1
    kind: window_aggregate
    i18n_key: factor.soil_moisture
    input: {variable: soil_moisture_7_to_28cm_mean, aggregate: percentile_of_normal, window_days: 7}
    response: {trapezoid: [10, 40, null, null]}
    confidence: plausible
    source: [karavani2018, garcia_bustamante2021]
    derived: true
    data: derived
    enabled: false
    notes: >-
      POR-M2. Same-month soil moisture limits yield (Mediterranean pine, community). Percentile against the
      cell's calendar-month climatology, because model soil moisture is not comparable with field thresholds.
      Needs the backfill climatology.

  - id: early_season_wetness
    role: stopper
    kind: window_aggregate
    i18n_key: factor.early_season_wetness
    input: {variable: precipitation_sum, aggregate: percent_of_normal, window_days: 60}
    response: {trapezoid: [50, 100, null, null]}
    floor: 0.6
    confidence: plausible
    source: [alday2017, taye2016, parlade2017, garcia_bustamante2021, salerni2002_oak]
    derived: true
    data: derived
    enabled: false
    notes: >-
      POR-M4. 60-day rain as % of the cell's climatology: x0.6 at <=50 %, x1 at >=100 %. Autumn only in the
      source reading; Soria found no effect of previous-summer rain, so it stays a weak multiplier.

  - id: heat_spike
    role: stopper
    kind: count_days
    i18n_key: factor.heat_spike
    input: {variable: temperature_2m_max_anomaly_30d, op: gte, threshold: 8, window_days: 14}
    response: {trapezoid: [null, null, 0, 1]}
    floor: 0.5
    confidence: plausible
    source: [salerni2023_amiata, karavani2018, andrew2025]
    derived: true
    data: derived
    notes: >-
      POR-X1. Tmax spikes about 8 °C above the period mean correlated negatively with fruit bodies for up to
      about 3 weeks at Amiata. The multiplier is derived.

  - id: frost
    role: stopper
    kind: count_days
    i18n_key: factor.frost
    input: {variable: temperature_2m_min, op: lte, threshold: 0, window_days: 7}
    response: {trapezoid: [null, null, 1, 2]}
    floor: 0.2
    confidence: folklore
    source: [borgotaro_igp_rt, brejon_hoffman2026_preprint, funghimagazine_fino_quando, vda_peretti1999_mont_avic]
    derived: true
    data: available
    notes: >-
      POR-X3. Two or more frosty nights in a week -> x0.2. Thresholds derived. Valle d'Aosta: kept; at Mont
      Avic fruit bodies were still found on 15 October 1997 after a night at -3 °C, and -10 °C on 28 October
      stopped every species but Cantharellus aurora (Peretti et al. 1999).

  - id: snow
    role: stopper
    kind: window_aggregate
    i18n_key: factor.snow
    input: {variable: snowfall_sum, aggregate: sum, window_days: 3}
    response: {trapezoid: [null, null, 0, 1]}
    confidence: plausible
    source: [borgotaro_igp_rt, borgotaro_igp_2014, funghimagazine_fino_quando]
    derived: true
    data: available
    notes: POR-X4. "Alla prima neve" ends the season. >=1 cm of snow in 3 days -> 0.

  - id: drying
    role: stopper
    kind: count_days
    i18n_key: factor.drying
    input: {variable: et0_fao_evapotranspiration, op: gte, threshold: 4, window_days: 7}
    response: {trapezoid: [null, null, 1, 3]}
    floor: 0.6
    confidence: folklore
    source: [forager_wind_pages, funghimagazine_giorni_pioggia, vda_peretti1999_mont_avic]
    derived: true
    data: available
    notes: >-
      POR-X6. Forager lore: drying wind (tramontana, grecale) after rain wastes the trigger. No source gives
      numbers; ET0 stands in for wind + dry air + sun. Every number is a guess to tune. Valle d'Aosta
      (2026-09-29): kept. Here the drying wind is the foehn: at Mont Avic in September 1998 no rain "unito
      alla presenza di forte vento per diversi giorni consecutivi, ha ritardato una abbondante fuoriuscita
      degli sporocarpi fino ai primi giorni del mese di ottobre" (Peretti et al. 1999), and Funghi Magazine
      blames "vento favonico" or "vento secco" for failed flushes in most years of its Valdostan reports
      (2021, 2022, 2023). The known gap drying_wind (gusts plus low humidity) would suit the region better
      than ET0 alone.

  - id: drought_45d
    role: stopper
    kind: window_aggregate
    i18n_key: factor.drought
    input: {variable: precipitation_sum, aggregate: sum, window_days: 45}
    response: {trapezoid: [10, 15, null, null]}
    confidence: plausible
    source: [brejon_hoffman2026_preprint, agreda2015, salerni2002_oak]
    derived: true
    data: available
    enabled: false
    notes: POR-X2. Mostly subsumed by rain_30d (0 at <=20 mm in 30 days); kept for the backtest to compare.

  - id: sun_exposure
    role: stopper
    kind: window_aggregate
    i18n_key: factor.sun_exposure
    input: {variable: sun_exposure_pct, aggregate: mean, window_days: 1}
    response: {trapezoid: [null, null, 105, 125]}
    floor: 0.8
    where: {attribute: elevation_m, trapezoid: [null, null, 900, 1100]}
    confidence: folklore
    source: [rt_tipi_forestali_p4, bmeteo_pioggia_funghi, bonet2008, mumcu_kucuker2019, mushma_vda_terrain_check_2026]
    derived: true
    data: derived
    notes: >-
      POR-A5. Below 1000 m, north-facing slopes keep moisture in hot spells and hold the conifer hosts (N
      x1.0, E/W x0.9, S x0.8), but flat, east- and west-facing ground is normal for Tuscan woodland and scores
      full credit: only clearly sunny slopes lose it. On 15 Oct the cell's sun ratio (its clear-sky sun as a %
      of flat ground's) runs p10 89 %, p25 95 %, median 100 %, p75 105 %, p90 111 % (2026-09-24): x1 up to 105
      %, about the p90, x0.8 from 125 %, fading out between 900 and 1100 m. North aspect raised production in
      dry Pyrenean pine (Bonet 2008), while a humid Turkish forest found north slopes worst for B. edulis
      (Mumcu Küçüker 2019): the preference is kept to low altitude, where water limits fruiting. Read on the
      day's sun ratio, the cell's sun as a percentage of flat ground's (api.model.terrain), so it bites
      hardest in autumn, when the sun is low. The terrain microclimate already makes sunny slopes warmer and
      drier for every rule; this line is the species' own preference on top of that, kept soft. Valle d'Aosta:
      kept from Tuscany. On 15 Oct the region's woodland cells below 1000 m (186 of 1,174, approximated as for
      the slope, mushma_vda_terrain_check_2026) run p10 66 %, p25 77 %, median 98 %, p75 113 %, p90 124 % of
      flat ground's sun (Tuscany 89/95/100/105/110 %): the steep valley sides spread the sun ratio wider, as
      in Trentino-Alto Adige, so the line docks about two fifths of the low woods (39 % above 105 %), at most
      by its floor (8 % at 125 % or more). The band is kept as a statement about sun and drying, not
      re-anchored to the region's percentiles; the backtest can test it (2026-09-29).

  - id: slope
    role: stopper
    kind: static_band
    i18n_key: factor.slope
    input: {attribute: slope_deg}
    response: {trapezoid: [null, null, 36, 45]}
    floor: 0.8
    confidence: plausible
    source: [bonet2008, mumcu_kucuker2019, beven_kirkby1979, mushma_vda_terrain_check_2026]
    derived: true
    data: available
    notes: >-
      Steep ground drains fast and holds thinner soil (topographic wetness, Beven & Kirkby 1979), but a 1 km
      cell's mean slope is not the slope of the exact spot the mushrooms grow on: normal terrain for Tuscan
      woodland scores full credit, and only clearly steep cells lose it. Woodland cells on the Tuscan grid run
      p10 10.2°, p25 12.6°, median 16.6°, p75 21.6°, p90 26.2° (2026-09-24): x1 up to 25°, about the p90, x0.8
      from 40°. Mushroom production fell with slope in Pyrenean Scots pine (Bonet 2008), and B. edulis yield
      was highest under about 11° on plots in north-east Turkey (Mumcu Küçüker 2019); two Spanish studies
      found no slope effect (Martínez-Peña 2012, Taye 2016). It acts on the score only, never on the rain, so
      the same water is not counted twice. Valle d'Aosta (2026-09-29): the band moves onto the region's woods
      by the same rule, normal terrain at full credit. The region grid was not built yet, so the woods were
      approximated by the 1 km cells (EPSG:3035, inside the ISTAT boundary) at least half covered by trees on
      ESA WorldCover 2021, with slopes from the Copernicus 30 m DEM, the grid's own method
      (mushma_vda_terrain_check_2026): 1,174 cells, slope p10 20.4°, p25 24.2°, median 28.5°, p75 32.8°, p90
      36.5°, p99 40.1°, max 44.4°; 72 % are steeper than 25° (Tuscany 13 %), the steepest woods of any region
      so far. x1 up to 36° (about the p90), x0.8 from 45° (about the max, as 40° is on the Tuscan grid), close
      to Trentino-Alto Adige's 35°/45°. Recheck against the region grid's woodland cells once it is built.

known_gaps:
  - id: temperature_drop
    description: >-
      POR-T6. A >=3 °C drop in 7-day mean Tmax, 3-15 days before, helps trigger fruiting (x1.1 bonus). Bonuses
      above 1 and change-over-time inputs are not in schema v1.
    needs: [a change-detection factor kind]
    confidence: folklore
    source: [bmeteo_pioggia_funghi, karavani2018]
