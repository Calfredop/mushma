    end: 10-12
  lower:
    area: carso
    seasons:
    - 2016
    start: 09-21
    end: 10-12
- id: alps_2016_late_summer
  claim: 'Summer 2016 in the Friulian Alps: "Contrariamente al solito, quando la prima buttata di fine
    giugno riguarda le zone basse, quest''anno siamo dovuti salire oltre i 1.500 metri per trovare i
    primi porcini"; the first porcini in the usual places came about 1 September near Paluzza, and "sin
    qui, il Boletus Edulis è stato il grande assente di questa estate" (Udine mycologists, Il Piccolo,
    2016-09-11)'
  source: https://www.ilpiccolo.it/cronaca/gialletti-da-record-e-zero-porcini-nellestate-anomala-dei-funghi-achmqfo8
  higher:
    area: fvg_alps
    seasons: normal
    start: 06-20
    end: 08-31
  lower:
    area: fvg_alps
    seasons:
    - 2016
    start: 06-20
    end: 08-31
- id: alps_2020_2021_september
  claim: 'Late August to 20 September: in 2020 porcini "nascite in crescendo con apice verso la fine del
    mese" in the eastern Alps including FVG, then "la buttata-non-stop si è un po'' fermata" (Funghi
    Magazine, 2020-09-04, 2020-09-21); in 2021 "la stagnazione di piogge fredde ha bloccato ogni possibile
    nascita" in Carnia and northern Friuli (Funghi Magazine, 2021-09-04), a year of "una certa carenza"
    of porcini and galletti after a 2020 that "era stato molto buono" (Centro micologico friulano, Il
    Friuli, 2021-11-14)'
  source: https://funghimagazine.it/aggiornamento-meteofunghi-04-09-2021-porcini-giganti/
  higher:
    area: fvg_alps
    seasons:
    - 2020
    start: 08-25
    end: 09-20
  lower:
    area: fvg_alps
    seasons:
    - 2021
    start: 08-25
    end: 09-20
- id: alps_2021_august_vs_september
  claim: 'Carnia and the Julian Alps in 2021: in mid-August "Carnia, Alpi e Prealpi Giulie sono al momento
    in ottima forma" and "buone nascite di Porcini dai colli pedemontani alle Prealpi ed Alpi" (Funghi
    Magazine, 2021-08-12 and 2021-08-19); from late August cold rain and wind "ha inibito le nascite così
    come accaduto nella vicina Carnia e sulle Alpi Giulie" (2021-09-10), and in October "la perdurante
    assenza di funghi Porcini" in the Triveneto (2021-10-09)'
  source: https://funghimagazine.it/aggiornamento-meteofunghi-porcini-20-08-2021/
  higher:
