- id: carso_2017_2016_autumn
  claim: 'Trieste Karst, late September to mid-October: in 2017 "Da tre settimane il meteo è cambiato,
    regalando fioriture a dir poco eccezionali, un aumento dell''80% rispetto al 2016", "tantissimi
    porcini e ovuli" (AMB Bresadola Trieste, Il Piccolo, 2017-10-12); in 2016 the same group was
    "in ansia causa il perdurare della siccità di inizio mese" and "Appena ora ... iniziano a spuntare i
    funghi" (Il Piccolo, 2016-10-09)'
  source: https://www.ilpiccolo.it/cronaca/fvg-il-meteo-perfetto-regala-a-porcini-e-ovuli-un-autunno-da-record-p8k6lur7
  higher:
