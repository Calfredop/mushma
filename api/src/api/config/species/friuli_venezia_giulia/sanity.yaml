- id: gallinacci_alps_2016_2021
  claim: 'July-August: in 2016 "I gialletti da record, i porcini si fanno attendere", C. cibarius "Li si è
    visti un po'' ovunque, a luglio e poi ancora ad agosto" (Udine mycologists, Il Piccolo, 2016-09-11);
