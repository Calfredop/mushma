contrasts:
- id: carnia_vs_hills_2017
  claim: 'Late August to September 2017: conditions "negative, e addirittura disastrose nella fascia
    collinare, per poi migliorare dalla fine di agosto, ma soltanto in Carnia, mentre nelle altre zone le
    buone buttate sono state brevi e direi episodiche" (Centro micologico friulano, Messaggero Veneto,
    2017-10-31)'
  source: https://www.messaggeroveneto.it/cronaca/funghi-annata-negativa-si-salva-solo-lautunno-q5qnwrip
  higher:
    area: carnia
    seasons:
    - 2017
    start: 08-25
    end: 09-30
  lower:
    area: fvg_hills
    seasons:
    - 2017
    start: 08-25
    end: 09-30
- id: carnia_vs_tarvisiano_2017
  claim: 'Autumn 2017: "La Carnia meglio del Tarvisiano, in collina poche soddisfazioni" (subtitle);
    the good flushes from late August came "soltanto in Carnia", elsewhere "brevi e direi episodiche"
    (Centro micologico friulano, Messaggero Veneto, 2017-10-31)'
  source: https://www.messaggeroveneto.it/cronaca/funghi-annata-negativa-si-salva-solo-lautunno-q5qnwrip
  higher:
