- id: alps_2023_2024_late_july
  claim: 'Mid to late July: in 2023 "Ottime nascite anche in tutto l''alto Veneto da Agordo-Longarone fino
    alle Alpi Carniche e più ad Est su tutte le Giulie" (Funghi Magazine, 2023-07-20); in 2024 porcini
    edulis had come to Trentino and the Veneto mountains, "non in Friuli Venezia Giulia dove sui monti è
    ancora primavera" (Funghi Magazine, 2024-07-25)'
  source: https://funghimagazine.it/aggiornamento-funghi-20-07-2023/
