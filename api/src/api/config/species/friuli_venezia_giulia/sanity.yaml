# Press-contrast sanity check for Friuli-Venezia Giulia (api.model.sanity).
# Areas by comuni (ISTAT names, 2025, with the bilingual Karst forms) or provinces (sigle); windows
# and source URLs written down on 2026-09-27, before any Friuli-Venezia Giulia score existed.
# `seasons: normal` expands to `normal_seasons`. 14 contrasts are porcini (the default `--group
# porcini`); `gallinacci_...` and `ovoli_...` are read with `--group gallinacci` and `--group ovoli`.
# Quotes, second sources and caveats per contrast: .gavin-root/docs/species-ecology/
# friuli_venezia_giulia.md (Press contrasts). Local papers rarely sum up a season: 6 contrasts rest on
# the Messaggero Veneto, Il Piccolo and Il Friuli quoting the Udine and Trieste mycological groups, the
# other 10 mainly on Funghi Magazine's weekly bulletins, one editor working from readers' reports and
# rain gauges. Friulian usage: "gialletti"/"galletti" are C. cibarius, "finferli" may mean Craterellus.
