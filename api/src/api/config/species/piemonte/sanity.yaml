# Press-contrast sanity check for Piemonte (api.model.sanity).
# Areas by comuni (ISTAT names, 2025) or provinces (sigle); windows and source URLs written down on
# 2026-09-25, before any Piemonte score existed. `seasons: normal` expands to `normal_seasons`.
# All contrasts are porcini (run with the default `--group porcini`). Quotes, second sources and
# caveats per contrast: .gavin-root/docs/species-ecology/piemonte.md (Press contrasts). Most rest
# on Funghi Magazine's bulletins, which often reason from rain gauges: those partly test the rain
# data, not only the fruiting. Picking was banned or restricted in the 2022-2023 African swine
# fever zone (Ovadese, Acquese, Val Borbera, Val Curone): that thins sightings there, not scores.
