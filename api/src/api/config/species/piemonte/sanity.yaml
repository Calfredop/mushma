    start: 09-12
    end: 10-04
- id: torinese_vs_valsesia_ossola_june_2024
  claim: 'June to early July 2024: red porcini "tutt''altro che degne di nota, addirittura del tutto assenti"
    in the Val d''Ossola and Valsesia after too much rain, "ancora buoni ritrovamenti nel solito territorio
    Torinese"; on 2024-06-28 the Torinese "si raccoglie bene ormai da inizio mese"'
  source: https://funghimagazine.it/aggiornamento-funghi-14-06-2024/
  higher:
