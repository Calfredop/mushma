- id: cuneo_valleys_2023_2024_vs_2021
  claim: 'Mid-September: 2023 "È boom di funghi nel Cuneese, specialmente nelle vallate prealpine" in
    the second and third weeks of September (Coldiretti Cuneo), 2024 "una vera e propria esplosione di
    funghi, anche se non dappertutto" (Cuneodice, 2024-09-13); 2021 "restano a secco ampie zone del Cuneese"
    (Funghi Magazine, 2021-09-18) until rain on about 22 September'
  source: https://www.cuneo24.it/2023/09/con-20-e-boom-di-funghi-nelle-vallate-215096/
  higher:
