  claim: 'September 2020: on 29 August "a Fraconalto ... cadono bel 241 millimetri di pioggia, a pochissima
    distanza a Ponzone non si va oltre i 2 millimetri"; "piogge monsoniche" on the Borbera and Staffora
    basins while "L''Alto Monferrato tutto continua a ricevere piogge effimere" (Funghi Magazine, 2020-09-21);
    rain back at Ponzone and Pareto only in early October'
  source: https://funghimagazine.it/aggiornamento-meteofunghi-04-09-2020/
