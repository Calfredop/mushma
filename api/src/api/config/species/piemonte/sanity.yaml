    start: 09-05
    end: 09-20
- id: cuneo_valleys_spring_2022_2021
  claim: 'Late May to early June: in 2022 the Cuneo valleys, "dopo aver sofferto la siccità per oltre
    un anno intero, ora stanno tornando alla riscossa", a "splendida parentesi fungina" closed by 10 June;
    in 2021 red porcini came "sempre col contagocce ... nel Cuneese ed Alpi Marittime" (Funghi Magazine,
    2021-06-24)'
  source: https://funghimagazine.it/boom-di-funghi-porcini-estatini-e-rossi-ecco-dove/
