- id: cuneo_border_july_2024_2025
  claim: 'Second half of July: in 2024 "nascite massicce di Porcini Rossi-Pinicola ... durata molto più
    di un mese" on the Ligurian-Cuneo border, with summer porcini flushes; in 2025 "Pochi funghi se non
    quasi nulla ... Una stagione imprevedibile e incomprensibile, incerta. Ma soprattutto scarsissima"
