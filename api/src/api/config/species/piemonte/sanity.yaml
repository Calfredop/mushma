contrasts:
- id: biellese_2025_2024
  claim: 'Late August to early September: in the Biellese 2025 the picking started "con 15-20 giorni di
    anticipo" on 2024, a "buttata" abundant and widespread, "a differenza dello scorso anno, quando i
    raccolti erano stati localizzati soprattutto nell''Oasi Zegna e limitati nel tempo"; 2024: "la penuria
    di funghi ha raggiunto livelli difficilmente visti nel recente passato" (La Provincia di Biella, 2024-09-07)'
  source: https://www.giornalelavoce.it/news/attualita/622291/stagione-dei-funghi-2025-tra-raccolte-anticipate-boom-di-tesserini-e-turismo-culturale.html
  higher:
    area: biellese_mountains
    seasons:
    - 2025
    start: 08-18
    end: 09-07
  lower:
    area: biellese_mountains
    seasons:
    - 2024
    start: 08-18
    end: 09-07
- id: valsesia_2022_2021
  claim: 'Late August to mid-September: "Raccolta funghi: il 2022 è un anno record" in the Valsesia woods
    after the storms; in 2021 dry foehn air "sta inibendo nascite di Porcini anche tra la Valsesia ed
    il VCO dove non si registra alcuna buttata" (Funghi Magazine, 2021-09-04)'
  source: https://notiziaoggi.it/attualita/raccolta-funghi-il-2022-e-un-anno-record/
  higher:
    area: valsesia
    seasons:
    - 2022
    start: 08-28
    end: 09-12
  lower:
