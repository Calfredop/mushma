    seasons:
    - 2021
    start: 08-28
    end: 09-12
- id: valsesia_ossola_2023_late
  claim: '2023: in Valsesia "la stagione è iniziata con un paio di settimane di ritardo"; the mountains
    of Valsesia and the VCO had "piogge assai inferiori", no porcini "almeno non prima di fine Agosto"
    (Funghi Magazine, 2023-08-10)'
  source: https://notiziaoggi.it/attualita/coi-funghi-la-valsesia-incassa-quasi-100mila-euro/
  higher:
    area: valsesia_ossola
    seasons: normal
