    start: 08-15
    end: 09-08
- id: alto_piemonte_vs_valsusa_2023
  claim: 'Mid-September to early October 2023: "Biellese, Vercellese, Novarese e Verbano-Cusio-Ossola
    strabilianti, con super nascite ovunque, dal piano ai monti"; "Alpi Cozie risultano poco produttive",
    the inner Val di Susa "con piogge insufficienti"'
  source: https://funghimagazine.it/aggiornamento-porcini-04-10-2023/
  higher:
