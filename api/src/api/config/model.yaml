# Model v1: how the per-species rule files in species/ roll up into the scores the app shows, and
# how the weather is prepared for them. See species/README.md for how one species key is scored,
# .gavin-root/docs/species-ecology.md for the evidence and .gavin-root/docs/model-v1-validation.md
# for the backtest.

# UI species ("groups") and the rule files (species keys) behind each, in tie-break order: a group
# scores the max over its keys and its breakdown is the winning key's; on a tie the key listed
# first wins. The group order is the tie-break for the combined score, which is the max over the
# groups in season (key `combined`).
groups:
  porcini: [porcini_edulis, porcini_reticulatus, porcini_aereus, porcini_pinophilus]
  ovoli: [ovoli_caesarea]
  gallinacci: [gallinacci_cibarius]

# The reanalysis rain is too dry in the hills against the SIR Toscana gauges, and the rain
# thresholds in the rules come from gauge-based studies and gauge-reading foragers. Before scoring,
# daily precipitation_sum from `sources` is multiplied by
#     intercept + per_km x elevation (km, clamped to 0..max_elevation_m)
# fitted to gauge totals for 2025 and checked on 2026. Forecast rain (ecmwf_ifs) is left as it is:
# the gauge check covers the reanalysis only, and IFS already ran wetter than ERA5 at the seam.
precipitation_scale:
  enabled: true
  sources: [era5_seamless]
  intercept: 1.28
  per_km: 0.29
  max_elevation_m: 1700
  confidence: plausible
  source: [mushma_sir_gauge_check_2026]
  notes: >-
    Least squares through the origin of gauge totals on model totals x (a + b x elevation) over the
    133 woodland gauges of 2025 gave a = 1.283, b = 0.291 per km (2026 alone: 1.349, 0.210). On the
    145 gauges of 2026 it moves the pooled model/gauge ratio from 0.68 to 0.99 (below 400 m 0.76 ->
    1.03, 400-800 m 0.66 -> 0.96, above 800 m 0.64 -> 1.01). It scales totals: timing errors and
    missed convective cells stay. The backtest compares scoring with and without it.
