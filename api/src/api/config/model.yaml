# Model v1: how the per-region rule files in species/<region>/ roll up into the scores the app
# shows, and how the weather is prepared for them. See species/README.md for how one species key is
# scored, .gavin-root/docs/species-ecology.md for the evidence and
# .gavin-root/docs/model-v1-validation.md for the backtest. A region may override these in a model:
# block of config/regions/<id>.yaml; none does.

# UI species ("groups") and the rule files (species keys) behind each, in tie-break order: a group
# scores the max over its keys and its breakdown is the winning key's; on a tie the key listed
# first wins. The group order is the tie-break for the combined score, which is the max over the
# groups in season (key `combined`).
groups:
  porcini: [porcini_edulis, porcini_reticulatus, porcini_aereus, porcini_pinophilus]
  ovoli: [ovoli_caesarea]
  gallinacci: [gallinacci_cibarius]

# The reanalysis rain is too dry or too wet by an amount that depends on place and height, and the
# rain thresholds in the rules come from gauge-based studies and gauge-reading foragers. Before
# scoring, daily precipitation_sum from `sources` is multiplied by
#     intercept + per_km x elevation (km, clamped to 0..max_elevation_m)
# with all three read at the cell's position from `field`, one lattice over Italy fitted on every
# region's open gauges at once (api.weather.rain_field, config/rain_field.yaml), so there is no step
# where one region's gauge network meets another's. Forecast rain (ecmwf_ifs) is left as it is: the
# gauge check covers the reanalysis only, and IFS already ran wetter than ERA5 at the seam.
precipitation_scale:
  enabled: true
  sources: [era5_land_cds, era5_seamless]
  field: rain_scale_field.csv
  confidence: plausible
  source: [mushma_rain_field_2026]
  notes: >-
    One field for all of Italy, written by `uv run python -m api.weather.rain_field fit`: at every
    node of a 0.25° lattice, a local least-squares fit of gauge/reanalysis season ratios (April to
    November) on height, the gauges weighted by a Gaussian of 25 km in distance and pulled toward
    the national 0.95 + 0.05 per km by a ridge worth 2 gauges; the height clamp is the 95th
    percentile of the nearby gauges' heights. 1,980 gauges in 10 open networks (2016-2025, mostly 2023-2025, all
    stations, the reanalysis downscaled to each gauge as to a cell) and 278 pseudo-gauges carrying
    six yearbook or farm-network fits. The 25 km width won spatial-block cross-validation (50 km
    blocks): log error 0.186, against 0.252 for one national fit. It replaces 19 region fits that
    disagreed at their borders (x1.37 on the Tuscan side of the Umbrian border, x1.00 across it;
    the field gives 0.92-1.03 along the whole border). See .gavin-root/docs/rain-scale-field.md.

# Terrain microclimate. Before scoring, each cell's weather is moved to its own slope: a sunny slope
# is warmer and dries faster than flat ground, a shady one cooler and slower to dry. The measure is
# the cell-day's sun ratio (api.model.terrain): clear-sky sun on the cell's mean surface over flat
# ground's, from its latitude, the day's sun path, its slope and aspect, and the month's diffuse
# share of radiation. With sun = that ratio (1 = flat), each temperature below gains
# k x (sun - 1) °C and ET0 is multiplied by 1 + et0_per_sun x (sun - 1). Night-time minimum
# temperature, rain, soil moisture and VPD are left alone. The same ratio x 100 is the daily series
# `sun_exposure_pct` the species rules can read. Applied to reanalysis and forecast days alike.
microclimate:
  enabled: true
  # Diffuse share of global radiation, January to December (PVGIS SARAH3 2005-2023, 7 Tuscan points).
  diffuse_fraction: [0.49, 0.46, 0.45, 0.45, 0.44, 0.38, 0.33, 0.35, 0.40, 0.46, 0.53, 0.53]
  # °C per unit of (sun - 1): a cell getting 20 % more sun than flat ground is 0.8 °C warmer on
  # average, 1.2 °C in the afternoon and 1.6 °C in the top 7 cm of soil.
  temperature_per_sun:
    temperature_2m_mean: 4.0
    temperature_2m_max: 6.0
    soil_temperature_0_to_7cm_mean: 8.0
  et0_per_sun: 1.0
  confidence: plausible
  source: [allen2006_slopes, swift1976, liu_jordan1963, mushma_pvgis_kd_2026, rita2021, bennie2008, fao56_allen1998, aguilar2010]
  notes: >-
    The geometry is textbook (Allen et al. 2006, Swift 1976, isotropic diffuse sky of Liu & Jordan
    1963). The temperature coefficients are derived: under a southern-Apennine beech canopy
    (May-September) a 0.17 difference in relative radiation went with about 1.4 °C of air and
    2.8 °C of soil (Rita et al. 2021, after the lapse rate), 8 and 16 °C per unit; open grassland
    slopes differ by 2.5-3 °C a year (Bennie et al. 2008). Half of the single site's slope is used,
    because 1 km cells mix aspects and the canopy buffers sunny slopes more. Maximum temperature gets
    more than the mean, as in Bennie. ET0 follows the radiation about one to one: its radiation term
    dominates in a humid climate (FAO-56), and correcting the radiation for terrain moves ET0 by tens
    of mm a year (Aguilar et al. 2010). No ridge shading, no afternoon asymmetry (east and west
    slopes get the same sun), no effect on VPD. Every coefficient is a prior for the backtest.

# Backtest (api.model.backtest). Fixed before any score was compared with a sighting.
#
# Seasons are calendar years. The split is chronological: rules are tuned on the older seasons and
# judged on the two most recent complete ones, the way the app is used (past seasons teach, the
# next one tests). Counts of stored woodland-cell sightings per year on 2026-09-17, the only thing
# looked at: 2019 39 (28 of them soil-DNA samples to exclude), 2020 27, 2021 1, 2022 14, 2023 9,
# 2024 22, 2025 11, 2026 2; earlier years have none with weather. That leaves about 62 usable
# sightings to tune on and 33 to judge on. 2026 is still in season: it is reported once it ends and
# is never used for tuning.
#
# Season windows, altitude bands and habitat affinities are frozen: the species research derived
# them partly from sightings of every year, hold-out years included, so tuning them would leak.
backtest:
  train_seasons: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
  holdout_seasons: [2024, 2025]
  live_seasons: [2026]
  frozen_factor_kinds: [season_window, habitat, static_band]
